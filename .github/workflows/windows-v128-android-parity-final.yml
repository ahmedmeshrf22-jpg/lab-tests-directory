      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit Windows V128 Android parity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_v128_windows/windows-system'

          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '128.0.0') { throw "Expected 128.0.0, got $($pkg.version)" }
          if ($pkg.build.portable.artifactName -notmatch 'V128') { throw 'Portable V128 artifact name missing' }
          if ($pkg.build.nsis.artifactName -notmatch 'V128') { throw 'Setup V128 artifact name missing' }

          $tests = Get-Content (Join-Path $root 'public/lab_tests_android.json') -Raw | ConvertFrom-Json
          if ($tests.Count -ne 331) { throw "Expected 331 tests, got $($tests.Count)" }
          if (($tests | Where-Object { $null -ne $_.customer_price }).Count -ne 0) { throw 'Embedded customer prices detected' }

          $app = Get-Content (Join-Path $root 'src/app.js') -Raw
          foreach ($x in @(
            'Unified System V128',
            'Windows System V128',
            'tahalil_manager_home_order_v128',
            'enableHomeReorder',
            'اسحب أي أيقونة لتغيير ترتيبها',
            'وضع الطوارئ الآمن V128',
            'clearOfflineAccess',
            'BackendResilienceRegistry'
          )) { if (!$app.Contains($x)) { throw "Missing app parity marker: $x" } }

          $data = Get-Content (Join-Path $root 'src/data.js') -Raw
          foreach ($x in @(
            'getProfileFromServer',
            'getDeviceFromServer',
            'tahalil_acting_user_v128',
            "labOrders:'lab_orders'",
            'result_revision_requested',
            'user_credentials_rotate'
          )) { if (!$data.Contains($x)) { throw "Missing data marker: $x" } }

          $fb = Get-Content (Join-Path $root 'src/firebase.js') -Raw
          if (!$fb.Contains('browserLocalPersistence')) { throw 'Persistent Firebase auth required for V127/V128 outage grace' }
          if (!$fb.Contains('persistentLocalCache')) { throw 'Firestore persistent cache missing' }

          $main = Get-Content (Join-Path $root 'electron/main.cjs') -Raw
          foreach ($x in @(
            'safeStorage',
            'OFFLINE_GRACE_MS = 72 * 60 * 60 * 1000',
            "offline-access:save",
            "offline-access:load",
            "offline-access:clear",
            'sandbox: true',
            'contextIsolation: true',
            'nodeIntegration: false',
            'webSecurity: true',
            'new Tray',
            'requestSingleInstanceLock'
          )) { if (!$main.Contains($x)) { throw "Missing Windows marker: $x" } }

          $res = Get-Content (Join-Path $root 'src/resilience.js') -Raw
          foreach ($x in @(
            'FIREBASE_ONLY',
            'SHADOW_BACKUP',
            'MANUAL_SECONDARY',
            'AUTO_FAILOVER',
            'DisabledSecondaryBackendAdapter',
            "currentMode(){return BackendFailoverMode.FIREBASE_ONLY}"
          )) { if (!$res.Contains($x)) { throw "Missing V128 resilience marker: $x" } }

          $backup = Get-Content (Join-Path $root 'src/backup.js') -Raw
          if (!$backup.Contains('app_version_code:128')) { throw 'Backup V128 metadata missing' }
          if (!$backup.Contains("app_version_name:'System V128 Windows'")) { throw 'Backup V128 version name missing' }

          $runtime = $app + "`n" + $data + "`n" + $fb + "`n" + $main + "`n" + $res + "`n" + $backup
          if ($runtime.ToLower().Contains('cloudflare') -or $runtime.ToLower().Contains('workers.dev')) { throw 'Cloudflare dependency detected' }
          if ($runtime.Contains('sendPasswordResetEmail')) { throw 'Email password reset must remain disabled' }
          if ($runtime.ToLower().Contains('io.supabase') -or $runtime.ToLower().Contains('@supabase')) { throw 'Supabase runtime must remain disabled in V128' }

          Get-ChildItem (Join-Path $root 'src') -Filter '*.js' -File | ForEach-Object {
            Get-Content $_.FullName -Raw | node --input-type=module --check
            if ($LASTEXITCODE -ne 0) { throw "JS syntax failed: $($_.Name)" }
          }
          node --check (Join-Path $root 'electron/main.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'main.cjs syntax failed' }
          node --check (Join-Path $root 'electron/preload.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'preload.cjs syntax failed' }

          Write-Host 'WINDOWS V128 ANDROID PARITY SOURCE AUDIT PASSED'

      - name: Install dependencies
        working-directory: build_v128_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Build Portable
        working-directory: build_v128_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Portable startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v128_windows/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$exe) { throw 'Portable EXE not found' }
          $env:TAHALIL_SMOKE_TEST = '1'
          Remove-Item Env:TAHALIL_TRAY_SMOKE_TEST -ErrorAction SilentlyContinue
          $p = Start-Process $exe.FullName -PassThru
          if (!$p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; throw 'Portable startup timed out' }
          if ($p.ExitCode -ne 0) { throw "Portable startup exit code $($p.ExitCode)" }
          Remove-Item Env:TAHALIL_SMOKE_TEST -ErrorAction SilentlyContinue
          Write-Host 'PORTABLE STARTUP OK'

      - name: Portable System Tray smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v128_windows/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $env:TAHALIL_TRAY_SMOKE_TEST = '1'
          $p = Start-Process $exe.FullName -PassThru
          if (!$p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; throw 'Tray smoke timed out' }
          if ($p.ExitCode -ne 0) { throw "Tray smoke exit code $($p.ExitCode)" }
          Remove-Item Env:TAHALIL_TRAY_SMOKE_TEST -ErrorAction SilentlyContinue
          Write-Host 'SYSTEM TRAY OK'

      - name: Build Setup
        working-directory: build_v128_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }

      - name: Prepare V128 release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v128_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup = Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable -or !$setup) { throw 'Portable or Setup EXE missing' }

          Copy-Item $portable.FullName 'Tahalil-Alakkad-V128-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V128-Windows-Setup.exe' -Force

          foreach ($name in @('Tahalil-Alakkad-V128-Windows-Portable.exe','Tahalil-Alakkad-V128-Windows-Setup.exe')) {
            if ((Get-Item $name).Length -lt 1000000) { throw "$name unexpectedly small" }
            $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Publish directly to Windows V128 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v128-windows'
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "$env:GITHUB_REPOSITORY" `
              --title "تحاليل العقاد Windows V128 — Android Parity" `
              --notes "Windows V128 aligned with Android V128: draggable home icons, protected 72-hour outage grace, persistent Firestore cache/queued writes, and secondary-backend-ready architecture with a hard FIREBASE_ONLY safety policy. Firebase remains authoritative; no automatic failover, no Supabase runtime, no Cloudflare, no email-reset flow."
            if ($LASTEXITCODE -ne 0) { throw 'Could not create V128 Windows release' }
          }

          gh release upload $tag `
            'Tahalil-Alakkad-V128-Windows-Portable.exe' `
            'Tahalil-Alakkad-V128-Windows-Portable.exe.sha256' `
            'Tahalil-Alakkad-V128-Windows-Setup.exe' `
            'Tahalil-Alakkad-V128-Windows-Setup.exe.sha256' `
            --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload V128 release files' }
