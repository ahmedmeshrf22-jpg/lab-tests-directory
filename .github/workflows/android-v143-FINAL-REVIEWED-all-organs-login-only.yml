      - name: Compile-check Android V143
        working-directory: build_v143
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:compileReleaseKotlin

      - name: Select exact installed V142 signing identity
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_BUNDLE_B64:-}" || { echo "::error::TAHALIL_SIGNING_BUNDLE_B64 missing"; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -n "$APKSIGNER"

          apk_cert_sha256() {
            local apk="$1" raw cert
            raw="$("$APKSIGNER" verify --print-certs "$apk" 2>&1 || true)"
            cert="$(printf '%s\n' "$raw" | python3 -c 'import re,sys; s=sys.stdin.read(); m=re.search(r"certificate\s+SHA-256\s+digest\s*:\s*([0-9A-Fa-f:]+)",s,re.I); print(re.sub(r"[^0-9A-Fa-f]","",m.group(1)).lower() if m else "")')"
            test -n "$cert" || return 1
            printf '%s' "$cert"
          }

          V142_APK="$RUNNER_TEMP/android-v142-installed.apk"
          curl --fail --location --retry 3 \
            'https://github.com/ahmedmeshrf22-jpg/lab-tests-directory/releases/download/v142-android/Tahalil-Alakkad-V142-All-Fixes-Organ-Smart-Search-Android-SIGNED.apk' \
            -o "$V142_APK"
          "$APKSIGNER" verify --verbose --print-certs "$V142_APK" >/dev/null
          EXPECTED_CERT="$(apk_cert_sha256 "$V142_APK")"
          test -n "$EXPECTED_CERT" || { echo "::error::Could not read installed V142 signer certificate"; exit 1; }

          SIGN_DIR="$RUNNER_TEMP/tahalil_v143_exact_signing"
          rm -rf "$SIGN_DIR" && mkdir -p "$SIGN_DIR/files" "$SIGN_DIR/test"
          printf '%s' "$SIGNING_BUNDLE_B64" | tr -d '\r\n ' | base64 --decode > "$SIGN_DIR/bundle.bin"
          if unzip -t "$SIGN_DIR/bundle.bin" >/dev/null 2>&1; then
            unzip -q "$SIGN_DIR/bundle.bin" -d "$SIGN_DIR/files"
          else
            cp "$SIGN_DIR/bundle.bin" "$SIGN_DIR/files/original.keystore"
          fi
          mapfile -t KEYSTORES < <(find "$SIGN_DIR/files" -type f \( -iname '*.jks' -o -iname '*.keystore' \) -print | sort)
          [ "${#KEYSTORES[@]}" -gt 0 ] || { echo "::error::No keystore in signing bundle"; exit 1; }

          PASSFILE="$SIGN_DIR/passwords.txt"; : > "$PASSFILE"
          while IFS= read -r META; do
            [ -f "$META" ] || continue
            sed -nE 's/^[[:space:]]*(STORE_PASSWORD|KEYSTORE_PASSWORD|storePassword|store_password|KEY_PASSWORD|keyPassword|key_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" >> "$PASSFILE" || true
          done < <(find "$SIGN_DIR/files" -type f \( -iname '*.properties' -o -iname '*.env' -o -iname '*.txt' \) -print)
          printf '%s\n' android >> "$PASSFILE"
          tr -d '\r' < "$PASSFILE" | awk 'NF && !seen[$0]++' > "$PASSFILE.tmp" && mv "$PASSFILE.tmp" "$PASSFILE"

          FOUND_KEYSTORE=''; FOUND_STOREPASS=''; FOUND_ALIAS=''; FOUND_KEYPASS=''
          while IFS= read -r KS; do
            while IFS= read -r SP; do
              [ -n "$SP" ] || continue
              keytool -list -keystore "$KS" -storepass "$SP" >/dev/null 2>&1 || continue
              mapfile -t ALIASES < <(keytool -list -v -keystore "$KS" -storepass "$SP" 2>/dev/null | sed -n 's/^Alias name: //p')
              for ALIAS in "${ALIASES[@]}"; do
                [ -n "$ALIAS" ] || continue
                CERT="$(keytool -exportcert -rfc -keystore "$KS" -storepass "$SP" -alias "$ALIAS" 2>/dev/null | openssl x509 -noout -fingerprint -sha256 2>/dev/null | sed 's/.*=//' | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
                [ "$CERT" = "$EXPECTED_CERT" ] || continue
                { printf '%s\n' "$SP"; cat "$PASSFILE"; } | awk 'NF && !seen[$0]++' > "$SIGN_DIR/keypasses.txt"
                while IFS= read -r KP; do
                  [ -n "$KP" ] || continue
                  rm -f "$SIGN_DIR/test/keycheck.p12"
                  if keytool -importkeystore -srckeystore "$KS" -srcstorepass "$SP" -srcalias "$ALIAS" -srckeypass "$KP" \
                     -destkeystore "$SIGN_DIR/test/keycheck.p12" -deststoretype PKCS12 \
                     -deststorepass 'TemporaryCheckOnly_143!' -destkeypass 'TemporaryCheckOnly_143!' -noprompt >/dev/null 2>&1; then
                    FOUND_KEYSTORE="$KS"; FOUND_STOREPASS="$SP"; FOUND_ALIAS="$ALIAS"; FOUND_KEYPASS="$KP"
                    break 4
                  fi
                done < "$SIGN_DIR/keypasses.txt"
              done
            done < "$PASSFILE"
          done < <(printf '%s\n' "${KEYSTORES[@]}")

          test -n "$FOUND_KEYSTORE" || { echo "::error::Signing bundle does not contain the exact installed V142 private key"; exit 1; }
          echo "::add-mask::$FOUND_STOREPASS"; echo "::add-mask::$FOUND_ALIAS"; echo "::add-mask::$FOUND_KEYPASS"
          {
            echo "KEYSTORE_PATH=$FOUND_KEYSTORE"
            echo "STORE_PASSWORD=$FOUND_STOREPASS"
            echo "KEY_ALIAS=$FOUND_ALIAS"
            echo "KEY_PASSWORD=$FOUND_KEYPASS"
            echo "EXPECTED_V142_CERT=$EXPECTED_CERT"
          } >> "$GITHUB_ENV"
          echo 'Exact V142 private signing identity selected and private-key password verified.'

      - name: Build signed Android V143
        working-directory: build_v143
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify exact signer and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build_v143/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          RAW="$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)"
          NEW_CERT="$(printf '%s\n' "$RAW" | python3 -c 'import re,sys; s=sys.stdin.read(); m=re.search(r"certificate\s+SHA-256\s+digest\s*:\s*([0-9A-Fa-f:]+)",s,re.I); print(re.sub(r"[^0-9A-Fa-f]","",m.group(1)).lower() if m else "")')"
          test -n "${EXPECTED_V142_CERT:-}" && test -n "$NEW_CERT"
          test "$NEW_CERT" = "$EXPECTED_V142_CERT" || { echo '::error::Built APK signer differs from installed V142'; exit 1; }
          cp "$APK" Tahalil-Alakkad-V143-All-Organs-Login-Only-SIGNED.apk
          sha256sum Tahalil-Alakkad-V143-All-Organs-Login-Only-SIGNED.apk > Tahalil-Alakkad-V143-All-Organs-Login-Only-SIGNED.apk.sha256

      - name: Publish immutable V143 source branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd build_v143
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B v143-android-all-organs-login-only-base
          git add -A
          git commit -m 'Android V143 all organs search + login only' || true
          V143_SHA="$(git rev-parse HEAD)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/v143-android-all-organs-login-only-base
          echo "V143_COMMIT_SHA=$V143_SHA" >> "$GITHUB_ENV"

      - name: Prepare source snapshot
        shell: bash
