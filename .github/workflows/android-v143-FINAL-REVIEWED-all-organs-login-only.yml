          sha256sum Tahalil-Alakkad-V143-Android-SOURCE.zip > Tahalil-Alakkad-V143-Android-SOURCE.zip.sha256

      - name: Upload V143 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-Android-V143-FINAL-REVIEWED
          path: |
            Tahalil-Alakkad-V143-All-Organs-Login-Only-SIGNED.apk
            Tahalil-Alakkad-V143-All-Organs-Login-Only-SIGNED.apk.sha256
            Tahalil-Alakkad-V143-Android-SOURCE.zip
            Tahalil-Alakkad-V143-Android-SOURCE.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android V143 release and preserve Windows V144 latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v143-android'
          TITLE='تحاليل العقاد Android V143 — All Organs + Login Only'
          NOTES='V143 expands semantic search across all major lab-relevant organs and body systems on direct/manual/smart/OCR paths; keeps the sequential رعاية تليق بك slogan on Login; removes the second local biometric/device-credential/app-PIN unlock layer so an active Firebase session opens directly; keeps the approved-device gate and separate privileged administration PIN; preserves V142 backup UI, 04:00 catch-up, catalogue, Firebase, results, failover, offline behavior, notifications, screenshots and overlay defense. Windows V144 is untouched.'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" Tahalil-Alakkad-V143-All-Organs-Login-Only-SIGNED.apk Tahalil-Alakkad-V143-All-Organs-Login-Only-SIGNED.apk.sha256 Tahalil-Alakkad-V143-Android-SOURCE.zip Tahalil-Alakkad-V143-Android-SOURCE.zip.sha256 --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" Tahalil-Alakkad-V143-All-Organs-Login-Only-SIGNED.apk Tahalil-Alakkad-V143-All-Organs-Login-Only-SIGNED.apk.sha256 Tahalil-Alakkad-V143-Android-SOURCE.zip Tahalil-Alakkad-V143-Android-SOURCE.zip.sha256 --repo "$GITHUB_REPOSITORY" --target "$V143_COMMIT_SHA" --title "$TITLE" --notes "$NOTES"
          fi
          gh release edit v144-windows --repo "$GITHUB_REPOSITORY" --latest
          curl --fail --location --retry 3 "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest-windows.json" -o "$RUNNER_TEMP/latest-windows.json"
          python3 -c 'import json,os; m=json.load(open(os.environ["RUNNER_TEMP"]+"/latest-windows.json",encoding="utf-8-sig")); assert int(m.get("versionCode",0))==144, m'

      - name: Final status
        shell: bash
        run: |
          echo 'ANDROID V143 FINAL REVIEWED: ALL ORGANS + LOGIN ONLY + EXACT V142 SIGNER + WINDOWS V144 PRESERVED'
