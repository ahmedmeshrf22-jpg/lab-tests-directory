name: Windows V145 R8.22 Organized UI

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-windows-v145-r822-ui
  cancel-in-progress: false

jobs:
  build:
    name: Windows V145 R8.22 — Organized UI
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      BASE_TAG: v145-r8.21-windows
      BASE_SOURCE: Tahalil-Alakkad-V145-R8.21-Windows-Source.zip
      BASE_SHA256: 1f63e43eb43d90d89c395e610b2c236affa5af1e5fdb78f97b6f3adc8cd247fd
      R822_CSS_B64: 
      R822_NOTES_B64: 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore exact R8.21 source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD $env:BASE_SOURCE
          if (Test-Path $zip) { Remove-Item $zip -Force }
          gh release download $env:BASE_TAG --repo "$env:GITHUB_REPOSITORY" --pattern $env:BASE_SOURCE --dir $PWD
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $zip)) { throw 'Could not download exact R8.21 source' }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:BASE_SHA256) { throw "R8.21 source hash mismatch: $hash" }
          $root = Join-Path $PWD 'build_windows/windows-system'
          if (Test-Path (Join-Path $PWD 'build_windows')) { Remove-Item (Join-Path $PWD 'build_windows') -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path $zip -DestinationPath $root -Force
          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '145.8.21') { throw "Expected 145.8.21, got $($pkg.version)" }
          foreach ($item in @('src/app.js','src/data.js','src/firebase.js','src/v145r8-parity.js','electron/main.cjs','electron/preload.cjs')) {
            $name = 'R822_' + ($item -replace '[^A-Za-z0-9]','_').ToUpper() + '_SHA256'
            $value = (Get-FileHash (Join-Path $root $item) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$name=$value" | Add-Content $env:GITHUB_ENV
          }

      - name: Apply organized dashboard UI only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $styles = Join-Path $root 'src/styles.css'
          $pkgPath = Join-Path $root 'package.json'
          $existing = Get-Content $styles -Raw
          if ($existing.Contains('TAH_R822_ORGANIZED_UI')) { throw 'R8.22 UI marker already exists' }
          $css = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:R822_CSS_B64))
          Add-Content -Path $styles -Value "`r`n$css" -Encoding utf8
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = '145.8.22'
          $pkg.description = 'Tahalil Alakkad Windows V145 R8.22 - organized professional dashboard UI'
          $pkg | ConvertTo-Json -Depth 20 | Set-Content $pkgPath -Encoding utf8
          $notes = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:R822_NOTES_B64))
          $notes | Set-Content (Join-Path $root 'V145_R822_ORGANIZED_UI_NOTES.txt') -Encoding utf8

      - name: Audit visual-only scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '145.8.22') { throw "Expected 145.8.22, got $($pkg.version)" }
          $css = Get-Content (Join-Path $root 'src/styles.css') -Raw
          if (!$css.Contains('TAH_R822_ORGANIZED_UI')) { throw 'R8.22 marker missing' }
          if (!$css.Contains('grid-template-columns:repeat(5,minmax(0,1fr))')) { throw 'Shortcut organization rule missing' }
          if (!$css.Contains('.sys814-header{display:none!important}')) { throw 'Duplicate dashboard header removal missing' }
          $checks = @{
            'src/app.js'='R822_SRC_APP_JS_SHA256';
            'src/data.js'='R822_SRC_DATA_JS_SHA256';
            'src/firebase.js'='R822_SRC_FIREBASE_JS_SHA256';
            'src/v145r8-parity.js'='R822_SRC_V145R8_PARITY_JS_SHA256';
            'electron/main.cjs'='R822_ELECTRON_MAIN_CJS_SHA256';
            'electron/preload.cjs'='R822_ELECTRON_PRELOAD_CJS_SHA256'
          }
          foreach ($pair in $checks.GetEnumerator()) {
            $actual = (Get-FileHash (Join-Path $root $pair.Key) -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = [Environment]::GetEnvironmentVariable($pair.Value)
            if ($actual -ne $expected) { throw "$($pair.Key) changed - visual-only scope violated" }
          }
          node --check (Join-Path $root 'src/app.js')
          if ($LASTEXITCODE -ne 0) { throw 'app.js syntax failed' }
          node --check (Join-Path $root 'electron/main.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'main.cjs syntax failed' }
          'R8.22 VISUAL-ONLY AUDIT: PASS' | Set-Content 'R822_UI_AUDIT.txt' -Encoding utf8
          'Base: exact R8.21 Security Hardened source' | Add-Content 'R822_UI_AUDIT.txt'
          'Changed: src/styles.css + package metadata only' | Add-Content 'R822_UI_AUDIT.txt'
          'Firebase/data/security/updater logic: unchanged' | Add-Content 'R822_UI_AUDIT.txt'

      - name: Package R8.22 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $stage = Join-Path $env:RUNNER_TEMP 'source_stage_r822'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem -LiteralPath $root -Force | Where-Object { @('node_modules','release','.git') -notcontains $_.Name } | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $stage -Recurse -Force }
          $zip = Join-Path $PWD 'Tahalil-Alakkad-V145-R8.22-Windows-Source.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage,$zip,[System.IO.Compression.CompressionLevel]::Optimal,$false)
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Tahalil-Alakkad-V145-R8.22-Windows-Source.zip" | Set-Content 'Tahalil-Alakkad-V145-R8.22-Windows-Source.zip.sha256' -Encoding ascii
          Copy-Item (Join-Path $root 'V145_R822_ORGANIZED_UI_NOTES.txt') 'V145_R822_ORGANIZED_UI_NOTES.txt' -Force

      - name: Install dependencies
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Build Portable
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Portable smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable) { throw 'Portable EXE missing' }
          $proc = Start-Process -FilePath $portable.FullName -PassThru
          Start-Sleep -Seconds 12
          if ($proc.HasExited) { throw "Portable exited unexpectedly: $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Build Setup
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }

      - name: Prepare delivery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup = Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable -or !$setup) { throw 'Portable or Setup missing' }
          Copy-Item $portable.FullName 'Tahalil-Alakkad-V145-R8.22-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V145-R8.22-Windows-Setup.exe' -Force
          foreach ($name in @('Tahalil-Alakkad-V145-R8.22-Windows-Portable.exe','Tahalil-Alakkad-V145-R8.22-Windows-Setup.exe')) {
            $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V145-R8.22-Windows-Organized-UI
          path: |
            Tahalil-Alakkad-V145-R8.22-Windows-Portable.exe
            Tahalil-Alakkad-V145-R8.22-Windows-Portable.exe.sha256
            Tahalil-Alakkad-V145-R8.22-Windows-Setup.exe
            Tahalil-Alakkad-V145-R8.22-Windows-Setup.exe.sha256
            Tahalil-Alakkad-V145-R8.22-Windows-Source.zip
            Tahalil-Alakkad-V145-R8.22-Windows-Source.zip.sha256
            V145_R822_ORGANIZED_UI_NOTES.txt
            R822_UI_AUDIT.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish R8.22 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v145-r8.22-windows'
          $title = 'تحاليل العقاد Windows V145 R8.22 — Organized UI'
          $notes = Get-Content 'V145_R822_ORGANIZED_UI_NOTES.txt' -Raw
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes } else { gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create R8.22 release' }
          gh release upload $tag Tahalil-Alakkad-V145-R8.22-Windows-Portable.exe Tahalil-Alakkad-V145-R8.22-Windows-Portable.exe.sha256 Tahalil-Alakkad-V145-R8.22-Windows-Setup.exe Tahalil-Alakkad-V145-R8.22-Windows-Setup.exe.sha256 Tahalil-Alakkad-V145-R8.22-Windows-Source.zip Tahalil-Alakkad-V145-R8.22-Windows-Source.zip.sha256 V145_R822_ORGANIZED_UI_NOTES.txt R822_UI_AUDIT.txt --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload R8.22 release assets' }
