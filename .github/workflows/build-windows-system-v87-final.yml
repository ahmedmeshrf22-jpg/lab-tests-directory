          if (-not (Test-Path "windows-system/package.json")) { throw "Windows source package was not reconstructed" }

      - name: Verify Firebase Windows registration
        shell: pwsh
        run: |
          $firebase = Get-Content "windows-system/src/firebase.js" -Raw
          if ($firebase -notmatch "1:266327573884:web:c457f66f054582bb4290f9") { throw "Windows Firebase Web App ID is missing" }
          if ($firebase -notmatch "tahalil-alakkad") { throw "Firebase project ID is missing" }
          Write-Host "Firebase Windows/Web configuration detected."

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax check
        shell: pwsh
        working-directory: windows-system
        run: |
          node --check src/app.js
          node --check src/backup.js
          node --check src/data.js
          node --check src/firebase.js
          node --check src/guide.js
          node --check src/vision.js
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check vite.config.js

      - name: Install dependencies
        shell: pwsh
        working-directory: windows-system
        run: npm install --no-audit --no-fund

      - name: Build portable Windows EXE
        shell: pwsh
        working-directory: windows-system
        run: npm run dist:win

      - name: Verify output
        shell: pwsh
        run: |
          $files = Get-ChildItem "windows-system/release/*.exe" -ErrorAction Stop
          if ($files.Count -lt 1) { throw "No Windows EXE was produced" }
          $files | ForEach-Object { Write-Host ("Built: " + $_.FullName + " | " + $_.Length + " bytes") }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-System-V87-Windows-FINAL
          path: windows-system/release/*.exe
          if-no-files-found: error
          retention-days: 30
