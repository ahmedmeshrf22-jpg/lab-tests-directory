          fcm = read("app/src/main/java/com/example/notifications/OrderFirebaseMessagingService.kt")
          periodic = read("app/src/main/java/com/example/notifications/LabOrderBackgroundService.kt")
          autobackup = read("app/src/main/java/com/example/notifications/AutoBackupScheduler.kt")
          backup = read("app/src/main/java/com/example/util/CommercialBackupManager.kt")
          rules = read("firestore.rules")
          update = read("app/src/main/java/com/example/update/ForcedUpdateGate.kt")
          allkt = "\n".join(p.read_text(errors="ignore") for p in (root / "app/src/main/java").rglob("*.kt"))
          tests = json.loads(read("app/src/main/assets/lab_tests_android.json"))
          
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          changed |= set(subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"], text=True).splitlines())
          allowed = {
              "V141_FINAL_DELIVERY_FIX_NOTES.txt",
              "app/build.gradle.kts",
              "app/src/main/AndroidManifest.xml",
              "app/src/main/java/com/example/MainActivity.kt",
              "app/src/main/java/com/example/data/repository/LabTestRepository.kt",
              "app/src/main/java/com/example/notifications/AutoBackupScheduler.kt",
              "app/src/main/java/com/example/notifications/DeviceApprovalGuard.kt",
              "app/src/main/java/com/example/notifications/LabOrderBackgroundService.kt",
              "app/src/main/java/com/example/notifications/OrderFirebaseMessagingService.kt",
              "app/src/main/java/com/example/notifications/OrderNotificationManager.kt",
              "app/src/main/java/com/example/notifications/OrderRealtimeNotificationService.kt",
              "app/src/main/java/com/example/resilience/ResultFailoverClient.kt",
              "app/src/main/java/com/example/ui/LabTestsViewModel.kt",
              "app/src/main/java/com/example/util/CommercialBackupManager.kt",
              "app/src/main/res/xml/file_paths.xml",
              "firestore.rules",
          }
          
          manager_start = vm.find("if (manager) {")
          manager_end = vm.find("\n        _actingAsUser.value = null", manager_start + 20)
          manager_block = vm[manager_start:manager_end]
          
          checks = {
              "V141 version": 'versionCode = 141' in grad and '5.61-final-delivery-fix-v141' in grad,
              "same package": 'applicationId = "com.aistudio.labtestsdirectory.egypt"' in grad,
              "no unintended files changed": not (changed - allowed),
              "331 tests": len(tests) == 331,
              "embedded customer prices removed": all(x.get("customer_price") is None for x in tests),
          
              "screenshots still enabled": "FLAG_SECURE" not in main,
              "overlay defense preserved": "setHideOverlayWindows(true)" in main,
          
              "result failover provider authority fixed":
                  '${applicationId}.provider' in manifest and 'context.packageName + ".provider"' in result,
              "result failover cache path declared":
                  'name="result_failover_cache"' in paths and 'path="result_failover/"' in paths,
              "result failover SHA and 6MiB guard":
                  "X-Tahalil-SHA256" in result and "MAX_FILE_BYTES = 6 * 1024 * 1024" in result,
          
              "realtime device approval": "DeviceApprovalGuard.checkServerApproved" in realtime,
              "FCM device approval": "DeviceApprovalGuard.checkServerApproved" in fcm,
              "periodic job device approval": "DeviceApprovalGuard.checkServerApproved" in periodic,
              "backup device approval": "DeviceApprovalGuard.checkServerApproved" in autobackup,
              "manager device bypass removed":
                  '_deviceAccessStatus.value = "approved"' not in manager_block
                  and "attachUserProfileListener" in manager_block,
          
              "Android 15/16 FGS class":
                  "FOREGROUND_SERVICE_SPECIAL_USE" in manifest
                  and 'android:foregroundServiceType="specialUse"' in manifest
                  and "PROPERTY_SPECIAL_USE_FGS_SUBTYPE" in manifest,
          
              "catalogue server sync":
                  'CATALOG_OVERRIDES_COLLECTION = "lab_catalog_overrides"' in vm
                  and "startCatalogOverridesSync()" in vm
                  and "saveCatalogOverride" in vm
                  and "applyRemoteCatalogOverride" in repo,
              "bulk customer prices server-backed":
                  "applyBulkCatalogUpdate" in vm
                  and "runBatch" in vm
                  and "CUSTOMER_OVERRIDES_COLLECTION" in vm,
              "catalogue included in encrypted backup": "lab_catalog_overrides" in backup,
              "catalogue Firestore rules": "match /lab_catalog_overrides/{document=**}" in rules,
          
              "financial invariants":
                  "function validOrderFinancialState()" in rules
                  and "request.resource.data.total_customer_price == request.resource.data.subtotal_customer_price - request.resource.data.discount_amount" in rules
                  and "request.resource.data.remaining_amount == request.resource.data.total_customer_price - request.resource.data.paid_amount" in rules,
              "payment identity validation":
                  "request.resource.data.customer_id == customerId" in rules
                  and "request.resource.data.order_id == orderId" in rules,
          
              "Firebase authoritative": "FirebaseFirestore" in allkt and "FirebaseAuth" in allkt,
              "DB failover preserved": "tahalil-failover-read" in allkt,
              "result failover preserved": "tahalil-result-failover" in allkt,
              "reconciliation preserved": "tahalil-shadow-reconcile" in allkt,
              "offline vault preserved": "OfflineAccessVault" in allkt,
              "pending writes preserved": "waitForPendingWrites()" in vm and "PendingSyncStore" in vm,
              "04:00 backup preserved": "FOUR_AM_HOUR = 4" in autobackup and "Tahalil Alakkad/Backups" in allkt,
              "mandatory updater preserved": "releases/latest/download/latest.json" in update and "sha256" in update.lower(),
              "no Cloudflare": "cloudflare" not in allkt.lower() and "workers.dev" not in allkt.lower(),
              "no shipped backend secrets": all(x not in allkt for x in [
                  "SUPABASE_SERVICE_ROLE_KEY", "SUPABASE_SECRET_KEYS", "sb_secret_", "BEGIN PRIVATE KEY"
              ]),
          }
          
          for name, ok in checks.items():
              print(("OK   " if ok else "FAIL ") + name)
          bad = [name for name, ok in checks.items() if not ok]
          if bad:
              raise SystemExit("V141 FINAL DELIVERY AUDIT FAILED: " + ", ".join(bad))
          print("ALL V141 FINAL DELIVERY AUDITS PASSED")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile-check V141
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:compileReleaseKotlin

      - name: Publish immutable V141 source branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="v141-final-delivery-fix-base"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add \
            V141_FINAL_DELIVERY_FIX_NOTES.txt \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/example/MainActivity.kt \
            app/src/main/java/com/example/data/repository/LabTestRepository.kt \
            app/src/main/java/com/example/notifications/AutoBackupScheduler.kt \
            app/src/main/java/com/example/notifications/DeviceApprovalGuard.kt \
            app/src/main/java/com/example/notifications/LabOrderBackgroundService.kt \
            app/src/main/java/com/example/notifications/OrderFirebaseMessagingService.kt \
            app/src/main/java/com/example/notifications/OrderNotificationManager.kt \
            app/src/main/java/com/example/notifications/OrderRealtimeNotificationService.kt \
            app/src/main/java/com/example/resilience/ResultFailoverClient.kt \
            app/src/main/java/com/example/ui/LabTestsViewModel.kt \
            app/src/main/java/com/example/util/CommercialBackupManager.kt \
            app/src/main/res/xml/file_paths.xml \
            firestore.rules
          git commit -m "V141 Android final delivery fix"
          
          COMMIT_SHA="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch -q origin "$BRANCH"
            LOCAL_TREE="$(git rev-parse HEAD^{tree})"
            REMOTE_TREE="$(git rev-parse FETCH_HEAD^{tree})"
            if [ "$LOCAL_TREE" != "$REMOTE_TREE" ]; then
              echo "::error::Existing $BRANCH differs; refusing to overwrite it."
              exit 1
            fi
            COMMIT_SHA="$(git rev-parse FETCH_HEAD)"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "V141_COMMIT_SHA=$COMMIT_SHA" >> "$GITHUB_ENV"

      - name: Restore original Android signing identity
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_BUNDLE_B64:-}"
          
          SIGN_DIR="$RUNNER_TEMP/tahalil_v141_signing"
          rm -rf "$SIGN_DIR"
          mkdir -p "$SIGN_DIR/files"
          
          printf '%s' "$SIGNING_BUNDLE_B64" | tr -d '\r\n ' | base64 --decode > "$SIGN_DIR/bundle.bin"
          if unzip -t "$SIGN_DIR/bundle.bin" >/dev/null 2>&1; then
            unzip -q "$SIGN_DIR/bundle.bin" -d "$SIGN_DIR/files"
          else
            cp "$SIGN_DIR/bundle.bin" "$SIGN_DIR/files/original.keystore"
          fi
          
          KEYSTORE="$(find "$SIGN_DIR/files" -type f \( -iname '*.jks' -o -iname '*.keystore' \) -print -quit)"
          test -n "$KEYSTORE"
          
          STORE_PASSWORD=""
          KEY_ALIAS=""
          KEY_PASSWORD=""
          
          while IFS= read -r META; do
            [ -f "$META" ] || continue
            [ -n "$STORE_PASSWORD" ] || STORE_PASSWORD="$(sed -nE 's/^[[:space:]]*(STORE_PASSWORD|KEYSTORE_PASSWORD|storePassword|store_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(sed -nE 's/^[[:space:]]*(KEY_ALIAS|keyAlias|key_alias)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$(sed -nE 's/^[[:space:]]*(KEY_PASSWORD|keyPassword|key_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
          done < <(find "$SIGN_DIR/files" -type f \( -iname '*.properties' -o -iname '*.env' -o -iname '*.txt' \) -print)
          
          if [ -z "$STORE_PASSWORD" ] && keytool -list -keystore "$KEYSTORE" -storepass android >/dev/null 2>&1; then
            STORE_PASSWORD=android
          fi
          
          test -n "$STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
          test -n "$KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$STORE_PASSWORD"
          
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          
          {
            echo "KEYSTORE_PATH=$KEYSTORE"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Android V141
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify APK and original signing certificate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          
          mkdir -p "$RUNNER_TEMP/v140apk"
          gh release download v140 \
            --pattern 'Tahalil-Alakkad-V140-Screenshot-Enabled-Android-SIGNED.apk' \
            --dir "$RUNNER_TEMP/v140apk"
          
          OLD_APK="$RUNNER_TEMP/v140apk/Tahalil-Alakkad-V140-Screenshot-Enabled-Android-SIGNED.apk"
          test -s "$OLD_APK"
          
          NEW_CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          OLD_CERT="$("$APKSIGNER" verify --print-certs "$OLD_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test -n "$NEW_CERT"
          test -n "$OLD_CERT"
          test "$NEW_CERT" = "$OLD_CERT" || {
            echo "::error::V141 signing certificate differs from V140"
            exit 1
          }
          
          cp "$APK" Tahalil-Alakkad-V141-Final-Delivery-Fix-Android-SIGNED.apk
          sha256sum Tahalil-Alakkad-V141-Final-Delivery-Fix-Android-SIGNED.apk \
            > Tahalil-Alakkad-V141-Final-Delivery-Fix-Android-SIGNED.apk.sha256

      - name: Deploy V141 Firestore rules
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" || {
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is required"
            exit 1
          }
          
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          
          npm install --global firebase-tools
          firebase deploy \
            --project tahalil-alakkad \
            --config firebase.json \
            --only firestore:rules \
            --non-interactive

      - name: Publish Android V141 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v141 >/dev/null 2>&1; then
            echo "::error::Release v141 already exists. Refusing to overwrite it."
            exit 1
          fi
          
          gh release create v141 \
            Tahalil-Alakkad-V141-Final-Delivery-Fix-Android-SIGNED.apk \
            Tahalil-Alakkad-V141-Final-Delivery-Fix-Android-SIGNED.apk.sha256 \
            --target "$V141_COMMIT_SHA" \
            --title "تحاليل العقاد Android V141 — Final Delivery Fix" \
            --notes "V141 closes final Android delivery blockers: result failover FileProvider/cache, approved-device background enforcement including manager, Android 15/16 notification FGS classification, server-synced catalogue/bulk prices, backup coverage, and financial Firestore invariants. Android screenshots remain enabled. Firebase primary, Supabase failover/reconciliation, offline vault, backup/restore, notifications, update gate and original signing identity are preserved."

      - name: Final status
        shell: bash
        run: |
          echo "ANDROID V141 FINAL DELIVERY FIX: BUILD + SIGNING + RULES + RELEASE = PASSED"
