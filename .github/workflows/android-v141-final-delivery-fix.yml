name: Android V141 Final Delivery Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-v141-android-final-delivery
  cancel-in-progress: false

jobs:
  build-v141:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Android V140 source
        uses: actions/checkout@v4
        with:
          ref: v140-screenshot-enabled-base
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply V141 delivery fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          grad = root / "app/build.gradle.kts"
          result = root / "app/src/main/java/com/example/resilience/ResultFailoverClient.kt"
          paths = root / "app/src/main/res/xml/file_paths.xml"
          service = root / "app/src/main/java/com/example/notifications/OrderRealtimeNotificationService.kt"

          for p in (grad, result, paths, service):
              if not p.exists():
                  raise SystemExit(f"Missing required file: {p}")

          s = grad.read_text(encoding="utf-8")
          if not re.search(r'\bversionCode\s*=\s*140\b', s):
              raise SystemExit("Expected Android V140 source")
          s = re.sub(r'\bversionCode\s*=\s*140\b', 'versionCode = 141', s, count=1)
          if 'versionName = "5.60-screenshot-enabled-v140"' not in s:
              raise SystemExit("Expected V140 versionName")
          s = s.replace(
              'versionName = "5.60-screenshot-enabled-v140"',
              'versionName = "5.61-final-delivery-v141"',
              1
          )
          grad.write_text(s, encoding="utf-8")

          s = result.read_text(encoding="utf-8")
          changed = 0
          for old, new in [
              ('${context.packageName}.fileprovider', '${context.packageName}.provider'),
              ('${packageName}.fileprovider', '${packageName}.provider'),
              ('.fileprovider"', '.provider"'),
          ]:
              if old in s:
                  s = s.replace(old, new)
                  changed += 1
          if changed == 0 and '.provider' not in s:
              raise SystemExit("Could not locate ResultFailover FileProvider authority")
          result.write_text(s, encoding="utf-8")

          s = paths.read_text(encoding="utf-8")
          marker = '<cache-path name="result_failover" path="result_failover/" />'
          if marker not in s:
              if '</paths>' not in s:
                  raise SystemExit("Invalid file_paths.xml")
              s = s.replace('</paths>', f'    {marker}\n</paths>', 1)
          paths.write_text(s, encoding="utf-8")

          s = service.read_text(encoding="utf-8")
          if 'override fun onTimeout(startId: Int, fgsType: Int)' not in s:
              insert = (
                  '    override fun onTimeout(startId: Int, fgsType: Int) {\n'
                  '        LabOrderBackgroundScheduler.schedule(this)\n'
                  '        stopSelf(startId)\n'
                  '    }\n\n'
              )
              idx = s.find('override fun onDestroy()')
              if idx < 0:
                  raise SystemExit("Could not locate onDestroy() in OrderRealtimeNotificationService")
              s = s[:idx] + insert + s[idx:]
          service.write_text(s, encoding="utf-8")

          Path("V141_ANDROID_FINAL_DELIVERY_FIX_NOTES.txt").write_text(
              "Android V141 Final Delivery Fix\n"
              "- Result failover FileProvider authority aligned with AndroidManifest.\n"
              "- result_failover cache path explicitly exposed via FileProvider.\n"
              "- Android 15/16 dataSync FGS timeout handled safely with scheduler fallback.\n"
              "- Screenshots remain enabled.\n"
              "- Firebase/Supabase/offline/backup/restore/results/signing behavior otherwise preserved.\n",
              encoding="utf-8"
          )
          print("V141 delivery patch applied")
          PY

      - name: Audit V141 blockers
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          src = Path("app/src/main/java")
          grad = Path("app/build.gradle.kts").read_text(encoding="utf-8")
          manifest = Path("app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          result = (src/"com/example/resilience/ResultFailoverClient.kt").read_text(encoding="utf-8")
          service = (src/"com/example/notifications/OrderRealtimeNotificationService.kt").read_text(encoding="utf-8")
          paths = Path("app/src/main/res/xml/file_paths.xml").read_text(encoding="utf-8")
          main = (src/"com/example/MainActivity.kt").read_text(encoding="utf-8")
          vm = (src/"com/example/ui/LabTestsViewModel.kt").read_text(encoding="utf-8")
          fail = (src/"com/example/resilience/EmergencyFailoverClient.kt").read_text(encoding="utf-8")
          reconcile = (src/"com/example/resilience/ShadowReconciliationClient.kt").read_text(encoding="utf-8")
          allkt = "\n".join(p.read_text(errors="ignore") for p in src.rglob("*.kt"))

          checks = {
              "V141 version": 'versionCode = 141' in grad and '5.61-final-delivery-v141' in grad,
              "same package": 'applicationId = "com.aistudio.labtestsdirectory.egypt"' in grad,
              "manifest provider authority": '${applicationId}.provider' in manifest,
              "result failover authority fixed": '.fileprovider' not in result and '.provider' in result,
              "result failover cache path fixed": '<cache-path name="result_failover" path="result_failover/" />' in paths,
              "Android 15 timeout handled": 'override fun onTimeout(startId: Int, fgsType: Int)' in service and 'LabOrderBackgroundScheduler.schedule(this)' in service,
              "screenshots remain enabled": "FLAG_SECURE" not in main,
              "overlay defense preserved": "setHideOverlayWindows(true)" in main,
              "Firebase authoritative": "FirebaseFirestore" in allkt and "FirebaseAuth" in allkt,
              "DB failover preserved": "tahalil-failover-read" in fail,
              "result failover preserved": "tahalil-result-failover" in result and "X-Tahalil-Device" in result,
              "reconciliation preserved": "tahalil-shadow-reconcile" in reconcile,
              "pending writes preserved": "waitForPendingWrites()" in vm and "PendingSyncStore" in vm,
              "no Supabase secret": all(x not in allkt for x in ["SUPABASE_SERVICE_ROLE_KEY","SUPABASE_SECRET_KEYS","sb_secret_","BEGIN PRIVATE KEY"]),
              "no Cloudflare": "cloudflare" not in allkt.lower() and "workers.dev" not in allkt.lower(),
          }

          for k, v in checks.items():
              print(("OK   " if v else "FAIL ") + k)

          bad = [k for k,v in checks.items() if not v]
          if bad:
              raise SystemExit("V141 AUDIT FAILED: " + ", ".join(bad))

          print("ALL V141 DELIVERY CHECKS PASSED")
          PY

      - name: Compile-check V141
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:compileReleaseKotlin

      - name: Restore Android signing identity
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_BUNDLE_B64:-}"
          SIGN_DIR="$RUNNER_TEMP/tahalil_v141_signing"
          rm -rf "$SIGN_DIR" && mkdir -p "$SIGN_DIR/files"
          printf '%s' "$SIGNING_BUNDLE_B64" | tr -d '\r\n ' | base64 --decode > "$SIGN_DIR/bundle.bin"

          if unzip -t "$SIGN_DIR/bundle.bin" >/dev/null 2>&1; then
            unzip -q "$SIGN_DIR/bundle.bin" -d "$SIGN_DIR/files"
          else
            cp "$SIGN_DIR/bundle.bin" "$SIGN_DIR/files/original.keystore"
          fi

          KEYSTORE="$(find "$SIGN_DIR/files" -type f \( -iname '*.jks' -o -iname '*.keystore' \) -print -quit)"
          test -n "$KEYSTORE"

          STORE_PASSWORD=""
          KEY_ALIAS=""
          KEY_PASSWORD=""

          while IFS= read -r META; do
            [ -f "$META" ] || continue
            [ -n "$STORE_PASSWORD" ] || STORE_PASSWORD="$(sed -nE 's/^[[:space:]]*(STORE_PASSWORD|KEYSTORE_PASSWORD|storePassword|store_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(sed -nE 's/^[[:space:]]*(KEY_ALIAS|keyAlias|key_alias)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$(sed -nE 's/^[[:space:]]*(KEY_PASSWORD|keyPassword|key_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
          done < <(find "$SIGN_DIR/files" -type f \( -iname '*.properties' -o -iname '*.env' -o -iname '*.txt' \) -print)

          if [ -z "$STORE_PASSWORD" ] && keytool -list -keystore "$KEYSTORE" -storepass android >/dev/null 2>&1; then
            STORE_PASSWORD=android
          fi

          test -n "$STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
          test -n "$KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$STORE_PASSWORD"

          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"

          {
            echo "KEYSTORE_PATH=$KEYSTORE"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Android V141
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify APK signature and same signer as V140
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          mkdir -p "$RUNNER_TEMP/v140apk"
          gh release download v140 \
            --pattern 'Tahalil-Alakkad-V140-Screenshot-Enabled-Android-SIGNED.apk' \
            --dir "$RUNNER_TEMP/v140apk"

          OLD_APK="$RUNNER_TEMP/v140apk/Tahalil-Alakkad-V140-Screenshot-Enabled-Android-SIGNED.apk"
          test -s "$OLD_APK"

          NEW_CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          OLD_CERT="$("$APKSIGNER" verify --print-certs "$OLD_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test -n "$NEW_CERT" && test -n "$OLD_CERT"
          test "$NEW_CERT" = "$OLD_CERT" || { echo "::error::Signing certificate differs from V140"; exit 1; }

          cp "$APK" Tahalil-Alakkad-V141-Final-Delivery-Android-SIGNED.apk
          sha256sum Tahalil-Alakkad-V141-Final-Delivery-Android-SIGNED.apk \
            > Tahalil-Alakkad-V141-Final-Delivery-Android-SIGNED.apk.sha256

      - name: Publish immutable V141 source branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="v141-final-delivery-base"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/example/resilience/ResultFailoverClient.kt \
            app/src/main/java/com/example/notifications/OrderRealtimeNotificationService.kt \
            app/src/main/res/xml/file_paths.xml \
            V141_ANDROID_FINAL_DELIVERY_FIX_NOTES.txt

          git commit -m "V141 Android final delivery fixes"
          COMMIT_SHA="$(git rev-parse HEAD)"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch -q origin "$BRANCH"
            LOCAL_TREE="$(git rev-parse HEAD^{tree})"
            REMOTE_TREE="$(git rev-parse FETCH_HEAD^{tree})"
            if [ "$LOCAL_TREE" != "$REMOTE_TREE" ]; then
              echo "::error::Existing $BRANCH differs; refusing to overwrite it."
              exit 1
            fi
            COMMIT_SHA="$(git rev-parse FETCH_HEAD)"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

          echo "V141_COMMIT_SHA=$COMMIT_SHA" >> "$GITHUB_ENV"

      - name: Publish Android V141 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v141-android >/dev/null 2>&1; then
            echo "::error::Release v141-android already exists. Refusing to overwrite it."
            exit 1
          fi

          gh release create v141-android \
            Tahalil-Alakkad-V141-Final-Delivery-Android-SIGNED.apk \
            Tahalil-Alakkad-V141-Final-Delivery-Android-SIGNED.apk.sha256 \
            --target "$V141_COMMIT_SHA" \
            --title "تحاليل العقاد Android V141 — Final Delivery Fix" \
            --notes "V141 fixes Android result-file failover FileProvider routing and Android 15/16 foreground-service timeout handling while preserving V140 screenshots, Firebase, Supabase failover, reconciliation, backup/restore, offline protections and signing identity."

      - name: Final status
        shell: bash
        run: |
          echo "Android V141 Final Delivery Fix built, compiled, signed, signer-verified, source-pinned and released."
