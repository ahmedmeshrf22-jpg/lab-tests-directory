      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit V129 zero-extra-read shadow backup safety
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_v129_windows/windows-system'
          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '129.0.0') { throw 'Expected Windows V129 package' }
          $tests = Get-Content (Join-Path $root 'public/lab_tests_android.json') -Raw | ConvertFrom-Json
          if ($tests.Count -ne 331) { throw "Expected 331 tests, got $($tests.Count)" }
          if (($tests | Where-Object { $null -ne $_.customer_price }).Count -ne 0) { throw 'Embedded customer prices detected' }
          $shadow = Get-Content (Join-Path $root 'src/shadowBackup.js') -Raw
          foreach ($x in @('https://ogidyelgmigcvasizzuv.supabase.co/functions/v1/tahalil-shadow-mirror','getIdToken(false)','getIdToken(true)','Shadow backup is deliberately non-blocking','mirrorSnapshot(snapshot)','mirrorPath(firestorePath','appVersionCode: 129')) { if (!$shadow.Contains($x)) { throw "Missing shadow marker: $x" } }
          if ($shadow.Contains('firebase/firestore') -or $shadow.Contains('getDoc(') -or $shadow.Contains('getDocs(') -or $shadow.Contains('onSnapshot(')) { throw 'Shadow module must create zero extra Firestore reads/listeners' }
          $pkgText = Get-Content (Join-Path $root 'package.json') -Raw
          if ($pkgText.ToLower().Contains('@supabase') -or $pkgText.ToLower().Contains('supabase-js')) { throw 'Supabase SDK must not be bundled' }
          $files = @((Join-Path $root 'src/app.js'),(Join-Path $root 'src/data.js'),(Join-Path $root 'src/resultStore.js'),(Join-Path $root 'src/shadowBackup.js'),(Join-Path $root 'electron/main.cjs'),(Join-Path $root 'electron/preload.cjs'))
          $all = ($files | ForEach-Object { Get-Content $_ -Raw }) -join "`n"
          foreach ($secret in @('sb_secret_','sb_publishable_','SUPABASE_SERVICE_ROLE_KEY','SUPABASE_SECRET_KEYS','BEGIN PRIVATE KEY')) { if ($all.Contains($secret)) { throw "Forbidden secret marker: $secret" } }
          if ($all.ToLower().Contains('cloudflare') -or $all.ToLower().Contains('workers.dev')) { throw 'Cloudflare dependency detected' }
          if ($all.Contains('sendPasswordResetEmail')) { throw 'Email password reset must remain disabled' }
          $result = Get-Content (Join-Path $root 'src/resultStore.js') -Raw
          if (!$result.Contains('ShadowBackupReplicator.mirrorPath(metaRef.path')) { throw 'Result metadata shadow hook missing' }
          if ($result -match 'ShadowBackupReplicator\.mirrorPath\([^\r\n]*(chunk|part)') { throw 'Result chunks must not be shadowed' }
          $res = Get-Content (Join-Path $root 'src/resilience.js') -Raw
          if (!$res.Contains('currentMode(){return BackendFailoverMode.FIREBASE_ONLY}')) { throw 'Firebase-only failover safety policy missing' }
          $main = Get-Content (Join-Path $root 'electron/main.cjs') -Raw
          foreach ($x in @('OFFLINE_GRACE_MS = 72 * 60 * 60 * 1000','new Tray',"ipcMain.handle('shadow:post'",'SHADOW_ENDPOINT','net.fetch')) { if (!$main.Contains($x)) { throw "Missing V129 marker: $x" } }
          Get-ChildItem (Join-Path $root 'src') -Filter '*.js' -File | ForEach-Object { Get-Content $_.FullName -Raw | node --input-type=module --check; if ($LASTEXITCODE -ne 0) { throw "JS syntax failed: $($_.Name)" } }
          node --check (Join-Path $root 'electron/main.cjs'); if ($LASTEXITCODE -ne 0) { throw 'main.cjs syntax failed' }
          node --check (Join-Path $root 'electron/preload.cjs'); if ($LASTEXITCODE -ne 0) { throw 'preload.cjs syntax failed' }
          Write-Host 'ALL WINDOWS V129 SHADOW BACKUP CHECKS PASSED'
      - name: Install dependencies
        working-directory: build_v129_windows/windows-system
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Build Portable
        working-directory: build_v129_windows/windows-system
        shell: pwsh
        run: npm run dist:portable
      - name: Portable startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v129_windows/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$exe) { throw 'Portable EXE not found' }
          $env:TAHALIL_SMOKE_TEST='1'; $p=Start-Process $exe.FullName -PassThru
          if (!$p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; throw 'Portable smoke timed out' }
          if ($p.ExitCode -ne 0) { throw "Portable smoke exit code $($p.ExitCode)" }
          Remove-Item Env:TAHALIL_SMOKE_TEST -ErrorAction SilentlyContinue
      - name: Portable System Tray smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v129_windows/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $env:TAHALIL_TRAY_SMOKE_TEST='1'; $p=Start-Process $exe.FullName -PassThru
          if (!$p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; throw 'Tray smoke timed out' }
          if ($p.ExitCode -ne 0) { throw "Tray smoke exit code $($p.ExitCode)" }
          Remove-Item Env:TAHALIL_TRAY_SMOKE_TEST -ErrorAction SilentlyContinue
      - name: Build Setup
        working-directory: build_v129_windows/windows-system
        shell: pwsh
        run: npm run dist:setup
      - name: Prepare V129 release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v129_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup = Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable -or !$setup) { throw 'Portable or Setup EXE missing' }
          Copy-Item $portable.FullName 'Tahalil-Alakkad-V129-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V129-Windows-Setup.exe' -Force
          foreach ($name in @('Tahalil-Alakkad-V129-Windows-Portable.exe','Tahalil-Alakkad-V129-Windows-Setup.exe')) { $hash=(Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii }
      - name: Publish directly to Windows V129 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag='v129-windows'
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title "تحاليل العقاد Windows V129 — Supabase Shadow Backup" --notes "Windows V129 aligns with Android V129: best-effort Supabase shadow backup with Firebase ID-token authentication. Firebase remains authoritative. No extra Firestore backup listeners/broad reads, no Supabase key/SDK, result chunks are not duplicated, failures never block Firebase, and there are no failover reads or automatic backend switching." }
          gh release upload $tag 'Tahalil-Alakkad-V129-Windows-Portable.exe' 'Tahalil-Alakkad-V129-Windows-Portable.exe.sha256' 'Tahalil-Alakkad-V129-Windows-Setup.exe' 'Tahalil-Alakkad-V129-Windows-Setup.exe.sha256' --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Windows V129 files' }
          gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --latest
