replace_body(ui/'LabTestsScreen.kt','GlossyServiceCard',r'''\n    LabeledIconAction(label = title, onClick = onClick, modifier = modifier) {\n        Image(\n            painter = painterResource(iconRes),\n            contentDescription = null,\n            modifier = Modifier.size(if (compact) 32.dp else 36.dp),\n            contentScale = ContentScale.Fit\n        )\n    }\n''')\nreplace_body(ui/'LabTestsScreen.kt','OrdersHubIconShortcut',r'''\n    LabeledIconAction(label = title, onClick = onClick, modifier = Modifier.fillMaxWidth()) {\n        Icon(Icons.Default.NotificationsActive, contentDescription = null, tint = Color(0xFF167A8B), modifier = Modifier.size(34.dp))\n    }\n''')\nreplace_body(ui/'LabTestsScreen.kt','StaffSecondaryActionCard',r'''\n    LabeledIconAction(label = title, onClick = onClick, modifier = Modifier.fillMaxWidth()) {\n        Image(painter = painterResource(iconRes), contentDescription = null, modifier = Modifier.size(36.dp), contentScale = ContentScale.Fit)\n    }\n''')\nreplace_body(ui/'LabTestsScreen.kt','HomeServiceIconShortcut',r'''\n    LabeledIconAction(\n        label = if (locked) \"$title \U0001F512\" else title,\n        onClick = onClick,\n        modifier = modifier\n    ) {\n        Image(painter = painterResource(iconRes), contentDescription = null, modifier = Modifier.size(36.dp), contentScale = ContentScale.Fit)\n    }\n''')\nreplace_body(ui/'LabTestsScreen.kt','BottomUtilityCard',r'''\n    LabeledIconAction(\n        label = if (locked) \"$title \U0001F512\" else title,\n        onClick = onClick,\n        modifier = modifier\n    ) {\n        Image(painter = painterResource(imageRes), contentDescription = null, modifier = Modifier.size(36.dp), contentScale = ContentScale.Fit)\n    }\n''')\nreplace_body(ui/'LabTestsScreen.kt','WorkspaceMoreButton',r'''\n    LabeledIconAction(label = title, onClick = onClick, modifier = Modifier.fillMaxWidth()) {\n        Icon(icon, contentDescription = null, tint = Color(0xFF167A8B))\n 