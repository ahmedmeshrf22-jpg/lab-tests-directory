    - name: Audit V124 large icons + V123 recovery
      shell: bash
      run: |
        set -euo pipefail
        python3 <<'PYAUDIT124'
        from pathlib import Path
        import re
        r=Path('build_v121')
        src=r/'app/src/main/java'
        files=list(src.rglob('*.kt'))
        allkt='\n'.join(p.read_text(errors='ignore') for p in files)
        grad=(r/'app/build.gradle.kts').read_text()
        checks={
          'V124 version':'versionCode = 124' in grad and '5.44-large-home-icons-v124' in grad,
          'forgot username':'نسيت اسم المستخدم' in allkt and 'راجع الإدارة' in allkt,
          'forgot password':'نسيت كلمة المرور' in allkt,
          'admin visible login email':'البريد الإلكتروني / اسم الدخول' in allkt,
          'no email reset':'sendPasswordResetEmail' not in allkt,
          'manager credential reset':'resetUserLoginCredentials' in allkt and 'user_credentials_rotate' in allkt,
          'old login disabled':'credential_replaced_by_uid' in allkt and '"enabled" to false' in allkt,
          'approved devices preserved':'batch.set(newUserRef.collection(DEVICES_SUBCOLLECTION)' in allkt,
          'bottom settings logout':'HomeBottomActionBar' in allkt,
          'main icons enlarged':'actionSize = 64.dp' in allkt and 'Modifier.size(54.dp)' in allkt,
          'bottom icons enlarged':'actionSize = 58.dp' in allkt and 'Modifier.size(40.dp)' in allkt,
          'dialog action size default preserved':'actionSize: Dp = 44.dp' in allkt,
          'results preserved':'saveResultToDownloads' in allkt and 'requestResultRevision' in allkt,
          'notifications preserved':'class OrderRealtimeNotificationService' in allkt,
          'no Cloudflare':'cloudflare' not in allkt.lower() and 'workers.dev' not in allkt.lower(),
          'no rectangular action buttons':not re.search(r'\b(Button|OutlinedButton|TextButton)\s*\(',allkt),
          'no raw IconButton outside helper':all(not re.search(r'\bIconButton\s*\(',p.read_text(errors='ignore')) for p in files if p.name!='LabeledIconAction.kt'),
        }
        for k,v in checks.items(): print(('OK   ' if v else 'FAIL ')+k)
        bad=[k for k,v in checks.items() if not v]
        if bad: raise SystemExit('V124 AUDIT FAILED: '+', '.join(bad))
        print('ALL V124 SOURCE CHECKS PASSED')
        PYAUDIT124
