    - name: Restore original Android signing
      shell: bash
      env:
        SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
      run: |
        set -euo pipefail
        test -n "${SIGNING_BUNDLE_B64:-}"
        rm -rf /tmp/tahalil_sign
        mkdir -p /tmp/tahalil_sign/files
        printf '%s' "$SIGNING_BUNDLE_B64" | tr -d '\r\n ' | base64 --decode > /tmp/tahalil_sign/bundle.bin
        if unzip -t /tmp/tahalil_sign/bundle.bin >/dev/null 2>&1; then
          unzip -q /tmp/tahalil_sign/bundle.bin -d /tmp/tahalil_sign/files
        else
          cp /tmp/tahalil_sign/bundle.bin /tmp/tahalil_sign/files/original.keystore
        fi
        KEYSTORE="$(find /tmp/tahalil_sign/files -type f \( -iname '*.jks' -o -iname '*.keystore' \) -print -quit)"
        test -n "$KEYSTORE"
        STORE_PASSWORD=""; KEY_ALIAS=""; KEY_PASSWORD=""
        while IFS= read -r META; do
          [ -f "$META" ] || continue
          [ -n "$STORE_PASSWORD" ] || STORE_PASSWORD="$(sed -nE 's/^[[:space:]]*(STORE_PASSWORD|KEYSTORE_PASSWORD|storePassword|store_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
          [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(sed -nE 's/^[[:space:]]*(KEY_ALIAS|keyAlias|key_alias)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
          [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$(sed -nE 's/^[[:space:]]*(KEY_PASSWORD|keyPassword|key_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
        done < <(find /tmp/tahalil_sign/files -type f \( -iname '*.properties' -o -iname '*.env' -o -iname '*.txt' \) -print)
        if [ -z "$STORE_PASSWORD" ] && keytool -list -keystore "$KEYSTORE" -storepass android >/dev/null 2>&1; then STORE_PASSWORD=android; fi
        test -n "$STORE_PASSWORD"
        [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
        test -n "$KEY_ALIAS"
        [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$STORE_PASSWORD"
        keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
        cp "$KEYSTORE" build_v121/original-signing-key.jks
        echo "::add-mask::$STORE_PASSWORD"; echo "::add-mask::$KEY_ALIAS"; echo "::add-mask::$KEY_PASSWORD"
        {
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/build_v121/original-signing-key.jks"
          echo "STORE_PASSWORD=$STORE_PASSWORD"
          echo "KEY_ALIAS=$KEY_ALIAS"
          echo "KEY_PASSWORD=$KEY_PASSWORD"
        } >> "$GITHUB_ENV"
    - name: Build signed Android V125
      shell: bash
      working-directory: build_v121
      run: |
        set -euo pipefail
        gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease
    - name: Verify signature and prepare V125 release
      shell: bash
      run: |
        set -euo pipefail
        APK="$(find build_v121/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
        test -n "$APK"; test -s "$APK"
        APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
        "$APKSIGNER" verify --verbose --print-certs "$APK"
        cp "$APK" Tahalil-Alakkad-V125-Android-SIGNED.apk
        sha256sum Tahalil-Alakkad-V125-Android-SIGNED.apk > Tahalil-Alakkad-V125-Android-SIGNED.apk.sha256
    - name: Publish Android V125
      shell: bash
      run: |
        set -euo pipefail
        TAG=v125
        if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "تحاليل العقاد V125 — Standalone Settings + Logout" --notes "V125 keeps V124 large home icons and all V123 recovery/results/notification behavior, but removes the full-width bottom Settings/Logout bar. Settings and Logout are now normal standalone 40dp icons inside the home page, with no footer/header Surface. No Cloudflare and no email-reset flow."
        fi
        gh release upload "$TAG" Tahalil-Alakkad-V125-Android-SIGNED.apk Tahalil-Alakkad-V125-Android-SIGNED.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber
        gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
      env:
        GH_TOKEN: ${{ github.token }}
