name: Build AK V112 SIMPLE CLINIC ORDER

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract V112
        run: |
          set -euo pipefail
          rm -rf build_v112
          mkdir build_v112
          unzip -q Project3_AK_V112_SIMPLE_CLINIC_ORDER_FIXED.zip -d build_v112
          test -f build_v112/app/src/main/java/com/example/ui/LabTestsScreen.kt
          test -f build_v112/app/src/main/java/com/example/ui/DailyWorklistScreen.kt
          test -f build_v112/app/src/main/java/com/example/ui/LabOperatorScreen.kt

      - name: Restore signing
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_BUNDLE_B64:-}"
          rm -rf /tmp/tahalil_sign
          mkdir -p /tmp/tahalil_sign/files
          printf '%s' "$SIGNING_BUNDLE_B64" | tr -d '\r\n ' | base64 --decode > /tmp/tahalil_sign/bundle.bin
          if unzip -t /tmp/tahalil_sign/bundle.bin >/dev/null 2>&1; then
            unzip -q /tmp/tahalil_sign/bundle.bin -d /tmp/tahalil_sign/files
          else
            cp /tmp/tahalil_sign/bundle.bin /tmp/tahalil_sign/files/original.keystore
          fi
          KEYSTORE="$(find /tmp/tahalil_sign/files -type f \( -iname '*.jks' -o -iname '*.keystore' \) -print -quit)"
          test -n "$KEYSTORE"
          STORE_PASSWORD=""
          KEY_ALIAS=""
          KEY_PASSWORD=""
          while IFS= read -r META; do
            [ -f "$META" ] || continue
            [ -n "$STORE_PASSWORD" ] || STORE_PASSWORD="$(sed -nE 's/^[[:space:]]*(STORE_PASSWORD|KEYSTORE_PASSWORD|storePassword|store_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(sed -nE 's/^[[:space:]]*(KEY_ALIAS|keyAlias|key_alias)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$(sed -nE 's/^[[:space:]]*(KEY_PASSWORD|keyPassword|key_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
          done < <(find /tmp/tahalil_sign/files -type f \( -iname '*.properties' -o -iname '*.env' -o -iname '*.txt' \) -print)
          if [ -z "$STORE_PASSWORD" ] && keytool -list -keystore "$KEYSTORE" -storepass android >/dev/null 2>&1; then STORE_PASSWORD="android"; fi
          test -n "$STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
          test -n "$KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$STORE_PASSWORD"
          cp "$KEYSTORE" build_v112/original-signing-key.jks
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/build_v112/original-signing-key.jks"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Verify V112 simple order flow
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          root = Path("build_v112")
          grad = (root / "app/build.gradle.kts").read_text()
          screen = (root / "app/src/main/java/com/example/ui/LabTestsScreen.kt").read_text()
          customer = (root / "app/src/main/java/com/example/ui/CustomerSystemDialog.kt").read_text()
          worklist = (root / "app/src/main/java/com/example/ui/DailyWorklistScreen.kt").read_text()
          vm = (root / "app/src/main/java/com/example/ui/LabTestsViewModel.kt").read_text()
          lab = (root / "app/src/main/java/com/example/ui/LabOperatorScreen.kt").read_text()
          gs = (root / "app/google-services.json").read_text()

          checks = {
              "versionCode 112": 'versionCode = 112' in grad,
              "versionName V112": '5.32-simple-clinic-order-v112' in grad,
              "same package": 'applicationId = "com.aistudio.labtestsdirectory.egypt"' in grad,
              "same Firebase": 'tahalil-alakkad' in gs,
              "clear clinic final send button": 'حفظ وإرسال الطلب للمعمل' in screen,
              "send behavior explained": 'سيتم حفظ الطلب وإرساله للمعمل مباشرة' in screen,
              "auto-send backend preserved": 'workflowStatus = "sent_to_lab"' in vm and '"workflow_status" to "sent_to_lab"' in vm,
              "clinic status read-only": 'OrderWorkflowStatusBar(' not in customer,
              "clinic worklist no manual stage advance": 'updateOrderWorkflowStatus' not in worklist and 'المرحلة التالية' not in worklist,
              "clinic only simple statuses": all(x in worklist for x in ['تم الإرسال للمعمل', 'جاري التنفيذ', 'النتيجة جاهزة']),
              "lab three stages preserved": all(x in lab for x in ['طلبات جديدة', 'جاري التنفيذ', 'النتائج المرسلة']),
              "lab primary actions preserved": all(x in lab for x in ['استلام الطلب', 'إرسال النتيجة', 'إعادة إرسال النتيجة']),
              "lab prices still hidden": not any(x in lab for x in ['customerPrice','discountAmount','paidAmount','remainingAmount']),
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(("OK   " if ok else "FAIL ") + name)
          if failed:
              raise SystemExit("V112 checks failed: " + ", ".join(failed))
          print("ALL V112 SIMPLE CLINIC ORDER CHECKS PASSED")
          PY

      - name: Build signed V112 release
        working-directory: build_v112
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify and upload APK
        run: |
          set -euo pipefail
          APK="$(find build_v112/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" Tahalil-Alakkad-V112-SIMPLE-CLINIC-ORDER-SIGNED.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V112-SIMPLE-CLINIC-ORDER-SIGNED
          path: Tahalil-Alakkad-V112-SIMPLE-CLINIC-ORDER-SIGNED.apk
          if-no-files-found: error
          retention-days: 30
