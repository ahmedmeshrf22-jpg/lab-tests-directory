name: Android V143 Backup Permission Rules Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-backup-permission:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get exact V143 rules
        run: |
          curl --fail --location \
          'https://raw.githubusercontent.com/ahmedmeshrf22-jpg/lab-tests-directory/337332bb4d083735d0c911747d7bdfccb5872701/firestore.rules' \
          -o firestore.rules

      - name: Fix manager permission
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("firestore.rules")
          s = p.read_text(encoding="utf-8")

          old = """        request.auth.uid == 'Wps5Y19pZSbeGooEzFfW5UFsshq2'
        || request.auth.token.email == 'tahalil.admin.gate.v60@tahali.com'"""

          new = """        request.auth.uid == 'Wps5Y19pZSbeGooEzFfW5UFsshq2'
        || request.auth.token.email == 'abdelrahman@tahali.com'
        || request.auth.token.email == 'tahalil.admin.gate.v60@tahali.com'"""

          if old not in s:
              raise SystemExit("Expected V143 admin rule not found")

          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Safety check
        run: |
          grep -F "abdelrahman@tahali.com" firestore.rules
          grep -F "tahalil.admin.gate.v60@tahali.com" firestore.rules
          grep -F "Wps5Y19pZSbeGooEzFfW5UFsshq2" firestore.rules

          if grep -Eq 'allow .*: if true' firestore.rules; then
            echo "Unsafe rule detected"
            exit 1
          fi

      - name: Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" \
          > "$RUNNER_TEMP/firebase-service-account.json"

          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" \
          >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Firebase config
        run: |
          cat > firebase.json <<'JSON'
          {
            "firestore": {
              "rules": "firestore.rules"
            }
          }
          JSON

      - name: Deploy Rules Only
        run: |
          firebase deploy \
          --project tahalil-alakkad \
          --only firestore:rules \
          --non-interactive

          echo "BACKUP PERMISSION FIX DEPLOYED"
