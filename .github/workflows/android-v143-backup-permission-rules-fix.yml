name: Android V143 Backup Permission Rules Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-backup-permission:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get exact V143 rules
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/ahmedmeshrf22-jpg/lab-tests-directory/337332bb4d083735d0c911747d7bdfccb5872701/firestore.rules' -o firestore.rules
          test -s firestore.rules

      - name: Add manager permission
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Fq "request.auth.token.email == 'abdelrahman@tahali.com'" firestore.rules; then
            sed -i "/request.auth.uid == 'Wps5Y19pZSbeGooEzFfW5UFsshq2'/a\\        || request.auth.token.email == 'abdelrahman@tahali.com'" firestore.rules
          fi

          test "$(grep -Fc "request.auth.token.email == 'abdelrahman@tahali.com'" firestore.rules)" -eq 1
          grep -F "tahalil.admin.gate.v60@tahali.com" firestore.rules >/dev/null

      - name: Firebase credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          python3 -m json.tool "$RUNNER_TEMP/firebase-service-account.json" >/dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Firebase config
        run: |
          printf '%s\n' '{"firestore":{"rules":"firestore.rules"}}' > firebase.json

      - name: Deploy Firestore rules only
        run: |
          set -euo pipefail
          firebase deploy --project tahalil-alakkad --only firestore:rules --non-interactive
          echo "BACKUP PERMISSION FIX DEPLOYED"
