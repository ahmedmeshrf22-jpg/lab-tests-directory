name: Windows V145 R8.23 Order Icon Details

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-windows-v145-r823-order-details
  cancel-in-progress: false

jobs:
  build:
    name: Windows V145 R8.23 — Order Icon Details
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      BASE_TAG: v145-r8.22-windows
      BASE_SOURCE: Tahalil-Alakkad-V145-R8.22-Windows-Source.zip
      BASE_SHA256: d74bb2622e072dacd1d0a9c00fe1ba58e53d86d49103df8f46d2470e2c9697e5
      R823_LAB_FUNCTION_B64: 
      R823_CSS_B64: 
      R823_NOTES_B64: 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore exact R8.22 source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD $env:BASE_SOURCE
          if (Test-Path $zip) { Remove-Item $zip -Force }
          gh release download $env:BASE_TAG --repo "$env:GITHUB_REPOSITORY" --pattern $env:BASE_SOURCE --dir $PWD
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $zip)) { throw 'Could not download exact R8.22 source' }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:BASE_SHA256) { throw "R8.22 source hash mismatch: $hash" }

          $root = Join-Path $PWD 'build_windows/windows-system'
          if (Test-Path (Join-Path $PWD 'build_windows')) { Remove-Item (Join-Path $PWD 'build_windows') -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path $zip -DestinationPath $root -Force

          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '145.8.22') { throw "Expected 145.8.22, got $($pkg.version)" }

          foreach ($item in @(
            'src/data.js',
            'src/firebase.js',
            'src/resultStore.js',
            'src/v145r8-parity.js',
            'electron/main.cjs',
            'electron/preload.cjs'
          )) {
            $name = 'R823_' + ($item -replace '[^A-Za-z0-9]','_').ToUpper() + '_SHA256'
            $value = (Get-FileHash (Join-Path $root $item) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$name=$value" | Add-Content $env:GITHUB_ENV
          }

      - name: Apply compact order icons with inline details/results
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $appPath = Join-Path $root 'src/app.js'
          $stylesPath = Join-Path $root 'src/styles.css'
          $pkgPath = Join-Path $root 'package.json'

          $app = Get-Content $appPath -Raw
          if ($app.Contains('TAH_R823_ORDER_ICON_DETAILS')) { throw 'R8.23 marker already exists' }

          $startMarker = 'async function labWorklistPage(c){'
          $endMarker = 'const DEFAULT_CLINIC='
          $start = $app.IndexOf($startMarker)
          $end = $app.IndexOf($endMarker, $start)
          if ($start -lt 0 -or $end -le $start) { throw 'Could not locate labWorklistPage block' }

          $newFunc = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:R823_LAB_FUNCTION_B64))
          $app = $app.Substring(0,$start) + $newFunc + "`r`n" + $app.Substring($end)
          Set-Content $appPath -Value $app -Encoding utf8

          $css = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:R823_CSS_B64))
          $existingCss = Get-Content $stylesPath -Raw
          if ($existingCss.Contains('TAH_R823_ORDER_ICON_DETAILS')) { throw 'R8.23 CSS marker already exists' }
          Add-Content -Path $stylesPath -Value "`r`n$css" -Encoding utf8

          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = '145.8.23'
          $pkg.description = 'Tahalil Alakkad Windows V145 R8.23 - compact order icons with inline details and results'
          $pkg | ConvertTo-Json -Depth 20 | Set-Content $pkgPath -Encoding utf8

          $notes = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:R823_NOTES_B64))
          $notes | Set-Content (Join-Path $root 'V145_R823_ORDER_ICON_DETAILS_NOTES.txt') -Encoding utf8

      - name: Audit R8.23 scope and same-order result flow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $app = Get-Content (Join-Path $root 'src/app.js') -Raw
          $css = Get-Content (Join-Path $root 'src/styles.css') -Raw
          $data = Get-Content (Join-Path $root 'src/data.js') -Raw
          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json

          if ($pkg.version -ne '145.8.23') { throw "Expected 145.8.23, got $($pkg.version)" }
          foreach ($marker in @(
            'TAH_R823_ORDER_ICON_DETAILS',
            'data-open-order',
            'lab-r823-detail',
            'labuploadfiles',
            'labuploadcamera',
            'النتيجة داخل نفس الطلب'
          )) {
            if (!$app.Contains($marker) -and !$css.Contains($marker)) { throw "R8.23 marker missing: $marker" }
          }

          if (!$data.Contains('export async function labUploadResults(order,files')) { throw 'labUploadResults missing' }
          if (!$data.Contains("doc(db,C.customers,customerId,'orders',order.id)")) { throw 'Result upload no longer targets same order ID' }
          if (!$data.Contains("workflow_status:'ready'")) { throw 'Result-ready workflow update missing' }
          if (!$data.Contains('b.update(ref,patch)')) { throw 'Original order result update missing' }
          if (!$data.Contains('b.update(labMirrorRef(order.id),labMirrorData(patch))')) { throw 'Lab mirror result update missing' }

          $checks = @{
            'src/data.js'='R823_SRC_DATA_JS_SHA256';
            'src/firebase.js'='R823_SRC_FIREBASE_JS_SHA256';
            'src/resultStore.js'='R823_SRC_RESULTSTORE_JS_SHA256';
            'src/v145r8-parity.js'='R823_SRC_V145R8_PARITY_JS_SHA256';
            'electron/main.cjs'='R823_ELECTRON_MAIN_CJS_SHA256';
            'electron/preload.cjs'='R823_ELECTRON_PRELOAD_CJS_SHA256'
          }
          foreach ($pair in $checks.GetEnumerator()) {
            $actual = (Get-FileHash (Join-Path $root $pair.Key) -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = [Environment]::GetEnvironmentVariable($pair.Value)
            if ($actual -ne $expected) { throw "$($pair.Key) changed - R8.23 scope violation" }
          }

          node --check (Join-Path $root 'src/app.js')
          if ($LASTEXITCODE -ne 0) { throw 'app.js syntax failed' }
          node --check (Join-Path $root 'src/data.js')
          if ($LASTEXITCODE -ne 0) { throw 'data.js syntax failed' }
          node --check (Join-Path $root 'electron/main.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'main.cjs syntax failed' }

          $audit = @(
            'R8.23 ORDER ICON DETAILS AUDIT: PASS',
            'Base: exact R8.22 source',
            'Changed: lab worklist presentation in src/app.js + R8.23 CSS + package metadata',
            'Result storage: SAME customer/order ID through unchanged labUploadResults()',
            'Firebase/data/resultStore/electron security logic: unchanged'
          )
          $audit | Set-Content 'R823_ORDER_DETAILS_AUDIT.txt' -Encoding utf8

      - name: Package R8.23 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $stage = Join-Path $env:RUNNER_TEMP 'source_stage_r823'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem -LiteralPath $root -Force |
            Where-Object { @('node_modules','release','.git') -notcontains $_.Name } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $stage -Recurse -Force }

          $zip = Join-Path $PWD 'Tahalil-Alakkad-V145-R8.23-Windows-Source.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage,$zip,[System.IO.Compression.CompressionLevel]::Optimal,$false)
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Tahalil-Alakkad-V145-R8.23-Windows-Source.zip" | Set-Content 'Tahalil-Alakkad-V145-R8.23-Windows-Source.zip.sha256' -Encoding ascii
          Copy-Item (Join-Path $root 'V145_R823_ORDER_ICON_DETAILS_NOTES.txt') 'V145_R823_ORDER_ICON_DETAILS_NOTES.txt' -Force

      - name: Install dependencies
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Build Portable
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Portable smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable) { throw 'Portable EXE missing' }
          $proc = Start-Process -FilePath $portable.FullName -PassThru
          Start-Sleep -Seconds 12
          if ($proc.HasExited) { throw "Portable exited unexpectedly: $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Build Setup
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }

      - name: Prepare delivery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup = Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable -or !$setup) { throw 'Portable or Setup missing' }
          Copy-Item $portable.FullName 'Tahalil-Alakkad-V145-R8.23-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V145-R8.23-Windows-Setup.exe' -Force
          foreach ($name in @(
            'Tahalil-Alakkad-V145-R8.23-Windows-Portable.exe',
            'Tahalil-Alakkad-V145-R8.23-Windows-Setup.exe'
          )) {
            $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V145-R8.23-Windows-Order-Icon-Details
          path: |
            Tahalil-Alakkad-V145-R8.23-Windows-Portable.exe
            Tahalil-Alakkad-V145-R8.23-Windows-Portable.exe.sha256
            Tahalil-Alakkad-V145-R8.23-Windows-Setup.exe
            Tahalil-Alakkad-V145-R8.23-Windows-Setup.exe.sha256
            Tahalil-Alakkad-V145-R8.23-Windows-Source.zip
            Tahalil-Alakkad-V145-R8.23-Windows-Source.zip.sha256
            V145_R823_ORDER_ICON_DETAILS_NOTES.txt
            R823_ORDER_DETAILS_AUDIT.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish R8.23 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v145-r8.23-windows'
          $title = 'تحاليل العقاد Windows V145 R8.23 — Order Icon Details'
          $notes = Get-Content 'V145_R823_ORDER_ICON_DETAILS_NOTES.txt' -Raw

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes
          } else {
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create R8.23 release' }

          gh release upload $tag `
            Tahalil-Alakkad-V145-R8.23-Windows-Portable.exe `
            Tahalil-Alakkad-V145-R8.23-Windows-Portable.exe.sha256 `
            Tahalil-Alakkad-V145-R8.23-Windows-Setup.exe `
            Tahalil-Alakkad-V145-R8.23-Windows-Setup.exe.sha256 `
            Tahalil-Alakkad-V145-R8.23-Windows-Source.zip `
            Tahalil-Alakkad-V145-R8.23-Windows-Source.zip.sha256 `
            V145_R823_ORDER_ICON_DETAILS_NOTES.txt `
            R823_ORDER_DETAILS_AUDIT.txt `
            --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload R8.23 release assets' }
