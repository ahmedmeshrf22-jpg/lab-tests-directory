name: Publish Tahalil Alakkad PUBLIC Update FIX

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Tahalil Alakkad LATEST RELEASE"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  publish-public-update:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve successful build run
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "${EVENT_RUN_ID:-}" ]; then
            RUN_ID="$EVENT_RUN_ID"
          else
            RUN_ID="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "Build Tahalil Alakkad LATEST RELEASE" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi

          if [ -z "${RUN_ID:-}" ]; then
            echo "ERROR: No successful Tahalil Alakkad build was found."
            exit 1
          fi

          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Using build run: $RUN_ID"

      - name: Download APK from successful build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts
          find artifacts -maxdepth 6 -type f -print

      - name: Prepare public mandatory update files
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_APK="$(find artifacts -type f -iname '*.apk' -print -quit)"
          if [ -z "${SOURCE_APK:-}" ] || [ ! -f "$SOURCE_APK" ]; then
            echo "ERROR: APK was not found in the build artifacts."
            exit 1
          fi

          FULL_PATH="$SOURCE_APK"
          VERSION_CODE="$(printf '%s' "$FULL_PATH" | sed -n 's/.*Tahalil-Alakkad-V\([0-9][0-9]*\).*/\1/p' | head -1)"
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not parse versionCode from: $FULL_PATH"
            exit 1
          fi

          VERSION_NAME="V${VERSION_CODE}"
          UPDATE_REPO="ahmedmeshrf22-jpg/tahalil-alakkad-updates"
          RELEASE_DIR="$GITHUB_WORKSPACE/public-update-release"
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          cp "$SOURCE_APK" "$RELEASE_DIR/Tahalil-Alakkad-LATEST.apk"
          SHA256="$(sha256sum "$RELEASE_DIR/Tahalil-Alakkad-LATEST.apk" | awk '{print $1}')"
          APK_URL="https://github.com/${UPDATE_REPO}/releases/latest/download/Tahalil-Alakkad-LATEST.apk"

          cat > "$RELEASE_DIR/latest.json" <<JSON
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "$APK_URL",
            "sha256": "$SHA256",
            "mandatory": true
          }
          JSON

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION_CODE" >> "$GITHUB_ENV"
          echo "UPDATE_REPO=$UPDATE_REPO" >> "$GITHUB_ENV"

          cat "$RELEASE_DIR/latest.json"
          ls -lh "$RELEASE_DIR"

      - name: Publish to public update repository
        env:
          GH_TOKEN: ${{ secrets.TAHALIL_UPDATE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ERROR: Secret TAHALIL_UPDATE_REPO_TOKEN is missing."
            exit 1
          fi

          VISIBILITY="$(gh repo view "$UPDATE_REPO" --json visibility --jq '.visibility')"
          if [ "$VISIBILITY" != "PUBLIC" ]; then
            echo "ERROR: $UPDATE_REPO must be PUBLIC. Current visibility: $VISIBILITY"
            exit 1
          fi

          if gh release view "$TAG" --repo "$UPDATE_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              public-update-release/Tahalil-Alakkad-LATEST.apk \
              public-update-release/latest.json \
              --repo "$UPDATE_REPO" \
              --clobber

            gh release edit "$TAG" \
              --repo "$UPDATE_REPO" \
              --title "تحاليل العقاد V${VERSION_CODE}" \
              --notes "Automatic mandatory update package for Tahalil Alakkad." \
              --latest
          else
            gh release create "$TAG" \
              public-update-release/Tahalil-Alakkad-LATEST.apk \
              public-update-release/latest.json \
              --repo "$UPDATE_REPO" \
              --title "تحاليل العقاد V${VERSION_CODE}" \
              --notes "Automatic mandatory update package for Tahalil Alakkad." \
              --latest
          fi

          gh release view "$TAG" \
            --repo "$UPDATE_REPO" \
            --json tagName,isDraft,isPrerelease,assets,url

      - name: Verify public update URLs
        shell: bash
        run: |
          set -euo pipefail

          JSON_URL="https://github.com/${UPDATE_REPO}/releases/latest/download/latest.json"
          APK_URL="https://github.com/${UPDATE_REPO}/releases/latest/download/Tahalil-Alakkad-LATEST.apk"

          curl --fail --location --retry 3 --silent --show-error "$JSON_URL" -o /tmp/latest.json
          curl --fail --location --retry 3 --silent --show-error --range 0-1023 "$APK_URL" -o /tmp/apk-check.bin

          echo "PUBLIC UPDATE CHECK PASSED"
          cat /tmp/latest.json
