          Expand-Archive 'v136-source.zip' 'build_v136_windows' -Force
          if (!(Test-Path 'build_v136_windows/windows-system/package.json')) { throw 'V136 source reconstruction failed' }

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit V134 Safety + V135 Safe Restore + V136 Feedback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_v136_windows/windows-system'

          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '136.0.0') { throw "Expected Windows V136 package" }
          if ($pkg.build.portable.artifactName -notmatch 'V136') { throw 'Portable V136 name missing' }
          if ($pkg.build.nsis.artifactName -notmatch 'V136') { throw 'Setup V136 name missing' }

          $tests = Get-Content (Join-Path $root 'public/lab_tests_android.json') -Raw | ConvertFrom-Json
          if ($tests.Count -ne 331) { throw "Expected 331 tests, got $($tests.Count)" }
          if (($tests | Where-Object { $null -ne $_.customer_price }).Count -ne 0) { throw 'Embedded customer prices detected' }

          $backup = Get-Content (Join-Path $root 'src/backup.js') -Raw
          foreach ($x in @(
            'const SCHEMA=3',
            'app_version_code:136',
            "app_version_name:'System V136 Windows'",
            "security_archive_restore_mode:'manual_only'",
            'users,user_devices,audit_logs',
            'getDocFromServer',
            'Existing Firestore documents are NEVER overwritten',
            'if(!snap.exists())missing.push(write)',
            'const phases=[customerWrites,orderWrites,paymentWrites,activityWrites,simpleWrites]',
            'b.set(write.ref,write.data)',
            'securityArchiveRestoreMode'
          )) {
            if (!$backup.Contains($x)) { throw "Missing V134-V135 backup marker: $x" }
          }

          if ($backup.Contains('b.set(write.ref,write.data,{merge:true})')) {
            throw 'Restore must never merge/overwrite an existing document'
          }

          $app = Get-Content (Join-Path $root 'src/app.js') -Raw
          foreach ($x in @(
            'Unified System V136 • Windows',
            'Windows V136</span>',
            'Backup مشفر V136 — Safety Schema v3',
            'Safe Restore V136',
            'يرجع البيانات المفقودة فقط',
            'تم الاسترجاع ✓',
            'لا توجد بيانات مفقودة للاسترجاع',
            'runRecoveryProbe',
            'ShadowBackupReplicator',
            'requestResultRevision',
            'resetUserLoginCredentials',
            'order-history-table',
            'guide-detail-grid',
            'customer-choice-row'
          )) {
            if (!$app.Contains($x)) { throw "Missing Windows V136 marker: $x" }
          }

          $data = Get-Content (Join-Path $root 'src/data.js') -Raw
          foreach ($x in @(
            'ShadowBackupReplicator.mirrorPath(newRef.path,now)',
            'ShadowBackupReplicator.mirrorPath(target.path,now)',
            'result_revision_requested',
            'user_credentials_rotate'
          )) {
            if (!$data.Contains($x)) { throw "Missing preserved data/safety marker: $x" }
          }

          $shadow = Get-Content (Join-Path $root 'src/shadowBackup.js') -Raw
          foreach ($x in @(
            'tahalil-shadow-mirror',
            'getIdToken(false)',
            'getIdToken(true)',
            'Shadow backup is deliberately non-blocking'
          )) {
            if (!$shadow.Contains($x)) { throw "V129 shadow marker missing: $x" }
          }

          $recovery = Get-Content (Join-Path $root 'src/recoveryProbe.js') -Raw
          if (!$recovery.Contains('recovery')) { throw 'V130 read-only recovery module missing' }

          $res = Get-Content (Join-Path $root 'src/resilience.js') -Raw
          if (!$res.Contains('currentMode(){return BackendFailoverMode.FIREBASE_ONLY}')) {
            throw 'FIREBASE_ONLY policy missing'
          }

          $main = Get-Content (Join-Path $root 'electron/main.cjs') -Raw
          foreach ($x in @(
            'OFFLINE_GRACE_MS = 72 * 60 * 60 * 1000',
            'new Tray',
            'requestSingleInstanceLock',
            'sandbox: true',
            'contextIsolation: true',
            'nodeIntegration: false',
            'webSecurity: true'
          )) {
            if (!$main.Contains($x)) { throw "Windows safety marker missing: $x" }
          }

          $all = $app + "`n" + $data + "`n" + $backup + "`n" + $shadow + "`n" + $main
          if ($all.ToLower().Contains('cloudflare') -or $all.ToLower().Contains('workers.dev')) {
            throw 'Cloudflare dependency detected'
          }
          if ($all.Contains('sendPasswordResetEmail')) {
            throw 'Email password-reset flow must remain disabled'
          }
          foreach ($secret in @('SUPABASE_SERVICE_ROLE_KEY','SUPABASE_SECRET_KEYS','sb_secret_','BEGIN PRIVATE KEY')) {
            if ($all.Contains($secret)) { throw "Forbidden secret marker: $secret" }
          }

          Get-ChildItem (Join-Path $root 'src') -Filter '*.js' -File | ForEach-Object {
            Get-Content $_.FullName -Raw | node --input-type=module --check
            if ($LASTEXITCODE -ne 0) { throw "JS syntax failed: $($_.Name)" }
          }
          node --check (Join-Path $root 'electron/main.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'main.cjs syntax failed' }
          node --check (Join-Path $root 'electron/preload.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'preload.cjs syntax failed' }

          Write-Host 'WINDOWS V136 ANDROID PARITY AUDIT PASSED'

      - name: Install dependencies
        working-directory: build_v136_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Build Portable
        working-directory: build_v136_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Portable startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v136_windows/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$exe) { throw 'Portable EXE not found' }
          $env:TAHALIL_SMOKE_TEST='1'
          Remove-Item Env:TAHALIL_TRAY_SMOKE_TEST -ErrorAction SilentlyContinue
          $p=Start-Process $exe.FullName -PassThru
          if (!$p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; throw 'Portable smoke timed out' }
          if ($p.ExitCode -ne 0) { throw "Portable smoke exit code $($p.ExitCode)" }
          Remove-Item Env:TAHALIL_SMOKE_TEST -ErrorAction SilentlyContinue
          Write-Host 'PORTABLE STARTUP OK'

      - name: Portable System Tray smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v136_windows/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$exe) { throw 'Portable EXE not found for tray smoke' }
          Remove-Item Env:TAHALIL_SMOKE_TEST -ErrorAction SilentlyContinue
          $env:TAHALIL_TRAY_SMOKE_TEST='1'
          $p=Start-Process $exe.FullName -PassThru
          if (!$p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; throw 'Tray smoke timed out' }
          if ($p.ExitCode -ne 0) { throw "Tray smoke exit code $($p.ExitCode)" }
          Remove-Item Env:TAHALIL_TRAY_SMOKE_TEST -ErrorAction SilentlyContinue
          Write-Host 'SYSTEM TRAY OK'

      - name: Build Setup
        working-directory: build_v136_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }

      - name: Prepare Windows V136 release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v136_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup = Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable -or !$setup) { throw 'Portable or Setup EXE missing' }

          Copy-Item $portable.FullName 'Tahalil-Alakkad-V136-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V136-Windows-Setup.exe' -Force

          foreach ($name in @('Tahalil-Alakkad-V136-Windows-Portable.exe','Tahalil-Alakkad-V136-Windows-Setup.exe')) {
            if ((Get-Item $name).Length -lt 1000000) { throw "$name unexpectedly small" }
            $hash=(Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Publish directly to Windows V136 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag='v136-windows'

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "$env:GITHUB_REPOSITORY" `
              --title "تحاليل العقاد Windows V136 — Safe Restore + Feedback" `
              --notes "Windows V136 is aligned with the latest Android V136. It adds the V134 Safety backup lineage (encrypted schema v3 with users, authorized devices and audit archive), V135 missing-only restore with Firebase SERVER preflight and no overwrite of existing documents, and V136 immediate restore completion feedback including an explicit no-missing-data message. Windows V134 UI polish and all existing Firebase, Supabase shadow backup, read-only recovery, offline resilience, results, notifications, tray and security behavior are preserved. No Cloudflare, no automatic failover and no reset-email flow."
            if ($LASTEXITCODE -ne 0) { throw 'Could not create Windows V136 release' }
          }

          gh release upload $tag `
            'Tahalil-Alakkad-V136-Windows-Portable.exe' `
            'Tahalil-Alakkad-V136-Windows-Portable.exe.sha256' `
            'Tahalil-Alakkad-V136-Windows-Setup.exe' `
            'Tahalil-Alakkad-V136-Windows-Setup.exe.sha256' `
            --repo "$env:GITHUB_REPOSITORY" --clobber

          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Windows V136 files' }
          gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --latest
