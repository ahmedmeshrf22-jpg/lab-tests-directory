name: Windows V145 R8.21 SECURITY HARDENED

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-windows-v145-r821-security
  cancel-in-progress: false

jobs:
  windows-v145-r821:
    name: Windows V145 R8.21 — SECURITY HARDENED
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      BASE_TAG: "v145-r8.20-windows"
      BASE_SOURCE: "Tahalil-Alakkad-V145-R8.20-Windows-Source.zip"
      BASE_SHA256: "a55bfd61363281a809d06b77e8d5ca69e9eb94be52e4950e267ecbabb50c2f90"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore exact R8.20 LOCKED source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD $env:BASE_SOURCE
          if (Test-Path $zip) { Remove-Item $zip -Force }

          gh release download $env:BASE_TAG --repo "$env:GITHUB_REPOSITORY" --pattern $env:BASE_SOURCE --dir $PWD
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $zip)) {
            throw 'Could not download exact R8.20 source release'
          }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:BASE_SHA256) {
            throw "R8.20 source hash mismatch: $hash"
          }

          $root = Join-Path $PWD 'build_windows/windows-system'
          if (Test-Path (Join-Path $PWD 'build_windows')) { Remove-Item (Join-Path $PWD 'build_windows') -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path $zip -DestinationPath $root -Force

          foreach ($required in @(
            'package.json',
            'electron/main.cjs',
            'electron/preload.cjs',
            'src/app.js',
            'src/data.js',
            'src/firebase.js',
            'src/v145r8-parity.js',
            'src/styles.css',
            'index.html',
            'public/lab_tests_android.json'
          )) {
            if (!(Test-Path (Join-Path $root $required))) { throw "R8.20 source missing: $required" }
          }

          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '145.8.20') { throw "Expected R8.20, got $($pkg.version)" }

      - name: Apply R8.21 security hardening
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $patcher = Join-Path $env:RUNNER_TEMP 'r821_security_patcher.py'
          $b64 = ''
          [IO.File]::WriteAllBytes($patcher, [Convert]::FromBase64String($b64))
          python $patcher $root
          if ($LASTEXITCODE -ne 0) { throw 'R8.21 security patch failed' }

      - name: Security integrity audit R8.21
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $mainPath = Join-Path $root 'electron/main.cjs'
          $main = Get-Content $mainPath -Raw
          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json

          if ($pkg.version -ne '145.8.21') { throw "Expected 145.8.21, got $($pkg.version)" }
          if ($pkg.build.appId -ne 'com.aistudio.tahalil.alakkad.windows') { throw 'Stable appId changed - blocked' }
          if ($pkg.build.productName -ne 'Tahalil Alakkad System') { throw 'Stable productName changed - blocked' }
          if ($pkg.build.nsis.deleteAppDataOnUninstall -ne $false) { throw 'App-data preservation changed - blocked' }
          if ($pkg.build.nsis.differentialPackage -ne $false) { throw 'Differential updates re-enabled - blocked' }

          foreach ($required in @(
            "APP_UPDATE_POLICY = 'manual-setup-only'",
            'TAH_R820_MANUAL_UPDATE_LOCK',
            'BLOCKED_EXECUTABLE_EXTENSIONS',
            "BACKUP_HEADER = Buffer.from('TAHALIL_BACKUP_V1\n'",
            'safeResultNameForBytes',
            'defenderScanFile',
            "'-ScanType', '3', '-File'",
            "session.on('will-download'",
            "webContents.on('will-redirect'",
            'Blocked credential-bearing URL',
            'Blocked local/private URL',
            'contextIsolation: true',
            'nodeIntegration: false',
            'sandbox: true',
            'webSecurity: true',
            'allowRunningInsecureContent: false',
            'webviewTag: false',
            'devTools: false'
          )) {
            if (!$main.Contains($required)) { throw "Missing security contract: $required" }
          }

          foreach ($forbidden in @(
            'WINDOWS_UPDATE_MANIFEST_URL',
            'latest-windows.json',
            'checkForWindowsUpdate',
            'scheduleWindowsUpdateCheck',
            'downloadWindowsUpdate'
          )) {
            if ($main.Contains($forbidden)) { throw "Automatic updater residue found: $forbidden" }
          }

          $protected = @{
            'src/app.js' = '96edcb9ddf3a3550c2cd49a7d318ba0bf494f7de1f8e61ec8b7dd743fd139c8c'
            'src/data.js' = '16810af922d751ded286e3df56fe46eed77480a73166c3e016d4a61a0a613dea'
            'src/firebase.js' = '9518522693c26e4efa2771244beb27800c680dbbb4e6e2dbb4375fda0ff9b615'
            'src/v145r8-parity.js' = '1ab0ab26b88a2159cb357173ba503242cb48ea30e683d3d312052db06f537b52'
            'src/styles.css' = '832fb3cba041a89c153c9b7888191db14e43b76f90c332ea5cf8e6d75a4c9da3'
            'electron/preload.cjs' = '0d5a3fbd0823d0d069fabfb8e816794435f130f8b995d7547ab08d69fa448426'
            'index.html' = 'cc475b2c0ce3e00fc183fdfdd067cc665e717c9b93d6233592b950b2ce18bc78'
            'public/lab_tests_android.json' = '77b09ad3aa97c6ebdb66e973e971cbe9f327e9a268fd6ee3980501ff1e5d43c3'
          }
          foreach ($entry in $protected.GetEnumerator()) {
            $actual = (Get-FileHash (Join-Path $root $entry.Key) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) { throw "Protected file changed: $($entry.Key)" }
          }

          node --check $mainPath
          if ($LASTEXITCODE -ne 0) { throw 'electron/main.cjs syntax failed' }
          node --check (Join-Path $root 'src/app.js')
          if ($LASTEXITCODE -ne 0) { throw 'src/app.js syntax failed' }
          node --check (Join-Path $root 'src/data.js')
          if ($LASTEXITCODE -ne 0) { throw 'src/data.js syntax failed' }

          'R8.21 SECURITY AUDIT: PASS' | Set-Content 'R821_SECURITY_AUDIT.txt' -Encoding utf8
          'Automatic application updates: DISABLED' | Add-Content 'R821_SECURITY_AUDIT.txt'
          'Executable/script extensions: BLOCKED from app-controlled result/file paths' | Add-Content 'R821_SECURITY_AUDIT.txt'
          'Result binary allowlist: PDF/JPEG/PNG/WEBP/HEIC/AVIF' | Add-Content 'R821_SECURITY_AUDIT.txt'
          'Backup import: .tahbak + header + size validation' | Add-Content 'R821_SECURITY_AUDIT.txt'
          'Defender pre-open scan: ENABLED when MpCmdRun is available' | Add-Content 'R821_SECURITY_AUDIT.txt'
          'Firebase/sync/business UI protected files: UNCHANGED' | Add-Content 'R821_SECURITY_AUDIT.txt'

      - name: Package R8.21 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $stage = Join-Path $env:RUNNER_TEMP 'source_stage_r821'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Get-ChildItem -LiteralPath $root -Force |
            Where-Object { @('node_modules','release','.git') -notcontains $_.Name } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $stage -Recurse -Force }

          $zip = Join-Path $PWD 'Tahalil-Alakkad-V145-R8.21-Windows-Source.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage,$zip,[System.IO.Compression.CompressionLevel]::Optimal,$false)
          if (!(Test-Path $zip) -or (Get-Item $zip).Length -lt 50000) { throw 'R8.21 source ZIP invalid' }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Tahalil-Alakkad-V145-R8.21-Windows-Source.zip" | Set-Content 'Tahalil-Alakkad-V145-R8.21-Windows-Source.zip.sha256' -Encoding ascii
          Copy-Item (Join-Path $root 'V145_R821_SECURITY_HARDENING_NOTES.txt') 'V145_R821_SECURITY_HARDENING_NOTES.txt' -Force

      - name: Install dependencies
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Runtime dependency critical audit
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm audit --omit=dev --audit-level=critical
          if ($LASTEXITCODE -ne 0) { throw 'Critical runtime dependency vulnerability detected' }

      - name: Build Portable
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Portable startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable) { throw 'Portable EXE missing' }
          $env:TAHALIL_SMOKE_TEST = '1'
          $proc = Start-Process -FilePath $portable.FullName -PassThru
          if (!$proc.WaitForExit(30000)) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; throw 'Portable smoke timed out' }
          if ($proc.ExitCode -ne 0) { throw "Portable smoke failed with exit code $($proc.ExitCode)" }

      - name: Build Setup
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }

      - name: Prepare R8.21 delivery files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup = Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable -or !$setup) { throw 'Portable or Setup EXE missing' }

          Copy-Item $portable.FullName 'Tahalil-Alakkad-V145-R8.21-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V145-R8.21-Windows-Setup.exe' -Force

          foreach ($name in @(
            'Tahalil-Alakkad-V145-R8.21-Windows-Portable.exe',
            'Tahalil-Alakkad-V145-R8.21-Windows-Setup.exe'
          )) {
            $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Microsoft Defender scan delivery binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @()
          $platform = Join-Path $env:ProgramData 'Microsoft\Windows Defender\Platform'
          if (Test-Path $platform) {
            $candidates += Get-ChildItem $platform -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'MpCmdRun.exe' }
          }
          $candidates += Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          $mp = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($mp) {
            foreach ($file in @(
              'Tahalil-Alakkad-V145-R8.21-Windows-Portable.exe',
              'Tahalil-Alakkad-V145-R8.21-Windows-Setup.exe'
            )) {
              & $mp -Scan -ScanType 3 -File (Join-Path $PWD $file)
              if ($LASTEXITCODE -ne 0) { throw "Defender scan did not pass: $file (exit $LASTEXITCODE)" }
            }
            'Microsoft Defender build scan: PASS' | Add-Content 'R821_SECURITY_AUDIT.txt'
          } else {
            'Microsoft Defender build scan: NOT AVAILABLE ON RUNNER' | Add-Content 'R821_SECURITY_AUDIT.txt'
          }

      - name: Upload R8.21 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V145-R8.21-Windows-SECURITY-HARDENED
          path: |
            Tahalil-Alakkad-V145-R8.21-Windows-Portable.exe
            Tahalil-Alakkad-V145-R8.21-Windows-Portable.exe.sha256
            Tahalil-Alakkad-V145-R8.21-Windows-Setup.exe
            Tahalil-Alakkad-V145-R8.21-Windows-Setup.exe.sha256
            Tahalil-Alakkad-V145-R8.21-Windows-Source.zip
            Tahalil-Alakkad-V145-R8.21-Windows-Source.zip.sha256
            V145_R821_SECURITY_HARDENING_NOTES.txt
            R821_SECURITY_AUDIT.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish Windows V145 R8.21 SECURITY HARDENED release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v145-r8.21-windows'
          $title = 'تحاليل العقاد Windows V145 R8.21 — SECURITY HARDENED'
          $notes = Get-Content 'V145_R821_SECURITY_HARDENING_NOTES.txt' -Raw
          $files = @(
            'Tahalil-Alakkad-V145-R8.21-Windows-Portable.exe',
            'Tahalil-Alakkad-V145-R8.21-Windows-Portable.exe.sha256',
            'Tahalil-Alakkad-V145-R8.21-Windows-Setup.exe',
            'Tahalil-Alakkad-V145-R8.21-Windows-Setup.exe.sha256',
            'Tahalil-Alakkad-V145-R8.21-Windows-Source.zip',
            'Tahalil-Alakkad-V145-R8.21-Windows-Source.zip.sha256',
            'V145_R821_SECURITY_HARDENING_NOTES.txt',
            'R821_SECURITY_AUDIT.txt'
          )

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes
          } else {
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create/update R8.21 release' }

          gh release upload $tag @files --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload R8.21 release files' }
