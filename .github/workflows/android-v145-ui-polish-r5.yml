name: Android V145 UI POLISH R5

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-v145-ui-polish-r5
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare exact V145 R3 base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          REF='refs/remotes/origin/v145-search-packages-final-r3-base'
          test -n "$(git rev-parse "$REF^{commit}")"
          rm -rf build_v145
          git worktree add --detach build_v145 "$REF"
          cd build_v145
          grep -Fq 'versionCode = 145' app/build.gradle.kts
          grep -Fq 'V145PackagesSection' app/src/main/java/com/example/ui/LabTestsScreen.kt
          sha256sum firestore.rules app/google-services.json app/src/main/assets/lab_tests_android.json app/src/main/java/com/example/MainActivity.kt > "$RUNNER_TEMP/protected.sha256"

      - name: Apply verified compact UI patch
        shell: bash
        env:
          R5_PATCH_GZ_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$R5_PATCH_GZ_B64" | base64 --decode > "$RUNNER_TEMP/r5.py.gz"
          test "$(sha256sum "$RUNNER_TEMP/r5.py.gz" | awk '{print $1}')" = "f48f8daa65a6e93a27932b2c21b0d6d2b08e7678692c2a943a0fd65514bc07c1"
          gzip -t "$RUNNER_TEMP/r5.py.gz"
          gzip -dc "$RUNNER_TEMP/r5.py.gz" > "$RUNNER_TEMP/r5.py"
          python3 -m py_compile "$RUNNER_TEMP/r5.py"
          python3 "$RUNNER_TEMP/r5.py"

      - name: Safety audit
        shell: bash
        run: |
          set -euo pipefail
          cd build_v145
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' app/build.gradle.kts app/src/main/java/com/example/ui/LabTestsScreen.kt | sort)"
          sha256sum -c "$RUNNER_TEMP/protected.sha256"
          grep -Fq 'versionCode = 146' app/build.gradle.kts
          grep -Fq 'versionName = "5.66-v145-ui-polish-r5"' app/build.gradle.kts
          grep -Fq 'horizontalArrangement = Arrangement.SpaceBetween' app/src/main/java/com/example/ui/LabTestsScreen.kt
          grep -Fq '.heightIn(min = 82.dp)' app/src/main/java/com/example/ui/LabTestsScreen.kt
          grep -Fq 'maxLines = 3' app/src/main/java/com/example/ui/LabTestsScreen.kt
          grep -Fq 'QuickImageSelectedSection(' app/src/main/java/com/example/ui/LabTestsScreen.kt
          grep -Fq 'v145ActiveSegment' app/src/main/java/com/example/ui/LabTestsScreen.kt

      - name: Load proven production signer
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          WF='.github/workflows/android-v144-ONLY-SESSION-RELOCK-FIX-FINAL-ONE-RUN-R3-AUDITED.yml'
          test -s "$WF"
          extract_step() {
            local name="$1" out="$2"
            awk -v target="$name" '
              $0 == "      - name: " target { found=1; next }
              found && /^        run: \|/ { inrun=1; next }
              inrun && /^      - name:/ { exit }
              inrun { sub(/^          /,""); print }
            ' "$WF" > "$out"
            test -s "$out"
          }
          extract_step 'Prepare deterministic APK certificate reader' "$RUNNER_TEMP/cert.sh"
          extract_step 'Select exact installed Android signer' "$RUNNER_TEMP/signer.sh"
          bash "$RUNNER_TEMP/cert.sh"
          bash "$RUNNER_TEMP/signer.sh"

      - name: Confirm signing environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_PATH:-}"
          test -n "${STORE_PASSWORD:-}"
          test -n "${KEY_ALIAS:-}"
          test -n "${KEY_PASSWORD:-}"
          test -f "$KEYSTORE_PATH"

      - name: Compile and build
        working-directory: build_v145
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:compileReleaseKotlin
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify production APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build_v145/app/build/outputs/apk/release -type f -name '*.apk' | sort | head -1)"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"

          curl -fL --retry 3 'https://github.com/ahmedmeshrf22-jpg/lab-tests-directory/releases/download/v145-search-packages-final-r3/Tahalil-Alakkad-V145-R3-FINAL-SIGNED.apk' -o "$RUNNER_TEMP/r3.apk"
          "$APKSIGNER" verify --verbose "$RUNNER_TEMP/r3.apk"

          NEW_CERT="$(python3 "$RUNNER_TEMP/apk_cert_sha256.py" "$APK" | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
          OLD_CERT="$(python3 "$RUNNER_TEMP/apk_cert_sha256.py" "$RUNNER_TEMP/r3.apk" | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
          test "${#NEW_CERT}" -eq 64
          test "${#OLD_CERT}" -eq 64
          test "$NEW_CERT" = "$OLD_CERT"

          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          echo "$BADGING"
          echo "$BADGING" | grep -Fq "package: name='com.aistudio.labtestsdirectory.egypt'"
          echo "$BADGING" | grep -Fq "versionCode='146'"
          echo "$BADGING" | grep -Fq "versionName='5.66-v145-ui-polish-r5'"

          cp "$APK" Tahalil-Alakkad-V145-R5-UI-POLISH-SIGNED.apk
          sha256sum Tahalil-Alakkad-V145-R5-UI-POLISH-SIGNED.apk > Tahalil-Alakkad-V145-R5-UI-POLISH-SIGNED.apk.sha256

      - name: Create source ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd build_v145
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b v145-ui-polish-r5-base
          git add app/build.gradle.kts app/src/main/java/com/example/ui/LabTestsScreen.kt
          git commit -m 'Polish V145 inquiry UI'
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          git archive --format=zip --output="$GITHUB_WORKSPACE/Tahalil-Alakkad-V145-R5-SOURCE.zip" HEAD

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V145-R5-UI-POLISH
          path: |
            Tahalil-Alakkad-V145-R5-UI-POLISH-SIGNED.apk
            Tahalil-Alakkad-V145-R5-UI-POLISH-SIGNED.apk.sha256
            Tahalil-Alakkad-V145-R5-SOURCE.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C build_v145 push origin HEAD:refs/heads/v145-ui-polish-r5-base

          gh release create v145-ui-polish-r5 \
            Tahalil-Alakkad-V145-R5-UI-POLISH-SIGNED.apk \
            Tahalil-Alakkad-V145-R5-UI-POLISH-SIGNED.apk.sha256 \
            Tahalil-Alakkad-V145-R5-SOURCE.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$FINAL_SHA" \
            --title 'Tahalil Alakkad V145 R5 UI Polish' \
            --notes 'Compact cleaner package rows, smaller multi-test search box, unnecessary Search label removed, V145 functions preserved.'
