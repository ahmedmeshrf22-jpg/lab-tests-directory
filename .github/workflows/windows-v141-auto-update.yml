      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit Windows V141 auto update
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_v141_windows/windows-system'
          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '141.0.0') { throw 'Expected Windows V141 package' }
          if ($pkg.build.portable.artifactName -notmatch 'V141') { throw 'Portable V141 name missing' }
          if ($pkg.build.nsis.artifactName -notmatch 'V141') { throw 'Setup V141 name missing' }

          $tests = Get-Content (Join-Path $root 'public/lab_tests_android.json') -Raw | ConvertFrom-Json
          if ($tests.Count -ne 331) { throw "Expected 331 tests, got $($tests.Count)" }
          if (($tests | Where-Object { $null -ne $_.customer_price }).Count -ne 0) { throw 'Embedded customer prices detected' }

          $main = Get-Content (Join-Path $root 'electron/main.cjs') -Raw
          foreach ($x in @(
            'setContentProtection(false)',
            'latest-windows.json',
            'MAX_WINDOWS_UPDATE_BYTES',
            'downloadWindowsUpdate',
            'sha256FileAsync',
            'scheduleWindowsUpdateCheck',
            'Update SHA-256 verification failed',
            "original.hostname.toLowerCase() !== 'github.com'",
            "FAILOVER_ENDPOINT = 'https://ogidyelgmigcvasizzuv.supabase.co/functions/v1/tahalil-failover-read'",
            "RESULT_FAILOVER_ENDPOINT = 'https://ogidyelgmigcvasizzuv.supabase.co/functions/v1/tahalil-result-failover'",
            "RECONCILE_ENDPOINT = 'https://ogidyelgmigcvasizzuv.supabase.co/functions/v1/tahalil-shadow-reconcile'",
            'OFFLINE_GRACE_MS = 72 * 60 * 60 * 1000',
            'new Tray',
            'target.setHours(4,0,0,0)',
            'safeStorage.encryptString',
            'sandbox: true',
            'contextIsolation: true',
            'nodeIntegration: false',
            'webSecurity: true'
          )) { if (!$main.Contains($x)) { throw "Missing V141 main marker: $x" } }
          if ($main.Contains('setContentProtection(true)')) { throw 'Screenshot blocking reappeared' }

          $fail = Get-Content (Join-Path $root 'src/failover.js') -Raw
          foreach ($x in @('tahalil-failover-read','getIdToken(false)','getIdToken(true)','shadow_read_only')) { if(!$fail.Contains($x)){throw "Missing failover marker: $x"} }
          $resultFail = Get-Content (Join-Path $root 'src/resultFailover.js') -Raw
          foreach ($x in @('tahalil-result-failover','MAX_FILE_BYTES','result_hash_mismatch')) { if(!$resultFail.Contains($x)){throw "Missing result failover marker: $x"} }
          $reconcile = Get-Content (Join-Path $root 'src/shadowReconcile.js') -Raw
          foreach ($x in @('tahalil-shadow-reconcile','SUCCESS_INTERVAL_MS=24*60*60*1000','runIfDue')) { if(!$reconcile.Contains($x)){throw "Missing reconcile marker: $x"} }
          $backup = Get-Content (Join-Path $root 'src/backup.js') -Raw
          foreach ($x in @('const SCHEMA=3','app_version_code:141',"app_version_name:'System V141 Windows'",'getDocFromServer','if(!snap.exists())missing.push(write)')) { if(!$backup.Contains($x)){throw "Missing backup marker: $x"} }
          $shadow = Get-Content (Join-Path $root 'src/shadowBackup.js') -Raw
          foreach ($x in @('tahalil-shadow-mirror','appVersionCode: 141','Shadow backup is deliberately non-blocking')) { if(!$shadow.Contains($x)){throw "Missing shadow marker: $x"} }
          $appjs = Get-Content (Join-Path $root 'src/app.js') -Raw
          foreach ($x in @('Unified System V141','Windows V141','ShadowReconciliationClient.runIfDue','تم الاسترجاع ✓')) { if(!$appjs.Contains($x)){throw "Missing UI marker: $x"} }

          $all = $main + "`n" + $fail + "`n" + $resultFail + "`n" + $reconcile + "`n" + $backup + "`n" + $shadow + "`n" + $appjs
          if ($all.ToLower().Contains('cloudflare') -or $all.ToLower().Contains('workers.dev')) { throw 'Cloudflare dependency detected' }
          foreach ($secret in @('SUPABASE_SERVICE_ROLE_KEY','SUPABASE_SECRET_KEYS','sb_secret_','BEGIN PRIVATE KEY')) { if($all.Contains($secret)){throw "Forbidden secret marker: $secret"} }

          Get-ChildItem (Join-Path $root 'src') -Filter '*.js' -File | ForEach-Object {
            Get-Content $_.FullName -Raw | node --input-type=module --check
            if ($LASTEXITCODE -ne 0) { throw "JS syntax failed: $($_.Name)" }
          }
          node --check (Join-Path $root 'electron/main.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'main.cjs syntax failed' }
          node --check (Join-Path $root 'electron/preload.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'preload.cjs syntax failed' }
          Write-Host 'WINDOWS V141 AUTO UPDATE AUDIT PASSED'

      - name: Install dependencies
        working-directory: build_v141_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Build Portable
        working-directory: build_v141_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Portable startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v141_windows/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$exe) { throw 'Portable EXE not found' }
          $env:TAHALIL_SMOKE_TEST='1'
          $p=Start-Process $exe.FullName -PassThru
          if (!$p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; throw 'Portable smoke timed out' }
          if ($p.ExitCode -ne 0) { throw "Portable smoke exit code $($p.ExitCode)" }
          Remove-Item Env:TAHALIL_SMOKE_TEST -ErrorAction SilentlyContinue
          Write-Host 'PORTABLE STARTUP OK'

      - name: Portable System Tray smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v141_windows/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$exe) { throw 'Portable EXE not found for tray smoke' }
          $env:TAHALIL_TRAY_SMOKE_TEST='1'
          $p=Start-Process $exe.FullName -PassThru
          if (!$p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; throw 'Tray smoke timed out' }
          if ($p.ExitCode -ne 0) { throw "Tray smoke exit code $($p.ExitCode)" }
          Remove-Item Env:TAHALIL_TRAY_SMOKE_TEST -ErrorAction SilentlyContinue
          Write-Host 'SYSTEM TRAY OK'

      - name: Build Setup
        working-directory: build_v141_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }

      - name: Prepare Windows V141 delivery files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v141_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup = Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable -or !$setup) { throw 'Portable or Setup EXE missing' }
          Copy-Item $portable.FullName 'Tahalil-Alakkad-V141-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V141-Windows-Setup.exe' -Force
          Compress-Archive -Path 'build_v141_windows/windows-system/*' -DestinationPath 'Tahalil-Alakkad-V141-Windows-Source.zip' -Force
          foreach ($name in @('Tahalil-Alakkad-V141-Windows-Portable.exe','Tahalil-Alakkad-V141-Windows-Setup.exe','Tahalil-Alakkad-V141-Windows-Source.zip')) {
            if ((Get-Item $name).Length -lt 100000) { throw "$name unexpectedly small" }
            $hash=(Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Publish Windows V141 auto-update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag='v141-windows'
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { throw 'v141-windows already exists; refusing to overwrite immutable delivery release' }
          gh release create $tag `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "تحاليل العقاد Windows V141 — Verified Auto Update" `
            --notes "Windows V141 preserves V140 screenshots and resilience and adds a verified public GitHub update channel. Setup is accepted only from github.com and SHA-256 is checked before installation."
          if ($LASTEXITCODE -ne 0) { throw 'Could not create Windows V141 release' }
          gh release upload $tag `
            'Tahalil-Alakkad-V141-Windows-Portable.exe' `
            'Tahalil-Alakkad-V141-Windows-Portable.exe.sha256' `
            'Tahalil-Alakkad-V141-Windows-Setup.exe' `
            'Tahalil-Alakkad-V141-Windows-Setup.exe.sha256' `
            'Tahalil-Alakkad-V141-Windows-Source.zip' `
            'Tahalil-Alakkad-V141-Windows-Source.zip.sha256' `
            --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Windows V141 files' }

      - name: Final status
        shell: pwsh
        run: |
          Write-Host 'WINDOWS V141 VERIFIED AUTO UPDATE BUILT, SMOKE-TESTED AND RELEASED'
