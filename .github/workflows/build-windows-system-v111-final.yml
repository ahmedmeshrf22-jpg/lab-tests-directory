          Expand-Archive -Path "source.zip" -DestinationPath "." -Force
          if (-not (Test-Path "windows-system/package.json")) { throw "Windows V111 source was not reconstructed" }

      - name: Verify V111 system parity
        shell: pwsh
        run: |
          $pkg = Get-Content "windows-system/package.json" -Raw
          $app = Get-Content "windows-system/src/app.js" -Raw
          $data = Get-Content "windows-system/src/data.js" -Raw
          $fb = Get-Content "windows-system/src/firebase.js" -Raw
          $main = Get-Content "windows-system/electron/main.cjs" -Raw
          if ($pkg -notmatch '"version"\s*:\s*"111\.0\.0"') { throw "Windows version is not V111" }
          if ($fb -notmatch "1:266327573884:web:c457f66f054582bb4290f9") { throw "Firebase Windows Web App ID is missing" }
          if ($fb -notmatch "tahalil-alakkad") { throw "Firebase project ID is missing" }
          if ($data -notmatch "watchLabOrders") { throw "Lab realtime listener missing" }
          if ($data -notmatch "labUploadResults") { throw "Lab result upload missing" }
          if ($data -notmatch "workflow_status:'sent_to_lab'") { throw "Clinic-to-lab auto send missing" }
          if ($app -notmatch "Unified System V111") { throw "V111 UI marker missing" }
          if ($app -notmatch "رقم الطلب أو اسم/هاتف العميل أو رقم الملف") { throw "V111 fast lab search missing" }
          if ($main -notmatch "app:notify") { throw "Windows native notifications missing" }
          Write-Host "V111 static parity checks passed."

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax check
        shell: pwsh
        working-directory: windows-system
        run: |
          node --check src/app.js
          node --check src/backup.js
          node --check src/data.js
          node --check src/firebase.js
          node --check src/guide.js
          node --check src/vision.js
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check vite.config.mjs

      - name: Install dependencies
        shell: pwsh
        working-directory: windows-system
        run: npm install --no-audit --no-fund

      - name: Verify Vite 7
        shell: pwsh
        working-directory: windows-system
        run: |
          $v = npx vite --version
          Write-Host $v
          if ($v -notmatch "vite/7\.") { throw "Expected Vite 7.x but got: $v" }

      - name: Build web client
        shell: pwsh
        working-directory: windows-system
        run: npm run build:web

      - name: Build portable Windows EXE
        shell: pwsh
        working-directory: windows-system
        run: npx electron-builder --win portable

      - name: Verify Windows V111 EXE
        shell: pwsh
        run: |
          $files = Get-ChildItem "windows-system/release/*.exe" -ErrorAction Stop
          if ($files.Count -lt 1) { throw "No Windows V111 EXE was produced" }
          $files | ForEach-Object { Write-Host ("Built: " + $_.FullName + " | " + $_.Length + " bytes") }

      - name: Upload Windows V111 EXE
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-System-V111-Windows-FINAL
          path: windows-system/release/*.exe
          if-no-files-found: error
          retention-days: 30
