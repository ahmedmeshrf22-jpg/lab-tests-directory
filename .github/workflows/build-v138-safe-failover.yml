      - name: Audit V138 safety and continuity
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYAUDIT'
          from pathlib import Path
          import subprocess

          src=Path('app/src/main/java')
          grad=Path('app/build.gradle.kts').read_text()
          vm=(src/'com/example/ui/LabTestsViewModel.kt').read_text()
          fail=(src/'com/example/resilience/EmergencyFailoverClient.kt').read_text()
          scheduler=(src/'com/example/notifications/AutoBackupScheduler.kt').read_text()
          backup=(src/'com/example/util/CommercialBackupManager.kt').read_text()
          allkt='\n'.join(p.read_text(errors='ignore') for p in src.rglob('*.kt'))

          tracked=subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines()
          changed={x.strip() for x in tracked+untracked if x.strip()}
          allowed={
              'app/build.gradle.kts',
              'app/src/main/java/com/example/resilience/EmergencyFailoverClient.kt',
              'app/src/main/java/com/example/ui/LabTestsViewModel.kt',
              'V138_SAFE_FAILOVER_NOTES.txt',
          }

          checks={
              'V138 version':'versionCode = 138' in grad and '5.58-safe-failover-v138' in grad,
              'same package':'applicationId = "com.aistudio.labtestsdirectory.egypt"' in grad,
              'only V138 scope changed':changed == allowed,
              'failover endpoint present':'tahalil-failover-read' in fail,
              'firebase auth token required':'getIdToken(false)' in fail and 'Authorization' in fail,
              'approved device proof sent':'X-Tahalil-Device' in fail and 'ANDROID_ID' in fail,
              'no Supabase key in APK':all(x not in allkt for x in ['SUPABASE_SERVICE_ROLE_KEY','SUPABASE_SECRET_KEYS','sb_secret_','BEGIN PRIVATE KEY']),
              'read only failover client':'requestMethod = "GET"' in fail and 'doOutput = true' not in fail and 'requestMethod = "POST"' not in fail,
              'customer fallback':'entityType = "customer"' in vm and 'parseCustomerShadow' in vm,
              'orders fallback':'entityType = "order"' in vm and 'parseOrderShadow' in vm,
              'price fallback':'entityType = "customer_price"' in vm and 'entityType = "lab2lab_price"' in vm,
              'lab fallback':'entityType = "lab_order"' in vm,
              'emergency message':'وضع الطوارئ' in vm,
              'Firebase remains authoritative':'FirebaseFirestore' in allkt and 'FirestorePerformance.get()' in vm,
              'existing Firestore offline sync preserved':'waitForPendingWrites()' in vm and 'PendingSyncStore' in vm,
              'V137 daily 4am backup preserved':'FOUR_AM_HOUR = 4' in scheduler and 'Tahalil Alakkad/Backups' in allkt,
              'V137 backup notifications preserved':'notifyBackupStarted' in allkt and 'notifyBackupCompleted' in allkt,
              'V136 restore feedback preserved':'تم الاسترجاع ✓' in allkt,
              'V135 safe restore preserved':'if (!snapshot.exists()) missing += write' in backup,
              'shadow mirror preserved':'tahalil-shadow-mirror' in allkt,
              'recovery probe preserved':'tahalil-recovery-probe' in allkt,
              'offline vault preserved':'OfflineAccessVault' in allkt,
              'results preserved':'saveResultToDownloads' in allkt and 'requestResultRevision' in allkt,
              'order notifications preserved':'class OrderRealtimeNotificationService' in allkt,
              'no Firebase rules edits':not any('firestore.rules' in x.lower() for x in changed),
              'no Cloudflare':'cloudflare' not in allkt.lower() and 'workers.dev' not in allkt.lower(),
          }

          for k,v in checks.items():
              print(('OK   ' if v else 'FAIL ')+k)
          bad=[k for k,v in checks.items() if not v]
          if bad:
              raise SystemExit('V138 AUDIT FAILED: '+', '.join(bad))
          print('ALL V138 SAFE FAILOVER CHECKS PASSED')
          PYAUDIT

      - name: Publish immutable V138 source branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="v138-safe-failover-base"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add app/build.gradle.kts             app/src/main/java/com/example/resilience/EmergencyFailoverClient.kt             app/src/main/java/com/example/ui/LabTestsViewModel.kt             V138_SAFE_FAILOVER_NOTES.txt
          git commit -m "V138 safe authenticated Supabase read failover"

          COMMIT_SHA="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch -q origin "$BRANCH"
            LOCAL_TREE="$(git rev-parse HEAD^{tree})"
            REMOTE_TREE="$(git rev-parse FETCH_HEAD^{tree})"
            if [ "$LOCAL_TREE" != "$REMOTE_TREE" ]; then
              echo "::error::Existing $BRANCH differs; refusing to overwrite it."
              exit 1
            fi
            COMMIT_SHA="$(git rev-parse FETCH_HEAD)"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "V138_COMMIT_SHA=$COMMIT_SHA" >> "$GITHUB_ENV"

      - name: Restore original Android signing identity
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_BUNDLE_B64:-}"
          SIGN_DIR="$RUNNER_TEMP/tahalil_v138_signing"
          rm -rf "$SIGN_DIR" && mkdir -p "$SIGN_DIR/files"
          printf '%s' "$SIGNING_BUNDLE_B64" | tr -d '\r\n ' | base64 --decode > "$SIGN_DIR/bundle.bin"

          if unzip -t "$SIGN_DIR/bundle.bin" >/dev/null 2>&1; then
            unzip -q "$SIGN_DIR/bundle.bin" -d "$SIGN_DIR/files"
          else
            cp "$SIGN_DIR/bundle.bin" "$SIGN_DIR/files/original.keystore"
          fi

          KEYSTORE="$(find "$SIGN_DIR/files" -type f \( -iname '*.jks' -o -iname '*.keystore' \) -print -quit)"
          test -n "$KEYSTORE"

          STORE_PASSWORD=""
          KEY_ALIAS=""
          KEY_PASSWORD=""

          while IFS= read -r META; do
            [ -f "$META" ] || continue
            [ -n "$STORE_PASSWORD" ] || STORE_PASSWORD="$(sed -nE 's/^[[:space:]]*(STORE_PASSWORD|KEYSTORE_PASSWORD|storePassword|store_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(sed -nE 's/^[[:space:]]*(KEY_ALIAS|keyAlias|key_alias)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$(sed -nE 's/^[[:space:]]*(KEY_PASSWORD|keyPassword|key_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
          done < <(find "$SIGN_DIR/files" -type f \( -iname '*.properties' -o -iname '*.env' -o -iname '*.txt' \) -print)

          if [ -z "$STORE_PASSWORD" ] && keytool -list -keystore "$KEYSTORE" -storepass android >/dev/null 2>&1; then
            STORE_PASSWORD=android
          fi

          test -n "$STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
          test -n "$KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$STORE_PASSWORD"

          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"

          {
            echo "KEYSTORE_PATH=$KEYSTORE"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Android V138
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          cp "$APK" Tahalil-Alakkad-V138-Safe-Failover-Android-SIGNED.apk
          sha256sum Tahalil-Alakkad-V138-Safe-Failover-Android-SIGNED.apk             > Tahalil-Alakkad-V138-Safe-Failover-Android-SIGNED.apk.sha256

      - name: Publish V138 release directly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v138 >/dev/null 2>&1; then
            echo "::error::Release v138 already exists. Refusing to overwrite it."
            exit 1
          fi

          gh release create v138             Tahalil-Alakkad-V138-Safe-Failover-Android-SIGNED.apk             Tahalil-Alakkad-V138-Safe-Failover-Android-SIGNED.apk.sha256             --target "$V138_COMMIT_SHA"             --title "تحاليل العقاد V138 — Safe Failover"             --notes "V138 adds authenticated emergency read continuity from the Supabase shadow backup after Firebase/server/cache read failure for customers, orders, price data, and lab orders. Firebase remains authoritative, existing Firestore offline pending-write sync remains unchanged, V137 daily 04:00 backup remains intact, no Supabase secret is shipped in the APK, and Firebase Rules are unchanged."

      - name: Final status
        shell: bash
        run: |
          echo "V138 Safe Failover built, signed, source-pinned and released."
