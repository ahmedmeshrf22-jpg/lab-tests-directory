name: Build Tahalil Alakkad V138 Safe Failover

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-v138-safe-failover
  cancel-in-progress: false

jobs:
  build-v138:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout V137 Auto Backup base
        uses: actions/checkout@v4
        with:
          ref: v137-auto-backup-fix-base
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

