      - name: Deep audit V142 requested behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json,re,os,hashlib
          root=Path('build_v142')
          src=root/'app/src/main/java'
          grad=(root/'app/build.gradle.kts').read_text()
          vm=(src/'com/example/ui/LabTestsViewModel.kt').read_text()
          repo=(src/'com/example/data/repository/LabTestRepository.kt').read_text()
          login=(src/'com/example/ui/LoginScreen.kt').read_text()
          ops=(src/'com/example/ui/OperationsV14Dialog.kt').read_text()
          sched=(src/'com/example/notifications/AutoBackupScheduler.kt').read_text()
          storage=(src/'com/example/util/AutoBackupStorage.kt').read_text()
          main=(src/'com/example/MainActivity.kt').read_text()
          backup=(src/'com/example/util/CommercialBackupManager.kt').read_text()
          rules=(root/'firestore.rules').read_text()
          allkt='\n'.join(p.read_text(errors='ignore') for p in src.rglob('*.kt'))
          tests=json.loads((root/'app/src/main/assets/lab_tests_android.json').read_text())

          checks={
            'V142 version': 'versionCode = 142' in grad and '5.62-backup-smart-search-ui-v142' in grad,
            'same package': 'applicationId = "com.aistudio.labtestsdirectory.egypt"' in grad,
            '331 tests': len(tests)==331,
            'backup now visible': 'V142_QUICK_BACKUP' in ops and 'نسخة احتياطية الآن' in ops,
            'backup status visible': 'النسخ التلقائي: 4:00 ص' in ops and 'آخر نسخة:' in ops,
            'existing restore preserved': 'restoreCommercialBackup' in vm and 'تم الاسترجاع ✓' in ops,
            '4am preserved': 'FOUR_AM_HOUR = 4' in sched,
            'missed backup catchup': 'catchUpIfMissed' in sched and 'AutoBackupScheduler.catchUpIfMissed(this)' in main,
            'latest backup detection': 'latestBackupEpochMillis' in storage and 'latestBackupName' in storage,
            'admin icons enlarged': 'actionSize = 72.dp' in ops and ('actionSize = 60.dp' in ops or 'actionSize = 68.dp' in ops),
            'login care tagline': 'V142_CARE_TAGLINE' in login and all(x in login for x in ['"رعاية"','"تليق"','"بك"']),
            'tagline sequential animation': 'careWordsVisible' in login and 'delay(320)' in login and 'AnimatedVisibility' in login,
            'universal separators': 'universal medical-list tokenizer' in vm and "'+'" in vm and "'•'" in vm and "'|'" in vm,
            'side-by-side detection': 'detectTestsFromRecognizedText(newQuery)' in vm and 'explicitTests.size > 1' in vm,
            'per-item smart fallback': 'directMatches' in vm and 'repository.smartSearchTests(q)' in vm,
            'OCR uses same parser': 'val segments = parseQueries(rawText)' in vm,
            'aliases expanded': 'V142 common clinic shorthand' in repo and all(x in repo for x in ['"cbc"','"ft4"','"ddimer"','"ggt"','"fpsa"']),
            'semantic organ search': 'V142 semantic organ/system search' in repo and all(x in repo for x in ['"القلب"','"Troponin I (Qualitative)"','"Troponin I (Quantitative)"','"الكلى"','"البنكرياس"','"المبايض"','"الرئة"']),
            'natural heart phrase': 'عايز اطمن على القلب' in repo and 'CK-MB' in repo and 'Homocysteine' in repo,
            'shared catalogue preserved': 'lab_catalog_overrides' in vm and 'applyRemoteCatalogOverride' in (src/'com/example/data/repository/LabTestRepository.kt').read_text(),
            'catalog backup preserved': 'lab_catalog_overrides' in backup,
            # Stronger preservation check: the complete Firestore rules file must be byte-for-byte
            # identical to the V141 baseline. This covers all financial validation regardless of
            # internal helper-function naming.
            'financial rules preserved': hashlib.sha256(rules.encode()).hexdigest() == os.environ.get('V141_RULES_SHA',''),
            'safe restore preserved': 'if (!snapshot.exists()) missing += write' in backup,
            'result failover preserved': 'tahalil-result-failover' in allkt,
            'reconciliation preserved': 'tahalil-shadow-reconcile' in allkt,
            'offline preserved': 'OfflineAccessVault' in allkt,
            'notifications preserved': 'class OrderRealtimeNotificationService' in allkt,
            'screenshots enabled': 'FLAG_SECURE' not in allkt,
            'overlay defense preserved': 'setHideOverlayWindows(true)' in main,
            'no Cloudflare': 'cloudflare' not in allkt.lower() and 'workers.dev' not in allkt.lower(),
            'no client Supabase secret': all(x not in allkt for x in ['SUPABASE_SERVICE_ROLE_KEY','SUPABASE_SECRET_KEYS','sb_secret_','BEGIN PRIVATE KEY']),
          }
          for k,v in checks.items(): print(('OK   ' if v else 'FAIL ')+k)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('V142 AUDIT FAILED: '+', '.join(bad))
          print('ALL V142 REQUESTED + PRESERVATION CHECKS PASSED')
          PY

      - name: Compile-check Android V142
        working-directory: build_v142
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:compileReleaseKotlin

      - name: Restore original Android signing identity
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_BUNDLE_B64:-}" ]; then
            echo "::error::TAHALIL_SIGNING_BUNDLE_B64 is missing here. This workflow must be run in the OLD signing repository that built V141."
            exit 1
          fi
          SIGN_DIR="$RUNNER_TEMP/tahalil_v142_signing"
          rm -rf "$SIGN_DIR" && mkdir -p "$SIGN_DIR/files"
          printf '%s' "$SIGNING_BUNDLE_B64" | tr -d '\r\n ' | base64 --decode > "$SIGN_DIR/bundle.bin"
          if unzip -t "$SIGN_DIR/bundle.bin" >/dev/null 2>&1; then
            unzip -q "$SIGN_DIR/bundle.bin" -d "$SIGN_DIR/files"
          else
            cp "$SIGN_DIR/bundle.bin" "$SIGN_DIR/files/original.keystore"
          fi
          KEYSTORE="$(find "$SIGN_DIR/files" -type f \( -iname '*.jks' -o -iname '*.keystore' \) -print -quit)"
          test -n "$KEYSTORE"
          STORE_PASSWORD=''; KEY_ALIAS=''; KEY_PASSWORD=''
          while IFS= read -r META; do
            [ -f "$META" ] || continue
            [ -n "$STORE_PASSWORD" ] || STORE_PASSWORD="$(sed -nE 's/^[[:space:]]*(STORE_PASSWORD|KEYSTORE_PASSWORD|storePassword|store_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(sed -nE 's/^[[:space:]]*(KEY_ALIAS|keyAlias|key_alias)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$(sed -nE 's/^[[:space:]]*(KEY_PASSWORD|keyPassword|key_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
          done < <(find "$SIGN_DIR/files" -type f \( -iname '*.properties' -o -iname '*.env' -o -iname '*.txt' \) -print)
          if [ -z "$STORE_PASSWORD" ] && keytool -list -keystore "$KEYSTORE" -storepass android >/dev/null 2>&1; then STORE_PASSWORD=android; fi
          test -n "$STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
          test -n "$KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$STORE_PASSWORD"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "::add-mask::$STORE_PASSWORD"; echo "::add-mask::$KEY_ALIAS"; echo "::add-mask::$KEY_PASSWORD"
          {
            echo "KEYSTORE_PATH=$KEYSTORE"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Android V142
        working-directory: build_v142
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify signer against installed-channel V141
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build_v142/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          curl --fail --location --retry 3             'https://github.com/ahmedmeshrf22-jpg/tahalil-alakkad-updates/releases/download/v140/Tahalil-Alakkad-LATEST.apk'             -o "$RUNNER_TEMP/android-v141-current.apk"
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/android-v141-current.apk"

          NEW_CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          OLD_CERT="$("$APKSIGNER" verify --print-certs "$RUNNER_TEMP/android-v141-current.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test -n "$NEW_CERT" && test -n "$OLD_CERT"
          test "$NEW_CERT" = "$OLD_CERT" || { echo "::error::Android signer differs from V141"; exit 1; }

          cp "$APK" Tahalil-Alakkad-V142-All-Fixes-Organ-Smart-Search-Android-SIGNED.apk
          sha256sum Tahalil-Alakkad-V142-All-Fixes-Organ-Smart-Search-Android-SIGNED.apk             > Tahalil-Alakkad-V142-All-Fixes-Organ-Smart-Search-Android-SIGNED.apk.sha256

      - name: Publish immutable V142 source branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd build_v142
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b v142-android-backup-smart-search-ui-base
          git add -A
          git commit -m 'Android V142 backup smart search UI'
          V142_SHA="$(git rev-parse HEAD)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"             HEAD:refs/heads/v142-android-backup-smart-search-ui-base
          echo "V142_COMMIT_SHA=$V142_SHA" >> "$GITHUB_ENV"

      - name: Prepare V142 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          (
            cd build_v142
            zip -qr ../Tahalil-Alakkad-V142-Android-SOURCE.zip .               -x '.git/*' '.gradle/*' 'app/build/*' 'build/*' '*.apk'
          )
          sha256sum Tahalil-Alakkad-V142-Android-SOURCE.zip > Tahalil-Alakkad-V142-Android-SOURCE.zip.sha256

      - name: Upload V142 delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-Android-V142-BACKUP-SMART-SEARCH-UI
          path: |
            Tahalil-Alakkad-V142-All-Fixes-Organ-Smart-Search-Android-SIGNED.apk
            Tahalil-Alakkad-V142-All-Fixes-Organ-Smart-Search-Android-SIGNED.apk.sha256
            Tahalil-Alakkad-V142-Android-SOURCE.zip
            Tahalil-Alakkad-V142-Android-SOURCE.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android V142 release without changing Windows latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v142-android'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing overwrite."
            exit 1
          fi
          gh release create "$TAG"             Tahalil-Alakkad-V142-All-Fixes-Organ-Smart-Search-Android-SIGNED.apk             Tahalil-Alakkad-V142-All-Fixes-Organ-Smart-Search-Android-SIGNED.apk.sha256             Tahalil-Alakkad-V142-Android-SOURCE.zip             Tahalil-Alakkad-V142-Android-SOURCE.zip.sha256             --repo "$GITHUB_REPOSITORY"             --target "$V142_COMMIT_SHA"             --title 'تحاليل العقاد Android V142 — All Fixes + Organ Smart Search'             --notes 'V142 combines all requested fixes: visible Backup Now and auto-backup status, missed-04:00 catch-up, larger administration icons, sequential "رعاية تليق بك" login tagline, universal multi-test parsing, expanded abbreviations, semantic organ/system search (for example القلب returns CK-MB, both Troponin I qualitative/quantitative and related tests), and the same smart matching for image/PDF OCR. All Android V141 Firebase/catalogue/financial/result/offline/security behavior is preserved. This release intentionally does NOT mark itself latest so Windows V144 latest/update channel stays untouched.'

      - name: Final status
        shell: bash
        run: |
          echo 'ANDROID V142 BUILT + COMPILED + SIGNER-VERIFIED + SOURCE-PINNED + RELEASED'
          echo 'Signed using the existing Android signing identity stored in this repository.'
