        shell: bash
        run: |
          set -euo pipefail
          ROOT=build_v142
          grep -Fq 'versionCode = 141' "$ROOT/app/build.gradle.kts"
          grep -Fq 'applicationId = "com.aistudio.labtestsdirectory.egypt"' "$ROOT/app/build.gradle.kts"
          grep -Fq 'CATALOG_OVERRIDES_COLLECTION = "lab_catalog_overrides"' "$ROOT/app/src/main/java/com/example/ui/LabTestsViewModel.kt"
          grep -Fq 'createEncryptedBackupV134' "$ROOT/app/src/main/java/com/example/ui/LabTestsViewModel.kt"
          grep -Fq 'FOUR_AM_HOUR = 4' "$ROOT/app/src/main/java/com/example/notifications/AutoBackupScheduler.kt"
          grep -Fq 'setHideOverlayWindows(true)' "$ROOT/app/src/main/java/com/example/MainActivity.kt"
          ! grep -RFn --include='*.kt' --include='*.java' 'FLAG_SECURE' "$ROOT/app/src/main" || exit 1

          # V142 must not modify Firestore security/financial rules at all.
          # Save the exact V141 rules digest now and verify it again after the UI/search patch.
          V141_RULES_SHA="$(sha256sum "$ROOT/firestore.rules" | awk '{print $1}')"
          test -n "$V141_RULES_SHA"
          echo "V141_RULES_SHA=$V141_RULES_SHA" >> "$GITHUB_ENV"
          echo "Baseline firestore.rules SHA256=$V141_RULES_SHA"

          python3 - <<'PY'
          import json
          from pathlib import Path
          tests=json.loads(Path('build_v142/app/src/main/assets/lab_tests_android.json').read_text())
          assert len(tests)==331, len(tests)
          print('V141 baseline OK: 331 tests')
          PY

