name: Android V142 FINAL Sign On Old Repo

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-android-v142-final-sign-old-repo
  cancel-in-progress: false

jobs:
  build-v142:
    name: Build + Audit + Release Android V142 All Fixes
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Resolve exact Android V141 source
        shell: bash
        run: |
          set -euo pipefail

          # This workflow is designed for the new GitHub account. It first uses a
          # V141/V140 source ref already copied into this repo. If not found, it
          # tries the historical repository as a read-only source.
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' || true

          SOURCE_REF=''
          BASE_KIND=''

          is_v141() {
            local ref="$1"
            git show "$ref:app/build.gradle.kts" 2>/dev/null | grep -Fq 'versionCode = 141' &&
            git show "$ref:app/src/main/java/com/example/ui/LabTestsViewModel.kt" 2>/dev/null | grep -Fq 'lab_catalog_overrides'
          }

          is_v140() {
            local ref="$1"
            git show "$ref:app/build.gradle.kts" 2>/dev/null | grep -Fq 'versionCode = 140'
          }

          for ref in             refs/remotes/origin/v141-android-final-delivery-base             refs/tags/v141-android             refs/remotes/origin/main
          do
            if git rev-parse --verify "$ref^{commit}" >/dev/null 2>&1 && is_v141 "$ref"; then
              SOURCE_REF="$ref"; BASE_KIND='v141'; break
            fi
          done

          if [ -z "$SOURCE_REF" ]; then
            for ref in refs/remotes/origin/v140-screenshot-enabled-base refs/tags/v140; do
              if git rev-parse --verify "$ref^{commit}" >/dev/null 2>&1 && is_v140 "$ref"; then
                SOURCE_REF="$ref"; BASE_KIND='v140'; break
              fi
            done
          fi

          if [ -z "$SOURCE_REF" ]; then
            LEGACY='https://github.com/ahmedmeshrf22-jpg/lab-tests-directory.git'
            git fetch "$LEGACY"               '+refs/heads/v141-android-final-delivery-base:refs/remotes/legacy/v141-android-final-delivery-base'               '+refs/heads/v140-screenshot-enabled-base:refs/remotes/legacy/v140-screenshot-enabled-base'               '+refs/tags/v141-android:refs/remotes/legacy/v141-android-tag'               '+refs/tags/v140:refs/remotes/legacy/v140-tag' || true

            for ref in refs/remotes/legacy/v141-android-final-delivery-base refs/remotes/legacy/v141-android-tag; do
              if git rev-parse --verify "$ref^{commit}" >/dev/null 2>&1 && is_v141 "$ref"; then
                SOURCE_REF="$ref"; BASE_KIND='v141'; break
              fi
            done

            if [ -z "$SOURCE_REF" ]; then
              for ref in refs/remotes/legacy/v140-screenshot-enabled-base refs/remotes/legacy/v140-tag; do
                if git rev-parse --verify "$ref^{commit}" >/dev/null 2>&1 && is_v140 "$ref"; then
                  SOURCE_REF="$ref"; BASE_KIND='v140'; break
                fi
              done
            fi
          fi

          test -n "$SOURCE_REF" || {
            echo "::error::Could not locate Android V141/V140 source. Copy branch v141-android-final-delivery-base into the new repo and rerun."
            exit 1
          }

          rm -rf build_v142
          git worktree add --detach build_v142 "$SOURCE_REF"
          echo "BASE_KIND=$BASE_KIND" >> "$GITHUB_ENV"
          echo "Resolved Android source: $SOURCE_REF ($BASE_KIND)"

