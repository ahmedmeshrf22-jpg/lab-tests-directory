name: Android V145 FINAL R3 Delivery

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-v145-final-r3
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="v145-search-packages-final-r3-base"
          TAG="v145-search-packages-final-r3"

          if git ls-remote --exit-code --heads origin \
            "refs/heads/$BRANCH" >/dev/null 2>&1
          then
            echo "::error::R3 branch already exists"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin \
            "refs/tags/$TAG" >/dev/null 2>&1
          then
            echo "::error::R3 tag already exists"
            exit 1
          fi

      - name: Prepare exact V144 production base
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin \
            '+refs/heads/*:refs/remotes/origin/*'

          BASE="cb81e5608a02103b5d4633063b44fffd21e082da"
          REF="refs/remotes/origin/v144-android-no-relock-r3-base"

          ACTUAL="$(git rev-parse "$REF^{commit}")"

          if [ "$ACTUAL" != "$BASE" ]; then
            echo "::error::V144 production base mismatch"
            echo "Expected: $BASE"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

          rm -rf build_v145
          git worktree add --detach build_v145 "$BASE"

          (
            cd build_v145

            grep -Fq 'versionCode = 144' \
              app/build.gradle.kts

            grep -Fq 'V144_R3_NO_RELOCK' \
              app/src/main/java/com/example/MainActivity.kt

            sha256sum \
              firestore.rules \
              app/google-services.json \
              app/src/main/assets/lab_tests_android.json \
              app/src/main/java/com/example/MainActivity.kt \
              > "$RUNNER_TEMP/protected.sha256"
          )

      - name: Reuse already compiled V145 feature patch
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_WF=".github/workflows/android-v145-search-packages-preview.yml"

          if [ ! -s "$SOURCE_WF" ]; then
            echo "::error::Previous V145 workflow not found"
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          source = Path(
              ".github/workflows/android-v145-search-packages-preview.yml"
          ).read_text(encoding="utf-8")

          marker = "          V145_PATCH_GZ_B64: |-"

          if marker not in source:
              raise SystemExit(
                  "V145 patch payload not found in previous workflow"
              )

          after = source.split(marker, 1)[1]

          payload = []

          for line in after.splitlines():
              if line.startswith("        run: |"):
                  break

              if not line.strip():
                  continue

              if not line.startswith("            "):
                  raise SystemExit(
                      "Unexpected V145 patch payload indentation"
                  )

              payload.append(line[12:])

          if not payload:
              raise SystemExit("V145 patch payload is empty")

          Path("/tmp/v145_patch.b64").write_text(
              "\n".join(payload) + "\n",
              encoding="utf-8"
          )
          PY

          base64 --decode \
            /tmp/v145_patch.b64 \
            > "$RUNNER_TEMP/v145_patch.py.gz"

          gzip -t \
            "$RUNNER_TEMP/v145_patch.py.gz"

          gzip -dc \
            "$RUNNER_TEMP/v145_patch.py.gz" \
            > "$RUNNER_TEMP/v145_patch.py"

          python3 -m py_compile \
            "$RUNNER_TEMP/v145_patch.py"

          python3 \
            "$RUNNER_TEMP/v145_patch.py"

      - name: Safety audit
        shell: bash
        run: |
          set -euo pipefail

          cd build_v145

          git diff --check

          EXPECTED="$(
            printf '%s\n' \
              'app/build.gradle.kts' \
              'app/src/main/java/com/example/ui/LabTestsScreen.kt' \
              'app/src/main/java/com/example/ui/LabTestsViewModel.kt' \
              | sort
          )"

          ACTUAL="$(
            git diff --name-only | sort
          )"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Unexpected files changed"
            echo "EXPECTED:"
            echo "$EXPECTED"
            echo "ACTUAL:"
            echo "$ACTUAL"
            exit 1
          fi

          sha256sum -c \
            "$RUNNER_TEMP/protected.sha256"

          grep -Fq \
            'versionCode = 145' \
            app/build.gradle.kts

          grep -Fq \
            '5.65-search-packages-v145-r2' \
            app/build.gradle.kts

          grep -Fq \
            'V145PackagesSection' \
            app/src/main/java/com/example/ui/LabTestsScreen.kt

          grep -Fq \
            'QuickImageSelectedSection(' \
            app/src/main/java/com/example/ui/LabTestsScreen.kt

          grep -Fq \
            'minLines = 2' \
            app/src/main/java/com/example/ui/LabTestsScreen.kt

          grep -Fq \
            '_searchQuery.value = newQuery' \
            app/src/main/java/com/example/ui/LabTestsViewModel.kt

          echo "Safety audit passed"

      - name: Load proven V144 certificate reader and signer
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail

          WF=".github/workflows/android-v144-ONLY-SESSION-RELOCK-FIX-FINAL-ONE-RUN-R3-AUDITED.yml"

          if [ ! -s "$WF" ]; then
            echo "::error::Proven V144 workflow missing"
            exit 1
          fi

          extract_step() {
            local name="$1"
            local out="$2"

            awk -v target="$name" '
              $0 == "      - name: " target {
                found=1
                next
              }

              found && /^        run: \|/ {
                inrun=1
                next
              }

              inrun && /^      - name:/ {
                exit
              }

              inrun {
                sub(/^          /,"")
                print
              }
            ' "$WF" > "$out"

            test -s "$out"
          }

          extract_step \
            "Prepare deterministic APK certificate reader" \
            "$RUNNER_TEMP/cert-reader.sh"

          extract_step \
            "Select exact installed Android signer" \
            "$RUNNER_TEMP/signer-selector.sh"

          bash \
            "$RUNNER_TEMP/cert-reader.sh"

          test -s \
            "$RUNNER_TEMP/apk_cert_sha256.py"

          bash \
            "$RUNNER_TEMP/signer-selector.sh"

          test -n "${KEYSTORE_PATH:-}"
          test -n "${STORE_PASSWORD:-}"
          test -n "${KEY_ALIAS:-}"
          test -n "${KEY_PASSWORD:-}"

          echo "Exact production signer selected"

      - name: Compile V145
        working-directory: build_v145
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=2 \
            :app:compileReleaseKotlin

      - name: Build signed V145 APK
        working-directory: build_v145
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=2 \
            :app:assembleRelease

      - name: Verify APK with proven V144 certificate reader
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find \
              build_v145/app/build/outputs/apk/release \
              -type f \
              -name '*.apk' \
              -print \
              | sort \
              | head -1
          )"

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::V145 APK missing"
            exit 1
          fi

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              -print \
              | sort -V \
              | tail -1
          )"

          AAPT="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name aapt \
              -print \
              | sort -V \
              | tail -1
          )"

          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK"

          OLD_APK="$RUNNER_TEMP/v144-production.apk"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            'https://github.com/ahmedmeshrf22-jpg/lab-tests-directory/releases/download/v144-android-no-relock-r3/Tahalil-Alakkad-V144-No-Relock-R3-SIGNED.apk' \
            -o "$OLD_APK"

          test -s "$OLD_APK"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$OLD_APK"

          NEW_CERT="$(
            python3 \
              "$RUNNER_TEMP/apk_cert_sha256.py" \
              "$APK" \
              | tr 'A-F' 'a-f' \
              | tr -d ':[:space:]'
          )"

          OLD_CERT="$(
            python3 \
              "$RUNNER_TEMP/apk_cert_sha256.py" \
              "$OLD_APK" \
              | tr 'A-F' 'a-f' \
              | tr -d ':[:space:]'
          )"

          if [ "${#NEW_CERT}" -ne 64 ]; then
            echo "::error::V145 certificate reader returned invalid digest"
            exit 1
          fi

          if [ "${#OLD_CERT}" -ne 64 ]; then
            echo "::error::V144 certificate reader returned invalid digest"
            exit 1
          fi

          if [ "$NEW_CERT" != "$OLD_CERT" ]; then
            echo "::error::V145 signer does not match installed V144"
            exit 1
          fi

          echo "Signer match verified"

          BADGING="$(
            "$AAPT" dump badging "$APK" \
              | head -1
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -Fq \
              "package: name='com.aistudio.labtestsdirectory.egypt'"

          echo "$BADGING" \
            | grep -Fq \
              "versionCode='145'"

          echo "$BADGING" \
            | grep -Fq \
              "versionName='5.65-search-packages-v145-r2'"

          cp \
            "$APK" \
            Tahalil-Alakkad-V145-R3-FINAL-SIGNED.apk

          sha256sum \
            Tahalil-Alakkad-V145-R3-FINAL-SIGNED.apk \
            > Tahalil-Alakkad-V145-R3-FINAL-SIGNED.apk.sha256

      - name: Create local final source ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd build_v145

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b \
            v145-search-packages-final-r3-base

          git add \
            app/build.gradle.kts \
            app/src/main/java/com/example/ui/LabTestsScreen.kt \
            app/src/main/java/com/example/ui/LabTestsViewModel.kt

          git commit \
            -m \
            "Android V145 final search packages and inquiry image"

          FINAL_SHA="$(
            git rev-parse HEAD
          )"

          echo "FINAL_SHA=$FINAL_SHA" \
            >> "$GITHUB_ENV"

          git archive \
            --format=zip \
            --output="$GITHUB_WORKSPACE/Tahalil-Alakkad-V145-R3-SOURCE.zip" \
            HEAD

          cd "$GITHUB_WORKSPACE"

          test -s \
            Tahalil-Alakkad-V145-R3-SOURCE.zip

          sha256sum \
            Tahalil-Alakkad-V145-R3-SOURCE.zip \
            > Tahalil-Alakkad-V145-R3-SOURCE.zip.sha256

      - name: Upload final handover artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V145-R3-FINAL-HANDOVER
          path: |
            Tahalil-Alakkad-V145-R3-FINAL-SIGNED.apk
            Tahalil-Alakkad-V145-R3-FINAL-SIGNED.apk.sha256
            Tahalil-Alakkad-V145-R3-SOURCE.zip
            Tahalil-Alakkad-V145-R3-SOURCE.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent source and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git -C build_v145 push \
            origin \
            HEAD:refs/heads/v145-search-packages-final-r3-base

          gh release create \
            v145-search-packages-final-r3 \
            Tahalil-Alakkad-V145-R3-FINAL-SIGNED.apk \
            Tahalil-Alakkad-V145-R3-FINAL-SIGNED.apk.sha256 \
            Tahalil-Alakkad-V145-R3-SOURCE.zip \
            Tahalil-Alakkad-V145-R3-SOURCE.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$FINAL_SHA" \
            --title "Tahalil Alakkad Android V145 R3 FINAL" \
            --notes "Final V145 delivery. APK compiled and signed with the proven V144 production signing selector. Certificate verified against V144 using the same deterministic certificate reader used by the successful V144 workflow. Includes persistent multi-test search, larger inquiry box, test packages with current totals, and branded customer image save/share. Firestore Rules and 331-test catalogue unchanged."

      - name: Final summary
        shell: bash
        run: |
          {
            echo "## ✅ V145 FINAL DELIVERY"
            echo ""
            echo "✅ Exact V144 production source"
            echo ""
            echo "✅ V145 feature patch compiled"
            echo ""
            echo "✅ Release APK built"
            echo ""
            echo "✅ APK cryptographic verification passed"
            echo ""
            echo "✅ Same certificate as installed V144"
            echo ""
            echo "✅ Package/version verified"
            echo ""
            echo "✅ Firestore Rules unchanged"
            echo ""
            echo "✅ 331-test catalogue unchanged"
            echo ""
            echo "✅ APK artifact uploaded"
            echo ""
            echo "✅ Source ZIP uploaded"
            echo ""
            echo "✅ Permanent release published"
          } >> "$GITHUB_STEP_SUMMARY"
