name: Build Tahalil Alakkad V135 Safe Restore

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-v135-safe-restore
  cancel-in-progress: false

jobs:
  build-v135:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
