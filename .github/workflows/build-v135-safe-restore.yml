      - name: Audit V135 restore safety
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYAUDIT'
          from pathlib import Path
          import subprocess, re
          r=Path('.')
          src=r/'app/src/main/java'
          allkt='\n'.join(p.read_text(errors='ignore') for p in src.rglob('*.kt'))
          grad=(r/'app/build.gradle.kts').read_text()
          backup=(src/'com/example/util/CommercialBackupManager.kt').read_text()
          vm=(src/'com/example/ui/LabTestsViewModel.kt').read_text()
          login=(src/'com/example/ui/LoginScreen.kt').read_text()
          tracked=subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines()
          changed={str(Path(x.strip())) for x in (tracked+untracked) if x.strip()}
          allowed={
            'app/build.gradle.kts',
            'app/src/main/java/com/example/util/CommercialBackupManager.kt',
            'V135_SAFE_RESTORE_NOTES.txt',
          }
          checks={
            'V135 version':'versionCode = 135' in grad and '5.55-safe-restore-v135' in grad,
            'same package':'applicationId = "com.aistudio.labtestsdirectory.egypt"' in grad,
            'only restore files changed':changed <= allowed and changed == allowed,
            'schema v3 preserved':'SCHEMA_VERSION = 3' in backup,
            'V134 user archive preserved':'put("users", JSONArray(users))' in backup,
            'V134 device archive preserved':'put("user_devices", JSONArray(userDevices))' in backup,
            'V134 audit archive preserved':'put("audit_logs", JSONArray(auditLogs))' in backup,
            'missing-only restore':'if (!snapshot.exists()) missing += write' in backup,
            'server existence check':'write.ref.get(Source.SERVER)' in backup,
            'dependency order':backup.find('restoreMissingPhase(customerWrites)') < backup.find('restoreMissingPhase(orderWrites)') < backup.find('restoreMissingPhase(paymentWrites)'),
            'no overwrite existing':'batch.set(write.ref, write.data)' in backup and 'missing[i]' in backup,
            'manager-bound create':'put("created_by_uid", restoreUid)' in backup,
            'immutable payment update avoided':'Existing Firestore documents are NEVER overwritten' in backup,
            'Firebase preserved':'FirebaseFirestore' in allkt and 'FirebaseAuth' in allkt,
            'Supabase standby preserved':'tahalil-shadow-mirror' in allkt and 'tahalil-recovery-probe' in allkt,
            'offline preserved':'OfflineAccessVault' in allkt,
            'results preserved':'saveResultToDownloads' in allkt and 'requestResultRevision' in allkt,
            'notifications preserved':'class OrderRealtimeNotificationService' in allkt,
            'credential reset preserved':'resetUserLoginCredentials' in allkt and 'sendPasswordResetEmail' not in allkt,
            'login compile fix preserved':'import androidx.compose.foundation.layout.weight' not in login,
            'no Cloudflare':'cloudflare' not in allkt.lower() and 'workers.dev' not in allkt.lower(),
            'no Supabase secret':all(x not in allkt for x in ['SUPABASE_SERVICE_ROLE_KEY','SUPABASE_SECRET_KEYS','sb_secret_','BEGIN PRIVATE KEY']),
          }
          for k,v in checks.items(): print(('OK   ' if v else 'FAIL ')+k)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('V135 AUDIT FAILED: '+', '.join(bad))
          print('ALL V135 SAFE RESTORE CHECKS PASSED')
          PYAUDIT

      - name: Publish immutable V135 source branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="v135-safe-restore-base"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add app/build.gradle.kts app/src/main/java/com/example/util/CommercialBackupManager.kt V135_SAFE_RESTORE_NOTES.txt
          git commit -m "V135 permission-safe missing-only restore"
          COMMIT_SHA="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch -q origin "$BRANCH"
            LOCAL_TREE="$(git rev-parse HEAD^{tree})"
            REMOTE_TREE="$(git rev-parse FETCH_HEAD^{tree})"
            if [ "$LOCAL_TREE" != "$REMOTE_TREE" ]; then
              echo "::error::Existing $BRANCH differs; refusing to overwrite it."
              exit 1
            fi
            COMMIT_SHA="$(git rev-parse FETCH_HEAD)"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "V135_COMMIT_SHA=$COMMIT_SHA" >> "$GITHUB_ENV"

      - name: Restore original Android signing identity
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_BUNDLE_B64:-}"
          SIGN_DIR="$RUNNER_TEMP/tahalil_v135_signing"
          rm -rf "$SIGN_DIR" && mkdir -p "$SIGN_DIR/files"
          printf '%s' "$SIGNING_BUNDLE_B64" | tr -d '\r\n ' | base64 --decode > "$SIGN_DIR/bundle.bin"
          if unzip -t "$SIGN_DIR/bundle.bin" >/dev/null 2>&1; then
            unzip -q "$SIGN_DIR/bundle.bin" -d "$SIGN_DIR/files"
          else
            cp "$SIGN_DIR/bundle.bin" "$SIGN_DIR/files/original.keystore"
          fi
          KEYSTORE="$(find "$SIGN_DIR/files" -type f \( -iname '*.jks' -o -iname '*.keystore' \) -print -quit)"
          test -n "$KEYSTORE"
          STORE_PASSWORD=""; KEY_ALIAS=""; KEY_PASSWORD=""
          while IFS= read -r META; do
            [ -f "$META" ] || continue
            [ -n "$STORE_PASSWORD" ] || STORE_PASSWORD="$(sed -nE 's/^[[:space:]]*(STORE_PASSWORD|KEYSTORE_PASSWORD|storePassword|store_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(sed -nE 's/^[[:space:]]*(KEY_ALIAS|keyAlias|key_alias)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$(sed -nE 's/^[[:space:]]*(KEY_PASSWORD|keyPassword|key_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
          done < <(find "$SIGN_DIR/files" -type f \( -iname '*.properties' -o -iname '*.env' -o -iname '*.txt' \) -print)
          if [ -z "$STORE_PASSWORD" ] && keytool -list -keystore "$KEYSTORE" -storepass android >/dev/null 2>&1; then STORE_PASSWORD=android; fi
          test -n "$STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
          test -n "$KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$STORE_PASSWORD"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "KEYSTORE_PATH=$KEYSTORE"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Android V135
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" Tahalil-Alakkad-V135-Safe-Restore-Android-SIGNED.apk
          sha256sum Tahalil-Alakkad-V135-Safe-Restore-Android-SIGNED.apk > Tahalil-Alakkad-V135-Safe-Restore-Android-SIGNED.apk.sha256

      - name: Publish V135 release directly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v135 >/dev/null 2>&1; then
            echo "::error::Release v135 already exists. Refusing to overwrite it."
            exit 1
          fi
          gh release create v135 \
            Tahalil-Alakkad-V135-Safe-Restore-Android-SIGNED.apk \
            Tahalil-Alakkad-V135-Safe-Restore-Android-SIGNED.apk.sha256 \
            --target "$V135_COMMIT_SHA" \
            --title "تحاليل العقاد V135 — Safe Restore" \
            --notes "V135 fixes backup restore permissions without opening Firestore rules. Existing documents are never overwritten; only missing records are recreated in safe dependency order. V134 safety backup, Firebase, Supabase shadow backup, offline mode, results, notifications and UI are preserved."

      - name: Final status
        shell: bash
        run: |
          echo "V135 Safe Restore built, signed, source-pinned and released."
