      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit Windows V140 screenshot enabled
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_v140_windows/windows-system'

          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '140.0.0') { throw "Expected Windows V140 package" }
          if ($pkg.build.portable.artifactName -notmatch 'V140') { throw 'Portable V140 name missing' }
          if ($pkg.build.nsis.artifactName -notmatch 'V140') { throw 'Setup V140 name missing' }

          $tests = Get-Content (Join-Path $root 'public/lab_tests_android.json') -Raw | ConvertFrom-Json
          if ($tests.Count -ne 331) { throw "Expected 331 tests, got $($tests.Count)" }
          if (($tests | Where-Object { $null -ne $_.customer_price }).Count -ne 0) { throw 'Embedded customer prices detected' }

          $fail = Get-Content (Join-Path $root 'src/failover.js') -Raw
          foreach ($x in @('tahalil-failover-read','customer','order','customer_price','lab2lab_price','lab_order','getIdToken(false)','getIdToken(true)','shadow_read_only')) {
            if (!$fail.Contains($x)) { throw "Missing V138/V140 data failover marker: $x" }
          }

          $resultFail = Get-Content (Join-Path $root 'src/resultFailover.js') -Raw
          foreach ($x in @('tahalil-result-failover','getIdToken(false)','getIdToken(true)','MAX_FILE_BYTES','result_hash_mismatch','shadow-v140')) {
            if (!$resultFail.Contains($x)) { throw "Missing V140 result failover marker: $x" }
          }

          $reconcile = Get-Content (Join-Path $root 'src/shadowReconcile.js') -Raw
          foreach ($x in @('tahalil-shadow-reconcile','SUCCESS_INTERVAL_MS=24*60*60*1000','super_admin','device_not_approved','runIfDue')) {
            if (!$reconcile.Contains($x)) { throw "Missing V140 reconcile marker: $x" }
          }

          $resultStore = Get-Content (Join-Path $root 'src/resultStore.js') -Raw
          foreach ($x in @('ResultFailoverClient','mirrorPath(chunkRef.path','readPrimaryResultFile','failoverEligible','sha256_hex','فشل التحقق من سلامة ملف النتيجة')) {
            if (!$resultStore.Contains($x)) { throw "Missing V140 result-store marker: $x" }
          }

          $main = Get-Content (Join-Path $root 'electron/main.cjs') -Raw
          if (!$main.Contains('setContentProtection(false)')) { throw 'Screenshot allowance marker missing' }
          if ($main.Contains('setContentProtection(true)')) { throw 'Screenshot blocking is still enabled' }
          foreach ($x in @(
            "FAILOVER_ENDPOINT = 'https://ogidyelgmigcvasizzuv.supabase.co/functions/v1/tahalil-failover-read'",
            "RESULT_FAILOVER_ENDPOINT = 'https://ogidyelgmigcvasizzuv.supabase.co/functions/v1/tahalil-result-failover'",
            "RECONCILE_ENDPOINT = 'https://ogidyelgmigcvasizzuv.supabase.co/functions/v1/tahalil-shadow-reconcile'",
            "ipcMain.handle('failover:read'",
            "ipcMain.handle('result-failover:read'",
            "ipcMain.handle('shadow:reconcile'",
            "'X-Tahalil-Device':getDeviceId()",
            'Authorization:`Bearer ${token}`',
            'MAX_RESULT_BYTES = 6 * 1024 * 1024',
            'OFFLINE_GRACE_MS = 72 * 60 * 60 * 1000',
            'new Tray',
            'requestSingleInstanceLock',
            "target.setHours(4,0,0,0)",
            "scheduled-04:00",
            "retry-after-failure",
            "safeStorage.encryptString",
            "setLoginItemSettings",
            'sandbox: true',
            'contextIsolation: true',
            'nodeIntegration: false',
            'webSecurity: true'
          )) {
            if (!$main.Contains($x)) { throw "Missing V140 Windows safety marker: $x" }
          }

          $preload = Get-Content (Join-Path $root 'electron/preload.cjs') -Raw
          foreach ($x in @(
            "failoverRead: (payload) => ipcRenderer.invoke('failover:read', payload)",
            "resultFailoverRead: (payload) => ipcRenderer.invoke('result-failover:read', payload)",
            "shadowReconcile: (payload) => ipcRenderer.invoke('shadow:reconcile', payload)"
          )) { if (!$preload.Contains($x)) { throw "Missing V140 preload marker: $x" } }

          $data = Get-Content (Join-Path $root 'src/data.js') -Raw
          foreach ($x in @('getDocsFromServer','getDocsFromCache','getDocFromServer','getDocFromCache',"failoverDocuments('customer','customers/'","failoverDocuments('order','customers/'",'requestResultRevision','resetUserLoginCredentials')) {
            if (!$data.Contains($x)) { throw "Missing preserved data marker: $x" }
          }

          $backup = Get-Content (Join-Path $root 'src/backup.js') -Raw
          foreach ($x in @('const SCHEMA=3','app_version_code:140',"app_version_name:'System V140 Windows'","security_archive_restore_mode:'manual_only'",'getDocFromServer','Existing Firestore documents are NEVER overwritten','if(!snap.exists())missing.push(write)')) {
            if (!$backup.Contains($x)) { throw "Missing backup/restore marker: $x" }
          }

          $app = Get-Content (Join-Path $root 'src/app.js') -Raw
          foreach ($x in @('Unified System V140','Windows V140','V140 Final Resilience + V137 Auto Backup','ShadowReconciliationClient.runIfDue','وضع الطوارئ','تم الاسترجاع ✓','لا توجد بيانات مفقودة للاسترجاع','جاري إنشاء النسخة الاحتياطية','تم حفظ النسخة الاحتياطية ✓')) {
            if (!$app.Contains($x)) { throw "Missing V140 UI/preserved marker: $x" }
          }

          $shadow = Get-Content (Join-Path $root 'src/shadowBackup.js') -Raw
          foreach ($x in @('tahalil-shadow-mirror','getIdToken(false)','getIdToken(true)','appVersionCode: 140','Shadow backup is deliberately non-blocking')) {
            if (!$shadow.Contains($x)) { throw "Shadow backup marker missing: $x" }
          }

          $all = $app + "`n" + $data + "`n" + $backup + "`n" + $fail + "`n" + $resultFail + "`n" + $reconcile + "`n" + $resultStore + "`n" + $main + "`n" + $shadow
          if ($all.ToLower().Contains('cloudflare') -or $all.ToLower().Contains('workers.dev')) { throw 'Cloudflare dependency detected' }
          if ($all.Contains('sendPasswordResetEmail')) { throw 'Email password-reset flow must remain disabled' }
          foreach ($secret in @('SUPABASE_SERVICE_ROLE_KEY','SUPABASE_SECRET_KEYS','sb_secret_','BEGIN PRIVATE KEY')) {
            if ($all.Contains($secret)) { throw "Forbidden secret marker: $secret" }
          }

          Get-ChildItem (Join-Path $root 'src') -Filter '*.js' -File | ForEach-Object {
            Get-Content $_.FullName -Raw | node --input-type=module --check
            if ($LASTEXITCODE -ne 0) { throw "JS syntax failed: $($_.Name)" }
          }
          node --check (Join-Path $root 'electron/main.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'main.cjs syntax failed' }
          node --check (Join-Path $root 'electron/preload.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'preload.cjs syntax failed' }

          Write-Host 'WINDOWS V140 SCREENSHOT ENABLED AUDIT PASSED'

      - name: Install dependencies
        working-directory: build_v140_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Build Portable
        working-directory: build_v140_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Portable startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v140_windows/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$exe) { throw 'Portable EXE not found' }
          $env:TAHALIL_SMOKE_TEST='1'
          $p=Start-Process $exe.FullName -PassThru
          if (!$p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; throw 'Portable smoke timed out' }
          if ($p.ExitCode -ne 0) { throw "Portable smoke exit code $($p.ExitCode)" }
          Remove-Item Env:TAHALIL_SMOKE_TEST -ErrorAction SilentlyContinue
          Write-Host 'PORTABLE STARTUP OK'

      - name: Portable System Tray smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v140_windows/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$exe) { throw 'Portable EXE not found for tray smoke' }
          $env:TAHALIL_TRAY_SMOKE_TEST='1'
          $p=Start-Process $exe.FullName -PassThru
          if (!$p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; throw 'Tray smoke timed out' }
          if ($p.ExitCode -ne 0) { throw "Tray smoke exit code $($p.ExitCode)" }
          Remove-Item Env:TAHALIL_TRAY_SMOKE_TEST -ErrorAction SilentlyContinue
          Write-Host 'SYSTEM TRAY OK'

      - name: Background startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v140_windows/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$exe) { throw 'Portable EXE missing for background smoke' }
          $p=Start-Process $exe.FullName -ArgumentList '--background' -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "Background startup exited unexpectedly with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host 'BACKGROUND STARTUP OK'

      - name: Build Setup
        working-directory: build_v140_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }

      - name: Prepare Windows V140 delivery files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v140_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup = Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable -or !$setup) { throw 'Portable or Setup EXE missing' }

          Copy-Item $portable.FullName 'Tahalil-Alakkad-V140-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V140-Windows-Setup.exe' -Force

          Compress-Archive -Path 'build_v140_windows/windows-system/*' -DestinationPath 'Tahalil-Alakkad-V140-Windows-Source.zip' -Force

          foreach ($name in @('Tahalil-Alakkad-V140-Windows-Portable.exe','Tahalil-Alakkad-V140-Windows-Setup.exe','Tahalil-Alakkad-V140-Windows-Source.zip')) {
            if ((Get-Item $name).Length -lt 100000) { throw "$name unexpectedly small" }
            $hash=(Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Publish Windows V140 screenshot-enabled release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag='v140-windows'

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "$env:GITHUB_REPOSITORY" `
              --title "تحاليل العقاد Windows V140 — Screenshot Enabled" `
              --notes "Windows V140 delivery release with normal screenshots/screen capture enabled. Firebase/Firestore remains authoritative. Preserves V138 authenticated emergency database reads and V137 encrypted 04:00 backup, adds approved-device result-file fallback and manager-only full shadow reconciliation, mirrors result chunks, preserves safe missing-only restore, offline grace, notifications and tray behavior. No Supabase secret and no Cloudflare."
            if ($LASTEXITCODE -ne 0) { throw 'Could not create Windows V140 release' }
          }

          gh release upload $tag `
            'Tahalil-Alakkad-V140-Windows-Portable.exe' `
            'Tahalil-Alakkad-V140-Windows-Portable.exe.sha256' `
            'Tahalil-Alakkad-V140-Windows-Setup.exe' `
            'Tahalil-Alakkad-V140-Windows-Setup.exe.sha256' `
            'Tahalil-Alakkad-V140-Windows-Source.zip' `
            'Tahalil-Alakkad-V140-Windows-Source.zip.sha256' `
            --repo "$env:GITHUB_REPOSITORY" --clobber

          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Windows V140 files' }
          gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --latest

      - name: Final status
        shell: pwsh
        run: |
          Write-Host 'WINDOWS V140 SCREENSHOT ENABLED BUILT, SMOKE-TESTED AND RELEASED'
