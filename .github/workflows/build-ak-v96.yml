name: Build AK V97 Signed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        shell: bash
        run: |
          set -eu

          ZIP_FILE="$(find . -maxdepth 4 -type f -iname '*v96*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 4 -type f -iname '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          rm -rf build_app
          mkdir -p build_app
          unzip -q "$ZIP_FILE" -d build_app

          echo "Project extracted from: $ZIP_FILE"

      - name: Locate Android project
        shell: bash
        run: |
          set -eu

          SETTINGS="$(find build_app -type f \( \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' \
          \) -print -quit)"

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS")"
          else
            BUILD_FILE="$(find build_app -type f \( \
              -name 'build.gradle' -o \
              -name 'build.gradle.kts' \
            \) -print -quit)"

            if [ -z "$BUILD_FILE" ]; then
              echo "ERROR: Android project not found"
              find build_app -maxdepth 4 -type f || true
              exit 1
            fi

            PROJECT_DIR="$(dirname "$BUILD_FILE")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Upgrade V96 to V97
        shell: bash
        run: |
          set -eu

          python3 <<'PY'
          import pathlib
          import re
          import os

          root = pathlib.Path(os.environ["PROJECT_DIR"])

          files = list(root.rglob("build.gradle")) + list(root.rglob("build.gradle.kts"))

          changed = False

          for p in files:
              try:
                  s = p.read_text(encoding="utf-8")
              except:
                  continue

              old = s

              # versionName 96 -> 97
              s = re.sub(
                  r'(versionName\s*[= ]\s*["\'])([^"\']*?)(96)(["\'])',
                  lambda m: m.group(1) + m.group(2) + "97" + m.group(4),
                  s
              )

              # versionCode number -> +1
              def bump(m):
                  n = int(m.group(2))
                  return m.group(1) + str(n + 1)

              s = re.sub(
                  r'(versionCode\s*[= ]\s*)(\d+)',
                  bump,
                  s
              )

              if s != old:
                  p.write_text(s, encoding="utf-8")
                  print("Updated:", p)
                  changed = True

          if not changed:
              print("No V96 marker found; existing version kept.")
          PY

      - name: Restore original signing key
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -eu

          if [ -z "$SIGNING_BUNDLE_B64" ]; then
            echo "ERROR: TAHALIL_SIGNING_BUNDLE_B64 is empty"
            exit 1
          fi

          rm -rf /tmp/signing
          mkdir -p /tmp/signing/files

          printf '%s' "$SIGNING_BUNDLE_B64" | base64 --decode > /tmp/signing/bundle.bin

          if unzip -t /tmp/signing/bundle.bin >/dev/null 2>&1; then

            unzip -q /tmp/signing/bundle.bin -d /tmp/signing/files

            KEYSTORE="$(find /tmp/signing/files -type f \( \
              -iname '*.keystore' -o \
              -iname '*.jks' \
            \) -print -quit)"

            if [ -z "$KEYSTORE" ]; then
              echo "ERROR: Keystore not found inside signing bundle"
              find /tmp/signing/files -type f || true
              exit 1
            fi

            cp "$KEYSTORE" "$PROJECT_DIR/debug.keystore"

            PROPS="$(find /tmp/signing/files -type f -name 'gradle.properties' -print -quit || true)"

            if [ -n "$PROPS" ]; then
              cp "$PROPS" "$PROJECT_DIR/gradle.properties"
            fi

          else

            cp /tmp/signing/bundle.bin "$PROJECT_DIR/debug.keystore"

          fi

          test -s "$PROJECT_DIR/debug.keystore"

          echo "Original signing key restored"

      - name: Build signed V97 APK
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --no-daemon 2>&1 | tee /tmp/build.log
            RESULT=${PIPESTATUS[0]}
          else
            gradle clean assembleDebug --no-daemon 2>&1 | tee /tmp/build.log
            RESULT=${PIPESTATUS[0]}
          fi

          if [ "$RESULT" -ne 0 ]; then
            echo ""
            echo "========== REAL BUILD ERROR =========="
            grep -Ei \
              "FAILURE:|What went wrong|Execution failed|Caused by:|error:|Keystore|password|signing|Could not|Android SDK|SDK location" \
              /tmp/build.log | tail -80 || true
            echo "======================================"
            exit "$RESULT"
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -eu

          APK="$(find "$PROJECT_DIR" -type f -name '*.apk' \
            ! -name '*androidTest*' \
            ! -name '*unaligned*' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          cp "$APK" Tahalil-Alakkad-V97.apk

          echo "APK READY: Tahalil-Alakkad-V97.apk"

      - name: Upload V97 APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V97
          path: Tahalil-Alakkad-V97.apk
          if-no-files-found: error
          retention-days: 30
