name: Build AK V97 Signed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract prepared project
        shell: bash
        run: |
          set -eu

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*v96*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          rm -rf build_v96
          mkdir -p build_v96
          unzip -q "$ZIP_FILE" -d build_v96

          echo "Extracted: $ZIP_FILE"

      - name: Restore OLD signing keystore
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -eu

          if [ -z "$SIGNING_BUNDLE_B64" ]; then
            echo "ERROR: signing secret missing"
            exit 1
          fi

          rm -rf /tmp/signing
          mkdir -p /tmp/signing

          printf '%s' "$SIGNING_BUNDLE_B64" | base64 --decode > /tmp/signing/bundle.bin

          if unzip -t /tmp/signing/bundle.bin >/dev/null 2>&1; then
            mkdir -p /tmp/signing/unpacked
            unzip -q /tmp/signing/bundle.bin -d /tmp/signing/unpacked

            KEYSTORE="$(find /tmp/signing/unpacked -type f \( -iname '*.keystore' -o -iname '*.jks' \) -print -quit)"

            if [ -z "$KEYSTORE" ]; then
              echo "ERROR: no keystore inside signing bundle"
              exit 1
            fi

            cp "$KEYSTORE" build_v96/debug.keystore
          else
            cp /tmp/signing/bundle.bin build_v96/debug.keystore
          fi

          test -s build_v96/debug.keystore

          echo "Old signing keystore restored"

      - name: Set version V97
        shell: bash
        run: |
          set -eu

          python3 <<'PY'
          import pathlib, re

          root = pathlib.Path("build_v96")

          for p in list(root.rglob("build.gradle")) + list(root.rglob("build.gradle.kts")):
              try:
                  text = p.read_text(encoding="utf-8")
              except:
                  continue

              old = text

              text = re.sub(
                  r'versionName\s*[= ]\s*["\'][^"\']*["\']',
                  'versionName "97"',
                  text
              )

              def bump(m):
                  n = int(m.group(2))
                  return m.group(1) + str(max(n + 1, 97))

              text = re.sub(
                  r'(versionCode\s*[= ]\s*)(\d+)',
                  bump,
                  text
              )

              if text != old:
                  p.write_text(text, encoding="utf-8")
                  print("Updated:", p)
          PY

      - name: Build signed V97 APK
        shell: bash
        run: |
          set -eu
          cd build_v96

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -eu

          APK="$(find build_v96 -type f -name '*.apk' ! -name '*androidTest*' ! -name '*unaligned*' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          cp "$APK" Tahalil-Alakkad-V97.apk
          echo "READY: Tahalil-Alakkad-V97.apk"

      - name: Upload V97 APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V97
          path: Tahalil-Alakkad-V97.apk
          if-no-files-found: error
          retention-days: 30
