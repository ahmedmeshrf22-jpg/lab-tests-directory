name: Build AK V97 Signed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract prepared project
        shell: bash
        run: |
          set -eu

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*v96*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          rm -rf build_v96
          mkdir -p build_v96
          unzip -q "$ZIP_FILE" -d build_v96

          echo "Extracted: $ZIP_FILE"

      - name: Upgrade V96 to V97 safely
        shell: bash
        run: |
          set -eu

          python3 <<'PY'
          import pathlib
          import re

          root = pathlib.Path("build_v96")

          files = list(root.rglob("build.gradle")) + list(root.rglob("build.gradle.kts"))

          found_v96 = False

          for p in files:
              try:
                  text = p.read_text(encoding="utf-8")
              except Exception:
                  continue

              original = text
              changed_version = False

              # Kotlin DSL: versionName = "96"
              pattern_kts = r'(versionName\s*=\s*["\'])([^"\']*)(["\'])'

              def replace_kts(m):
                  global found_v96
                  value = m.group(2)

                  if "96" in value:
                      found_v96 = True
                      return m.group(1) + value.replace("96", "97") + m.group(3)

                  return m.group(0)

              new_text = re.sub(pattern_kts, replace_kts, text)

              if new_text != text:
                  changed_version = True
                  text = new_text

              # Groovy: versionName "96"
              pattern_groovy = r'(versionName\s+["\'])([^"\']*)(["\'])'

              def replace_groovy(m):
                  global found_v96
                  value = m.group(2)

                  if "96" in value:
                      found_v96 = True
                      return m.group(1) + value.replace("96", "97") + m.group(3)

                  return m.group(0)

              new_text = re.sub(pattern_groovy, replace_groovy, text)

              if new_text != text:
                  changed_version = True
                  text = new_text

              # نزود versionCode فقط لو نفس الملف كان V96
              if changed_version:

                  def bump_kts(m):
                      return m.group(1) + str(int(m.group(2)) + 1)

                  text = re.sub(
                      r'(versionCode\s*=\s*)(\d+)',
                      bump_kts,
                      text,
                      count=1
                  )

                  def bump_groovy(m):
                      return m.group(1) + str(int(m.group(2)) + 1)

                  text = re.sub(
                      r'(versionCode\s+)(\d+)',
                      bump_groovy,
                      text,
                      count=1
                  )

              if text != original:
                  p.write_text(text, encoding="utf-8")
                  print("UPDATED:", p)

          if found_v96:
              print("V96 FOUND -> CHANGED TO V97")
          else:
              print("NO V96 FOUND - VERSION LEFT UNCHANGED")
          PY

      - name: Restore original signing keystore
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -eu

          if [ -z "$SIGNING_BUNDLE_B64" ]; then
            echo "ERROR: TAHALIL_SIGNING_BUNDLE_B64 missing"
            exit 1
          fi

          rm -rf /tmp/tahalil_signing
          mkdir -p /tmp/tahalil_signing/unpacked

          printf '%s' "$SIGNING_BUNDLE_B64" | base64 --decode > /tmp/tahalil_signing/signing.bin

          if unzip -t /tmp/tahalil_signing/signing.bin >/dev/null 2>&1; then

            unzip -q /tmp/tahalil_signing/signing.bin \
              -d /tmp/tahalil_signing/unpacked

            KEYSTORE="$(find /tmp/tahalil_signing/unpacked -type f \( \
              -iname '*.keystore' -o \
              -iname '*.jks' \
              \) -print -quit)"

            if [ -z "$KEYSTORE" ]; then
              echo "ERROR: Keystore not found in signing bundle"
              exit 1
            fi

            cp "$KEYSTORE" build_v96/debug.keystore

          else

            cp /tmp/tahalil_signing/signing.bin \
              build_v96/debug.keystore

          fi

          if [ ! -s build_v96/debug.keystore ]; then
            echo "ERROR: Signing keystore restore failed"
            exit 1
          fi

          echo "OLD SIGNING KEY RESTORED"

      - name: Build signed V97 APK
        shell: bash
        run: |
          set -eu

          cd build_v96

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -eu

          APK="$(find build_v96 -type f \
            -name '*.apk' \
            ! -name '*androidTest*' \
            ! -name '*unaligned*' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          cp "$APK" Tahalil-Alakkad-V97.apk

          echo "APK READY"

      - name: Upload V97 APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V97
          path: Tahalil-Alakkad-V97.apk
          if-no-files-found: error
          retention-days: 30
