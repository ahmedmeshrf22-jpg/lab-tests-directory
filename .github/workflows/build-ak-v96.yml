name: Build AK V96 from ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract prepared V96
        shell: bash
        run: |
          set -eu

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*v96*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V96 ZIP not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf build_v96
          mkdir -p build_v96
          unzip -q "$ZIP_FILE" -d build_v96

          echo "V96 extracted successfully"

      - name: Locate Android project
        shell: bash
        run: |
          set -eu

          GRADLEW="$(find build_v96 -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Restore original signing keystore
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -eu

          if [ -z "$SIGNING_BUNDLE_B64" ]; then
            echo "ERROR: TAHALIL_SIGNING_BUNDLE_B64 is empty"
            exit 1
          fi

          printf '%s' "$SIGNING_BUNDLE_B64" | base64 --decode > "$PROJECT_DIR/debug.keystore"

          if [ ! -s "$PROJECT_DIR/debug.keystore" ]; then
            echo "ERROR: signing keystore is empty"
            exit 1
          fi

          echo "Original signing keystore restored"

      - name: Build installable V96 APK
        shell: bash
        run: |
          set -eu

          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Find and rename APK
        shell: bash
        run: |
          set -eu

          APK="$(find "$PROJECT_DIR" -type f -name '*.apk' \
            ! -name '*androidTest*' \
            ! -name '*unaligned*' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" Tahalil-Alakkad-V96.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V96
          path: Tahalil-Alakkad-V96.apk
          if-no-files-found: error
          retention-days: 30
