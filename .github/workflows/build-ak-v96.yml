name: Build AK V96 from ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract prepared V96
        run: |
          rm -rf build_v96
          mkdir build_v96
          unzip -q Project3_AK_V96_EDITABLE_CATALOG.zip -d build_v96

      - name: Create debug keystore expected by project
        run: |
          keytool -genkeypair -v \
            -keystore build_v96/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build installable V96 APK
        working-directory: build_v96
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp build_v96/app/build/outputs/apk/debug/app-debug.apk AK_Lab_Tests_V96.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AK-Lab-Tests-V96-APK
          path: AK_Lab_Tests_V96.apk
          retention-days: 30
