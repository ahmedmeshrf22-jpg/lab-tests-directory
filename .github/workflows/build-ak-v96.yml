      - name: Fix Kotlin 2 Compose plugin
        shell: bash
        run: |
          set -eu

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("build_v96")

          # خلي Kotlin + Compose plugin على نفس إصدار 2.x
          for p in root.rglob("libs.versions.toml"):
              s = p.read_text(errors="ignore")
              old = s

              # لو فيه kotlin version موجود، نخليه 2.0.21
              s = re.sub(
                  r'(?m)^(\s*kotlin\s*=\s*)["\'][^"\']+["\']',
                  r'\1"2.0.21"',
                  s
              )

              if s != old:
                  p.write_text(s)
                  print("FIXED:", p)

          for p in list(root.rglob("*.gradle.kts")) + list(root.rglob("*.gradle")):
              s = p.read_text(errors="ignore")
              old = s

              # Kotlin Android plugin
              s = re.sub(
                  r'(id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+")[^"]+(")',
                  r'\g<1>2.0.21\2',
                  s
              )

              # Kotlin Compose plugin
              s = re.sub(
                  r'(id\("org\.jetbrains\.kotlin\.plugin\.compose"\)\s+version\s+")[^"]+(")',
                  r'\g<1>2.0.21\2',
                  s
              )

              # لو النسخ بتيجي من plugin aliases، سيبها زي ما هي
              # واحذف النظام القديم بتاع Compose Compiler
              s = re.sub(
                  r'(?ms)\s*composeOptions\s*\{.*?kotlinCompilerExtensionVersion.*?\}',
                  '',
                  s
              )

              s = re.sub(
                  r'(?m)^\s*kotlinCompilerExtensionVersion\s*=.*$',
                  '',
                  s
              )

              if s != old:
                  p.write_text(s)
                  print("FIXED:", p)
          PY
