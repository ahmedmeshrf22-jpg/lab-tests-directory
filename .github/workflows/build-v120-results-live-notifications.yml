name: Build Tahalil Alakkad V120 Results Live Notifications

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android V120 Signed
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract V119 base
        shell: bash
        run: |
          set -euo pipefail
          test -f Project3_AK_V119_CURRENT_FIXES.zip
          rm -rf build_v120
          mkdir build_v120
          unzip -q Project3_AK_V119_CURRENT_FIXES.zip -d build_v120
          test -f build_v120/app/build.gradle.kts

      - name: Apply V120 results and notifications patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/v120.patch
          patch -d build_v120 -p1 < /tmp/v120.patch

      - name: Restore original Android signing
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_BUNDLE_B64:-}"
          rm -rf /tmp/tahalil_sign
          mkdir -p /tmp/tahalil_sign/files
          printf '%s' "$SIGNING_BUNDLE_B64" | tr -d '\r\n ' | base64 --decode > /tmp/tahalil_sign/bundle.bin
          if unzip -t /tmp/tahalil_sign/bundle.bin >/dev/null 2>&1; then
            unzip -q /tmp/tahalil_sign/bundle.bin -d /tmp/tahalil_sign/files
          else
            cp /tmp/tahalil_sign/bundle.bin /tmp/tahalil_sign/files/original.keystore
          fi
          KEYSTORE="$(find /tmp/tahalil_sign/files -type f \( -iname '*.jks' -o -iname '*.keystore' \) -print -quit)"
          test -n "$KEYSTORE"
          STORE_PASSWORD=""; KEY_ALIAS=""; KEY_PASSWORD=""
          while IFS= read -r META; do
            [ -f "$META" ] || continue
            [ -n "$STORE_PASSWORD" ] || STORE_PASSWORD="$(sed -nE 's/^[[:space:]]*(STORE_PASSWORD|KEYSTORE_PASSWORD|storePassword|store_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(sed -nE 's/^[[:space:]]*(KEY_ALIAS|keyAlias|key_alias)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$(sed -nE 's/^[[:space:]]*(KEY_PASSWORD|keyPassword|key_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
          done < <(find /tmp/tahalil_sign/files -type f \( -iname '*.properties' -o -iname '*.env' -o -iname '*.txt' \) -print)
          if [ -z "$STORE_PASSWORD" ] && keytool -list -keystore "$KEYSTORE" -storepass android >/dev/null 2>&1; then STORE_PASSWORD=android; fi
          test -n "$STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
          test -n "$KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$STORE_PASSWORD"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          cp "$KEYSTORE" build_v120/original-signing-key.jks
          echo "::add-mask::$STORE_PASSWORD"; echo "::add-mask::$KEY_ALIAS"; echo "::add-mask::$KEY_PASSWORD"
          {
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/build_v120/original-signing-key.jks"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Verify V120 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          r=Path('build_v120')
          grad=(r/'app/build.gradle.kts').read_text()
          vm=(r/'app/src/main/java/com/example/ui/LabTestsViewModel.kt').read_text()
          ui=(r/'app/src/main/java/com/example/ui/CustomerSystemDialog.kt').read_text()
          main=(r/'app/src/main/java/com/example/MainActivity.kt').read_text()
          manifest=(r/'app/src/main/AndroidManifest.xml').read_text()
          service=(r/'app/src/main/java/com/example/notifications/OrderRealtimeNotificationService.kt').read_text()
          checks={
            'version 120':'versionCode = 120' in grad and '5.40-results-notify-v120' in grad,
            'customer orders realtime':'customerOrdersListener' in vm and 'query.addSnapshotListener' in vm,
            'open details live sync':'val liveOrders by viewModel.customerOrders.collectAsState()' in ui,
            'result ready event':'sendExternalOrderPush("ready"' in vm,
            'background notification service':'class OrderRealtimeNotificationService' in service,
            'service started after login':'OrderRealtimeNotificationService.start' in main,
            'foreground service manifest':'FOREGROUND_SERVICE_DATA_SYNC' in manifest and 'foregroundServiceType="dataSync"' in manifest,
          }
          for k,v in checks.items(): print(('OK   ' if v else 'FAIL ')+k)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('V120 checks failed: '+', '.join(bad))
          print('ALL V120 RESULTS/NOTIFICATION CHECKS PASSED')
          PY

      - name: Build signed Android V120
        working-directory: build_v120
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify signature and prepare release
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build_v120/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"; test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" Tahalil-Alakkad-V120-Android-SIGNED.apk
          sha256sum Tahalil-Alakkad-V120-Android-SIGNED.apk > Tahalil-Alakkad-V120-Android-SIGNED.apk.sha256

      - name: Publish Android V120
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v120
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "تحاليل العقاد V120 Results Live + Notifications" --notes "V120: live result status in clinic order details plus Android background system notifications for order/result updates. Keeps V119 Firebase privacy migration and signing lineage."
          fi
          gh release upload "$TAG" Tahalil-Alakkad-V120-Android-SIGNED.apk Tahalil-Alakkad-V120-Android-SIGNED.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
