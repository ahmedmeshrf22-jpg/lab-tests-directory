name: Windows V145 R8.25 Worklist Right Click Menu

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-windows-v145-r825-worklist-right-click-menu
  cancel-in-progress: false

jobs:
  build:
    name: Windows V145 R8.25 — Worklist Right Click Menu
    runs-on: windows-latest
    timeout-minutes: 110

    env:
      BASE_TAG: v145-r8.24-windows
      BASE_SOURCE: Tahalil-Alakkad-V145-R8.24-Windows-Source.zip
      BASE_SHA256: 3f22125f8717bd690fe89e8cebef05e129c4827f1644417cf172d06101ec6b5e
      R825_WORKLIST_B64: 
      R825_STYLE_B64: 
      R825_NOTES_B64: 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore exact R8.24 source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD $env:BASE_SOURCE
          if (Test-Path $zip) { Remove-Item $zip -Force }
          gh release download $env:BASE_TAG --repo "$env:GITHUB_REPOSITORY" --pattern $env:BASE_SOURCE --dir $PWD
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $zip)) { throw 'Could not download exact R8.24 source' }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:BASE_SHA256) { throw "R8.24 source hash mismatch: $hash" }

          $root = Join-Path $PWD 'build_windows/windows-system'
          if (Test-Path (Join-Path $PWD 'build_windows')) { Remove-Item (Join-Path $PWD 'build_windows') -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path $zip -DestinationPath $root -Force

          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '145.8.24') { throw "Expected 145.8.24, got $($pkg.version)" }

          foreach ($item in @(
            'src/data.js',
            'src/firebase.js',
            'src/resultStore.js',
            'electron/main.cjs',
            'electron/preload.cjs'
          )) {
            $name = 'R825_' + ($item -replace '[^A-Za-z0-9]','_').ToUpper() + '_SHA256'
            $value = (Get-FileHash (Join-Path $root $item) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$name=$value" | Add-Content $env:GITHUB_ENV
          }

      - name: Patch worklist to right click menu
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $appPath = Join-Path $root 'src/app.js'
          $cssPath = Join-Path $root 'src/styles.css'
          $pkgPath = Join-Path $root 'package.json'

          $app = Get-Content $appPath -Raw
          if ($app.Contains('TAH_R825_CONTEXT_MENU')) { throw 'R8.25 marker already exists' }
          $startMarker = 'async function worklistPage(c){'
          $endMarker = 'async function labWorklistPage(c){'
          $start = $app.IndexOf($startMarker)
          $end = $app.IndexOf($endMarker, $start)
          if ($start -lt 0 -or $end -le $start) { throw 'Could not locate worklistPage block' }

          $newBlock = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:R825_WORKLIST_B64))
          $app = $app.Substring(0,$start) + $newBlock + "`r`n" + $app.Substring($end)
          Set-Content $appPath -Value $app -Encoding utf8

          $css = Get-Content $cssPath -Raw
          $styleBlock = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:R825_STYLE_B64))
          if (!$css.Contains('TAH_R825_CONTEXT_MENU_STYLE')) {
            Add-Content -Path $cssPath -Value "`r`n$styleBlock" -Encoding utf8
          }

          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = '145.8.25'
          $pkg.description = 'Tahalil Alakkad Windows V145 R8.25 - clean worklist with right click actions menu'
          $pkg | ConvertTo-Json -Depth 20 | Set-Content $pkgPath -Encoding utf8

          $notes = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:R825_NOTES_B64))
          $notes | Set-Content (Join-Path $root 'V145_R825_WORKLIST_RIGHT_CLICK_NOTES.txt') -Encoding utf8

      - name: Audit right click menu patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $app = Get-Content (Join-Path $root 'src/app.js') -Raw
          $css = Get-Content (Join-Path $root 'src/styles.css') -Raw
          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json

          if ($pkg.version -ne '145.8.25') { throw "Expected 145.8.25, got $($pkg.version)" }
          foreach ($marker in @('TAH_R825_CONTEXT_MENU','workContextMenu','work-context-item','كليك يمين','runMenuAction')) {
            if (!$app.Contains($marker)) { throw "Missing marker: $marker" }
          }
          if (!$css.Contains('TAH_R825_CONTEXT_MENU_STYLE')) { throw 'Missing R8.25 context menu styles' }

          foreach ($forbidden in @(
            '<button class="btn contentedit"',
            '<button class="btn editorder"',
            '<button class="btn pay"',
            '<button class="btn ph"',
            '<button class="btn printc"',
            '<button class="btn printl"',
            '<button class="btn imagec"',
            '<button class="btn imagel"',
            '<button class="btn bad void"'
          )) {
            if ($app.Contains($forbidden)) { throw "Old inline action cluster still present: $forbidden" }
          }

          $checks = @{
            'src/data.js'='R825_SRC_DATA_JS_SHA256';
            'src/firebase.js'='R825_SRC_FIREBASE_JS_SHA256';
            'src/resultStore.js'='R825_SRC_RESULTSTORE_JS_SHA256';
            'electron/main.cjs'='R825_ELECTRON_MAIN_CJS_SHA256';
            'electron/preload.cjs'='R825_ELECTRON_PRELOAD_CJS_SHA256'
          }
          foreach ($pair in $checks.GetEnumerator()) {
            $actual = (Get-FileHash (Join-Path $root $pair.Key) -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = [Environment]::GetEnvironmentVariable($pair.Value)
            if ($actual -ne $expected) { throw "$($pair.Key) changed - protected scope violated" }
          }

          node --check (Join-Path $root 'src/app.js')
          if ($LASTEXITCODE -ne 0) { throw 'app.js syntax failed' }

          $audit = @(
            'R8.25 WORKLIST RIGHT-CLICK MENU AUDIT: PASS',
            'Removed cluttered inline buttons from clinic worklist rows',
            'Added clean right-click context menu for each order',
            'Menu closes on action / outside click / Escape',
            'Data, Firebase, results, electron shell, and lab screen remain untouched'
          )
          $audit | Set-Content 'R825_WORKLIST_RIGHT_CLICK_AUDIT.txt' -Encoding utf8

      - name: Package R8.25 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $stage = Join-Path $env:RUNNER_TEMP 'source_stage_r825'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Get-ChildItem -LiteralPath $root -Force |
            Where-Object { @('node_modules','release','.git') -notcontains $_.Name } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $stage -Recurse -Force }

          $zip = Join-Path $PWD 'Tahalil-Alakkad-V145-R8.25-Windows-Source.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage,$zip,[System.IO.Compression.CompressionLevel]::Optimal,$false)

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Tahalil-Alakkad-V145-R8.25-Windows-Source.zip" | Set-Content 'Tahalil-Alakkad-V145-R8.25-Windows-Source.zip.sha256' -Encoding ascii
          Copy-Item (Join-Path $root 'V145_R825_WORKLIST_RIGHT_CLICK_NOTES.txt') 'V145_R825_WORKLIST_RIGHT_CLICK_NOTES.txt' -Force

      - name: Install dependencies
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Build Portable
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Portable smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable) { throw 'Portable EXE missing' }
          $proc = Start-Process -FilePath $portable.FullName -PassThru
          Start-Sleep -Seconds 12
          if ($proc.HasExited) { throw "Portable exited unexpectedly: $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Build Setup
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }

      - name: Prepare delivery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup = Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable -or !$setup) { throw 'Portable or Setup missing' }

          Copy-Item $portable.FullName 'Tahalil-Alakkad-V145-R8.25-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V145-R8.25-Windows-Setup.exe' -Force

          foreach ($name in @(
            'Tahalil-Alakkad-V145-R8.25-Windows-Portable.exe',
            'Tahalil-Alakkad-V145-R8.25-Windows-Setup.exe'
          )) {
            $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V145-R8.25-Windows-Right-Click-Menu
          path: |
            Tahalil-Alakkad-V145-R8.25-Windows-Portable.exe
            Tahalil-Alakkad-V145-R8.25-Windows-Portable.exe.sha256
            Tahalil-Alakkad-V145-R8.25-Windows-Setup.exe
            Tahalil-Alakkad-V145-R8.25-Windows-Setup.exe.sha256
            Tahalil-Alakkad-V145-R8.25-Windows-Source.zip
            Tahalil-Alakkad-V145-R8.25-Windows-Source.zip.sha256
            V145_R825_WORKLIST_RIGHT_CLICK_NOTES.txt
            R825_WORKLIST_RIGHT_CLICK_AUDIT.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish R8.25 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v145-r8.25-windows'
          $title = 'تحاليل العقاد Windows V145 R8.25 — Worklist Right Click Menu'
          $notes = Get-Content 'V145_R825_WORKLIST_RIGHT_CLICK_NOTES.txt' -Raw

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes
          } else {
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create R8.25 release' }

          gh release upload $tag `
            Tahalil-Alakkad-V145-R8.25-Windows-Portable.exe `
            Tahalil-Alakkad-V145-R8.25-Windows-Portable.exe.sha256 `
            Tahalil-Alakkad-V145-R8.25-Windows-Setup.exe `
            Tahalil-Alakkad-V145-R8.25-Windows-Setup.exe.sha256 `
            Tahalil-Alakkad-V145-R8.25-Windows-Source.zip `
            Tahalil-Alakkad-V145-R8.25-Windows-Source.zip.sha256 `
            V145_R825_WORKLIST_RIGHT_CLICK_NOTES.txt `
            R825_WORKLIST_RIGHT_CLICK_AUDIT.txt `
            --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload R8.25 release assets' }
