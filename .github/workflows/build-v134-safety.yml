name: Build Tahalil Alakkad V134 Safety

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-v134-safety
  cancel-in-progress: false

jobs:
  build-v134-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout verified V133 LTS base
        uses: actions/checkout@v4
        with:
          ref: v133-lts-base
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

