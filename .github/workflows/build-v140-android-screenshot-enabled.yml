name: Build Tahalil Alakkad V140 Android Screenshot Enabled

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-v140-android-screenshot-enabled
  cancel-in-progress: false

jobs:
  build-v140:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout V139 final Android base
        uses: actions/checkout@v4
        with:
          ref: v139-final-resilience-base
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Enable screenshots and bump to V140
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          main_path = Path("app/src/main/java/com/example/MainActivity.kt")
          grad_path = Path("app/build.gradle.kts")

          main = main_path.read_text(encoding="utf-8")
          grad = grad_path.read_text(encoding="utf-8")

          # V139 must be the source base.
          assert re.search(r'\bversionCode\s*=\s*139\b', grad), "Expected V139 versionCode"
          assert 'versionName = "5.59-final-resilience-v139"' in grad, "Expected V139 versionName"

          # Remove Android FLAG_SECURE screenshot/screen-recording protection only.
          secure_call = re.compile(
              r'\n[ \t]*// Sensitive pricing and account data must never appear in screenshots,\n'
              r'[ \t]*// screen recordings, casting, or the recent-apps thumbnail\.\n'
              r'[ \t]*window\.setFlags\(\s*'
              r'WindowManager\.LayoutParams\.FLAG_SECURE,\s*'
              r'WindowManager\.LayoutParams\.FLAG_SECURE\s*'
              r'\)\s*\n',
              re.MULTILINE
          )

          new_main, count = secure_call.subn(
              '\n        // V140: screenshots and screen recording are intentionally allowed.\n',
              main,
              count=1
          )

          if count == 0:
              # Fallback for the same protection if comments changed.
              fallback = re.compile(
                  r'\n[ \t]*window\.setFlags\(\s*'
                  r'WindowManager\.LayoutParams\.FLAG_SECURE,\s*'
                  r'WindowManager\.LayoutParams\.FLAG_SECURE\s*'
                  r'\)\s*\n',
                  re.MULTILINE
              )
              new_main, count = fallback.subn(
                  '\n        // V140: screenshots and screen recording are intentionally allowed.\n',
                  main,
                  count=1
              )

          assert count == 1, f"Expected exactly one FLAG_SECURE protection block, removed {count}"
          assert "FLAG_SECURE" not in new_main, "FLAG_SECURE still present in MainActivity"

          # Keep overlay/tapjacking defense unchanged.
          assert "setHideOverlayWindows(true)" in new_main, "Overlay protection unexpectedly missing"

          grad = re.sub(r'\bversionCode\s*=\s*139\b', 'versionCode = 140', grad, count=1)
          grad = grad.replace(
              'versionName = "5.59-final-resilience-v139"',
              'versionName = "5.60-screenshot-enabled-v140"',
              1
          )

          main_path.write_text(new_main, encoding="utf-8")
          grad_path.write_text(grad, encoding="utf-8")

          Path("V140_ANDROID_SCREENSHOT_ENABLED_NOTES.txt").write_text(
              "V140 Android Screenshot Enabled\n"
              "- Screenshot and screen recording are now allowed.\n"
              "- Android FLAG_SECURE was removed from MainActivity only.\n"
              "- Overlay/tapjacking protection remains enabled.\n"
              "- V139 Firebase, failover, reconciliation, backup, restore, notifications, offline vault, results and signing identity remain unchanged.\n",
              encoding="utf-8"
          )

          print("V140 screenshot patch applied")
          PY

      - name: Audit V140 invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          src = Path("app/src/main/java")
          grad = Path("app/build.gradle.kts").read_text(encoding="utf-8")
          main = (src/"com/example/MainActivity.kt").read_text(encoding="utf-8")
          vm = (src/"com/example/ui/LabTestsViewModel.kt").read_text(encoding="utf-8")
          fail = (src/"com/example/resilience/EmergencyFailoverClient.kt").read_text(encoding="utf-8")
          result = (src/"com/example/resilience/ResultFailoverClient.kt").read_text(encoding="utf-8")
          reconcile = (src/"com/example/resilience/ShadowReconciliationClient.kt").read_text(encoding="utf-8")
          store = (src/"com/example/backend/FirestoreResultFileStore.kt").read_text(encoding="utf-8")
          scheduler = (src/"com/example/notifications/AutoBackupScheduler.kt").read_text(encoding="utf-8")
          backup = (src/"com/example/util/CommercialBackupManager.kt").read_text(encoding="utf-8")
          allkt = "\n".join(p.read_text(errors="ignore") for p in src.rglob("*.kt"))

          tracked = subprocess.check_output(["git","diff","--name-only"], text=True).splitlines()
          untracked = subprocess.check_output(["git","ls-files","--others","--exclude-standard"], text=True).splitlines()
          changed = {x.strip() for x in tracked + untracked if x.strip()}

          allowed = {
              "app/build.gradle.kts",
              "app/src/main/java/com/example/MainActivity.kt",
              "V140_ANDROID_SCREENSHOT_ENABLED_NOTES.txt",
          }

          checks = {
              "V140 version": 'versionCode = 140' in grad and '5.60-screenshot-enabled-v140' in grad,
              "same package": 'applicationId = "com.aistudio.labtestsdirectory.egypt"' in grad,
              "only screenshot scope changed": changed == allowed,
              "screenshots enabled": "FLAG_SECURE" not in main,
              "overlay defense preserved": "setHideOverlayWindows(true)" in main,
              "Firebase authoritative": "FirebaseFirestore" in allkt and "FirebaseAuth" in allkt,
              "DB failover preserved": "tahalil-failover-read" in fail and 'entityType = "customer"' in vm and 'entityType = "order"' in vm,
              "result failover preserved": "tahalil-result-failover" in result and "X-Tahalil-Device" in result,
              "result integrity preserved": "X-Tahalil-SHA256" in result and "MAX_FILE_BYTES = 6 * 1024 * 1024" in result,
              "Firebase result first": "PrimaryV139" in store and "ResultFailoverClient.open" in store,
              "full reconciliation preserved": "tahalil-shadow-reconcile" in reconcile and "ShadowReconciliationClient.runIfDue" in main,
              "4am backup preserved": "FOUR_AM_HOUR = 4" in scheduler and "Tahalil Alakkad/Backups" in allkt,
              "restore safety preserved": "if (!snapshot.exists()) missing += write" in backup,
              "offline vault preserved": "OfflineAccessVault" in allkt,
              "pending writes preserved": "waitForPendingWrites()" in vm and "PendingSyncStore" in vm,
              "notifications preserved": "class OrderRealtimeNotificationService" in allkt,
              "no Supabase secret": all(x not in allkt for x in ["SUPABASE_SERVICE_ROLE_KEY","SUPABASE_SECRET_KEYS","sb_secret_","BEGIN PRIVATE KEY"]),
              "no Firebase rules edits": not any("firestore.rules" in x.lower() for x in changed),
              "no Cloudflare": "cloudflare" not in allkt.lower() and "workers.dev" not in allkt.lower(),
          }

          for k, v in checks.items():
              print(("OK   " if v else "FAIL ") + k)

          bad = [k for k, v in checks.items() if not v]
          if bad:
              raise SystemExit("V140 AUDIT FAILED: " + ", ".join(bad))

          print("ALL V140 ANDROID CHECKS PASSED")
          PY

      - name: Compile-check V140
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:compileReleaseKotlin

      - name: Publish immutable V140 Android source branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="v140-screenshot-enabled-base"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/example/MainActivity.kt \
            V140_ANDROID_SCREENSHOT_ENABLED_NOTES.txt
          git commit -m "V140 Android enable screenshots"

          COMMIT_SHA="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch -q origin "$BRANCH"
            LOCAL_TREE="$(git rev-parse HEAD^{tree})"
            REMOTE_TREE="$(git rev-parse FETCH_HEAD^{tree})"
            if [ "$LOCAL_TREE" != "$REMOTE_TREE" ]; then
              echo "::error::Existing $BRANCH differs; refusing to overwrite it."
              exit 1
            fi
            COMMIT_SHA="$(git rev-parse FETCH_HEAD)"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "V140_COMMIT_SHA=$COMMIT_SHA" >> "$GITHUB_ENV"

      - name: Restore original Android signing identity
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_BUNDLE_B64:-}"
          SIGN_DIR="$RUNNER_TEMP/tahalil_v140_signing"
          rm -rf "$SIGN_DIR" && mkdir -p "$SIGN_DIR/files"
          printf '%s' "$SIGNING_BUNDLE_B64" | tr -d '\r\n ' | base64 --decode > "$SIGN_DIR/bundle.bin"

          if unzip -t "$SIGN_DIR/bundle.bin" >/dev/null 2>&1; then
            unzip -q "$SIGN_DIR/bundle.bin" -d "$SIGN_DIR/files"
          else
            cp "$SIGN_DIR/bundle.bin" "$SIGN_DIR/files/original.keystore"
          fi

          KEYSTORE="$(find "$SIGN_DIR/files" -type f \( -iname '*.jks' -o -iname '*.keystore' \) -print -quit)"
          test -n "$KEYSTORE"

          STORE_PASSWORD=""
          KEY_ALIAS=""
          KEY_PASSWORD=""

          while IFS= read -r META; do
            [ -f "$META" ] || continue
            [ -n "$STORE_PASSWORD" ] || STORE_PASSWORD="$(sed -nE 's/^[[:space:]]*(STORE_PASSWORD|KEYSTORE_PASSWORD|storePassword|store_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(sed -nE 's/^[[:space:]]*(KEY_ALIAS|keyAlias|key_alias)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$(sed -nE 's/^[[:space:]]*(KEY_PASSWORD|keyPassword|key_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
          done < <(find "$SIGN_DIR/files" -type f \( -iname '*.properties' -o -iname '*.env' -o -iname '*.txt' \) -print)

          if [ -z "$STORE_PASSWORD" ] && keytool -list -keystore "$KEYSTORE" -storepass android >/dev/null 2>&1; then
            STORE_PASSWORD=android
          fi

          test -n "$STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
          test -n "$KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$STORE_PASSWORD"

          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"

          {
            echo "KEYSTORE_PATH=$KEYSTORE"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Android V140
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify APK signature and same signer as V139
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          mkdir -p "$RUNNER_TEMP/v139apk"
          gh release download v139 \
            --pattern 'Tahalil-Alakkad-V139-Final-Resilience-Android-SIGNED.apk' \
            --dir "$RUNNER_TEMP/v139apk"

          OLD_APK="$RUNNER_TEMP/v139apk/Tahalil-Alakkad-V139-Final-Resilience-Android-SIGNED.apk"
          test -s "$OLD_APK"

          NEW_CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          OLD_CERT="$("$APKSIGNER" verify --print-certs "$OLD_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test -n "$NEW_CERT" && test -n "$OLD_CERT"
          test "$NEW_CERT" = "$OLD_CERT" || { echo "::error::Signing certificate differs from V139"; exit 1; }

          cp "$APK" Tahalil-Alakkad-V140-Screenshot-Enabled-Android-SIGNED.apk
          sha256sum Tahalil-Alakkad-V140-Screenshot-Enabled-Android-SIGNED.apk \
            > Tahalil-Alakkad-V140-Screenshot-Enabled-Android-SIGNED.apk.sha256

      - name: Publish V140 Android release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v140 >/dev/null 2>&1; then
            echo "::error::Release v140 already exists. Refusing to overwrite it."
            exit 1
          fi

          gh release create v140 \
            Tahalil-Alakkad-V140-Screenshot-Enabled-Android-SIGNED.apk \
            Tahalil-Alakkad-V140-Screenshot-Enabled-Android-SIGNED.apk.sha256 \
            --target "$V140_COMMIT_SHA" \
            --title "تحاليل العقاد V140 — Screenshot Enabled" \
            --notes "Android V140 enables screenshots and screen recording by removing FLAG_SECURE only. All V139 resilience, Firebase, authenticated failover, reconciliation, backup/restore, notifications, offline data protections, overlay defense and original signing identity remain unchanged."

      - name: Final status
        shell: bash
        run: |
          echo "Android V140 built, signed, signer-verified, source-pinned and released with screenshots enabled."
