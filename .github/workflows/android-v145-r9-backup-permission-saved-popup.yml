name: Android V145 R9 BACKUP PERMISSION + SAVED POPUP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-v145-r9-backup-permission-saved-popup.yml'

permissions:
  contents: write

concurrency:
  group: android-v145-r9-backup-permission-saved-popup
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare exact released R8 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          REF='refs/remotes/origin/v145-ui-polish-r8-clean-glow'
          EXPECTED='ae682c504d7a52b94a2f71c0c4088bb169a943df'
          test "$(git rev-parse "$REF^{commit}")" = "$EXPECTED"

          rm -rf build_v145_r9
          git worktree add --detach build_v145_r9 "$REF"

          grep -Fq 'versionCode = 149' build_v145_r9/app/build.gradle.kts
          grep -Fq 'versionName = "5.69-v145-ui-polish-r8-clean-glow"' build_v145_r9/app/build.gradle.kts
          python3 -c 'import json; x=json.load(open("build_v145_r9/app/src/main/assets/lab_tests_android.json")); assert len(x)==331'

          sha256sum \
            build_v145_r9/firestore.rules \
            build_v145_r9/app/google-services.json \
            build_v145_r9/app/src/main/assets/lab_tests_android.json \
            build_v145_r9/app/src/main/java/com/example/MainActivity.kt \
            build_v145_r9/app/src/main/java/com/example/settings/AppSettings.kt \
            > "$RUNNER_TEMP/r9-protected.sha256"

      - name: Apply R9 backup permission fix and explicit saved popup
        shell: bash
        run: |
          set -euo pipefail

          BACKUP='build_v145_r9/app/src/main/java/com/example/util/CommercialBackupManager.kt'
          OPS='build_v145_r9/app/src/main/java/com/example/ui/OperationsV14Dialog.kt'
          GRADLE='build_v145_r9/app/build.gradle.kts'

          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          gradle = Path('build_v145_r9/app/build.gradle.kts')
          g = gradle.read_text(encoding='utf-8')
          assert g.count('versionCode = 149') == 1
          assert g.count('versionName = "5.69-v145-ui-polish-r8-clean-glow"') == 1
          g = g.replace('versionCode = 149', 'versionCode = 150', 1)
          g = g.replace(
              'versionName = "5.69-v145-ui-polish-r8-clean-glow"',
              'versionName = "5.70-v145-ui-polish-r9-backup-fix"',
              1
          )
          gradle.write_text(g, encoding='utf-8')

          ops = Path('build_v145_r9/app/src/main/java/com/example/ui/OperationsV14Dialog.kt')
          s = ops.read_text(encoding='utf-8')

          # Explicit visible confirmation after a successful MANUAL backup save.
          if 'R9_MANUAL_BACKUP_SAVED_POPUP' not in s:
              state_marker = 'var quickBackupMessage by remember { mutableStateOf("") }'
              assert state_marker in s, 'quickBackupMessage state marker missing'
              s = s.replace(
                  state_marker,
                  state_marker + '\n    // R9_MANUAL_BACKUP_SAVED_POPUP\n    var showManualBackupSaved by remember { mutableStateOf(false) }',
                  1
              )

              success_marker = 'quickBackupMessage = quickBackupSuccessText'
              assert s.count(success_marker) >= 1, 'manual backup success marker missing'
              s = s.replace(
                  success_marker,
                  success_marker + '\n                        showManualBackupSaved = true',
                  1
              )

              dialog_anchor = 'if (showQuickBackupPassword) {'
              assert dialog_anchor in s, 'backup password dialog marker missing'
              saved_dialog = textwrap.dedent(r'''
              if (showManualBackupSaved) {
                  AlertDialog(
                      onDismissRequest = { showManualBackupSaved = false },
                      title = {
                          Text(
                              appText("تم الحفظ ✓", "Saved ✓"),
                              fontWeight = FontWeight.ExtraBold
                          )
                      },
                      text = {
                          Text(
                              appText(
                                  "تم حفظ النسخة الاحتياطية بنجاح على الهاتف.",
                                  "The backup was saved successfully on this phone."
                              ),
                              textAlign = TextAlign.Center
                          )
                      },
                      confirmButton = {
                          LabeledIconAction(
                              label = appText("موافق", "OK"),
                              onClick = { showManualBackupSaved = false },
                              actionSize = 58.dp
                          ) {
                              Icon(
                                  Icons.Default.CheckCircle,
                                  contentDescription = null,
                                  modifier = Modifier.size(38.dp)
                              )
                          }
                      }
                  )
              }
          
          ''')
              s = s.replace(dialog_anchor, saved_dialog + '    ' + dialog_anchor, 1)

          ops.write_text(s, encoding='utf-8')
          PY

          # Restore the proven permission-safe manager only if R8 lost it.
          # Core operational collections remain mandatory. Firestore-denied
          # users/audit/device security archive is best-effort and must not abort backup.
          if grep -Fq 'fun optionalSecurity(name: String)' "$BACKUP" \
             && grep -Fq 'optionalSecurity("users")' "$BACKUP" \
             && grep -Fq 'optionalSecurity("audit_logs")' "$BACKUP" \
             && grep -Fq 'security_archive_complete' "$BACKUP"; then
            echo 'R8 already contains the proven permission-safe backup manager.'
          else
            ACTUAL_SHA="$(sha256sum "$BACKUP" | awk '{print $1}')"
            BAD_V142_SHA='aab39abf98ccf7b39db0fad8404f034eb1f999b028cef25b9f389b4426e54599'
            FIXED_SHA='0beed05a03d3c192a19b4e43b3aca04d358c1678dccd98eba9a85bf00c5fb3b6'

            if [ "$ACTUAL_SHA" != "$BAD_V142_SHA" ]; then
              echo "::error::R8 backup manager has neither permission-safe markers nor the known V142 bad hash."
              echo "::error::Refusing an unsafe blind replacement. Actual SHA256: $ACTUAL_SHA"
              exit 1
            fi

            cat > "$RUNNER_TEMP/CommercialBackupManager.fixed.gz.b64" <<'B64'
