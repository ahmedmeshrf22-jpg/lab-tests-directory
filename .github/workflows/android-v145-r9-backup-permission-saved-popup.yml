      - name: Safety audit R9 scope
        shell: bash
        run: |
          set -euo pipefail
          cd build_v145_r9

          git diff --check
          grep -Fq 'versionCode = 150' app/build.gradle.kts
          grep -Fq 'versionName = "5.70-v145-ui-polish-r9-backup-fix"' app/build.gradle.kts

          BACKUP='app/src/main/java/com/example/util/CommercialBackupManager.kt'
          OPS='app/src/main/java/com/example/ui/OperationsV14Dialog.kt'

          grep -Fq 'fun optionalSecurity(name: String)' "$BACKUP"
          grep -Fq 'optionalSecurity("users")' "$BACKUP"
          grep -Fq 'optionalSecurity("audit_logs")' "$BACKUP"
          grep -Fq 'securityArchiveWarnings += "devices/$uid:' "$BACKUP"
          grep -Fq 'security_archive_complete' "$BACKUP"
          grep -Fq 'security_archive_warnings' "$BACKUP"

          grep -Fq 'val labOrders = simple("lab_orders")' "$BACKUP"
          grep -Fq 'val customerPrices = simple("customer_price_overrides")' "$BACKUP"
          grep -Fq 'val labPrices = simple("lab2lab_prices")' "$BACKUP"
          grep -Fq 'val phoneRegistry = simple("phone_registry")' "$BACKUP"
          grep -Fq 'val catalogOverrides = simple("lab_catalog_overrides")' "$BACKUP"

          grep -Fq 'R9_MANUAL_BACKUP_SAVED_POPUP' "$OPS"
          grep -Fq 'showManualBackupSaved = true' "$OPS"
          grep -Fq 'تم الحفظ ✓' "$OPS"
          grep -Fq 'تم حفظ النسخة الاحتياطية بنجاح على الهاتف.' "$OPS"

          # Firestore rules/config/catalogue and protected app core must be untouched.
          sed 's#build_v145_r9/##' "$RUNNER_TEMP/r9-protected.sha256" > "$RUNNER_TEMP/r9-protected-local.sha256"
          sha256sum -c "$RUNNER_TEMP/r9-protected-local.sha256"

          python3 - <<'PY'
          import json
          x=json.load(open('app/src/main/assets/lab_tests_android.json', encoding='utf-8'))
          assert len(x)==331
          ids=[i['id'] for i in x]
          assert len(ids)==len(set(ids))
          assert all('customer_price' in i for i in x)
          assert all('lab_to_lab_price' not in i for i in x)
          print('R9 CATALOGUE + PROTECTED CORE AUDIT PASS')
          PY

      - name: Load proven production signer
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          WF='.github/workflows/android-v144-ONLY-SESSION-RELOCK-FIX-FINAL-ONE-RUN-R3-AUDITED.yml'
          test -s "$WF"

          extract_step() {
            local name="$1" out="$2"
            awk -v target="$name" '
              $0 == "      - name: " target { found=1; next }
              found && /^        run: \|/ { inrun=1; next }
              inrun && /^      - name:/ { exit }
              inrun { sub(/^          /,""); print }
            ' "$WF" > "$out"
            test -s "$out"
          }

          extract_step 'Prepare deterministic APK certificate reader' "$RUNNER_TEMP/cert.sh"
          extract_step 'Select exact installed Android signer' "$RUNNER_TEMP/signer.sh"
          bash "$RUNNER_TEMP/cert.sh"
          bash "$RUNNER_TEMP/signer.sh"

          test -n "${KEYSTORE_PATH:-}"
          test -n "${STORE_PASSWORD:-}"
          test -n "${KEY_ALIAS:-}"
          test -n "${KEY_PASSWORD:-}"
          test -f "$KEYSTORE_PATH"

      - name: Compile and build signed release
        working-directory: build_v145_r9
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:compileReleaseKotlin
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify APK identity and exact signer lineage
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build_v145_r9/app/build/outputs/apk/release -type f -name '*.apk' | sort | head -1)"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          curl -fL --retry 3 \
            'https://github.com/ahmedmeshrf22-jpg/lab-tests-directory/releases/download/v145-ui-polish-r8-clean-glow/Tahalil-Alakkad-V145-R8-CLEAN-GLOW-SIGNED.apk' \
            -o "$RUNNER_TEMP/r8.apk"

          NEW_CERT="$(python3 "$RUNNER_TEMP/apk_cert_sha256.py" "$APK" | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
          OLD_CERT="$(python3 "$RUNNER_TEMP/apk_cert_sha256.py" "$RUNNER_TEMP/r8.apk" | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
          test "$NEW_CERT" = "$OLD_CERT"
          test "$NEW_CERT" = 'd20457a1cf78ed2598242fb858b32579793a856a94dd8f88829223221b8bc29c'

          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          echo "$BADGING"
          echo "$BADGING" | grep -Fq "package: name='com.aistudio.labtestsdirectory.egypt'"
          echo "$BADGING" | grep -Fq "versionCode='150'"
          echo "$BADGING" | grep -Fq "versionName='5.70-v145-ui-polish-r9-backup-fix'"

          cp "$APK" Tahalil-Alakkad-V145-R9-BACKUP-FIX-SIGNED.apk
          sha256sum Tahalil-Alakkad-V145-R9-BACKUP-FIX-SIGNED.apk \
            > Tahalil-Alakkad-V145-R9-BACKUP-FIX-SIGNED.apk.sha256

      - name: Commit exact R9 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd build_v145_r9
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B v145-ui-polish-r9-backup-fix
          git add app/build.gradle.kts \
            app/src/main/java/com/example/util/CommercialBackupManager.kt \
            app/src/main/java/com/example/ui/OperationsV14Dialog.kt
          git commit -m 'R9 fix backup permission handling and add saved popup'
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          git archive --format=zip \
            --output="$GITHUB_WORKSPACE/Tahalil-Alakkad-V145-R9-BACKUP-FIX-SOURCE.zip" \
            HEAD

      - name: Upload R9 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V145-R9-BACKUP-FIX
          path: |
            Tahalil-Alakkad-V145-R9-BACKUP-FIX-SIGNED.apk
            Tahalil-Alakkad-V145-R9-BACKUP-FIX-SIGNED.apk.sha256
            Tahalil-Alakkad-V145-R9-BACKUP-FIX-SOURCE.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish R9 branch and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C build_v145_r9 push --force origin HEAD:refs/heads/v145-ui-polish-r9-backup-fix

          TAG='v145-ui-polish-r9-backup-fix'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              Tahalil-Alakkad-V145-R9-BACKUP-FIX-SIGNED.apk \
              Tahalil-Alakkad-V145-R9-BACKUP-FIX-SIGNED.apk.sha256 \
              Tahalil-Alakkad-V145-R9-BACKUP-FIX-SOURCE.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              Tahalil-Alakkad-V145-R9-BACKUP-FIX-SIGNED.apk \
              Tahalil-Alakkad-V145-R9-BACKUP-FIX-SIGNED.apk.sha256 \
              Tahalil-Alakkad-V145-R9-BACKUP-FIX-SOURCE.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$FINAL_SHA" \
              --title 'Tahalil Alakkad V145 R9 Backup Fix' \
              --notes 'R9 fixes the Android manual/04:00 encrypted backup permission regression by preserving mandatory operational data while treating Firestore-denied users/audit/device security archives as best-effort, without relaxing Firestore rules. Manual backup now shows a clear in-app تم الحفظ ✓ confirmation only after the .tahbak file is successfully saved. Based exactly on released V145 R8; 331-test catalogue, Firebase configuration, package identity and production signer are preserved.'
          fi

      - name: Final status
        run: echo 'R9 BACKUP PERMISSION FIX + MANUAL SAVED POPUP BUILT, SIGNER VERIFIED AND RELEASED'
