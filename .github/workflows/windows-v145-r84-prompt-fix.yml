name: Windows V145 R8.4 Prompt Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-windows-v145-r84-prompt-fix
  cancel-in-progress: false

jobs:
  windows-v145-r84:
    name: Windows V145 R8.4 — Prompt Fix
    runs-on: windows-latest
    timeout-minutes: 105
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      R83_TEMPLATE_COMMIT: "67734666f2f6a0a8b07c307e8d7d38ab5ff724d0"

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore audited R8.3 build scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'windows-v145-r83-original.yml'
          $scripts = Join-Path $env:RUNNER_TEMP 'r83_scripts'
          if (Test-Path $scripts) { Remove-Item $scripts -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $scripts | Out-Null
          
          $spec = "$($env:R83_TEMPLATE_COMMIT):.github/workflows/windows-v145-r83-core-integrity.yml"
          git show $spec | Set-Content $source -Encoding utf8
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $source)) {
            throw "Could not restore audited R8.3 workflow template from $env:R83_TEMPLATE_COMMIT"
          }
          
          $extractor = @'
          from pathlib import Path
          import sys
          src = Path(sys.argv[1])
          out = Path(sys.argv[2])
          lines = src.read_text(encoding="utf-8-sig").splitlines()
          wanted = [
              ("Download audited Windows V145 R8 source", "01_download.ps1"),
              ("Apply Android-equivalent package price resolver", "02_price_parity.ps1"),
              ("Apply Android screen placement parity", "03_screen_parity.ps1"),
              ("Apply R8.3 customer and price core integrity", "04_core_integrity.ps1"),
              ("Safety audit package pricing", "05_safety_audit.ps1"),
              ("Install dependencies", "06_install.ps1"),
              ("Build Portable", "07_build_portable.ps1"),
              ("Portable startup smoke", "08_portable_smoke.ps1"),
              ("Build Setup", "09_build_setup.ps1"),
          ]
          def extract_step(name: str) -> str:
              start = next((i for i,l in enumerate(lines) if l.startswith("      - name: ") and l.strip() == f"- name: {name}"), None)
              if start is None: raise SystemExit(f"Missing audited step: {name}")
              end = next((i for i in range(start+1,len(lines)) if lines[i].startswith("      - name: ")), len(lines))
              run_idx = next((i for i in range(start+1,end) if lines[i].startswith("        run: |")), None)
              if run_idx is None: raise SystemExit(f"Step has no run block: {name}")
              block=[]
              for line in lines[run_idx+1:end]:
                  if not line.strip(): block.append("")
                  elif line.startswith("          "): block.append(line[10:])
                  else: break
              if not block: raise SystemExit(f"Empty run block: {name}")
              return "\n".join(block).rstrip()+"\n"
          out.mkdir(parents=True,exist_ok=True)
          for name,filename in wanted:
              (out/filename).write_text(extract_step(name),encoding="utf-8")
          print(f"Restored {len(wanted)} audited R8.3 scripts")
          '@
          $extractorPath = Join-Path $env:RUNNER_TEMP 'extract_r83_steps.py'
          $extractor | Set-Content $extractorPath -Encoding utf8
          python $extractorPath $source $scripts
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract audited R8.3 scripts' }
          foreach ($file in @('01_download.ps1','02_price_parity.ps1','03_screen_parity.ps1','04_core_integrity.ps1','05_safety_audit.ps1','06_install.ps1','07_build_portable.ps1','08_portable_smoke.ps1','09_build_setup.ps1')) {
            if (!(Test-Path (Join-Path $scripts $file))) { throw "Missing restored script: $file" }
          }

      - name: Download audited Windows V145 R8 source
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File "$env:RUNNER_TEMP\r83_scripts\01_download.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply Android-equivalent package price resolver
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File "$env:RUNNER_TEMP\r83_scripts\02_price_parity.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply Android screen placement parity
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File "$env:RUNNER_TEMP\r83_scripts\03_screen_parity.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply R8.3 customer and price core integrity
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File "$env:RUNNER_TEMP\r83_scripts\04_core_integrity.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit inherited R8.3 core before prompt patch
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File "$env:RUNNER_TEMP\r83_scripts\05_safety_audit.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply Windows prompt compatibility fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $patcher = @'
          from pathlib import Path
          import json, re, sys
          
          root = Path(sys.argv[1])
          main_path = root/'electron'/'main.cjs'
          preload_path = root/'electron'/'preload.cjs'
          app_path = root/'src'/'app.js'
          pkg_path = root/'package.json'
          
          for p in (main_path, preload_path, app_path, pkg_path):
              if not p.exists():
                  raise SystemExit(f'Missing required file: {p}')
          
          main = main_path.read_text(encoding='utf-8-sig')
          preload = preload_path.read_text(encoding='utf-8-sig')
          app = app_path.read_text(encoding='utf-8-sig')
          
          if 'TAH_PROMPT_SYNC_V1' in main or 'promptSync:' in preload or 'TAH_PROMPT_COMPAT_V1' in app:
              raise SystemExit('Prompt fix already appears to be installed')
          
          # Main process: synchronous Windows text-entry dialog that preserves browser prompt semantics.
          stream_anchor = "const { pipeline } = require('stream/promises');"
          if stream_anchor not in main:
              raise SystemExit('main.cjs import anchor missing')
          main = main.replace(stream_anchor, stream_anchor + "\nconst { spawnSync } = require('child_process');", 1)
          
          first_ipc = "ipcMain.handle('device:identity', () => ({"
          if first_ipc not in main:
              raise SystemExit('main.cjs IPC anchor missing')
          
          main_patch = r'''/* TAH_PROMPT_SYNC_V1
             Electron does not implement browser window.prompt().
             This Windows-only bridge preserves the existing synchronous app contract while
             using a native WinForms text-entry dialog. Values are passed to PowerShell as
             base64 environment variables so Arabic/default text is never interpolated into code. */
          function tahalilPromptSync(message, defaultValue = '') {
            const msg = String(message ?? '').slice(0, 2000);
            const def = String(defaultValue ?? '').slice(0, 20000);
            const env = {
              ...process.env,
              TAH_PROMPT_MESSAGE_B64: Buffer.from(msg, 'utf8').toString('base64'),
              TAH_PROMPT_DEFAULT_B64: Buffer.from(def, 'utf8').toString('base64')
            };
            const ps = String.raw`
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          [System.Windows.Forms.Application]::EnableVisualStyles()
          function Decode-B64([string]$value) {
            if ([string]::IsNullOrEmpty($value)) { return '' }
            return [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($value))
          }
          $message = Decode-B64 $env:TAH_PROMPT_MESSAGE_B64
          $defaultValue = Decode-B64 $env:TAH_PROMPT_DEFAULT_B64
          $sensitive = $message -match '(?i)password|\bpin\b|كلمة\s*المرور|رمز\s*(?:المرور|الإدارة)'
          $multiline = (-not $sensitive) -and (($defaultValue -match '[\r\n]') -or ($message -match '(?i)ملاحظات|كل\s*تحليل\s*في\s*سطر|notes|tests'))
          
          $form = New-Object System.Windows.Forms.Form
          $form.Text = 'تحاليل العقاد'
          $form.StartPosition = 'CenterScreen'
          $form.FormBorderStyle = 'FixedDialog'
          $form.MaximizeBox = $false
          $form.MinimizeBox = $false
          $form.ShowInTaskbar = $false
          $form.TopMost = $true
          $form.RightToLeft = [System.Windows.Forms.RightToLeft]::Yes
          $form.RightToLeftLayout = $true
          $form.Width = 540
          $form.Height = $(if ($multiline) { 410 } else { 245 })
          $form.Font = New-Object System.Drawing.Font('Segoe UI', 10)
          
          $label = New-Object System.Windows.Forms.Label
          $label.Left = 20
          $label.Top = 18
          $label.Width = 490
          $label.Height = 58
          $label.Text = $message
          $label.TextAlign = [System.Drawing.ContentAlignment]::MiddleRight
          $form.Controls.Add($label)
          
          $text = New-Object System.Windows.Forms.TextBox
          $text.Left = 20
          $text.Top = 82
          $text.Width = 490
          $text.Text = $defaultValue
          $text.RightToLeft = [System.Windows.Forms.RightToLeft]::Yes
          if ($multiline) {
            $text.Multiline = $true
            $text.AcceptsReturn = $true
            $text.ScrollBars = [System.Windows.Forms.ScrollBars]::Vertical
            $text.Height = 220
          } else {
            $text.Height = 32
          }
          if ($sensitive) { $text.UseSystemPasswordChar = $true }
          $form.Controls.Add($text)
          
          $buttonTop = $(if ($multiline) { 320 } else { 135 })
          $ok = New-Object System.Windows.Forms.Button
          $ok.Text = 'موافق'
          $ok.Width = 110
          $ok.Height = 34
          $ok.Left = 280
          $ok.Top = $buttonTop
          $ok.DialogResult = [System.Windows.Forms.DialogResult]::OK
          $form.Controls.Add($ok)
          
          $cancel = New-Object System.Windows.Forms.Button
          $cancel.Text = 'إلغاء'
          $cancel.Width = 110
          $cancel.Height = 34
          $cancel.Left = 400
          $cancel.Top = $buttonTop
          $cancel.DialogResult = [System.Windows.Forms.DialogResult]::Cancel
          $form.Controls.Add($cancel)
          
          $form.AcceptButton = $ok
          $form.CancelButton = $cancel
          $form.Add_Shown({ $text.Focus(); $text.SelectionStart = $text.Text.Length })
          $result = $form.ShowDialog()
          if ($result -eq [System.Windows.Forms.DialogResult]::OK) {
            $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes([string]$text.Text))
            [Console]::Out.Write('OK:' + $encoded)
          } else {
            [Console]::Out.Write('CANCEL')
          }
          $form.Dispose()
          `;
            const out = spawnSync('powershell.exe', ['-NoLogo', '-NoProfile', '-STA', '-Command', ps], {
              env,
              encoding: 'utf8',
              windowsHide: true,
              maxBuffer: 4 * 1024 * 1024
            });
            if (out.error) throw out.error;
            if (out.status !== 0) throw new Error(String(out.stderr || 'تعذر فتح نافذة الإدخال في Windows').trim());
            const value = String(out.stdout || '').trim();
            if (value === 'CANCEL') return null;
            if (!value.startsWith('OK:')) throw new Error('استجابة نافذة الإدخال غير صالحة');
            return Buffer.from(value.slice(3), 'base64').toString('utf8');
          }
          
          ipcMain.on('ui:prompt-sync', (event, payload = {}) => {
            try {
              event.returnValue = {
                ok: true,
                value: tahalilPromptSync(payload?.message, payload?.defaultValue)
              };
            } catch (error) {
              event.returnValue = { ok: false, error: String(error?.message || error || 'Prompt failed') };
            }
          });
          
          '''
          main = main.replace(first_ipc, main_patch + first_ipc, 1)
          
          # Preload bridge.
          preload_anchor = "  getDeviceIdentity: () => ipcRenderer.invoke('device:identity'),"
          if preload_anchor not in preload:
              raise SystemExit('preload.cjs bridge anchor missing')
          preload_patch = """  promptSync: (message, defaultValue = '') => {\n    const response = ipcRenderer.sendSync('ui:prompt-sync', { message: String(message ?? ''), defaultValue: String(defaultValue ?? '') });\n    if (!response?.ok) throw new Error(response?.error || 'تعذر فتح نافذة الإدخال في Windows');\n    return response.value;\n  },\n"""
          preload = preload.replace(preload_anchor, preload_patch + preload_anchor, 1)
          
          # Renderer: shadow the unsupported Electron browser prompt once, preserving all 41 existing call sites.
          if len(re.findall(r'\bprompt\s*\(', app)) < 1:
              raise SystemExit('No prompt() call sites found in app.js; refusing unexpected patch target')
          app_patch = """/* TAH_PROMPT_COMPAT_V1 — Electron Windows prompt compatibility. */\nconst prompt = (message, defaultValue = '') => {\n  if (!window.tahalilNative?.promptSync) throw new Error('نافذة الإدخال غير متاحة في نسخة Windows الحالية');\n  return window.tahalilNative.promptSync(message, defaultValue);\n};\n\n"""
          app = app_patch + app
          
          # Version only; release filenames are prepared by the workflow.
          pkg = json.loads(pkg_path.read_text(encoding='utf-8-sig'))
          pkg['version'] = '145.8.4'
          pkg['description'] = 'Tahalil Alakkad Windows V145 R8.4 Prompt Compatibility Fix on top of R8.3 Core Integrity'
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          
          main_path.write_text(main, encoding='utf-8')
          preload_path.write_text(preload, encoding='utf-8')
          app_path.write_text(app, encoding='utf-8')
          
          notes = root/'V145_R84_PROMPT_FIX_NOTES.txt'
          notes.write_text('''Windows V145 R8.4 Prompt Compatibility Fix\n\n- Fixes the Electron error: prompt is not supported.\n- Preserves every existing prompt() call site and routes it through one Windows-native compatibility layer.\n- New Customer now opens working input dialogs for name, phone, age, gender and address.\n- The same fix covers order edits, payments, customer edits, staff creation/reset and Admin PIN flows.\n- Cancel returns null, matching browser prompt semantics.\n- Password/PIN prompts are masked.\n- Notes/test-list prompts support multiline input.\n- R8.3 Firebase, customer price integrity, phone registry, orders, results, backup/failover and catalogue logic are not changed.\n''', encoding='utf-8')
          
          print('PROMPT_FIX_APPLIED')
          print('PROMPT_CALLS=' + str(len(re.findall(r'\bprompt\s*\(', app))))
          '@
          $patcherPath = Join-Path $env:RUNNER_TEMP 'patch_prompt_fix.py'
          $patcher | Set-Content $patcherPath -Encoding utf8
          python $patcherPath $root
          if ($LASTEXITCODE -ne 0) { throw 'R8.4 prompt patch failed' }

      - name: Audit R8.4 prompt fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '145.8.4') { throw "Expected 145.8.4, got $($pkg.version)" }
          $app = Get-Content (Join-Path $root 'src/app.js') -Raw
          $main = Get-Content (Join-Path $root 'electron/main.cjs') -Raw
          $preload = Get-Content (Join-Path $root 'electron/preload.cjs') -Raw
          $promptCount = [regex]::Matches($app,'\bprompt\s*\(').Count
          if ($promptCount -ne 41) { throw "Expected 41 existing prompt call sites, got $promptCount" }
          foreach($marker in @('TAH_PROMPT_COMPAT_V1','promptSync','TAH_PROMPT_SYNC_V1','ui:prompt-sync','powershell.exe')) {
            if (!($app + $main + $preload).Contains($marker)) { throw "Missing R8.4 marker: $marker" }
          }
          if ($app.Contains('window.prompt(')) { throw 'Direct window.prompt call remains' }
          node --check (Join-Path $root 'src/app.js')
          if ($LASTEXITCODE -ne 0) { throw 'app.js syntax failed' }
          node --check (Join-Path $root 'electron/preload.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'preload.cjs syntax failed' }
          node --check (Join-Path $root 'electron/main.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'main.cjs syntax failed' }
          Write-Host "R8.4 PROMPT AUDIT PASSED — $promptCount CALL SITES COVERED"

      - name: Package patched R8.4 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $stage = Join-Path $env:RUNNER_TEMP 'source_stage_r84'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $exclude = @('node_modules','release','.git')
          Get-ChildItem -LiteralPath $root -Force | Where-Object { $exclude -notcontains $_.Name } | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $stage -Recurse -Force
          }
          foreach ($required in @('package.json','src/app.js','electron/main.cjs','electron/preload.cjs','src/v145r8-parity.js','V145_R83_CORE_INTEGRITY_NOTES.txt','V145_R84_PROMPT_FIX_NOTES.txt')) {
            if (!(Test-Path (Join-Path $stage $required))) { throw "Source package missing: $required" }
          }
          $zip = Join-Path $PWD 'Tahalil-Alakkad-V145-R8.4-Windows-Source.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage,$zip,[System.IO.Compression.CompressionLevel]::Optimal,$false)
          if (!(Test-Path $zip) -or (Get-Item $zip).Length -lt 50000) { throw 'R8.4 source ZIP invalid' }
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Tahalil-Alakkad-V145-R8.4-Windows-Source.zip" | Set-Content 'Tahalil-Alakkad-V145-R8.4-Windows-Source.zip.sha256' -Encoding ascii
          Copy-Item (Join-Path $root 'V145_R83_CORE_INTEGRITY_AUDIT.txt') 'V145_R83_CORE_INTEGRITY_AUDIT.txt' -Force
          Copy-Item (Join-Path $root 'V145_R83_CORE_INTEGRITY_NOTES.txt') 'V145_R83_CORE_INTEGRITY_NOTES.txt' -Force
          Copy-Item (Join-Path $root 'V145_R84_PROMPT_FIX_NOTES.txt') 'V145_R84_PROMPT_FIX_NOTES.txt' -Force

      - name: Install dependencies
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File "$env:RUNNER_TEMP\r83_scripts\06_install.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Portable
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File "$env:RUNNER_TEMP\r83_scripts\07_build_portable.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable startup smoke
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File "$env:RUNNER_TEMP\r83_scripts\08_portable_smoke.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Setup
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File "$env:RUNNER_TEMP\r83_scripts\09_build_setup.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare R8.4 delivery files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup = Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable -or !$setup) { throw 'Portable or Setup EXE missing' }
          Copy-Item $portable.FullName 'Tahalil-Alakkad-V145-R8.4-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V145-R8.4-Windows-Setup.exe' -Force
          foreach ($name in @('Tahalil-Alakkad-V145-R8.4-Windows-Portable.exe','Tahalil-Alakkad-V145-R8.4-Windows-Setup.exe')) {
            if ((Get-Item $name).Length -lt 100000) { throw "$name unexpectedly small" }
            $hash=(Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Upload R8.4 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V145-R8.4-Windows-Prompt-Fix
          path: |
            Tahalil-Alakkad-V145-R8.4-Windows-Portable.exe
            Tahalil-Alakkad-V145-R8.4-Windows-Portable.exe.sha256
            Tahalil-Alakkad-V145-R8.4-Windows-Setup.exe
            Tahalil-Alakkad-V145-R8.4-Windows-Setup.exe.sha256
            Tahalil-Alakkad-V145-R8.4-Windows-Source.zip
            Tahalil-Alakkad-V145-R8.4-Windows-Source.zip.sha256
            V145_R83_CORE_INTEGRITY_AUDIT.txt
            V145_R83_CORE_INTEGRITY_NOTES.txt
            V145_R84_PROMPT_FIX_NOTES.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish Windows V145 R8.4 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag='v145-r8.4-windows'
          $title='تحاليل العقاد Windows V145 R8.4 — Prompt Fix'
          $notes=@'
          Windows V145 R8.4 Prompt Fix
          
          - Fixes Electron error: prompt is not supported.
          - New Customer now opens working Windows input dialogs for name, phone, age, gender and address.
          - One compatibility layer covers all 41 existing prompt workflows, including customer/order edits, collection, staff reset/create and Admin PIN.
          - Cancel semantics are preserved; password/PIN input is masked; notes/test lists support multiline input.
          - Built on the audited R8.3 Core Integrity pipeline; Firebase, customer pricing, phone_registry, orders, results, backup/failover and the 331-test catalogue are preserved.
          '@
          $files=@(
            'Tahalil-Alakkad-V145-R8.4-Windows-Portable.exe',
            'Tahalil-Alakkad-V145-R8.4-Windows-Portable.exe.sha256',
            'Tahalil-Alakkad-V145-R8.4-Windows-Setup.exe',
            'Tahalil-Alakkad-V145-R8.4-Windows-Setup.exe.sha256',
            'Tahalil-Alakkad-V145-R8.4-Windows-Source.zip',
            'Tahalil-Alakkad-V145-R8.4-Windows-Source.zip.sha256',
            'V145_R83_CORE_INTEGRITY_AUDIT.txt',
            'V145_R83_CORE_INTEGRITY_NOTES.txt',
            'V145_R84_PROMPT_FIX_NOTES.txt'
          )
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not update R8.4 release metadata' }
          } else {
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create R8.4 release' }
          }
          gh release upload $tag @files --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload R8.4 release files' }

      - name: Final status
        shell: pwsh
        run: |
          Write-Host 'WINDOWS V145 R8.4 PROMPT FIX — BUILT, AUDITED, SMOKE-TESTED AND RELEASED'
