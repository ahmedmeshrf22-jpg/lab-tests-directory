          @'
          Windows V145 R8.3 Core Integrity
          - Package and inquiry customer prices use a single id-first effective-price resolver.
          - Primary live source matches Android V145: Firestore customer_price_overrides, documents test_<id>, fields customer_price/customerPrice/price.
          - Price 0 is treated as a valid value; blank/null/NaN are treated as missing.
          - Package pricing no longer depends on changing the search field or scraping rendered currency text.
          - The 331-test catalogue remains the canonical name/id fallback and supports Arabic/English/market names.
          - Customer phone values are normalized to digits before save, matching Android V145 phone_normalized behavior.
          - Prevents rapid duplicate submits and checks the Android phone_registry collection before a new customer is created when Firestore is available.
          - Offline mode remains usable: validation/double-submit protection stays active and Firestore duplicate check fails open instead of blocking legitimate work.
          - Edit flows are not converted to create flows; the guard avoids duplicate-registry blocking when the UI is clearly in edit/update mode.
          - Inquiry result cards are repaired from the same centralized effective customer-price map when stale/dash prices are detected.
          - Existing auth/orders/results/backup/failover logic is preserved.
          '@ | Set-Content (Join-Path $root 'V145_R83_CORE_INTEGRITY_NOTES.txt') -Encoding utf8

