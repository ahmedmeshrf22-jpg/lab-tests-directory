name: Windows V145 R8.3 Core Integrity FINAL

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-windows-v145-r83-core-integrity-final
  cancel-in-progress: false

jobs:
  windows-v145-r83-final:
    name: Windows V145 R8.3 — Core Integrity FINAL
    runs-on: windows-latest
    timeout-minutes: 95
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      R83_TEMPLATE_COMMIT: "67734666f2f6a0a8b07c307e8d7d38ab5ff724d0"

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore audited R8.3 build scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'windows-v145-r83-original.yml'
          $scripts = Join-Path $env:RUNNER_TEMP 'r83_scripts'
          if (Test-Path $scripts) { Remove-Item $scripts -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $scripts | Out-Null

          $spec = "$($env:R83_TEMPLATE_COMMIT):.github/workflows/windows-v145-r83-core-integrity.yml"
          git show $spec | Set-Content $source -Encoding utf8
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $source)) {
            throw "Could not restore audited R8.3 workflow template from $env:R83_TEMPLATE_COMMIT"
          }

          $extractor = @'
          from pathlib import Path
          import sys

          src = Path(sys.argv[1])
          out = Path(sys.argv[2])
          lines = src.read_text(encoding="utf-8-sig").splitlines()

          wanted = [
              ("Download audited Windows V145 R8 source", "01_download.ps1"),
              ("Apply Android-equivalent package price resolver", "02_price_parity.ps1"),
              ("Apply Android screen placement parity", "03_screen_parity.ps1"),
              ("Apply R8.3 customer and price core integrity", "04_core_integrity.ps1"),
              ("Safety audit package pricing", "05_safety_audit.ps1"),
              ("Install dependencies", "06_install.ps1"),
              ("Build Portable", "07_build_portable.ps1"),
              ("Portable startup smoke", "08_portable_smoke.ps1"),
              ("Build Setup", "09_build_setup.ps1"),
              ("Prepare delivery files", "10_prepare_delivery.ps1"),
          ]

          def extract_step(name: str) -> str:
              start = None
              for i, line in enumerate(lines):
                  if line.startswith("      - name: ") and line.strip() == f"- name: {name}":
                      start = i
                      break
              if start is None:
                  raise SystemExit(f"Missing audited step: {name}")

              end = len(lines)
              for i in range(start + 1, len(lines)):
                  if lines[i].startswith("      - name: "):
                      end = i
                      break

              run_idx = None
              for i in range(start + 1, end):
                  if lines[i].startswith("        run: |"):
                      run_idx = i
                      break
              if run_idx is None:
                  raise SystemExit(f"Step has no run block: {name}")

              block = []
              for line in lines[run_idx + 1:end]:
                  if not line.strip():
                      block.append("")
                  elif line.startswith("          "):
                      block.append(line[10:])
                  else:
                      # Ignore step metadata outside the literal run block.
                      break
              if not block:
                  raise SystemExit(f"Empty run block: {name}")
              return "\n".join(block).rstrip() + "\n"

          out.mkdir(parents=True, exist_ok=True)
          for name, filename in wanted:
              (out / filename).write_text(extract_step(name), encoding="utf-8")

          print(f"Restored {len(wanted)} audited R8.3 scripts")
          '@
          $extractorPath = Join-Path $env:RUNNER_TEMP 'extract_r83_steps.py'
          $extractor | Set-Content $extractorPath -Encoding utf8
          python $extractorPath $source $scripts
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract audited R8.3 scripts' }

          foreach ($file in @(
            '01_download.ps1','02_price_parity.ps1','03_screen_parity.ps1','04_core_integrity.ps1',
            '05_safety_audit.ps1','06_install.ps1','07_build_portable.ps1','08_portable_smoke.ps1',
            '09_build_setup.ps1','10_prepare_delivery.ps1'
          )) {
            if (!(Test-Path (Join-Path $scripts $file))) { throw "Missing restored script: $file" }
          }

      - name: Download audited Windows V145 R8 source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & pwsh -NoLogo -NoProfile -File "$env:RUNNER_TEMP\r83_scripts\01_download.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply Android-equivalent package price resolver
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File "$env:RUNNER_TEMP\r83_scripts\02_price_parity.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply Android screen placement parity
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File "$env:RUNNER_TEMP\r83_scripts\03_screen_parity.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply R8.3 customer and price core integrity
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File "$env:RUNNER_TEMP\r83_scripts\04_core_integrity.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Safety audit package pricing and customer core
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File "$env:RUNNER_TEMP\r83_scripts\05_safety_audit.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # IMPORTANT:
      # Package the patched source BEFORE npm/electron builds.
      # This removes the old 7-minute late failure and avoids robocopy entirely.
      - name: Package patched source safely
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          if (!(Test-Path (Join-Path $root 'package.json'))) { throw 'Patched source root missing' }
          if (!(Test-Path (Join-Path $root 'src/v145r8-parity.js'))) { throw 'Patched parity module missing' }

          $stage = Join-Path $env:RUNNER_TEMP 'source_stage_r83_final'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $exclude = @('node_modules', 'release', '.git')
          Get-ChildItem -LiteralPath $root -Force | Where-Object {
            $exclude -notcontains $_.Name
          } | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $stage -Recurse -Force
          }

          foreach ($required in @(
            'package.json',
            'src/v145r8-parity.js',
            'V145_R83_CORE_INTEGRITY_AUDIT.txt',
            'V145_R83_CORE_INTEGRITY_NOTES.txt'
          )) {
            if (!(Test-Path (Join-Path $stage $required))) {
              throw "Source package missing required file: $required"
            }
          }

          $zip = Join-Path $PWD 'Tahalil-Alakkad-V145-R8.3-Windows-Source.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $stage,
            $zip,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )

          if (!(Test-Path $zip)) { throw 'Patched source ZIP was not created' }
          if ((Get-Item $zip).Length -lt 50000) { throw 'Patched source ZIP unexpectedly small' }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Tahalil-Alakkad-V145-R8.3-Windows-Source.zip" |
            Set-Content 'Tahalil-Alakkad-V145-R8.3-Windows-Source.zip.sha256' -Encoding ascii

          Copy-Item (Join-Path $root 'V145_R83_CORE_INTEGRITY_AUDIT.txt') 'V145_R83_CORE_INTEGRITY_AUDIT.txt' -Force
          Copy-Item (Join-Path $root 'V145_R83_CORE_INTEGRITY_NOTES.txt') 'V145_R83_CORE_INTEGRITY_NOTES.txt' -Force

          Write-Host "SOURCE PACKAGE OK: $((Get-Item $zip).Length) bytes"

      - name: Install dependencies
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File "$env:RUNNER_TEMP\r83_scripts\06_install.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Portable
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File "$env:RUNNER_TEMP\r83_scripts\07_build_portable.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable startup smoke
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File "$env:RUNNER_TEMP\r83_scripts\08_portable_smoke.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Setup
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File "$env:RUNNER_TEMP\r83_scripts\09_build_setup.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare delivery files
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File "$env:RUNNER_TEMP\r83_scripts\10_prepare_delivery.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          foreach ($file in @(
            'Tahalil-Alakkad-V145-R8.3-Windows-Portable.exe',
            'Tahalil-Alakkad-V145-R8.3-Windows-Portable.exe.sha256',
            'Tahalil-Alakkad-V145-R8.3-Windows-Setup.exe',
            'Tahalil-Alakkad-V145-R8.3-Windows-Setup.exe.sha256',
            'Tahalil-Alakkad-V145-R8.3-Windows-Source.zip',
            'Tahalil-Alakkad-V145-R8.3-Windows-Source.zip.sha256',
            'V145_R83_CORE_INTEGRITY_AUDIT.txt',
            'V145_R83_CORE_INTEGRITY_NOTES.txt'
          )) {
            if (!(Test-Path $file)) { throw "Delivery file missing: $file" }
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V145-R8.3-Windows-FINAL
          path: |
            Tahalil-Alakkad-V145-R8.3-Windows-Portable.exe
            Tahalil-Alakkad-V145-R8.3-Windows-Portable.exe.sha256
            Tahalil-Alakkad-V145-R8.3-Windows-Setup.exe
            Tahalil-Alakkad-V145-R8.3-Windows-Setup.exe.sha256
            Tahalil-Alakkad-V145-R8.3-Windows-Source.zip
            Tahalil-Alakkad-V145-R8.3-Windows-Source.zip.sha256
            V145_R83_CORE_INTEGRITY_AUDIT.txt
            V145_R83_CORE_INTEGRITY_NOTES.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish Windows V145 R8.3 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v145-r8.3-windows'
          $title = 'تحاليل العقاد Windows V145 R8.3 — Core Integrity FINAL'
          $notes = @'
          Windows V145 R8.3 Core Integrity FINAL

          - Central Android-compatible customer pricing from customer_price_overrides.
          - ID-first package and inquiry pricing.
          - Customer phone normalization and duplicate-submit protection.
          - phone_registry duplicate detection for new customers when Firebase is available.
          - Android screen parity retained: packages only inside Test Inquiry.
          - Existing auth, orders, results, backup, failover and 331-test catalogue preserved.
          - Portable startup smoke test passed before release.
          - Source packaging is validated before the expensive Electron builds and no longer uses robocopy.
          '@

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not update existing R8.3 release metadata' }
          } else {
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create Windows V145 R8.3 release' }
          }

          $files = @(
            'Tahalil-Alakkad-V145-R8.3-Windows-Portable.exe',
            'Tahalil-Alakkad-V145-R8.3-Windows-Portable.exe.sha256',
            'Tahalil-Alakkad-V145-R8.3-Windows-Setup.exe',
            'Tahalil-Alakkad-V145-R8.3-Windows-Setup.exe.sha256',
            'Tahalil-Alakkad-V145-R8.3-Windows-Source.zip',
            'Tahalil-Alakkad-V145-R8.3-Windows-Source.zip.sha256',
            'V145_R83_CORE_INTEGRITY_AUDIT.txt',
            'V145_R83_CORE_INTEGRITY_NOTES.txt'
          )
          gh release upload $tag @files --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Windows V145 R8.3 release files' }

      - name: Final status
        shell: pwsh
        run: |
          Write-Host 'WINDOWS V145 R8.3 CORE INTEGRITY FINAL — BUILT, AUDITED, SMOKE-TESTED, PACKAGED AND RELEASED'
