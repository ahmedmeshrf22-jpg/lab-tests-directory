          function phone(v){return d(v).replace(/\D+/g,'');}
          function money(v){if(v===null||v===undefined||String(v).trim()==='')return null;let s=d(v).trim().replace(/\s*(?:جنيه|ج|egp|le)\s*/ig,'').replace(',','.');const n=Number(s);return Number.isFinite(n)&&n>=0?n:null;}
