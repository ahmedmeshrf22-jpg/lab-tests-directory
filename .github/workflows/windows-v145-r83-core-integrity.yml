          for(const [s,e] of phoneCases){if(phone(s)!==e)process.exit(11);}
          for(const [s,e] of [[0,0],['0',0],['250 جنيه',250],['',null],[null,null]]){if(money(s)!==e)process.exit(12);}
          console.log('R8.3 phone + money contract OK');
          '@ | Set-Content 'r83-core-smoke.js' -Encoding utf8
          node r83-core-smoke.js
          if ($LASTEXITCODE -ne 0) { throw 'R8.3 core smoke failed' }
          Write-Host 'WINDOWS V145 R8.3 CORE INTEGRITY SAFETY AUDIT PASSED'

      - name: Install dependencies
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Build Portable
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Portable startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$exe) { throw 'Portable EXE not found' }
          $env:TAHALIL_SMOKE_TEST='1'
          $p=Start-Process $exe.FullName -PassThru
          if (!$p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; throw 'Portable smoke timed out' }
          if ($p.ExitCode -ne 0) { throw "Portable smoke exit code $($p.ExitCode)" }
          Remove-Item Env:TAHALIL_SMOKE_TEST -ErrorAction SilentlyContinue
          Write-Host 'PORTABLE STARTUP OK'

      - name: Build Setup
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }

      - name: Prepare delivery files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup = Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable -or !$setup) { throw 'Portable or Setup EXE missing' }
          Copy-Item $portable.FullName 'Tahalil-Alakkad-V145-R8.3-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V145-R8.3-Windows-Setup.exe' -Force
          foreach ($name in @('Tahalil-Alakkad-V145-R8.3-Windows-Portable.exe','Tahalil-Alakkad-V145-R8.3-Windows-Setup.exe')) {
            if ((Get-Item $name).Length -lt 100000) { throw "$name unexpectedly small" }
            $hash=(Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Package patched source and audit notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $stage = Join-Path $PWD 'source_stage_r83'
          if(Test-Path $stage){Remove-Item $stage -Recurse -Force}
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          robocopy $root $stage /E /XD node_modules release .git /XF '*.exe' | Out-Null
          if($LASTEXITCODE -gt 7){throw "Source staging failed: robocopy $LASTEXITCODE"}
          $zip='Tahalil-Alakkad-V145-R8.3-Windows-Source.zip'
          if(Test-Path $zip){Remove-Item $zip -Force}
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          if((Get-Item $zip).Length -lt 50000){throw 'Patched source ZIP unexpectedly small'}
          foreach($name in @($zip)){
            $hash=(Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }
          Copy-Item (Join-Path $root 'V145_R83_CORE_INTEGRITY_AUDIT.txt') 'V145_R83_CORE_INTEGRITY_AUDIT.txt' -Force
          Copy-Item (Join-Path $root 'V145_R83_CORE_INTEGRITY_NOTES.txt') 'V145_R83_CORE_INTEGRITY_NOTES.txt' -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V145-R8.3-Windows
          path: |
            Tahalil-Alakkad-V145-R8.3-Windows-Portable.exe
            Tahalil-Alakkad-V145-R8.3-Windows-Portable.exe.sha256
            Tahalil-Alakkad-V145-R8.3-Windows-Setup.exe
            Tahalil-Alakkad-V145-R8.3-Windows-Setup.exe.sha256
            Tahalil-Alakkad-V145-R8.3-Windows-Source.zip
            Tahalil-Alakkad-V145-R8.3-Windows-Source.zip.sha256
            V145_R83_CORE_INTEGRITY_AUDIT.txt
            V145_R83_CORE_INTEGRITY_NOTES.txt
          retention-days: 30

      - name: Publish Windows V145 R8.3 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag='v145-r8.3-windows'
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --repo "$env:GITHUB_REPOSITORY" --yes
            git push origin ":refs/tags/$tag" 2>$null
          }
          gh release create $tag `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "تحاليل العقاد Windows V145 R8.3 — Core Integrity" `
            --notes "Core Integrity release for Windows V145: central Android-compatible customer pricing from customer_price_overrides, id-first package/inquiry prices, phone normalization, duplicate-submit protection and phone_registry duplicate detection for new customers. Preserves Android screen parity, Firebase/auth/orders/results/backup/failover and the 331-test catalogue. Includes patched source and audit notes."
          if ($LASTEXITCODE -ne 0) { throw 'Could not create Windows V145 R8.3 release' }
          gh release upload $tag `
            'Tahalil-Alakkad-V145-R8.3-Windows-Portable.exe' `
            'Tahalil-Alakkad-V145-R8.3-Windows-Portable.exe.sha256' `
            'Tahalil-Alakkad-V145-R8.3-Windows-Setup.exe' `
            'Tahalil-Alakkad-V145-R8.3-Windows-Setup.exe.sha256' `
            'Tahalil-Alakkad-V145-R8.3-Windows-Source.zip' `
            'Tahalil-Alakkad-V145-R8.3-Windows-Source.zip.sha256' `
            'V145_R83_CORE_INTEGRITY_AUDIT.txt' `
            'V145_R83_CORE_INTEGRITY_NOTES.txt' `
            --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Windows V145 R8.3 files' }

      - name: Final status
        shell: pwsh
        run: |
          Write-Host 'WINDOWS V145 R8.3 CORE INTEGRITY BUILT, AUDITED, SMOKE-TESTED AND RELEASED'
