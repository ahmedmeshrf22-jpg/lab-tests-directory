name: Android V145 UI POLISH R8 CLEAN GLOW

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-v145-ui-polish-r8-clean-glow.yml'

permissions:
  contents: write

concurrency:
  group: android-v145-ui-polish-r8-clean-glow
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare exact R7 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          REF='refs/remotes/origin/v145-ui-polish-r7-base'
          test "$(git rev-parse "$REF^{commit}")" = 'b265f074db415d50bff6ac9887ecdfb61532f74f'
          rm -rf build_v145
          git worktree add --detach build_v145 "$REF"
          grep -Fq 'versionCode = 148' build_v145/app/build.gradle.kts
          grep -Fq 'versionName = "5.68-v145-ui-polish-r7"' build_v145/app/build.gradle.kts
          python3 -c 'import json; x=json.load(open("build_v145/app/src/main/assets/lab_tests_android.json")); assert len(x)==331'
          sha256sum \
            build_v145/firestore.rules \
            build_v145/app/google-services.json \
            build_v145/app/src/main/assets/lab_tests_android.json \
            build_v145/app/src/main/java/com/example/MainActivity.kt \
            build_v145/app/src/main/java/com/example/settings/AppSettings.kt \
            > "$RUNNER_TEMP/r8-clean-protected.sha256"

      - name: Remove colored glow under quick image actions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('build_v145/app/build.gradle.kts')
          g = gradle.read_text()
          assert g.count('versionCode = 148') == 1
          assert g.count('versionName = "5.68-v145-ui-polish-r7"') == 1
          g = g.replace('versionCode = 148', 'versionCode = 149', 1)
          g = g.replace('versionName = "5.68-v145-ui-polish-r7"', 'versionName = "5.69-v145-ui-polish-r8-clean-glow"', 1)
          gradle.write_text(g)

          p = Path('build_v145/app/src/main/java/com/example/ui/LabTestsScreen.kt')
          s = p.read_text()

          save_old = '''modifier = Modifier
                        .weight(1f)
                        .shadow(13.dp, RoundedCornerShape(13.dp), ambientColor = Color(0xFF25F0A7), spotColor = Color(0xFF25F0A7))'''
          share_old = '''modifier = Modifier
                        .weight(1f)
                        .shadow(11.dp, RoundedCornerShape(13.dp), ambientColor = Color(0xFFAE72FF), spotColor = Color(0xFFAE72FF))'''
          clean = '''modifier = Modifier
                        .weight(1f)'''

          assert s.count(save_old) == 1, f'green glow occurrences={s.count(save_old)}'
          assert s.count(share_old) == 1, f'purple glow occurrences={s.count(share_old)}'
          s = s.replace(save_old, clean, 1)
          s = s.replace(share_old, clean, 1)

          assert 'ambientColor = Color(0xFF25F0A7)' not in s
          assert 'ambientColor = Color(0xFFAE72FF)' not in s
          p.write_text(s)
          PY

      - name: Safety audit
        shell: bash
        run: |
          set -euo pipefail
          cd build_v145
          git diff --check
          EXPECTED="$(printf '%s\n' \
            app/build.gradle.kts \
            app/src/main/java/com/example/ui/LabTestsScreen.kt | sort)"
          ACTUAL="$(git diff --name-only | sort)"
          test "$ACTUAL" = "$EXPECTED"
          sed 's#build_v145/##' "$RUNNER_TEMP/r8-clean-protected.sha256" > "$RUNNER_TEMP/r8-clean-protected-local.sha256"
          sha256sum -c "$RUNNER_TEMP/r8-clean-protected-local.sha256"
          grep -Fq 'versionCode = 149' app/build.gradle.kts
          grep -Fq 'versionName = "5.69-v145-ui-polish-r8-clean-glow"' app/build.gradle.kts
          ! grep -Fq 'ambientColor = Color(0xFF25F0A7)' app/src/main/java/com/example/ui/LabTestsScreen.kt
          ! grep -Fq 'ambientColor = Color(0xFFAE72FF)' app/src/main/java/com/example/ui/LabTestsScreen.kt
          grep -Fq '.aspectRatio(1f)' app/src/main/java/com/example/ui/LabTestsScreen.kt
          grep -Fq 'package_details_' app/src/main/java/com/example/ui/LabTestsScreen.kt
          python3 -c 'import json; x=json.load(open("app/src/main/assets/lab_tests_android.json")); assert len(x)==331'

      - name: Load proven production signer
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          WF='.github/workflows/android-v144-ONLY-SESSION-RELOCK-FIX-FINAL-ONE-RUN-R3-AUDITED.yml'
          test -s "$WF"
          extract_step() {
            local name="$1" out="$2"
            awk -v target="$name" '
              $0 == "      - name: " target { found=1; next }
              found && /^        run: \|/ { inrun=1; next }
              inrun && /^      - name:/ { exit }
              inrun { sub(/^          /,""); print }
            ' "$WF" > "$out"
            test -s "$out"
          }
          extract_step 'Prepare deterministic APK certificate reader' "$RUNNER_TEMP/cert.sh"
          extract_step 'Select exact installed Android signer' "$RUNNER_TEMP/signer.sh"
          bash "$RUNNER_TEMP/cert.sh"
          bash "$RUNNER_TEMP/signer.sh"

      - name: Confirm signing environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_PATH:-}"
          test -n "${STORE_PASSWORD:-}"
          test -n "${KEY_ALIAS:-}"
          test -n "${KEY_PASSWORD:-}"
          test -f "$KEYSTORE_PATH"

      - name: Compile and build
        working-directory: build_v145
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:compileReleaseKotlin
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build_v145/app/build/outputs/apk/release -type f -name '*.apk' | sort | head -1)"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          curl -fL --retry 3 \
            'https://github.com/ahmedmeshrf22-jpg/lab-tests-directory/releases/download/v145-ui-polish-r7/Tahalil-Alakkad-V145-R7-SQUARE-PACKAGES-SIGNED.apk' \
            -o "$RUNNER_TEMP/r7.apk"
          NEW_CERT="$(python3 "$RUNNER_TEMP/apk_cert_sha256.py" "$APK" | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
          OLD_CERT="$(python3 "$RUNNER_TEMP/apk_cert_sha256.py" "$RUNNER_TEMP/r7.apk" | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
          test "$NEW_CERT" = "$OLD_CERT"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          echo "$BADGING" | grep -Fq "package: name='com.aistudio.labtestsdirectory.egypt'"
          echo "$BADGING" | grep -Fq "versionCode='149'"
          echo "$BADGING" | grep -Fq "versionName='5.69-v145-ui-polish-r8-clean-glow'"
          cp "$APK" Tahalil-Alakkad-V145-R8-CLEAN-GLOW-SIGNED.apk
          sha256sum Tahalil-Alakkad-V145-R8-CLEAN-GLOW-SIGNED.apk > Tahalil-Alakkad-V145-R8-CLEAN-GLOW-SIGNED.apk.sha256

      - name: Commit exact R8 source
        shell: bash
        run: |
          set -euo pipefail
          cd build_v145
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B v145-ui-polish-r8-clean-glow
          git add app/build.gradle.kts app/src/main/java/com/example/ui/LabTestsScreen.kt
          git commit -m 'R8 remove colored quick image glow'
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          git archive --format=zip --output="$GITHUB_WORKSPACE/Tahalil-Alakkad-V145-R8-CLEAN-GLOW-SOURCE.zip" HEAD

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V145-R8-CLEAN-GLOW
          path: |
            Tahalil-Alakkad-V145-R8-CLEAN-GLOW-SIGNED.apk
            Tahalil-Alakkad-V145-R8-CLEAN-GLOW-SIGNED.apk.sha256
            Tahalil-Alakkad-V145-R8-CLEAN-GLOW-SOURCE.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish R8 branch and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C build_v145 push --force origin HEAD:refs/heads/v145-ui-polish-r8-clean-glow
          if gh release view v145-ui-polish-r8-clean-glow --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v145-ui-polish-r8-clean-glow \
              Tahalil-Alakkad-V145-R8-CLEAN-GLOW-SIGNED.apk \
              Tahalil-Alakkad-V145-R8-CLEAN-GLOW-SIGNED.apk.sha256 \
              Tahalil-Alakkad-V145-R8-CLEAN-GLOW-SOURCE.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v145-ui-polish-r8-clean-glow \
              Tahalil-Alakkad-V145-R8-CLEAN-GLOW-SIGNED.apk \
              Tahalil-Alakkad-V145-R8-CLEAN-GLOW-SIGNED.apk.sha256 \
              Tahalil-Alakkad-V145-R8-CLEAN-GLOW-SOURCE.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$FINAL_SHA" \
              --title 'Tahalil Alakkad V145 R8 Clean Glow' \
              --notes 'R8: removes the purple and green colored glow under Share and Save Image in Quick Image. All R7 behavior and production signing are preserved.'
          fi
