name: Android V143 Organ Search FINAL AUDITED

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-android-v143-organ-search-everywhere
  cancel-in-progress: false

jobs:
  build-v143:
    name: Fix organ search everywhere + sign + release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout old signing repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Resolve exact V142 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          REF='refs/remotes/origin/v142-android-backup-smart-search-ui-base'
          git rev-parse --verify "$REF^{commit}" >/dev/null
          git show "$REF:app/build.gradle.kts" | grep -Fq 'versionCode = 142'
          git show "$REF:app/src/main/java/com/example/data/repository/LabTestRepository.kt" | grep -Fq 'V142 semantic organ/system search'
          rm -rf build_v143
          git worktree add --detach build_v143 "$REF"
          echo "Resolved V142 source: $REF"

      - name: Apply V143 organ-search-everywhere fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json, re

          root = Path('build_v143')
          grad = root/'app/build.gradle.kts'
          vmf = root/'app/src/main/java/com/example/ui/LabTestsViewModel.kt'
          asset = root/'app/src/main/assets/lab_tests_android.json'

          # Version bump: install directly over V142.
          g = grad.read_text(encoding='utf-8')
          g, n = re.subn(r'versionCode\s*=\s*142\b', 'versionCode = 143', g, count=1)
          if n != 1:
              raise SystemExit('Expected V142 versionCode marker not found')
          g, n2 = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "5.63-organ-search-everywhere-v143"', g, count=1)
          if n2 != 1:
              raise SystemExit('versionName marker not found')
          grad.write_text(g, encoding='utf-8')

          # Fix grouped/manual/OCR path: never discard semantic matches just because
          # one literal/direct match exists. Smart results are first, then direct,
          # de-duplicated by test id.
          vm = vmf.read_text(encoding='utf-8')
          old = '''                val directMatches = repository.searchTests(q)\n                // V142: a natural/clinical phrase is accepted for each item too.\n                val allMatches = if (directMatches.isNotEmpty()) directMatches else repository.smartSearchTests(q)'''
          new = '''                val directMatches = repository.searchTests(q)\n                val smartMatches = repository.smartSearchTests(q)\n                // V143: semantic organ matches must NEVER be hidden by one literal match.\n                val allMatches = (smartMatches + directMatches).distinctBy { it.id }'''
          if old in vm:
              vm = vm.replace(old, new, 1)
          elif 'val allMatches = (smartMatches + directMatches).distinctBy { it.id }' not in vm:
              raise SystemExit('V142 grouped-search fallback marker not found')
          vmf.write_text(vm, encoding='utf-8')

          tests = json.loads(asset.read_text(encoding='utf-8-sig'))
          if len(tests) != 331:
              raise SystemExit(f'Expected 331 tests, found {len(tests)}')

          # These aliases are written into each related test's search_text so EVERY
          # search surface (including literal/direct search) understands organs.
          organ_rules = [
              (["القلب","قلب","عضلة القلب","عضله القلب","انزيمات القلب","إنزيمات القلب","تحاليل القلب","فحص القلب","اطمن على القلب","اطمئن على القلب","عايز اطمن على القلب","عاوز اطمن على القلب","heart","cardiac","cardiology"],
               ["CK-MB","Troponin I (Qualitative)","Troponin I (Quantitative)","Homocysteine","CRP","LDH (Lactate Dehydrogenase)","Cholesterol","HDL","LDL Cholesterol","Triglyceride"]),
              (["الكبد","كبد","وظائف الكبد","انزيمات الكبد","إنزيمات الكبد","تحاليل الكبد","اطمن على الكبد","اطمئن على الكبد","liver","hepatic"],
               ["ALT (SGPT)","AST (SGOT)","GGT","Alkaline Phosphatase","Bilirubin (Total)","Bilirubin (Direct)","Bilirubin (Indirect)","Albumin","Total Protein","Prothrombin Time & Conc","HBs Ag","HCV Ab","AFP"]),
              (["الكلى","الكليتين","كلى","كلية","وظائف الكلى","تحاليل الكلى","اطمن على الكلى","اطمئن على الكلى","kidney","kidneys","renal"],
               ["Creatinine","Blood Urea","BUN","eGFR","Creatinine Clearance","Albumin/Creatinine Ratio","Micro Albumin Random","Micro Albumin in 24 hrs","Protein in Urine Random","Sodium (Na)","Potassium (K)","Phosphorous","Uric Acid"]),
              (["الغدة الدرقية","الغده الدرقيه","الدرقية","درقية","وظائف الغدة الدرقية","اطمن على الغدة الدرقية","thyroid"],
               ["TSH","T3","T4","Free T3","Free T4","Anti Thyroid Ab","Thyroid Ab (Anti-Microsomal / Peroxidase Ab)"]),
              (["البنكرياس","بنكرياس","وظائف البنكرياس","تحاليل البنكرياس","اطمن على البنكرياس","pancreas","pancreatic"],
               ["Amylase","Amylase in urine","Lipase","Blood Glucose Fasting","Glucose Random","Blood Glucose 2 hrs P.P","Glycated Haemoglobin (HbA1c)","Insulin Level (Fasting)","Insulin (Random)","C-Peptide (Fasting)","C-Peptide (Random)","Homa-IR","Anti Islet Cells Antibody"]),
              (["البروستاتا","بروستاتا","تحاليل البروستاتا","اطمن على البروستاتا","prostate"],
               ["PSA (Total)","PSA (Free)"]),
              (["المبيض","المبايض","مبيض","مبايض","مخزون المبيض","تحاليل المبايض","اطمن على المبايض","ovary","ovaries","ovarian"],
               ["AMH","CA 125","FSH","LH","Estradiol (E2)","Progesterone"]),
              (["الرحم","رحم","عنق الرحم","تحاليل الرحم","اطمن على الرحم","uterus","uterine","cervix","cervical"],
               ["Beta HCG Quantitative","Progesterone","Estradiol (E2)","FSH","LH","CA 125","Cervical Swab C/S"]),
              (["الغدة النخامية","الغده النخاميه","النخامية","النخاميه","نخامية","pituitary"],
               ["ACTH AM","ACTH PM","FSH","LH","PRL","Growth Hormone (Basal)","Insulin Like Growth Factor-1 (IGF-1)","TSH"]),
              (["الغدة الكظرية","الغده الكظريه","الكظرية","الكظريه","كظرية","adrenal"],
               ["Cortisol AM","Cortisol PM","Cortisol Random","ACTH AM","ACTH PM","Aldosterone","Aldosterone / Renin Ratio","DHEA","DHEA-S"]),
              (["العظام","عظام","صحة العظام","تحاليل العظام","اطمن على العظام","bone","bones"],
               ["Vit D3 (25 Hydroxycholecalciferol)","Calcium (Total)","Calcium (Ionized)","Phosphorous","PTH","Alkaline Phosphatase"]),
              (["العضلات","عضلات","عضلة","عضله","تحاليل العضلات","muscle","muscles"],
               ["CK Total","LDH (Lactate Dehydrogenase)","AST (SGOT)"]),
              (["المعدة","المعده","معدة","معده","تحاليل المعدة","جرثومة المعدة","اطمن على المعدة","stomach","gastric"],
               ["H. Pylori IgG","H. Pylori IgM","H. Pylori Ag (in stool)","Gastrin Level"]),
              (["القولون","قولون","الأمعاء","الامعاء","أمعاء","امعاء","تحاليل القولون","اطمن على القولون","colon","bowel","intestine","intestinal"],
               ["Calprotectin in Stool","Occult Blood in Stool","CEA","Stool Analysis","Stool C/S"]),
              (["الرئة","الرئه","الرئتين","رئة","رئه","التنفس","الجهاز التنفسي","تحاليل الرئة","اطمن على الرئة","lung","lungs","pulmonary","respiratory"],
               ["D-Dimer","Alpha 1 Antitrypsin (Serum)","Sputum C/S","Acid Fast Bacilli (Sputum)","T.B Gold (QuantiFERON)","T.B DNA by PCR","IgE Specific (Inhalant Allergens) RAST"]),
              (["الثدي","ثدي","تحاليل الثدي","اطمن على الثدي","breast"],
               ["CA 15.3","PRL"]),
              (["الخصية","الخصيه","الخصيتين","خصية","خصيه","تحاليل الخصية","اطمن على الخصية","testis","testicle","testicular","male fertility"],
               ["Testosterone Total","Testosterone Free","FSH","LH","Semen Analysis","Semen Analysis with CASA","Semen C/S","Fructose In Semen","Anti Sperm Ab (Semen)"]),
          ]

          by_name = {str(t.get('english_name','')).strip().casefold(): t for t in tests}
          touched = set()
          missing = []
          for aliases, targets in organ_rules:
              alias_blob = ' | '.join(aliases)
              for target in targets:
                  t = by_name.get(target.casefold())
                  if not t:
                      missing.append(target)
                      continue
                  st = str(t.get('search_text','')).strip()
                  if aliases[0] not in st:
                      st = (st + ' | ' + alias_blob).strip(' |')
                  t['search_text'] = st
                  touched.add(t.get('id'))

          # Heart is the acceptance-critical requirement: all 10 must exist and be searchable by القلب.
          heart_targets = organ_rules[0][1]
          for name in heart_targets:
              t = by_name.get(name.casefold())
              if not t:
                  raise SystemExit(f'Heart target missing from catalogue: {name}')
              if 'القلب' not in str(t.get('search_text','')):
                  raise SystemExit(f'Heart direct-search alias missing after patch: {name}')

          asset.write_text(json.dumps(tests, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Organ aliases written into search_text for {len(touched)} catalogue entries')
          if missing:
              print('Optional target names not present in this 331-test catalogue:', ', '.join(sorted(set(missing))))
          PY

      - name: Deep audit V143 requested behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json
          root=Path('build_v143')
          grad=(root/'app/build.gradle.kts').read_text(encoding='utf-8')
          vm=(root/'app/src/main/java/com/example/ui/LabTestsViewModel.kt').read_text(encoding='utf-8')
          repo=(root/'app/src/main/java/com/example/data/repository/LabTestRepository.kt').read_text(encoding='utf-8')
          tests=json.loads((root/'app/src/main/assets/lab_tests_android.json').read_text(encoding='utf-8'))
          allkt='\n'.join(p.read_text(errors='ignore') for p in (root/'app/src/main/java').rglob('*.kt'))
          by={t['english_name']:t for t in tests}
          heart=["CK-MB","Troponin I (Qualitative)","Troponin I (Quantitative)","Homocysteine","CRP","LDH (Lactate Dehydrogenase)","Cholesterol","HDL","LDL Cholesterol","Triglyceride"]
          checks={
            'V143 version': 'versionCode = 143' in grad and '5.63-organ-search-everywhere-v143' in grad,
            'same package': 'applicationId = "com.aistudio.labtestsdirectory.egypt"' in grad,
            '331 tests': len(tests)==331,
            'heart all 10 direct searchable': all(n in by and 'القلب' in by[n].get('search_text','') for n in heart),
            'both troponin I preserved': 'Troponin I (Qualitative)' in by and 'Troponin I (Quantitative)' in by,
            'smart + direct merged': 'val smartMatches = repository.smartSearchTests(q)' in vm and '(smartMatches + directMatches).distinctBy { it.id }' in vm,
            'V142 semantic rules preserved': 'V142 semantic organ/system search' in repo,
            'backup UI preserved': 'V142_QUICK_BACKUP' in allkt and 'نسخة احتياطية الآن' in allkt,
            'login tagline preserved': 'V142_CARE_TAGLINE' in allkt and 'رعاية' in allkt and 'تليق' in allkt and 'بك' in allkt,
            'screenshots enabled': 'FLAG_SECURE' not in allkt,
            'direct search consumes search_text': 'normSearch' in repo and 'searchTests' in repo,
            'catalog override preserved': 'applyRemoteCatalogOverride' in repo,
            'no Cloudflare': 'cloudflare' not in allkt.lower() and 'workers.dev' not in allkt.lower(),
          }
          for k,v in checks.items(): print(('OK   ' if v else 'FAIL ')+k)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('V143 AUDIT FAILED: '+', '.join(bad))
          print('V143 ORGAN SEARCH EVERYWHERE AUDIT PASSED')
          PY

      - name: Audit V143 change surface only
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          root = Path("build_v143")
          changed = set(
              subprocess.check_output(
                  ["git", "-C", str(root), "diff", "--name-only"],
                  text=True
              ).splitlines()
          )

          expected = {
              "app/build.gradle.kts",
              "app/src/main/assets/lab_tests_android.json",
              "app/src/main/java/com/example/ui/LabTestsViewModel.kt",
          }

          if changed != expected:
              raise SystemExit(
                  "Unexpected V143 changed files. "
                  f"Expected={sorted(expected)} actual={sorted(changed)}"
              )

          print("V143 change surface is exactly the 3 intended Android files.")
          PY

      - name: Compile-check Android V143
        working-directory: build_v143
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:compileReleaseKotlin

      - name: Restore exact V142 signing method
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_BUNDLE_B64:-}" ]; then
            echo "::error::TAHALIL_SIGNING_BUNDLE_B64 is missing in the old signing repository."
            exit 1
          fi

          SIGN_DIR="$RUNNER_TEMP/tahalil_v143_signing"
          rm -rf "$SIGN_DIR" && mkdir -p "$SIGN_DIR/files"
          printf '%s' "$SIGNING_BUNDLE_B64" | tr -d '\r\n ' | base64 --decode > "$SIGN_DIR/bundle.bin"

          if unzip -t "$SIGN_DIR/bundle.bin" >/dev/null 2>&1; then
            unzip -q "$SIGN_DIR/bundle.bin" -d "$SIGN_DIR/files"
          else
            cp "$SIGN_DIR/bundle.bin" "$SIGN_DIR/files/original.keystore"
          fi

          KEYSTORE="$(find "$SIGN_DIR/files" -type f \( -iname '*.jks' -o -iname '*.keystore' \) -print -quit)"
          test -n "$KEYSTORE"

          STORE_PASSWORD=''
          KEY_ALIAS=''
          KEY_PASSWORD=''

          while IFS= read -r META; do
            [ -f "$META" ] || continue
            [ -n "$STORE_PASSWORD" ] || STORE_PASSWORD="$(sed -nE 's/^[[:space:]]*(STORE_PASSWORD|KEYSTORE_PASSWORD|storePassword|store_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(sed -nE 's/^[[:space:]]*(KEY_ALIAS|keyAlias|key_alias)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$(sed -nE 's/^[[:space:]]*(KEY_PASSWORD|keyPassword|key_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
          done < <(find "$SIGN_DIR/files" -type f \( -iname '*.properties' -o -iname '*.env' -o -iname '*.txt' \) -print)

          if [ -z "$STORE_PASSWORD" ] && keytool -list -keystore "$KEYSTORE" -storepass android >/dev/null 2>&1; then
            STORE_PASSWORD=android
          fi

          test -n "$STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
          test -n "$KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$STORE_PASSWORD"

          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"

          {
            echo "KEYSTORE_PATH=$KEYSTORE"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "Original V142 signing method restored."

      - name: Preflight signer must equal installed V142
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -n "$APKSIGNER"

          V142_APK="$RUNNER_TEMP/android-v142-installed.apk"
          curl --fail --location --retry 3 \
            'https://github.com/ahmedmeshrf22-jpg/lab-tests-directory/releases/download/v142-android/Tahalil-Alakkad-V142-All-Fixes-Organ-Smart-Search-Android-SIGNED.apk' \
            -o "$V142_APK"

          "$APKSIGNER" verify --verbose --print-certs "$V142_APK" >/dev/null

          cert_from_apk() {
            local apk="$1"
            "$APKSIGNER" verify --print-certs "$apk" 2>&1 \
              | grep -i -m1 'certificate SHA-256 digest:' \
              | cut -d: -f2- \
              | tr -d ':[:space:]' \
              | tr 'A-F' 'a-f'
          }

          EXPECTED_CERT="$(cert_from_apk "$V142_APK")"
          test -n "$EXPECTED_CERT" || {
            echo "::error::Could not read installed V142 certificate digest."
            exit 1
          }

          SELECTED_CERT="$(
            keytool -exportcert \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" 2>/dev/null \
              | sha256sum \
              | awk '{print $1}'
          )"

          test -n "$SELECTED_CERT"
          test "$SELECTED_CERT" = "$EXPECTED_CERT" || {
            echo "::error::Signing key selected from the bundle is not the installed V142 identity."
            exit 1
          }

          echo "EXPECTED_V142_CERT=$EXPECTED_CERT" >> "$GITHUB_ENV"
          echo "Preflight signer identity matches installed V142."

      - name: Build signed Android V143
        working-directory: build_v143
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify signer against installed V142 and prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find build_v143/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          cert_from_apk() {
            local apk="$1"
            "$APKSIGNER" verify --print-certs "$apk" 2>&1 \
              | grep -i -m1 'certificate SHA-256 digest:' \
              | cut -d: -f2- \
              | tr -d ':[:space:]' \
              | tr 'A-F' 'a-f'
          }

          NEW_CERT="$(cert_from_apk "$APK")"
          OLD_CERT="${EXPECTED_V142_CERT:-}"

          test -n "$NEW_CERT" && test -n "$OLD_CERT" || {
            echo "::error::Could not read signer certificate during final V143 verification."
            exit 1
          }

          test "$NEW_CERT" = "$OLD_CERT" || {
            echo "::error::Built V143 APK signer differs from installed V142."
            exit 1
          }

          cp "$APK" Tahalil-Alakkad-V143-Organ-Search-Everywhere-SIGNED.apk
          sha256sum Tahalil-Alakkad-V143-Organ-Search-Everywhere-SIGNED.apk \
            > Tahalil-Alakkad-V143-Organ-Search-Everywhere-SIGNED.apk.sha256

          echo "Built V143 signer matches installed V142."

      - name: Publish immutable V143 source branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd build_v143
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B v143-android-organ-search-everywhere-base
          git add -A
          git commit -m 'Android V143 organ search everywhere fix' || true
          V143_SHA="$(git rev-parse HEAD)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/v143-android-organ-search-everywhere-base
          echo "V143_COMMIT_SHA=$V143_SHA" >> "$GITHUB_ENV"

      - name: Prepare source snapshot
        shell: bash
        run: |
          set -euo pipefail
          (cd build_v143 && zip -qr ../Tahalil-Alakkad-V143-Android-SOURCE.zip . -x '.git/*' '.gradle/*' 'app/build/*' 'build/*' '*.apk')
          sha256sum Tahalil-Alakkad-V143-Android-SOURCE.zip > Tahalil-Alakkad-V143-Android-SOURCE.zip.sha256

      - name: Upload V143 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-Android-V143-ORGAN-SEARCH-EVERYWHERE
          path: |
            Tahalil-Alakkad-V143-Organ-Search-Everywhere-SIGNED.apk
            Tahalil-Alakkad-V143-Organ-Search-Everywhere-SIGNED.apk.sha256
            Tahalil-Alakkad-V143-Android-SOURCE.zip
            Tahalil-Alakkad-V143-Android-SOURCE.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android V143 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v143-android'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              Tahalil-Alakkad-V143-Organ-Search-Everywhere-SIGNED.apk \
              Tahalil-Alakkad-V143-Organ-Search-Everywhere-SIGNED.apk.sha256 \
              Tahalil-Alakkad-V143-Android-SOURCE.zip \
              Tahalil-Alakkad-V143-Android-SOURCE.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              Tahalil-Alakkad-V143-Organ-Search-Everywhere-SIGNED.apk \
              Tahalil-Alakkad-V143-Organ-Search-Everywhere-SIGNED.apk.sha256 \
              Tahalil-Alakkad-V143-Android-SOURCE.zip \
              Tahalil-Alakkad-V143-Android-SOURCE.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$V143_COMMIT_SHA" \
              --title 'تحاليل العقاد Android V143 — Organ Search Everywhere' \
              --notes 'Fix: organ/system semantic search now works from direct search as well as smart/manual/OCR paths. Typing القلب returns CK-MB, both Troponin I qualitative/quantitative, Homocysteine, CRP, LDH, Cholesterol, HDL, LDL and Triglyceride. V142 backup UI, login tagline, Firebase, catalogue/prices and security behavior are preserved.'
          fi

      - name: Final status
        shell: bash
        run: |
          echo 'ANDROID V143 FINAL AUDITED: ORGAN SEARCH + EXACT V142 SIGNER + RELEASE PASSED'
