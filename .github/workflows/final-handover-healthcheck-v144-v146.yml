name: Diagnose Firestore Root Collections

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-root-collections:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_WEB_API_KEY: AIzaSyDHw4qrzsE04pQR7uj3GVOgEdyU5Cev49U

    steps:
      - name: Prepare Firebase service account
        shell: bash
        run: |
          set -euo pipefail

          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" \
            > "$RUNNER_TEMP/firebase-service-account.json"

          python3 -m json.tool \
            "$RUNNER_TEMP/firebase-service-account.json" \
            >/dev/null

          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" \
            >> "$GITHUB_ENV"


      - name: Install Firebase Admin SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/root-diagnostic"
          cd "$RUNNER_TEMP/root-diagnostic"

          npm init -y >/dev/null 2>&1

          npm install firebase-admin@13 \
            --no-audit \
            --no-fund


      - name: Diagnose Firestore root collections
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/root-diagnostic"

          cat > diagnose.cjs <<'NODE'
          const admin = require('firebase-admin');
          const fs = require('fs');

          const PROJECT = 'tahalil-alakkad';

          const PRIV_UID =
            'Wps5Y19pZSbeGooEzFfW5UFsshq2';

          const API_KEY =
            process.env.FIREBASE_WEB_API_KEY;

          const FIRESTORE_BASE =
            `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents`;


          const serviceAccount = JSON.parse(
            fs.readFileSync(
              process.env.GOOGLE_APPLICATION_CREDENTIALS,
              'utf8'
            )
          );


          admin.initializeApp({
            credential:
              admin.credential.cert(serviceAccount),

            projectId: PROJECT
          });


          async function getFirebaseIdToken() {

            console.log(
              'Creating Firebase custom token...'
            );

            const customToken =
              await admin.auth()
                .createCustomToken(PRIV_UID);


            const response =
              await fetch(
                `https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${encodeURIComponent(API_KEY)}`,
                {
                  method: 'POST',

                  headers: {
                    'Content-Type':
                      'application/json'
                  },

                  body: JSON.stringify({
                    token: customToken,
                    returnSecureToken: true
                  })
                }
              );


            const body =
              await response.json()
                .catch(() => ({}));


            if (
              !response.ok ||
              !body.idToken
            ) {
              throw new Error(
                `Firebase token exchange failed HTTP ${response.status}`
              );
            }


            console.log(
              'Firebase ID token created successfully'
            );

            return body.idToken;
          }


          async function testCollection(
            token,
            collection
          ) {

            const url =
              `${FIRESTORE_BASE}/${collection}?pageSize=500`;


            const started =
              Date.now();


            const response =
              await fetch(
                url,
                {
                  headers: {
                    Authorization:
                      `Bearer ${token}`,

                    Accept:
                      'application/json'
                  }
                }
              );


            const elapsedMs =
              Date.now() - started;


            const text =
              await response.text();


            let body = {};

            try {
              body =
                text
                  ? JSON.parse(text)
                  : {};
            } catch {
              body = {};
            }


            const documents =
              Array.isArray(body.documents)
                ? body.documents
                : [];


            const result = {

              collection,

              http_status:
                response.status,

              success:
                response.ok ||
                response.status === 404,

              first_page_documents:
                documents.length,

              has_next_page:
                typeof body.nextPageToken === 'string' &&
                body.nextPageToken.length > 0,

              elapsed_ms:
                elapsedMs
            };


            if (!result.success) {

              result.error =
                String(
                  body?.error?.status ||
                  body?.error?.message ||
                  text ||
                  'UNKNOWN_ERROR'
                ).slice(0, 1000);

            }


            return result;
          }


          async function main() {

            const token =
              await getFirebaseIdToken();


            const collections = [

              'audit_logs',

              'customers',

              'customer_price_overrides',

              'lab2lab_prices',

              'phone_registry',

              'lab_orders',

              'lab_catalog_overrides'

            ];


            const results = [];

            let failures = 0;


            console.log('');
            console.log(
              '===== FIRESTORE ROOT COLLECTION TEST ====='
            );
            console.log('');


            for (
              const collection
              of collections
            ) {

              console.log(
                `Testing ${collection} ...`
              );


              const result =
                await testCollection(
                  token,
                  collection
                );


              results.push(result);


              console.log(
                JSON.stringify(
                  result,
                  null,
                  2
                )
              );


              if (!result.success) {

                failures++;

                console.error(
                  `FAILED COLLECTION: ${collection}`
                );

              } else {

                console.log(
                  `PASSED COLLECTION: ${collection}`
                );

              }


              console.log('');
            }


            const report = {

              project:
                PROJECT,

              diagnostic_type:
                'firestore_root_collections',

              read_only:
                true,

              checked_at:
                new Date().toISOString(),

              failures,

              all_passed:
                failures === 0,

              results

            };


            fs.writeFileSync(

              'firestore-root-diagnostic.json',

              JSON.stringify(
                report,
                null,
                2
              )

            );


            console.log('');
            console.log(
              '===== FINAL DIAGNOSTIC RESULT ====='
            );


            if (failures > 0) {

              console.error(
                `FAILED ROOT COLLECTIONS: ${failures}`
              );

              for (
                const r
                of results.filter(
                  x => !x.success
                )
              ) {

                console.error(
                  `${r.collection} -> HTTP ${r.http_status} -> ${r.error}`
                );

              }


              process.exit(1);

            }


            console.log(
              'ALL FIRESTORE ROOT COLLECTIONS PASSED'
            );

          }


          main()
            .catch(
              error => {

                console.error(
                  'DIAGNOSTIC FAILED:',
                  error.message || error
                );

                process.exit(1);

              }
            );
          NODE


          node --check diagnose.cjs

          node diagnose.cjs


      - name: Upload diagnostic report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: firestore-root-collections-diagnostic

          path: ${{ runner.temp }}/root-diagnostic/firestore-root-diagnostic.json

          if-no-files-found: ignore


      - name: Final summary
        if: success()

        shell: bash

        run: |
          echo "## Firestore Root Diagnostic PASSED" >> "$GITHUB_STEP_SUMMARY"

          echo "All root collections used by Supabase Reconcile were readable with the privileged Firebase account." >> "$GITHUB_STEP_SUMMARY"
