name: Export Android Signing Rescue CMS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt original signing bundle for recovery
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
          RECOVERY_CERT_B64: 
        run: |
          set -euo pipefail
          test -n "${SIGNING_BUNDLE_B64:-}" || { echo "::error::Missing TAHALIL_SIGNING_BUNDLE_B64"; exit 1; }
          umask 077
          printf '%s' "$SIGNING_BUNDLE_B64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/signing-bundle.bin"
          test -s "$RUNNER_TEMP/signing-bundle.bin"
          printf '%s' "$RECOVERY_CERT_B64" | base64 --decode > "$RUNNER_TEMP/recovery-cert.pem"
          openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/signing-bundle.bin" -outform DER -out Tahalil-Android-Signing-Rescue.cms "$RUNNER_TEMP/recovery-cert.pem"
          sha256sum Tahalil-Android-Signing-Rescue.cms > Tahalil-Android-Signing-Rescue.cms.sha256
          rm -f "$RUNNER_TEMP/signing-bundle.bin" "$RUNNER_TEMP/recovery-cert.pem"

      - name: Publish encrypted rescue as draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="signing-rescue-$(date -u +'%Y%m%d-%H%M%S')"
          gh release create "$TAG" \
            Tahalil-Android-Signing-Rescue.cms \
            Tahalil-Android-Signing-Rescue.cms.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Android Signing Rescue — CMS Encrypted" \
            --notes "One-time encrypted rescue of the original Android signing bundle. Safe to keep as draft; ciphertext only." \
            --draft
