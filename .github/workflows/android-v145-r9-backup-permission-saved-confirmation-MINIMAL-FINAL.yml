name: Android V145 R9 BACKUP FIX FINAL VERIFIED

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-v145-r9-backup-permission-saved-popup.yml'

permissions:
  contents: write

concurrency:
  group: android-v145-r9-backup-permission-saved-popup
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare exact released R8 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          REF='refs/remotes/origin/v145-ui-polish-r8-clean-glow'
          EXPECTED='ae682c504d7a52b94a2f71c0c4088bb169a943df'
          test "$(git rev-parse "$REF^{commit}")" = "$EXPECTED"

          rm -rf build_v145_r9
          git worktree add --detach build_v145_r9 "$REF"

          grep -Fq 'versionCode = 149' build_v145_r9/app/build.gradle.kts
          grep -Fq 'versionName = "5.69-v145-ui-polish-r8-clean-glow"' build_v145_r9/app/build.gradle.kts
          python3 -c 'import json; x=json.load(open("build_v145_r9/app/src/main/assets/lab_tests_android.json")); assert len(x)==331'

          sha256sum \
            build_v145_r9/firestore.rules \
            build_v145_r9/app/google-services.json \
            build_v145_r9/app/src/main/assets/lab_tests_android.json \
            build_v145_r9/app/src/main/java/com/example/MainActivity.kt \
            build_v145_r9/app/src/main/java/com/example/settings/AppSettings.kt \
            > "$RUNNER_TEMP/r9-protected.sha256"

