    - name: Audit every Android action before build
      shell: bash
      run: |
        set -euo pipefail
        python3 <<'PYAUDIT'
        from pathlib import Path
        import re
        r=Path('build_v121')
        src=r/'app/src/main/java'
        files=list(src.rglob('*.kt'))
        allkt='\n'.join(p.read_text(errors='ignore') for p in files)
        grad=(r/'app/build.gradle.kts').read_text()

        checks={
          'V122 version':'versionCode = 122' in grad and '5.42-final-icon-labels-v122' in grad,
          'labeled icon helper':(src/'com/example/ui/LabeledIconAction.kt').exists(),
          'no Button/OutlinedButton/TextButton':not re.search(r'\b(Button|OutlinedButton|TextButton)\s*\(',allkt),
          'no Switch':not re.search(r'\bSwitch\s*\(',allkt),
          'no FilterChip':not re.search(r'\bFilterChip\s*\(',allkt),
          'no clickable modifier':not re.search(r'\.clickable\s*\(',allkt),
          'result download preserved':'saveResultToDownloads' in allkt and 'MediaStore.Downloads.EXTERNAL_CONTENT_URI' in allkt,
          'result share preserved':'fun shareResult' in allkt and 'Intent.ACTION_SEND' in allkt,
          'result revision preserved':'requestResultRevision' in allkt and 'result_revision_requested' in allkt,
          'mobile notifications preserved':'class OrderRealtimeNotificationService' in allkt and 'وصلت نتيجة التحاليل' in allkt and 'طلب تعديل نتيجة' in allkt,
        }
        for p in files:
            if p.name == 'LabeledIconAction.kt':
                continue
            if re.search(r'\bIconButton\s*\(',p.read_text(errors='ignore')):
                checks['no raw IconButton outside helper']=False
                break
        else:
            checks['no raw IconButton outside helper']=True

        # Every action has an explicit label parameter. Calls are counted line-wise because
        # the transformer writes the label in the opening call for all generated controls.
        count=len(re.findall(r'\bLabeledIconAction\s*\(',allkt))-1
        missing=[]
        for p in files:
            if p.name=='LabeledIconAction.kt': continue
            s=p.read_text(errors='ignore')
            for m in re.finditer(r'\bLabeledIconAction\s*\(',s):
                tail=s[m.start():m.start()+700]
                if not re.search(r'\blabel\s*=',tail):
                    missing.append(f'{p.name}:{s.count(chr(10),0,m.start())+1}')
        checks['every action has label underneath']=count >= 230 and not missing

        for k,v in checks.items(): print(('OK   ' if v else 'FAIL ')+k)
        print('Labeled action count:',count)
        if missing: print('Missing labels:',missing)
        bad=[k for k,v in checks.items() if not v]
        if bad: raise SystemExit('V122 FINAL UI AUDIT FAILED: '+', '.join(bad))
        print('ALL V122 FINAL ICON + LABEL + RESULT + NOTIFICATION CHECKS PASSED')
        PYAUDIT
