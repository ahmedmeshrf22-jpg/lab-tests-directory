          'Firebase remains authoritative':'FirebaseAuth' in allkt and 'FirebaseFirestore' in allkt,
          'no Supabase SDK dependency':'io.supabase' not in allkt.lower() and 'supabase-kt' not in grad.lower() and 'supabaseclient' not in allkt.lower(),
          'no Supabase keys in APK':all(x not in allkt for x in ['sb_secret_','sb_publishable_','SUPABASE_SERVICE_ROLE_KEY','SUPABASE_SECRET_KEYS','BEGIN PRIVATE KEY']),
          'only public Edge Function endpoint':'https://ogidyelgmigcvasizzuv.supabase.co/functions/v1/tahalil-shadow-mirror' in rep,
          'Firebase token authenticates shadow':'getIdToken(false)' in rep and 'getIdToken(true)' in rep and 'Bearer $token' in rep,
          'no added backup Firestore listeners/queries':all(x not in rep for x in ['FirebaseFirestore','addSnapshotListener','collectionGroup(','attachQuery(','attachDocument(']),
          'bounded best-effort executor':all(x in rep for x in ['ThreadPoolExecutor','ArrayBlockingQueue(MAX_QUEUE)','AbortPolicy()']),
          'failures never block Firebase':'Shadow backup is deliberately non-blocking' in rep and 'catch (_: Throwable)' in rep,
          'approved enabled device gate':'accountEnabled == true' in main and 'deviceAccessStatus == "approved"' in main and 'ShadowBackupReplicator.start' in main,
          'replicator stops outside gate':'ShadowBackupReplicator.stop' in main,
          'session bound requests':'activeUid' in rep and 'sessionMatches(expectedUid)' in rep,
          'existing customer snapshots reused':'snapshot.documents.forEach { ShadowBackupReplicator.mirrorSnapshot(it) }' in vm,
          'post-success customer/order/payment hooks':all(x in vm for x in ['mirrorPath(customerRef.path, now)','mirrorPath(orderRef.path, now)','mirrorPath(paymentRef.path, now)']),
          'price shadow hooks':'mirrorPath(labRef.path, System.currentTimeMillis())' in vm,
          'delete tombstones':'tombstone = true' in vm and 'lab_orders/${order.id}' in vm,
          'result metadata shadow only':'mirrorPath(metaRef.path, System.currentTimeMillis())' in store,
          'no result chunk shadow':not re.search(r'ShadowBackupReplicator\.(?:mirrorPath|mirrorSnapshot)\([^\n]*(?:chunk|part)', store, re.I),
          'no failover reads':'shadow_entities' not in allkt and '/rest/v1/' not in allkt,
          'V128 adapter layer preserved':'SecondaryBackendAdapter' in allkt and 'BackendResiliencePolicy' in allkt,
          'V127 offline vault preserved':'OfflineAccessVault' in allkt and 'offlineGraceAccess' in screen,
          'V126 draggable icons preserved':'detectDragGesturesAfterLongPress' in screen and 'v126_manager_home_icon_order' in screen,
          'results preserved':'saveResultToDownloads' in allkt and 'requestResultRevision' in allkt,
          'notifications preserved':'class OrderRealtimeNotificationService' in allkt,
          'credential reset preserved':'resetUserLoginCredentials' in allkt and 'sendPasswordResetEmail' not in allkt,
          'no Cloudflare':'cloudflare' not in allkt.lower() and 'workers.dev' not in allkt.lower(),
        }
        for k,v in checks.items(): print(('OK   ' if v else 'FAIL ')+k)
        bad=[k for k,v in checks.items() if not v]
        if bad: raise SystemExit('V129 SAFETY AUDIT FAILED: '+', '.join(bad))
        print('ALL V129 ZERO-EXTRA-READ SHADOW BACKUP CHECKS PASSED')
        PYAUDIT129
    - name: Restore original Android signing
      shell: bash
      env:
        SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
      run: |
        set -euo pipefail
        test -n "${SIGNING_BUNDLE_B64:-}"
        rm -rf /tmp/tahalil_sign
        mkdir -p /tmp/tahalil_sign/files
        printf '%s' "$SIGNING_BUNDLE_B64" | tr -d '\r\n ' | base64 --decode > /tmp/tahalil_sign/bundle.bin
        if unzip -t /tmp/tahalil_sign/bundle.bin >/dev/null 2>&1; then
          unzip -q /tmp/tahalil_sign/bundle.bin -d /tmp/tahalil_sign/files
        else
          cp /tmp/tahalil_sign/bundle.bin /tmp/tahalil_sign/files/original.keystore
        fi
        KEYSTORE="$(find /tmp/tahalil_sign/files -type f \( -iname '*.jks' -o -iname '*.keystore' \) -print -quit)"
        test -n "$KEYSTORE"
        STORE_PASSWORD=""; KEY_ALIAS=""; KEY_PASSWORD=""
        while IFS= read -r META; do
          [ -f "$META" ] || continue
          [ -n "$STORE_PASSWORD" ] || STORE_PASSWORD="$(sed -nE 's/^[[:space:]]*(STORE_PASSWORD|KEYSTORE_PASSWORD|storePassword|store_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
          [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(sed -nE 's/^[[:space:]]*(KEY_ALIAS|keyAlias|key_alias)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
          [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$(sed -nE 's/^[[:space:]]*(KEY_PASSWORD|keyPassword|key_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
        done < <(find /tmp/tahalil_sign/files -type f \( -iname '*.properties' -o -iname '*.env' -o -iname '*.txt' \) -print)
        if [ -z "$STORE_PASSWORD" ] && keytool -list -keystore "$KEYSTORE" -storepass android >/dev/null 2>&1; then STORE_PASSWORD=android; fi
        test -n "$STORE_PASSWORD"
        [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
        test -n "$KEY_ALIAS"
        [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$STORE_PASSWORD"
        keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
        cp "$KEYSTORE" build_v121/original-signing-key.jks
        echo "::add-mask::$STORE_PASSWORD"; echo "::add-mask::$KEY_ALIAS"; echo "::add-mask::$KEY_PASSWORD"
        {
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/build_v121/original-signing-key.jks"
          echo "STORE_PASSWORD=$STORE_PASSWORD"
          echo "KEY_ALIAS=$KEY_ALIAS"
          echo "KEY_PASSWORD=$KEY_PASSWORD"
        } >> "$GITHUB_ENV"
    - name: Build signed Android V129
      shell: bash
      working-directory: build_v121
      run: |
        set -euo pipefail
        gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease
    - name: Verify signature and prepare V129 release
      shell: bash
      run: |
        set -euo pipefail
        APK="$(find build_v121/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
        test -n "$APK"; test -s "$APK"
        APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
        "$APKSIGNER" verify --verbose --print-certs "$APK"
        cp "$APK" Tahalil-Alakkad-V129-Android-SIGNED.apk
        sha256sum Tahalil-Alakkad-V129-Android-SIGNED.apk > Tahalil-Alakkad-V129-Android-SIGNED.apk.sha256
    - name: Publish Android V129
      shell: bash
      run: |
        set -euo pipefail
        TAG=v129
        if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "تحاليل العقاد V129 — Supabase Shadow Backup" --notes "V129 adds a best-effort Supabase shadow backup while Firebase remains the sole authoritative backend. It adds no extra Firestore backup listeners or broad backup queries: shadow hooks reuse snapshots already loaded by normal app flows and successful Firebase writes. The APK contains no Supabase secret or publishable key. The Edge Function validates the Firebase ID token, fetches the authoritative Firestore document server-side, and stores an idempotent shadow copy. Supabase failures never block the app. No failover reads or automatic backend switching are enabled. Preserves V128/V127/V126 behavior, results, notifications, original signing and no Cloudflare."
        fi
        gh release upload "$TAG" Tahalil-Alakkad-V129-Android-SIGNED.apk Tahalil-Alakkad-V129-Android-SIGNED.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber
        gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
      env:
        GH_TOKEN: ${{ github.token }}
