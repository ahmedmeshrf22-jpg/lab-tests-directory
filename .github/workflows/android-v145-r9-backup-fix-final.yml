name: Android V145 R9 BACKUP FIX FINAL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-v145-r9-backup-fix-final.yml'

permissions:
  contents: write

concurrency:
  group: android-v145-r9-backup-fix-final
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      FIXED_BACKUP_GZ_B64: >-
        

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare exact released R8 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          EXPECTED='ae682c504d7a52b94a2f71c0c4088bb169a943df'
          test "$(git rev-parse "$EXPECTED^{commit}")" = "$EXPECTED"
          rm -rf build_v145_r9
          git worktree add --detach build_v145_r9 "$EXPECTED"

          grep -Fq 'versionCode = 149' build_v145_r9/app/build.gradle.kts
          grep -Fq 'versionName = "5.69-v145-ui-polish-r8-clean-glow"' build_v145_r9/app/build.gradle.kts
          python3 -c 'import json; x=json.load(open("build_v145_r9/app/src/main/assets/lab_tests_android.json")); assert len(x)==331'
          test "$(sha256sum build_v145_r9/app/src/main/java/com/example/util/CommercialBackupManager.kt | awk '{print $1}')" != ""

          sha256sum             build_v145_r9/firestore.rules             build_v145_r9/app/google-services.json             build_v145_r9/app/src/main/assets/lab_tests_android.json             build_v145_r9/app/src/main/java/com/example/MainActivity.kt             build_v145_r9/app/src/main/java/com/example/settings/AppSettings.kt             > "$RUNNER_TEMP/r9-protected.sha256"

      - name: Apply exact R9 backup fix
        shell: bash
        run: |
          set -euo pipefail
          ROOT='build_v145_r9'
          GRAD="$ROOT/app/build.gradle.kts"
          BACKUP="$ROOT/app/src/main/java/com/example/util/CommercialBackupManager.kt"
          OPS="$ROOT/app/src/main/java/com/example/ui/OperationsV14Dialog.kt"

          printf '%s' "$FIXED_BACKUP_GZ_B64"             | base64 --decode             | gzip -dc > "$BACKUP"

          test "$(sha256sum "$BACKUP" | awk '{print $1}')" = '0beed05a03d3c192a19b4e43b3aca04d358c1678dccd98eba9a85bf00c5fb3b6'

          python3 - <<'PY'
          from pathlib import Path

          grad = Path('build_v145_r9/app/build.gradle.kts')
          g = grad.read_text(encoding='utf-8')
          if g.count('versionCode = 149') != 1:
              raise SystemExit('R8 versionCode marker missing')
          if g.count('versionName = "5.69-v145-ui-polish-r8-clean-glow"') != 1:
              raise SystemExit('R8 versionName marker missing')
          g = g.replace('versionCode = 149', 'versionCode = 150', 1)
          g = g.replace(
              'versionName = "5.69-v145-ui-polish-r8-clean-glow"',
              'versionName = "5.70-v145-r9-backup-fix"',
              1
          )
          grad.write_text(g, encoding='utf-8')

          ops = Path('build_v145_r9/app/src/main/java/com/example/ui/OperationsV14Dialog.kt')
          s = ops.read_text(encoding='utf-8')
          old_ar = '"تم حفظ نسخة جديدة ✓ والنسخ التلقائي 4:00 ص مفعّل"'
          old_en = '"New backup saved ✓ and automatic 4:00 AM backup is enabled"'

          if old_ar not in s:
              raise SystemExit('Expected manual backup Arabic success message not found in exact R8 source')
          s = s.replace(old_ar, '"تم الحفظ ✓"', 1)

          if old_en in s:
              s = s.replace(old_en, '"Saved ✓"', 1)

          ops.write_text(s, encoding='utf-8')
          PY

      - name: Audit only intended R9 changes
        shell: bash
        run: |
          set -euo pipefail
          cd build_v145_r9

          grep -Fq 'versionCode = 150' app/build.gradle.kts
          grep -Fq 'versionName = "5.70-v145-r9-backup-fix"' app/build.gradle.kts

          BACKUP='app/src/main/java/com/example/util/CommercialBackupManager.kt'
          OPS='app/src/main/java/com/example/ui/OperationsV14Dialog.kt'

          test "$(sha256sum "$BACKUP" | awk '{print $1}')" = '0beed05a03d3c192a19b4e43b3aca04d358c1678dccd98eba9a85bf00c5fb3b6'
          grep -Fq 'fun optionalSecurity(name: String)' "$BACKUP"
          grep -Fq 'optionalSecurity("users")' "$BACKUP"
          grep -Fq 'optionalSecurity("audit_logs")' "$BACKUP"
          grep -Fq 'securityArchiveWarnings += "devices/$uid:' "$BACKUP"
          grep -Fq 'security_archive_complete' "$BACKUP"
          grep -Fq 'security_archive_warnings' "$BACKUP"

          grep -Fq 'val labOrders = simple("lab_orders")' "$BACKUP"
          grep -Fq 'val customerPrices = simple("customer_price_overrides")' "$BACKUP"
          grep -Fq 'val labPrices = simple("lab2lab_prices")' "$BACKUP"
          grep -Fq 'val phoneRegistry = simple("phone_registry")' "$BACKUP"
          grep -Fq 'val catalogOverrides = simple("lab_catalog_overrides")' "$BACKUP"

          grep -Fq 'V142_QUICK_BACKUP' "$OPS"
          grep -Fq 'AutoBackupStorage.saveToPhone' "$OPS"
          grep -Fq 'تم الحفظ ✓' "$OPS"

          sed 's#build_v145_r9/##' "$RUNNER_TEMP/r9-protected.sha256" > "$RUNNER_TEMP/r9-protected-local.sha256"
          sha256sum -c "$RUNNER_TEMP/r9-protected-local.sha256"

          ACTUAL="$(git diff --name-only | sort)"
          EXPECTED="$(printf '%s\n'             app/build.gradle.kts             app/src/main/java/com/example/ui/OperationsV14Dialog.kt             app/src/main/java/com/example/util/CommercialBackupManager.kt | sort)"
          test "$ACTUAL" = "$EXPECTED"

          python3 - <<'PY'
          import json
          x=json.load(open('app/src/main/assets/lab_tests_android.json', encoding='utf-8'))
          assert len(x)==331
          assert len({i['id'] for i in x})==331
          assert all('customer_price' in i for i in x)
          assert all('lab_to_lab_price' not in i for i in x)
          print('R9 protected core + 331 catalogue PASS')
          PY

      - name: Load proven production signer
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          WF='.github/workflows/android-v144-ONLY-SESSION-RELOCK-FIX-FINAL-ONE-RUN-R3-AUDITED.yml'
          test -s "$WF"

          extract_step() {
            local name="$1" out="$2"
            awk -v target="$name" '
              $0 == "      - name: " target { found=1; next }
              found && /^        run: \|/ { inrun=1; next }
              inrun && /^      - name:/ { exit }
              inrun { sub(/^          /,""); print }
            ' "$WF" > "$out"
            test -s "$out"
          }

          extract_step 'Prepare deterministic APK certificate reader' "$RUNNER_TEMP/cert.sh"
          extract_step 'Select exact installed Android signer' "$RUNNER_TEMP/signer.sh"
          bash "$RUNNER_TEMP/cert.sh"
          bash "$RUNNER_TEMP/signer.sh"

          test -n "${KEYSTORE_PATH:-}"
          test -n "${STORE_PASSWORD:-}"
          test -n "${KEY_ALIAS:-}"
          test -n "${KEY_PASSWORD:-}"
          test -f "$KEYSTORE_PATH"

      - name: Compile R9 before packaging
        working-directory: build_v145_r9
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:compileReleaseKotlin

      - name: Build signed R9
        working-directory: build_v145_r9
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify R9 APK identity and signer
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build_v145_r9/app/build/outputs/apk/release -type f -name '*.apk' | sort | head -1)"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          curl -fL --retry 3             'https://github.com/ahmedmeshrf22-jpg/lab-tests-directory/releases/download/v145-ui-polish-r8-clean-glow/Tahalil-Alakkad-V145-R8-CLEAN-GLOW-SIGNED.apk'             -o "$RUNNER_TEMP/r8.apk"

          NEW_CERT="$(python3 "$RUNNER_TEMP/apk_cert_sha256.py" "$APK" | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
          OLD_CERT="$(python3 "$RUNNER_TEMP/apk_cert_sha256.py" "$RUNNER_TEMP/r8.apk" | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
          test "$NEW_CERT" = "$OLD_CERT"
          test "$NEW_CERT" = 'd20457a1cf78ed2598242fb858b32579793a856a94dd8f88829223221b8bc29c'

          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          echo "$BADGING"
          echo "$BADGING" | grep -Fq "package: name='com.aistudio.labtestsdirectory.egypt'"
          echo "$BADGING" | grep -Fq "versionCode='150'"
          echo "$BADGING" | grep -Fq "versionName='5.70-v145-r9-backup-fix'"

          cp "$APK" Tahalil-Alakkad-V145-R9-BACKUP-FIX-SIGNED.apk
          sha256sum Tahalil-Alakkad-V145-R9-BACKUP-FIX-SIGNED.apk             > Tahalil-Alakkad-V145-R9-BACKUP-FIX-SIGNED.apk.sha256

      - name: Commit exact R9 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd build_v145_r9
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B v145-r9-backup-fix
          git add             app/build.gradle.kts             app/src/main/java/com/example/ui/OperationsV14Dialog.kt             app/src/main/java/com/example/util/CommercialBackupManager.kt
          git commit -m 'R9 fix manual backup permission handling and saved confirmation'
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          git archive --format=zip             --output="$GITHUB_WORKSPACE/Tahalil-Alakkad-V145-R9-BACKUP-FIX-SOURCE.zip"             HEAD

      - name: Upload R9 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V145-R9-BACKUP-FIX
          path: |
            Tahalil-Alakkad-V145-R9-BACKUP-FIX-SIGNED.apk
            Tahalil-Alakkad-V145-R9-BACKUP-FIX-SIGNED.apk.sha256
            Tahalil-Alakkad-V145-R9-BACKUP-FIX-SOURCE.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish R9 branch and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C build_v145_r9 push --force origin HEAD:refs/heads/v145-r9-backup-fix

          TAG='v145-r9-backup-fix'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG"               Tahalil-Alakkad-V145-R9-BACKUP-FIX-SIGNED.apk               Tahalil-Alakkad-V145-R9-BACKUP-FIX-SIGNED.apk.sha256               Tahalil-Alakkad-V145-R9-BACKUP-FIX-SOURCE.zip               --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG"               Tahalil-Alakkad-V145-R9-BACKUP-FIX-SIGNED.apk               Tahalil-Alakkad-V145-R9-BACKUP-FIX-SIGNED.apk.sha256               Tahalil-Alakkad-V145-R9-BACKUP-FIX-SOURCE.zip               --repo "$GITHUB_REPOSITORY"               --target "$FINAL_SHA"               --title 'Tahalil Alakkad V145 R9 Backup Fix'               --notes 'R9 is based exactly on released R8. It restores the previously proven permission-safe encrypted backup manager, keeps protected Firestore rules/config/catalogue unchanged, and changes the existing manual-backup success status to تم الحفظ ✓ after the phone save succeeds. Production signer and package identity are verified against R8.'
          fi

      - name: Final status
        run: echo 'R9 BACKUP FIX BUILT, COMPILED, SIGNER VERIFIED AND RELEASED'
