name: Android V145 R10 LOCKED Manual Update + Cancel Parity

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-v145-r10-locked-parity
  cancel-in-progress: false

jobs:
  build:
    name: Android V145 R10 — LOCKED
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      BASE_COMMIT: ae682c504d7a52b94a2f71c0c4088bb169a943df
      BASE_APK_URL: https://github.com/ahmedmeshrf22-jpg/lab-tests-directory/releases/download/v145-ui-polish-r8-clean-glow/Tahalil-Alakkad-V145-R8-CLEAN-GLOW-SIGNED.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore exact released Android R8 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          test "$(git rev-parse "$BASE_COMMIT^{commit}")" = "$BASE_COMMIT"
          rm -rf build_android_r10
          git worktree add --detach build_android_r10 "$BASE_COMMIT"
          grep -Fq 'versionCode = 149' build_android_r10/app/build.gradle.kts
          grep -Fq 'versionName = "5.69-v145-ui-polish-r8-clean-glow"' build_android_r10/app/build.gradle.kts
          grep -Fq 'com.example.update.ForcedUpdateGate' build_android_r10/app/src/main/java/com/example/MainActivity.kt
          grep -Fq 'REQUEST_INSTALL_PACKAGES' build_android_r10/app/src/main/AndroidManifest.xml
          grep -Fq 'UPDATE_MANIFEST_URL' build_android_r10/app/src/main/java/com/example/update/ForcedUpdateGate.kt
          grep -Fq 'if (reason.trim().length < 3)' build_android_r10/app/src/main/java/com/example/ui/LabTestsViewModel.kt

          sha256sum \
            build_android_r10/firestore.rules \
            build_android_r10/app/google-services.json \
            build_android_r10/app/src/main/assets/lab_tests_android.json \
            build_android_r10/app/src/main/java/com/example/settings/AppSettings.kt \
            build_android_r10/app/src/main/java/com/example/settings/FirestorePerformance.kt \
            build_android_r10/app/src/main/res/xml/network_security_config.xml \
            > "$RUNNER_TEMP/r10-protected.sha256"

      - name: Apply Android LOCKED + cancel parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('build_android_r10')

          gradle = root / 'app/build.gradle.kts'
          g = gradle.read_text(encoding='utf-8')
          assert g.count('versionCode = 149') == 1
          assert g.count('versionName = "5.69-v145-ui-polish-r8-clean-glow"') == 1
          g = g.replace('versionCode = 149', 'versionCode = 150', 1)
          g = g.replace('versionName = "5.69-v145-ui-polish-r8-clean-glow"', 'versionName = "5.70-v145-r10-locked-parity"', 1)
          gradle.write_text(g, encoding='utf-8')

          manifest = root / 'app/src/main/AndroidManifest.xml'
          m = manifest.read_text(encoding='utf-8')
          permission = '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n'
          assert m.count(permission) == 1
          m = m.replace(permission, '', 1)
          manifest.write_text(m, encoding='utf-8')

          main = root / 'app/src/main/java/com/example/MainActivity.kt'
          s = main.read_text(encoding='utf-8')
          assert s.count('import com.example.update.ForcedUpdateGate\n') == 1
          assert s.count('                    ForcedUpdateGate {\n') == 1
          s = s.replace('import com.example.update.ForcedUpdateGate\n', '', 1)
          s = s.replace('                    ForcedUpdateGate {\n', '                    // V145 R10 LOCKED: updates are manual APK installs only.\n', 1)
          marker = '                        }\n                    }\n                    }\n                }\n'
          assert s.count(marker) == 1
          s = s.replace(marker, '                        }\n                    }\n                }\n', 1)
          main.write_text(s, encoding='utf-8')

          updater = root / 'app/src/main/java/com/example/update/ForcedUpdateGate.kt'
          assert updater.exists()
          updater.unlink()

          dialog = root / 'app/src/main/java/com/example/ui/CustomerSystemDialog.kt'
          d = dialog.read_text(encoding='utf-8')
          assert d.count('    var voidReason by remember { mutableStateOf("") }\n') == 1
          d = d.replace('    var voidReason by remember { mutableStateOf("") }\n', '', 1)
          old_block = '                    OutlinedTextField(\n                        value = voidReason,\n                        onValueChange = { voidReason = it.take(300) },\n                        modifier = Modifier.fillMaxWidth().heightIn(min = 112.dp),\n                        label = { Text(tr("سبب الإلغاء", "Void Reason")) },\n                        minLines = 2\n                    )\n'
          assert d.count(old_block) == 1
          d = d.replace(old_block, '', 1)
          assert d.count('viewModel.voidOrder(activeCustomer, currentOrder, voidReason)') == 1
          d = d.replace('viewModel.voidOrder(activeCustomer, currentOrder, voidReason)', 'viewModel.voidOrder(activeCustomer, currentOrder, "")', 1)
          assert d.count('currentOrder = currentOrder.copy(isVoided = true, voidReason = voidReason.trim())') == 1
          d = d.replace('currentOrder = currentOrder.copy(isVoided = true, voidReason = voidReason.trim())', 'currentOrder = currentOrder.copy(isVoided = true, voidReason = "إلغاء بدون سبب")', 1)
          dialog.write_text(d, encoding='utf-8')

          vm = root / 'app/src/main/java/com/example/ui/LabTestsViewModel.kt'
          v = vm.read_text(encoding='utf-8')
          old_validation = '        if (reason.trim().length < 3) {\n            onResult(false, tr("اكتب سبب الإلغاء", "Enter void reason"))\n            return\n        }\n        val now = System.currentTimeMillis()\n'
          assert v.count(old_validation) == 1
          v = v.replace(old_validation, '        val cleanReason = reason.trim().ifBlank { "إلغاء بدون سبب" }\n        val now = System.currentTimeMillis()\n', 1)
          start = v.index('    fun voidOrder(customer: Customer, order: CustomerOrder, reason: String')
          end = v.index('    /** V113: permanent delete', start)
          block = v[start:end]
          clean_anchor = 'val cleanReason = reason.trim().ifBlank { "إلغاء بدون سبب" }'
          assert clean_anchor in block
          assert block.count('reason.trim()') == 5
          cut = block.index(clean_anchor) + len(clean_anchor)
          block = block[:cut] + block[cut:].replace('reason.trim()', 'cleanReason')
          assert block.count('reason.trim()') == 1
          v = v[:start] + block + v[end:]
          vm.write_text(v, encoding='utf-8')

          (root / 'V145_R10_ANDROID_LOCKED_PARITY_NOTES.txt').write_text(
              'Android V145 R10 LOCKED\n\n'
              '- Automatic/forced updater removed from startup.\n'
              '- REQUEST_INSTALL_PACKAGES permission removed.\n'
              '- No update manifest check, automatic APK download, or installer launch remains.\n'
              '- Future Android updates are manual APK installs only.\n'
              '- Cancel Order no longer asks for or requires a reason.\n'
              '- Cancellation remains a soft delete with audit/history preservation.\n'
              '- Firebase project, package name, signing identity, App Check, Firestore rules, device authorization, backup, catalogue sync and notifications are preserved.\n'
              '- Firestore rules are not changed or deployed by this workflow.\n',
              encoding='utf-8'
          )
          print('ANDROID_R10_LOCKED_PATCH_APPLIED')
          PY

      - name: Safety audit
        shell: bash
        run: |
          set -euo pipefail
          cd build_android_r10

          grep -Fq 'versionCode = 150' app/build.gradle.kts
          grep -Fq 'versionName = "5.70-v145-r10-locked-parity"' app/build.gradle.kts
          grep -Fq 'applicationId = "com.aistudio.labtestsdirectory.egypt"' app/build.gradle.kts

          ! grep -R -Fq 'ForcedUpdateGate' app/src/main/java
          ! grep -R -Fq 'UPDATE_MANIFEST_URL' app/src/main/java
          ! grep -R -Fq 'latest.json' app/src/main/java
          ! grep -Fq 'REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml
          ! test -e app/src/main/java/com/example/update/ForcedUpdateGate.kt

          grep -Fq 'val cleanReason = reason.trim().ifBlank { "إلغاء بدون سبب" }' app/src/main/java/com/example/ui/LabTestsViewModel.kt
          ! grep -Fq 'if (reason.trim().length < 3)' app/src/main/java/com/example/ui/LabTestsViewModel.kt
          ! grep -Fq 'label = { Text(tr("سبب الإلغاء", "Void Reason")) }' app/src/main/java/com/example/ui/CustomerSystemDialog.kt
          grep -Fq 'viewModel.voidOrder(activeCustomer, currentOrder, "")' app/src/main/java/com/example/ui/CustomerSystemDialog.kt

          grep -Fq 'PlayIntegrityAppCheckProviderFactory.getInstance()' app/src/main/java/com/example/MainActivity.kt
          grep -Fq 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -Fq 'cleartextTrafficPermitted="false"' app/src/main/res/xml/network_security_config.xml
          grep -Fq 'private const val CATALOG_OVERRIDES_COLLECTION = "lab_catalog_overrides"' app/src/main/java/com/example/ui/LabTestsViewModel.kt

          git diff --check
          ACTUAL="$(git diff --name-only | sort)"
          EXPECTED="$(printf '%s\n' \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/example/MainActivity.kt \
            app/src/main/java/com/example/ui/CustomerSystemDialog.kt \
            app/src/main/java/com/example/ui/LabTestsViewModel.kt \
            app/src/main/java/com/example/update/ForcedUpdateGate.kt | sort)"
          test "$ACTUAL" = "$EXPECTED"

          sed 's#build_android_r10/##' "$RUNNER_TEMP/r10-protected.sha256" > "$RUNNER_TEMP/r10-protected-local.sha256"
          sha256sum -c "$RUNNER_TEMP/r10-protected-local.sha256"

          python3 - <<'PY'
          import json
          x = json.load(open('app/src/main/assets/lab_tests_android.json', encoding='utf-8'))
          assert len(x) == 331
          ids = [i['id'] for i in x]
          assert len(ids) == len(set(ids))
          print('ANDROID R10 LOCKED SAFETY AUDIT PASS')
          PY

      - name: Load proven production signer
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          WF='.github/workflows/android-v144-ONLY-SESSION-RELOCK-FIX-FINAL-ONE-RUN-R3-AUDITED.yml'
          test -s "$WF"
          extract_step() {
            local name="$1" out="$2"
            awk -v target="$name" '
              $0 == "      - name: " target { found=1; next }
              found && /^        run: \|/ { inrun=1; next }
              inrun && /^      - name:/ { exit }
              inrun { sub(/^          /,""); print }
            ' "$WF" > "$out"
            test -s "$out"
          }
          extract_step 'Prepare deterministic APK certificate reader' "$RUNNER_TEMP/cert.sh"
          extract_step 'Select exact installed Android signer' "$RUNNER_TEMP/signer.sh"
          bash "$RUNNER_TEMP/cert.sh"
          bash "$RUNNER_TEMP/signer.sh"

      - name: Confirm signing environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_PATH:-}"
          test -n "${STORE_PASSWORD:-}"
          test -n "${KEY_ALIAS:-}"
          test -n "${KEY_PASSWORD:-}"
          test -f "$KEYSTORE_PATH"

      - name: Compile and build
        working-directory: build_android_r10
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:compileReleaseKotlin
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify signed APK and upgrade identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build_android_r10/app/build/outputs/apk/release -type f -name '*.apk' | sort | head -1)"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          curl -fL --retry 3 "$BASE_APK_URL" -o "$RUNNER_TEMP/android-r8.apk"
          NEW_CERT="$(python3 "$RUNNER_TEMP/apk_cert_sha256.py" "$APK" | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
          OLD_CERT="$(python3 "$RUNNER_TEMP/apk_cert_sha256.py" "$RUNNER_TEMP/android-r8.apk" | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
          test "$NEW_CERT" = "$OLD_CERT"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          echo "$BADGING" | grep -Fq "package: name='com.aistudio.labtestsdirectory.egypt'"
          echo "$BADGING" | grep -Fq "versionCode='150'"
          echo "$BADGING" | grep -Fq "versionName='5.70-v145-r10-locked-parity'"
          cp "$APK" Tahalil-Alakkad-V145-R10-LOCKED-SIGNED.apk
          sha256sum Tahalil-Alakkad-V145-R10-LOCKED-SIGNED.apk > Tahalil-Alakkad-V145-R10-LOCKED-SIGNED.apk.sha256

      - name: Commit exact R10 source
        shell: bash
        run: |
          set -euo pipefail
          cd build_android_r10
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B v145-r10-android-locked
          git add -A
          git commit -m 'Android V145 R10: manual-update lock and cancel parity'
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          git archive --format=zip --output="$GITHUB_WORKSPACE/Tahalil-Alakkad-V145-R10-LOCKED-SOURCE.zip" HEAD
          cd "$GITHUB_WORKSPACE"
          sha256sum Tahalil-Alakkad-V145-R10-LOCKED-SOURCE.zip > Tahalil-Alakkad-V145-R10-LOCKED-SOURCE.zip.sha256
          cp build_android_r10/V145_R10_ANDROID_LOCKED_PARITY_NOTES.txt .

      - name: Upload R10 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V145-R10-Android-LOCKED
          path: |
            Tahalil-Alakkad-V145-R10-LOCKED-SIGNED.apk
            Tahalil-Alakkad-V145-R10-LOCKED-SIGNED.apk.sha256
            Tahalil-Alakkad-V145-R10-LOCKED-SOURCE.zip
            Tahalil-Alakkad-V145-R10-LOCKED-SOURCE.zip.sha256
            V145_R10_ANDROID_LOCKED_PARITY_NOTES.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android V145 R10 LOCKED release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C build_android_r10 push --force origin HEAD:refs/heads/v145-r10-android-locked
          TAG='v145-r10-android-locked'
          TITLE='تحاليل العقاد Android V145 R10 — LOCKED Manual Update'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file V145_R10_ANDROID_LOCKED_PARITY_NOTES.txt
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$FINAL_SHA" --title "$TITLE" --notes-file V145_R10_ANDROID_LOCKED_PARITY_NOTES.txt
          fi
          gh release upload "$TAG" \
            Tahalil-Alakkad-V145-R10-LOCKED-SIGNED.apk \
            Tahalil-Alakkad-V145-R10-LOCKED-SIGNED.apk.sha256 \
            Tahalil-Alakkad-V145-R10-LOCKED-SOURCE.zip \
            Tahalil-Alakkad-V145-R10-LOCKED-SOURCE.zip.sha256 \
            V145_R10_ANDROID_LOCKED_PARITY_NOTES.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
