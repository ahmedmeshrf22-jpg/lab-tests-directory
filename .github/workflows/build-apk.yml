name: Build Tahalil Alakkad V82 PRODUCTION READY

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Project3_AK_V82_PRODUCTION_READY.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Extract V82 project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/Project3_AK_V82_PRODUCTION_READY.zip"
          test -f "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/android_project"
          mkdir -p "$GITHUB_WORKSPACE/android_project"
          unzip -q -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/android_project"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/android_project" -type f -name 'settings.gradle.kts' -print -quit)"
          test -n "$SETTINGS_FILE"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: V82 production service and security audit
        shell: bash
        run: |
          set -euo pipefail
          SCREEN="$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          WORKLIST="$PROJECT_DIR/app/src/main/java/com/example/ui/DailyWorklistScreen.kt"
          NAV="$PROJECT_DIR/app/src/main/java/com/example/ui/DailyServicesNav.kt"
          VM="$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsViewModel.kt"
          GUIDE="$PROJECT_DIR/app/src/main/java/com/example/ui/TestGuideDialog.kt"
          SETTINGS="$PROJECT_DIR/app/src/main/java/com/example/ui/ManagerSettingsDialog.kt"
          USERSET="$PROJECT_DIR/app/src/main/java/com/example/ui/UserSettingsDialog.kt"
          PINSCREEN="$PROJECT_DIR/app/src/main/java/com/example/ui/AppPinUnlockScreen.kt"
          MODEL="$PROJECT_DIR/app/src/main/java/com/example/data/model/SystemModels.kt"
          APPSET="$PROJECT_DIR/app/src/main/java/com/example/settings/AppSettings.kt"
          PERF="$PROJECT_DIR/app/src/main/java/com/example/settings/FirestorePerformance.kt"
          GENERATOR="$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          REPO="$PROJECT_DIR/app/src/main/java/com/example/data/repository/LabTestRepository.kt"
          MAIN="$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt"
          RULES="$PROJECT_DIR/firestore.rules"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          OPS="$PROJECT_DIR/app/src/main/java/com/example/ui/OperationsV14Dialog.kt"

          for f in "$SCREEN" "$WORKLIST" "$NAV" "$VM" "$GUIDE" "$SETTINGS" "$USERSET" "$PINSCREEN" "$MODEL" "$APPSET" "$PERF" "$GENERATOR" "$REPO" "$MAIN" "$RULES" "$MANIFEST" "$OPS"; do
            test -f "$f"
          done
          test -f "$PROJECT_DIR/firebase.json"
          test -f "$PROJECT_DIR/firestore.indexes.json"
          test -f "$PROJECT_DIR/.firebaserc"
          test -f "$PROJECT_DIR/V82_PRODUCTION_READY_NOTES.txt"

          grep -Fq 'versionCode = 82' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'versionName = "5.2-production-ready-v82"' "$PROJECT_DIR/app/build.gradle.kts"

          # Daily lab services retained.
          grep -Fq 'HBsAg' "$REPO"
          grep -Fq 'private fun editDistance' "$REPO"
          grep -Fq 'fun generateQuickTestsImage' "$GENERATOR"
          grep -Fq 'saveGeneratedImageToGallery' "$GENERATOR"
          grep -Fq 'generateGuideHologramImage' "$GUIDE"
          grep -Fq 'fun DailyWorklistScreen' "$WORKLIST"
          grep -Fq 'R.drawable.staff_new_order_3d' "$SCREEN"
          grep -Fq 'R.drawable.staff_qr_3d' "$SCREEN"
          grep -Fq 'Mini3DSwipeServiceCard' "$NAV"

          # Admin and sensitive pricing.
          grep -Fq 'fun changeAdminPin' "$VM"
          grep -Fq 'تغيير PIN الإدارة' "$SETTINGS"
          grep -Fq 'adminPinFailedAttempts >= 5' "$VM"
          grep -Fq 'LAB2LAB_COLLECTION' "$VM"

          # Account/device access must be fail-closed.
          grep -Fq 'deviceAccessStatus != "approved"' "$MAIN"
          grep -Fq 'hasOperationalAccess()' "$VM"
          grep -Fq '_deviceAccessStatus.value == "approved"' "$VM"
          grep -Fq 'enabled = doc.getBoolean("enabled") ?: false' "$VM"
          grep -Fq 'profileExists() && profile().enabled == true' "$RULES"
          ! grep -Fq '!profileExists()' "$RULES"
          grep -Fq 'allow create: if isPrivilegedAdmin();' "$RULES"
          grep -Fq "request.resource.data.status == 'pending'" "$RULES"

          # Real per-user permissions + hardened new-user passwords.
          grep -Fq 'canEditCustomersOperationally()' "$VM"
          grep -Fq 'canDiscountOperationally()' "$VM"
          grep -Fq 'canCollectPaymentsOperationally()' "$VM"
          grep -Fq 'password.length >= 10' "$VM"
          grep -Fq 'can_view_sales_reports" to canViewSalesReports' "$VM"
          grep -Fq '"technician"' "$MODEL"
          grep -Fq 'function canDiscount()' "$RULES"
          grep -Fq 'function canCollectPayments()' "$RULES"
          grep -Fq 'function canViewReports()' "$RULES"

          # Local/device security.
          grep -Fq 'PlayIntegrityAppCheckProviderFactory' "$MAIN"
          grep -Fq 'FLAG_SECURE' "$MAIN"
          grep -Fq 'setHideOverlayWindows(true)' "$MAIN"
          grep -Fq 'failedLoginAttempts' "$MAIN"
          grep -Fq 'lockedUntilMillis' "$PINSCREEN"
          grep -Fq 'PBKDF2WithHmacSHA256' "$APPSET"
          grep -Fq 'PIN_PBKDF2_ITERATIONS = 120_000' "$APPSET"
          grep -Fq 'pin.matches(Regex("\\d{6}"))' "$APPSET"
          grep -Fq 'securityEnabled = true' "$APPSET"
          grep -Fq 'android:allowBackup="false"' "$MANIFEST"
          grep -Fq 'android:usesCleartextTraffic="false"' "$MANIFEST"
          ! grep -Fq 'application/pdf' "$MANIFEST"

          # Backend continuity: server first + persistent cache fallback.
          grep -Fq 'CACHE_BYTES = 300L * 1024L * 1024L' "$PERF"
          grep -Fq 'get(Source.CACHE)' "$VM"
          grep -Fq '300 MB' "$OPS"

          echo 'V82 production audit passed'

      - name: Restore original release signing
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_BUNDLE_B64:-}" ]; then
            echo 'ERROR: Secret TAHALIL_SIGNING_BUNDLE_B64 is missing'
            exit 1
          fi

          SIGN_DIR="$RUNNER_TEMP/tahalil-signing"
          rm -rf "$SIGN_DIR"
          mkdir -p "$SIGN_DIR"

          printf '%s' "$SIGNING_BUNDLE_B64" | base64 -d > "$SIGN_DIR/signing.zip"
          unzip -q -o "$SIGN_DIR/signing.zip" -d "$SIGN_DIR"

          test -f "$SIGN_DIR/tahalil-alakkad-release.jks"
          test -f "$SIGN_DIR/signing.env"

          set -a
          source "$SIGN_DIR/signing.env"
          set +a

          KEYSTORE_PATH="$SIGN_DIR/tahalil-alakkad-release.jks"
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed V82 production Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=2 \
            --console=plain \
            :app:assembleRelease

          APK_FILE="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -f "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/output/Tahalil-Alakkad-V82-PRODUCTION-READY.apk"
          ls -lh "$GITHUB_WORKSPACE/output/Tahalil-Alakkad-V82-PRODUCTION-READY.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/output/Tahalil-Alakkad-V82-PRODUCTION-READY.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload V82 APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V82-PRODUCTION-READY
          path: output/Tahalil-Alakkad-V82-PRODUCTION-READY.apk
          if-no-files-found: error
          retention-days: 30
          
