name: Build Tahalil Alakkad LATEST RELEASE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Find newest valid Tahalil Alakkad project
        shell: bash
        run: |
          set -euo pipefail

          SCAN_ROOT="$RUNNER_TEMP/tahalil-latest-scan"
          rm -rf "$SCAN_ROOT"
          mkdir -p "$SCAN_ROOT"

          BEST_CODE=-1
          BEST_NAME=""
          BEST_DIR=""
          BEST_ZIP=""
          INDEX=0

          mapfile -t ZIPS < <(
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' -print | sort
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP files found in repository."
            exit 1
          fi

          for ZIP_FILE in "${ZIPS[@]}"; do
            INDEX=$((INDEX + 1))
            DEST="$SCAN_ROOT/zip_$INDEX"
            mkdir -p "$DEST"

            echo "Checking: $ZIP_FILE"
            if ! unzip -q -o "$ZIP_FILE" -d "$DEST"; then
              echo "Skipping unreadable ZIP."
              continue
            fi

            while IFS= read -r BUILD_FILE; do
              PROJECT_DIR="$(dirname "$(dirname "$BUILD_FILE")")"
              SETTINGS_FILE="$(find "$PROJECT_DIR" -maxdepth 1 -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit)"
              [ -n "$SETTINGS_FILE" ] || continue

              APP_ID="$(grep -oP 'applicationId\s*=\s*"\K[^"]+' "$BUILD_FILE" | head -1 || true)"
              VERSION_CODE="$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$BUILD_FILE" | head -1 || true)"
              VERSION_NAME="$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$BUILD_FILE" | head -1 || true)"

              if [ "$APP_ID" != "com.aistudio.labtestsdirectory.egypt" ]; then
                continue
              fi
              if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
                continue
              fi

              echo "Candidate: code=$VERSION_CODE name=$VERSION_NAME dir=$PROJECT_DIR"

              if [ "$VERSION_CODE" -gt "$BEST_CODE" ]; then
                BEST_CODE="$VERSION_CODE"
                BEST_NAME="$VERSION_NAME"
                BEST_DIR="$PROJECT_DIR"
                BEST_ZIP="$ZIP_FILE"
              fi
            done < <(find "$DEST" -type f -path '*/app/build.gradle.kts' -print)
          done

          if [ "$BEST_CODE" -lt 82 ] || [ -z "$BEST_DIR" ]; then
            echo "ERROR: No valid Tahalil Alakkad project with versionCode >= 82 was found."
            exit 1
          fi

          SAFE_NAME="$(printf '%s' "$BEST_NAME" | tr -cs 'A-Za-z0-9._-' '-')"

          echo "PROJECT_DIR=$BEST_DIR" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$BEST_CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$BEST_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_SAFE=$SAFE_NAME" >> "$GITHUB_ENV"

          echo "Selected ZIP: $BEST_ZIP"
          echo "Selected version: $BEST_CODE / $BEST_NAME"

      - name: Production safety audit
        shell: bash
        run: |
          set -euo pipefail

          BUILD="$PROJECT_DIR/app/build.gradle.kts"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          MAIN="$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt"

          test -f "$BUILD"
          test -f "$MANIFEST"
          test -f "$PROJECT_DIR/app/google-services.json"
          test -f "$PROJECT_DIR/firestore.rules"
          test -f "$PROJECT_DIR/firebase.json"

          grep -Fq 'applicationId = "com.aistudio.labtestsdirectory.egypt"' "$BUILD"
          grep -Fq "versionCode = $APP_VERSION_CODE" "$BUILD"
          grep -Fq 'android:allowBackup="false"' "$MANIFEST"
          grep -Fq 'android:usesCleartextTraffic="false"' "$MANIFEST"
          ! grep -Fq 'application/pdf' "$MANIFEST"

          # Production security controls must remain present in future versions.
          if [ -f "$MAIN" ]; then
            grep -Fq 'FLAG_SECURE' "$MAIN"
            grep -Fq 'PlayIntegrityAppCheckProviderFactory' "$MAIN"
          fi

          echo "Safety audit passed for version $APP_VERSION_CODE"

      - name: Restore original release signing
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail

          if [ -z "${SIGNING_BUNDLE_B64:-}" ]; then
            echo "ERROR: Secret TAHALIL_SIGNING_BUNDLE_B64 is missing."
            exit 1
          fi

          SIGN_DIR="$RUNNER_TEMP/tahalil-signing"
          rm -rf "$SIGN_DIR"
          mkdir -p "$SIGN_DIR"

          printf '%s' "$SIGNING_BUNDLE_B64" | base64 -d > "$SIGN_DIR/signing.zip"
          unzip -q -o "$SIGN_DIR/signing.zip" -d "$SIGN_DIR"

          test -f "$SIGN_DIR/tahalil-alakkad-release.jks"
          test -f "$SIGN_DIR/signing.env"

          set -a
          source "$SIGN_DIR/signing.env"
          set +a

          KEYSTORE_PATH="$SIGN_DIR/tahalil-alakkad-release.jks"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed latest Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=2 \
            --console=plain \
            :app:assembleRelease

          APK_FILE="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -f "$APK_FILE"

          OUT="$GITHUB_WORKSPACE/output"
          mkdir -p "$OUT"

          FINAL_APK="$OUT/Tahalil-Alakkad-V${APP_VERSION_CODE}-${APP_VERSION_SAFE}.apk"
          cp "$APK_FILE" "$FINAL_APK"
          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          ls -lh "$FINAL_APK"

      - name: Verify package version and original signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$FINAL_APK")"
          printf '%s\n' "$VERIFY_OUTPUT"

          EXPECTED_SHA256="d20457a1cf78ed2598242fb858b32579793a856a94dd8f88829223221b8bc29c"
          ACTUAL_SHA256="$(printf '%s\n' "$VERIFY_OUTPUT" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr 'A-F' 'a-f')"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: APK signing certificate does not match the original Tahalil Alakkad release key."
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$FINAL_APK" | head -1)"
          printf '%s\n' "$BADGING"
          printf '%s\n' "$BADGING" | grep -Fq "package: name='com.aistudio.labtestsdirectory.egypt'"
          printf '%s\n' "$BADGING" | grep -Fq "versionCode='$APP_VERSION_CODE'"

          echo "Package, version and release signature verified."

      - name: Upload latest APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V${{ env.APP_VERSION_CODE }}-${{ env.APP_VERSION_SAFE }}
          path: ${{ env.FINAL_APK }}
          if-no-files-found: error
          retention-days: 90
          
