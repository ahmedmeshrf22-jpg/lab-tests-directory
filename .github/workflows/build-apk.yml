name: Build Tahalil Alakkad V69 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Extract V69 project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository files:"
          find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -printf '%P\n' | sort | head -200

          rm -rf "$GITHUB_WORKSPACE/android_project" "$GITHUB_WORKSPACE/_v69_bundle"
          mkdir -p "$GITHUB_WORKSPACE/android_project" "$GITHUB_WORKSPACE/_v69_bundle"

          PROJECT_ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name 'Project3_AK_V69_BATCH_PRICE_SEARCH.zip' -print -quit || true)"

          if [ -z "$PROJECT_ZIP" ]; then
            echo "Exact V69 project ZIP not found. Looking inside another V69 ZIP..."
            BUNDLE_ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*V69*.zip' -print -quit || true)"
            if [ -z "$BUNDLE_ZIP" ]; then
              echo "ERROR: No V69 ZIP file found in repository."
              exit 1
            fi

            unzip -q -o "$BUNDLE_ZIP" -d "$GITHUB_WORKSPACE/_v69_bundle"
            PROJECT_ZIP="$(find "$GITHUB_WORKSPACE/_v69_bundle" -type f -name 'Project3_AK_V69_BATCH_PRICE_SEARCH.zip' -print -quit || true)"

            if [ -z "$PROJECT_ZIP" ]; then
              SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/_v69_bundle" -type f -name 'settings.gradle.kts' -print -quit || true)"
              if [ -n "$SETTINGS_FILE" ]; then
                PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
                echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
                echo "Project found directly inside bundle: $PROJECT_DIR"
                exit 0
              fi

              echo "ERROR: V69 project ZIP/settings.gradle.kts not found inside bundle."
              exit 1
            fi
          fi

          echo "Using project ZIP: $PROJECT_ZIP"
          unzip -q -o "$PROJECT_ZIP" -d "$GITHUB_WORKSPACE/android_project"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/android_project" -type f -name 'settings.gradle.kts' -print -quit || true)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found after extraction."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project root: $PROJECT_DIR"

      - name: Verify V69
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROJECT_DIR:-}"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/data/repository/LabTestRepository.kt"

          grep -q 'versionCode = 69' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionName = "4.36-batch-price-search-v69"' "$PROJECT_DIR/app/build.gradle.kts"

          echo "V69 project verified."

      - name: Create debug signing key
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          rm -f debug.keystore
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'

      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=2 \
            --console=plain \
            :app:assembleDebug

          APK_FILE="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -f "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/output/Tahalil-Alakkad-V69.apk"
          ls -lh "$GITHUB_WORKSPACE/output/Tahalil-Alakkad-V69.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V69-APK
          path: output/Tahalil-Alakkad-V69.apk
          if-no-files-found: error
          retention-days: 30
          
