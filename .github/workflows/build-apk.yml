name: Build Tahalil Alakkad V79 LAB COUNTER

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Project3_AK_V79_LAB_COUNTER.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Extract V79 project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/Project3_AK_V79_LAB_COUNTER.zip"
          test -f "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/android_project"
          mkdir -p "$GITHUB_WORKSPACE/android_project"
          unzip -q -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/android_project"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/android_project" -type f -name 'settings.gradle.kts' -print -quit)"
          test -n "$SETTINGS_FILE"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: V79 lab counter audit
        shell: bash
        run: |
          set -euo pipefail
          SCREEN="$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          NAV="$PROJECT_DIR/app/src/main/java/com/example/ui/DailyServicesNav.kt"
          GUIDE="$PROJECT_DIR/app/src/main/java/com/example/ui/TestGuideDialog.kt"
          GENERATOR="$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          SETTINGS="$PROJECT_DIR/app/src/main/java/com/example/ui/ManagerSettingsDialog.kt"
          VM="$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsViewModel.kt"
          REPO="$PROJECT_DIR/app/src/main/java/com/example/data/repository/LabTestRepository.kt"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$SCREEN" && test -f "$NAV" && test -f "$GUIDE" && test -f "$GENERATOR"
          test -f "$SETTINGS" && test -f "$VM" && test -f "$REPO" && test -f "$MANIFEST"
          test -f "$PROJECT_DIR/LAB_COUNTER_V79_NOTES.txt"

          grep -Fq 'versionCode = 79' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'versionName = "4.46-lab-counter-v79"' "$PROJECT_DIR/app/build.gradle.kts"

          # Counter-first workflow.
          grep -Fq 'private fun LabCounterHeader' "$SCREEN"
          grep -Fq 'private fun LabCounterSelectedSection' "$SCREEN"
          grep -Fq 'private fun CounterToolsDock' "$SCREEN"
          grep -Fq 'counterAutoSaveAfterCustomerPick' "$SCREEN"
          grep -Fq 'إضافة عميل وحفظ الطلب' "$SCREEN"
          grep -Fq 'حفظ صورة' "$SCREEN"
          grep -Fq 'بدء طلب جديد / تفريغ الشاشة' "$SCREEN"
          grep -Fq 'saveCounterOrderForCustomer' "$SCREEN"
          grep -Fq 'generateQuickTestsImage' "$SCREEN"
          grep -Fq 'saveGeneratedImageToGallery' "$SCREEN"

          # Premium UI + guide + security retained.
          grep -Fq 'Mini3DSwipeServiceCard' "$NAV"
          grep -Fq 'generateGuideHologramImage' "$GUIDE"
          grep -Fq 'fun generateQuickTestsImage' "$GENERATOR"
          grep -Fq 'fun changeAdminPin' "$VM"
          grep -Fq 'تغيير PIN الإدارة' "$SETTINGS"
          grep -Fq 'HBsAg' "$REPO"
          grep -Fq 'android:allowBackup="false"' "$MANIFEST"
          grep -Fq 'android:usesCleartextTraffic="false"' "$MANIFEST"

          echo 'V79 lab counter audit passed'

      - name: Restore original release signing
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_BUNDLE_B64:-}" ]; then
            echo 'ERROR: Secret TAHALIL_SIGNING_BUNDLE_B64 is missing'
            exit 1
          fi

          SIGN_DIR="$RUNNER_TEMP/tahalil-signing"
          rm -rf "$SIGN_DIR"
          mkdir -p "$SIGN_DIR"

          printf '%s' "$SIGNING_BUNDLE_B64" | base64 -d > "$SIGN_DIR/signing.zip"
          unzip -q -o "$SIGN_DIR/signing.zip" -d "$SIGN_DIR"

          test -f "$SIGN_DIR/tahalil-alakkad-release.jks"
          test -f "$SIGN_DIR/signing.env"

          set -a
          source "$SIGN_DIR/signing.env"
          set +a

          KEYSTORE_PATH="$SIGN_DIR/tahalil-alakkad-release.jks"
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed V79 Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=2 \
            --console=plain \
            :app:assembleRelease

          APK_FILE="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -f "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/output/Tahalil-Alakkad-V79.apk"
          ls -lh "$GITHUB_WORKSPACE/output/Tahalil-Alakkad-V79.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/output/Tahalil-Alakkad-V79.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload V79 APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V79-LAB-COUNTER
          path: output/Tahalil-Alakkad-V79.apk
          if-no-files-found: error
          retention-days: 30
          
