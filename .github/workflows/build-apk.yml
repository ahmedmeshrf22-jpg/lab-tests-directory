name: Build Tahalil Alakkad V69 RELEASE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Project3_AK_V69_BATCH_PRICE_SEARCH.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Extract V69 project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name 'Project3_AK_V69_BATCH_PRICE_SEARCH.zip' -print -quit || true)"
          if [ -z "$PROJECT_ZIP" ]; then
            echo "ERROR: Project3_AK_V69_BATCH_PRICE_SEARCH.zip not found"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -printf '%P\n' | sort
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/android_project"
          mkdir -p "$GITHUB_WORKSPACE/android_project"
          unzip -q -o "$PROJECT_ZIP" -d "$GITHUB_WORKSPACE/android_project"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/android_project" -type f -name 'settings.gradle.kts' -print -quit || true)"
          test -n "$SETTINGS_FILE"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify V69
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 69' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionName = "4.36-batch-price-search-v69"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'HBsAg' "$PROJECT_DIR/app/src/main/java/com/example/data/repository/LabTestRepository.kt"
          echo "V69 verified"

      - name: Restore original release signing
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_BUNDLE_B64:-}" ]; then
            echo "ERROR: GitHub Actions secret TAHALIL_SIGNING_BUNDLE_B64 is missing"
            exit 1
          fi

          SIGN_DIR="$RUNNER_TEMP/tahalil-signing"
          rm -rf "$SIGN_DIR"
          mkdir -p "$SIGN_DIR"

          printf '%s' "$SIGNING_BUNDLE_B64" | base64 -d > "$SIGN_DIR/signing.zip"
          unzip -q "$SIGN_DIR/signing.zip" -d "$SIGN_DIR"

          test -f "$SIGN_DIR/tahalil-alakkad-release.jks"
          test -f "$SIGN_DIR/signing.env"

          set -a
          source "$SIGN_DIR/signing.env"
          set +a

          export KEYSTORE_PATH="$SIGN_DIR/tahalil-alakkad-release.jks"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=2 \
            --console=plain \
            :app:assembleRelease

          APK_FILE="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -f "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/output/Tahalil-Alakkad-V69-RELEASE.apk"

          jarsigner -verify "$GITHUB_WORKSPACE/output/Tahalil-Alakkad-V69-RELEASE.apk" >/dev/null 2>&1 || true
          ls -lh "$GITHUB_WORKSPACE/output/Tahalil-Alakkad-V69-RELEASE.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V69-RELEASE
          path: output/Tahalil-Alakkad-V69-RELEASE.apk
          if-no-files-found: error
          retention-days: 30
          
