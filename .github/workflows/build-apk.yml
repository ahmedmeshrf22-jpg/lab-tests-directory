name: Build Tahalil Alakkad V78 ICON LABEL VISIBILITY

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Project3_AK_V78_ICON_LABEL_VISIBILITY.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Extract V78 project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/Project3_AK_V78_ICON_LABEL_VISIBILITY.zip"
          test -f "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/android_project"
          mkdir -p "$GITHUB_WORKSPACE/android_project"
          unzip -q -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/android_project"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/android_project" -type f -name 'settings.gradle.kts' -print -quit)"
          test -n "$SETTINGS_FILE"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: V78 icon label audit
        shell: bash
        run: |
          set -euo pipefail
          SCREEN="$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          NAV="$PROJECT_DIR/app/src/main/java/com/example/ui/DailyServicesNav.kt"
          GUIDE="$PROJECT_DIR/app/src/main/java/com/example/ui/TestGuideDialog.kt"
          GENERATOR="$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          SETTINGS="$PROJECT_DIR/app/src/main/java/com/example/ui/ManagerSettingsDialog.kt"
          VM="$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsViewModel.kt"
          REPO="$PROJECT_DIR/app/src/main/java/com/example/data/repository/LabTestRepository.kt"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$SCREEN" && test -f "$NAV" && test -f "$GUIDE" && test -f "$GENERATOR"
          test -f "$SETTINGS" && test -f "$VM" && test -f "$REPO" && test -f "$MANIFEST"

          grep -Fq 'versionCode = 78' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'versionName = "4.45-icon-label-visibility-v78"' "$PROJECT_DIR/app/build.gradle.kts"

          # V77 full premium glow system + swipe navigation.
          grep -Fq 'Mini3DSwipeServiceCard' "$NAV"
          grep -Fq 'premium illuminated 3D swipe launcher' "$NAV"
          grep -Fq 'R.drawable.mgr_reports_3d' "$SCREEN"
          grep -Fq 'R.drawable.mgr_health_3d' "$SCREEN"
          grep -Fq 'Icon Label Visibility Fix' "$PROJECT_DIR/V78_ICON_LABEL_VISIBILITY_NOTES.txt"
          grep -Fq 'LazyRow' "$NAV"
          grep -Fq 'rememberLazyListState' "$NAV"
          grep -Fq 'animateScrollToItem' "$NAV"
          grep -Fq 'staff_tests_3d' "$NAV"
          grep -Fq 'staff_quick_image_3d' "$NAV"
          grep -Fq 'staff_new_order_3d' "$NAV"
          grep -Fq 'staff_customers_3d' "$NAV"
          grep -Fq 'staff_qr_3d' "$NAV"
          grep -Fq 'ambientColor = item.glow' "$NAV"
          grep -Fq 'scaleX = scale' "$NAV"

          # V75/V74 production features retained.
          grep -Fq '"quick_image"' "$SCREEN"
          grep -Fq 'fun generateQuickTestsImage' "$GENERATOR"
          grep -Fq 'حفظ الصورة' "$SCREEN"
          grep -Fq 'saveGeneratedImageToGallery' "$SCREEN"
          grep -Fq 'generateGuideHologramImage' "$GUIDE"
          grep -Fq 'حفظ صورة' "$GUIDE"
          grep -Fq 'fun changeAdminPin' "$VM"
          grep -Fq 'تغيير PIN الإدارة' "$SETTINGS"
          grep -Fq 'adminPinFailedAttempts >= 5' "$VM"
          grep -Fq 'الأسعار\nLab 2 Lab' "$SCREEN"
          grep -Fq 'HBsAg' "$REPO"
          grep -Fq 'android:allowBackup="false"' "$MANIFEST"
          grep -Fq 'android:usesCleartextTraffic="false"' "$MANIFEST"

          echo 'V78 icon label audit passed'

      - name: Restore original release signing
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_BUNDLE_B64:-}" ]; then
            echo 'ERROR: Secret TAHALIL_SIGNING_BUNDLE_B64 is missing'
            exit 1
          fi

          SIGN_DIR="$RUNNER_TEMP/tahalil-signing"
          rm -rf "$SIGN_DIR"
          mkdir -p "$SIGN_DIR"

          printf '%s' "$SIGNING_BUNDLE_B64" | base64 -d > "$SIGN_DIR/signing.zip"
          unzip -q -o "$SIGN_DIR/signing.zip" -d "$SIGN_DIR"

          test -f "$SIGN_DIR/tahalil-alakkad-release.jks"
          test -f "$SIGN_DIR/signing.env"

          set -a
          source "$SIGN_DIR/signing.env"
          set +a

          KEYSTORE_PATH="$SIGN_DIR/tahalil-alakkad-release.jks"
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed V78 Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=2 \
            --console=plain \
            :app:assembleRelease

          APK_FILE="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -f "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/output/Tahalil-Alakkad-V78.apk"
          ls -lh "$GITHUB_WORKSPACE/output/Tahalil-Alakkad-V78.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/output/Tahalil-Alakkad-V78.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload V78 APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V78
          path: output/Tahalil-Alakkad-V78.apk
          if-no-files-found: error
          retention-days: 30
          
