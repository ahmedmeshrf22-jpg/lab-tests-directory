name: Build Tahalil Alakkad V73 SIMPLIFIED RELEASE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Project3_AK_V73_SIMPLIFIED_WORKFLOW_IMAGES.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Extract V73 project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/Project3_AK_V73_SIMPLIFIED_WORKFLOW_IMAGES.zip"
          test -f "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/android_project"
          mkdir -p "$GITHUB_WORKSPACE/android_project"
          unzip -q -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/android_project"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/android_project" -type f -name 'settings.gradle.kts' -print -quit)"
          test -n "$SETTINGS_FILE"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Verify V73
        shell: bash
        run: |
          set -euo pipefail
          SCREEN="$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          CUSTOMER="$PROJECT_DIR/app/src/main/java/com/example/ui/CustomerSystemDialog.kt"
          OUTPUT="$PROJECT_DIR/app/src/main/java/com/example/ui/OrderImageShareDialog.kt"
          GUIDE="$PROJECT_DIR/app/src/main/java/com/example/ui/TestGuideDialog.kt"
          REPO="$PROJECT_DIR/app/src/main/java/com/example/data/repository/LabTestRepository.kt"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$SCREEN"
          test -f "$CUSTOMER"
          test -f "$OUTPUT"
          test -f "$GUIDE"
          test -f "$REPO"
          test -f "$MANIFEST"

          grep -q 'versionCode = 73' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionName = "4.40-simplified-workflow-images-v73"' "$PROJECT_DIR/app/build.gradle.kts"

          # V73: clean home + bottom controls.
          grep -q 'fun ManagerHomeDashboard' "$SCREEN"
          grep -q 'fun BottomUtilityCard' "$SCREEN"
          grep -q 'الأسعار\\nLab 2 Lab' "$SCREEN"
          grep -q 'onPrices = { requireAdmin { showManagerDashboard = true } }' "$SCREEN"

          # Daily screens must not receive Lab 2 Lab pricing/edit access.
          grep -q 'isManager = false' "$SCREEN"
          grep -q 'lab2LabPrices = emptyMap()' "$SCREEN"
          grep -q 'onEditPrices = {}' "$SCREEN"

          # V73: image-only output and Android input surface.
          grep -q 'fun OrderImageShareDialog' "$OUTPUT"
          grep -q 'صورة العميل' "$OUTPUT"
          grep -q 'صورة طلب المعمل' "$OUTPUT"
          grep -q 'generateCustomerOrderImage' "$OUTPUT"
          grep -q 'generateLabRequestImage' "$OUTPUT"
          ! grep -q 'application/pdf' "$MANIFEST"
          grep -q 'arrayOf("image/\*")' "$SCREEN"

          # Minimal customer data + calendar.
          grep -q 'DatePickerDialog' "$CUSTOMER"
          grep -q 'رقم واتساب' "$CUSTOMER"
          grep -q 'بيانات أساسية فقط' "$CUSTOMER"

          # Required paid amount for partial / unpaid remains enforced in both flows.
          grep -q 'paidEntryRequired = paymentStatus == "partial" || paymentStatus == "unpaid"' "$SCREEN"
          grep -q 'المبلغ المسدد (إجباري)' "$SCREEN"
          grep -q 'paidEntryRequired = paymentStatus == "partial" || paymentStatus == "unpaid"' "$CUSTOMER"
          grep -q 'المبلغ المسدد (إجباري)' "$CUSTOMER"

          # Preserve V72 medical guide.
          grep -q 'fun TestGuideMoreButton' "$GUIDE"
          grep -q 'TestGuideHologramDialog' "$GUIDE"
          grep -q 'WHO Phlebotomy' "$GUIDE"
          grep -q 'BD Vacutainer' "$GUIDE"
          grep -q 'CDC — Hepatitis B testing' "$GUIDE"
          grep -q 'MedlinePlus — TSH Test' "$GUIDE"

          # Preserve V70/V69 behavior.
          grep -q 'price_results_add_all' "$SCREEN"
          grep -q 'price_results_customer' "$SCREEN"
          grep -q 'price_results_output' "$SCREEN"
          grep -q 'private fun editDistance' "$REPO"
          grep -q 'HBsAg' "$REPO"

          echo 'V73 verification passed'

      - name: Restore original release signing
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_BUNDLE_B64:-}" ]; then
            echo 'ERROR: Secret TAHALIL_SIGNING_BUNDLE_B64 is missing'
            exit 1
          fi

          SIGN_DIR="$RUNNER_TEMP/tahalil-signing"
          rm -rf "$SIGN_DIR"
          mkdir -p "$SIGN_DIR"

          printf '%s' "$SIGNING_BUNDLE_B64" | base64 -d > "$SIGN_DIR/signing.zip"
          unzip -q -o "$SIGN_DIR/signing.zip" -d "$SIGN_DIR"

          test -f "$SIGN_DIR/tahalil-alakkad-release.jks"
          test -f "$SIGN_DIR/signing.env"

          set -a
          source "$SIGN_DIR/signing.env"
          set +a

          KEYSTORE_PATH="$SIGN_DIR/tahalil-alakkad-release.jks"
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=2 \
            --console=plain \
            :app:assembleRelease

          APK_FILE="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -f "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/output/Tahalil-Alakkad-V73-RELEASE.apk"
          ls -lh "$GITHUB_WORKSPACE/output/Tahalil-Alakkad-V73-RELEASE.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V73-RELEASE
          path: output/Tahalil-Alakkad-V73-RELEASE.apk
          if-no-files-found: error
          retention-days: 30
          
