name: Build Tahalil Alakkad V74 FINAL PRODUCTION

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Project3_AK_V74_FINAL_PRODUCTION.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Extract V74 production project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/Project3_AK_V74_FINAL_PRODUCTION.zip"
          test -f "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/android_project"
          mkdir -p "$GITHUB_WORKSPACE/android_project"
          unzip -q -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/android_project"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/android_project" -type f -name 'settings.gradle.kts' -print -quit)"
          test -n "$SETTINGS_FILE"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Production feature audit
        shell: bash
        run: |
          set -euo pipefail
          SCREEN="$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          CUSTOMER="$PROJECT_DIR/app/src/main/java/com/example/ui/CustomerSystemDialog.kt"
          OUTPUT="$PROJECT_DIR/app/src/main/java/com/example/ui/OrderImageShareDialog.kt"
          GUIDE="$PROJECT_DIR/app/src/main/java/com/example/ui/TestGuideDialog.kt"
          SETTINGS="$PROJECT_DIR/app/src/main/java/com/example/ui/ManagerSettingsDialog.kt"
          VM="$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsViewModel.kt"
          APP_SETTINGS="$PROJECT_DIR/app/src/main/java/com/example/settings/AppSettings.kt"
          GENERATOR="$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          REPO="$PROJECT_DIR/app/src/main/java/com/example/data/repository/LabTestRepository.kt"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$SCREEN" && test -f "$CUSTOMER" && test -f "$OUTPUT"
          test -f "$GUIDE" && test -f "$SETTINGS" && test -f "$VM"
          test -f "$APP_SETTINGS" && test -f "$GENERATOR" && test -f "$REPO" && test -f "$MANIFEST"

          grep -Fq 'versionCode = 74' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'versionName = "4.41-production-final-v74"' "$PROJECT_DIR/app/build.gradle.kts"

          # Admin PIN: changeable, no fixed verifier shipped, no admin-account bootstrap during unlock.
          grep -Fq 'fun changeAdminPin' "$VM"
          grep -Fq 'تغيير PIN الإدارة' "$SETTINGS"
          ! grep -Fq 'ADMIN_PIN_VERIFIER' "$VM"
          ! sed -n '/fun unlockAdmin/,/fun changeAdminPin/p' "$VM" | grep -Fq 'createUserWithEmailAndPassword'
          grep -Fq 'adminPinFailedAttempts >= 5' "$VM"

          # Sensitive prices isolated from normal settings/daily surfaces.
          grep -Fq 'showLab2LabPrice = false' "$APP_SETTINGS"
          grep -Fq 'pdfIncludeLab2LabPrice = false' "$APP_SETTINGS"
          grep -Fq 'الأسعار\nLab 2 Lab' "$SCREEN"
          grep -Fq 'onPrices = { requireAdmin { showManagerDashboard = true } }' "$SCREEN"

          # Image-only user flow + direct save to phone Gallery/Pictures.
          grep -Fq 'fun OrderImageShareDialog' "$OUTPUT"
          grep -Fq 'حفظ' "$OUTPUT"
          grep -Fq 'مشاركة' "$OUTPUT"
          grep -Fq 'saveGeneratedImageToGallery' "$OUTPUT"
          grep -Fq 'MediaStore.Images.Media.RELATIVE_PATH' "$GENERATOR"
          grep -Fq 'Pictures / Tahalil Alakkad' "$GENERATOR"
          ! grep -Fq 'application/pdf' "$MANIFEST"
          grep -Fq 'arrayOf("image/*")' "$SCREEN"

          # Minimal customer data, calendar, and payment validation.
          grep -Fq 'بيانات أساسية فقط' "$CUSTOMER"
          grep -Fq 'رقم واتساب' "$CUSTOMER"
          grep -Fq 'DatePickerDialog' "$CUSTOMER"
          grep -Fq 'paidEntryRequired = paymentStatus == "partial" || paymentStatus == "unpaid"' "$SCREEN"
          grep -Fq 'المبلغ المسدد (إجباري)' "$SCREEN"

          # Duplicate-order protection on slow taps/network.
          grep -Fq 'var savingOrder by remember' "$SCREEN"
          grep -Fq 'enabled = paidEntryValid && !savingOrder' "$SCREEN"

          # Search/batch workflow and medical guide preserved.
          grep -Fq 'price_results_add_all' "$SCREEN"
          grep -Fq 'private fun editDistance' "$REPO"
          grep -Fq 'HBsAg' "$REPO"
          grep -Fq 'fun TestGuideMoreButton' "$GUIDE"
          grep -Fq 'TestGuideHologramDialog' "$GUIDE"

          # Security baseline.
          grep -Fq 'android:allowBackup="false"' "$MANIFEST"
          grep -Fq 'android:usesCleartextTraffic="false"' "$MANIFEST"

          echo 'V74 production audit passed'

      - name: Restore original release signing
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_BUNDLE_B64:-}" ]; then
            echo 'ERROR: Secret TAHALIL_SIGNING_BUNDLE_B64 is missing'
            exit 1
          fi

          SIGN_DIR="$RUNNER_TEMP/tahalil-signing"
          rm -rf "$SIGN_DIR"
          mkdir -p "$SIGN_DIR"

          printf '%s' "$SIGNING_BUNDLE_B64" | base64 -d > "$SIGN_DIR/signing.zip"
          unzip -q -o "$SIGN_DIR/signing.zip" -d "$SIGN_DIR"

          test -f "$SIGN_DIR/tahalil-alakkad-release.jks"
          test -f "$SIGN_DIR/signing.env"

          set -a
          source "$SIGN_DIR/signing.env"
          set +a

          KEYSTORE_PATH="$SIGN_DIR/tahalil-alakkad-release.jks"
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed production Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=2 \
            --console=plain \
            :app:assembleRelease

          APK_FILE="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -f "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/output/Tahalil-Alakkad-V74-FINAL.apk"
          ls -lh "$GITHUB_WORKSPACE/output/Tahalil-Alakkad-V74-FINAL.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/output/Tahalil-Alakkad-V74-FINAL.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V74-FINAL
          path: output/Tahalil-Alakkad-V74-FINAL.apk
          if-no-files-found: error
          retention-days: 30
          
