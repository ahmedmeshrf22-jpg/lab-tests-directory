          if (Test-Path build_v138_windows) { Remove-Item build_v138_windows -Recurse -Force }
          Expand-Archive 'v138-source.zip' 'build_v138_windows' -Force
          if (!(Test-Path 'build_v138_windows/windows-system/package.json')) { throw 'V138 source reconstruction failed' }

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit V138 Safe Failover and preserved systems
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_v138_windows/windows-system'

          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '138.0.0') { throw "Expected Windows V138 package" }
          if ($pkg.build.portable.artifactName -notmatch 'V138') { throw 'Portable V138 name missing' }
          if ($pkg.build.nsis.artifactName -notmatch 'V138') { throw 'Setup V138 name missing' }

          $tests = Get-Content (Join-Path $root 'public/lab_tests_android.json') -Raw | ConvertFrom-Json
          if ($tests.Count -ne 331) { throw "Expected 331 tests, got $($tests.Count)" }
          if (($tests | Where-Object { $null -ne $_.customer_price }).Count -ne 0) { throw 'Embedded customer prices detected' }

          $fail = Get-Content (Join-Path $root 'src/failover.js') -Raw
          foreach ($x in @(
            'tahalil-failover-read',
            'customer',
            'order',
            'customer_price',
            'lab2lab_price',
            'lab_order',
            'getIdToken(false)',
            'getIdToken(true)',
            'shadow_read_only'
          )) {
            if (!$fail.Contains($x)) { throw "Missing V138 failover client marker: $x" }
          }
          if ($fail.Contains('SUPABASE_SERVICE_ROLE_KEY') -or $fail.Contains('sb_secret_')) {
            throw 'Supabase secret found in renderer failover client'
          }

          $main = Get-Content (Join-Path $root 'electron/main.cjs') -Raw
          foreach ($x in @(
            "FAILOVER_ENDPOINT = 'https://ogidyelgmigcvasizzuv.supabase.co/functions/v1/tahalil-failover-read'",
            "ipcMain.handle('failover:read'",
            "method:'GET'",
            "'X-Tahalil-Device':getDeviceId()",
            "Authorization:`Bearer ${token}`",
            'OFFLINE_GRACE_MS = 72 * 60 * 60 * 1000',
            'new Tray',
            'requestSingleInstanceLock',
            "target.setHours(4,0,0,0)",
            "scheduled-04:00",
            "retry-after-failure",
            "safeStorage.encryptString",
            "setLoginItemSettings",
            'sandbox: true',
            'contextIsolation: true',
            'nodeIntegration: false',
            'webSecurity: true'
          )) {
            if (!$main.Contains($x)) { throw "Missing V138 Windows safety marker: $x" }
          }
          $failStart = $main.IndexOf("ipcMain.handle('failover:read'")
          $failEnd = $main.IndexOf("ipcMain.handle('recovery:probe'", $failStart)
          if ($failStart -lt 0 -or $failEnd -le $failStart) { throw 'Failover handler bounds missing' }
          $failHandler = $main.Substring($failStart, $failEnd - $failStart)
          if ($failHandler.Contains("method:'POST'") -or $failHandler.Contains('body:')) {
            throw 'V138 emergency failover must remain GET-only with no body'
          }

          $preload = Get-Content (Join-Path $root 'electron/preload.cjs') -Raw
          if (!$preload.Contains("failoverRead: (payload) => ipcRenderer.invoke('failover:read', payload)")) {
            throw 'V138 preload bridge missing'
          }

          $data = Get-Content (Join-Path $root 'src/data.js') -Raw
          foreach ($x in @(
            'getDocsFromServer',
            'getDocsFromCache',
            'getDocFromServer',
            'getDocFromCache',
            "failoverDocuments('customer','customers/'",
            "failoverDocuments('order','customers/'",
            "failoverDocuments('customer_price','customer_price_overrides/'",
            "failoverDocuments('lab2lab_price','lab2lab_prices/'",
            "failoverDocuments('lab_order','lab_orders/'",
            'tahalil:emergency-read',
            'requestResultRevision',
            'resetUserLoginCredentials'
          )) {
            if (!$data.Contains($x)) { throw "Missing V138 data continuity marker: $x" }
          }

          $res = Get-Content (Join-Path $root 'src/resilience.js') -Raw
          if (!$res.Contains("SAFE_READ_FAILOVER:'SAFE_READ_FAILOVER'")) { throw 'SAFE_READ_FAILOVER mode missing' }
          if (!$res.Contains('isPrimaryAuthoritative(){return true}')) { throw 'Firebase authority policy missing' }
          if (!$res.Contains('writesRemainFirebaseOnly(){return true}')) { throw 'Firebase-only writes policy missing' }

          $backup = Get-Content (Join-Path $root 'src/backup.js') -Raw
          foreach ($x in @(
            'const SCHEMA=3',
            'app_version_code:138',
            "app_version_name:'System V138 Windows'",
            "security_archive_restore_mode:'manual_only'",
            'getDocFromServer',
            'Existing Firestore documents are NEVER overwritten',
            'if(!snap.exists())missing.push(write)'
          )) {
            if (!$backup.Contains($x)) { throw "Missing backup/restore marker: $x" }
          }

          $app = Get-Content (Join-Path $root 'src/app.js') -Raw
          foreach ($x in @(
            'Unified System V138',
            'Windows V138',
            'V138 Safe Failover + V137 Auto Backup',
            'وضع الطوارئ',
            'تم الاسترجاع ✓',
            'لا توجد بيانات مفقودة للاسترجاع',
            'جاري إنشاء النسخة الاحتياطية',
            'تم حفظ النسخة الاحتياطية ✓'
          )) {
            if (!$app.Contains($x)) { throw "Missing V138 UI/preserved marker: $x" }
          }

          $shadow = Get-Content (Join-Path $root 'src/shadowBackup.js') -Raw
          foreach ($x in @('tahalil-shadow-mirror','getIdToken(false)','getIdToken(true)','Shadow backup is deliberately non-blocking')) {
            if (!$shadow.Contains($x)) { throw "V129 shadow backup missing: $x" }
          }

          $all = $app + "`n" + $data + "`n" + $backup + "`n" + $fail + "`n" + $main + "`n" + $shadow
          if ($all.ToLower().Contains('cloudflare') -or $all.ToLower().Contains('workers.dev')) {
            throw 'Cloudflare dependency detected'
          }
          if ($all.Contains('sendPasswordResetEmail')) {
            throw 'Email password-reset flow must remain disabled'
          }
          foreach ($secret in @('SUPABASE_SERVICE_ROLE_KEY','SUPABASE_SECRET_KEYS','sb_secret_','BEGIN PRIVATE KEY')) {
            if ($all.Contains($secret)) { throw "Forbidden secret marker: $secret" }
          }

          Get-ChildItem (Join-Path $root 'src') -Filter '*.js' -File | ForEach-Object {
            Get-Content $_.FullName -Raw | node --input-type=module --check
            if ($LASTEXITCODE -ne 0) { throw "JS syntax failed: $($_.Name)" }
          }
          node --check (Join-Path $root 'electron/main.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'main.cjs syntax failed' }
          node --check (Join-Path $root 'electron/preload.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'preload.cjs syntax failed' }

          Write-Host 'WINDOWS V138 SAFE FAILOVER AUDIT PASSED'

      - name: Install dependencies
        working-directory: build_v138_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Build Portable
        working-directory: build_v138_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Portable startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v138_windows/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$exe) { throw 'Portable EXE not found' }
          $env:TAHALIL_SMOKE_TEST='1'
          $p=Start-Process $exe.FullName -PassThru
          if (!$p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; throw 'Portable smoke timed out' }
          if ($p.ExitCode -ne 0) { throw "Portable smoke exit code $($p.ExitCode)" }
          Remove-Item Env:TAHALIL_SMOKE_TEST -ErrorAction SilentlyContinue
          Write-Host 'PORTABLE STARTUP OK'

      - name: Portable System Tray smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v138_windows/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$exe) { throw 'Portable EXE not found for tray smoke' }
          $env:TAHALIL_TRAY_SMOKE_TEST='1'
          $p=Start-Process $exe.FullName -PassThru
          if (!$p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; throw 'Tray smoke timed out' }
          if ($p.ExitCode -ne 0) { throw "Tray smoke exit code $($p.ExitCode)" }
          Remove-Item Env:TAHALIL_TRAY_SMOKE_TEST -ErrorAction SilentlyContinue
          Write-Host 'SYSTEM TRAY OK'

      - name: Background startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v138_windows/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $p=Start-Process $exe.FullName -ArgumentList '--background' -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "Background startup exited unexpectedly with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host 'BACKGROUND STARTUP OK'

      - name: Build Setup
        working-directory: build_v138_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }

      - name: Prepare Windows V138 release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v138_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup = Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable -or !$setup) { throw 'Portable or Setup EXE missing' }

          Copy-Item $portable.FullName 'Tahalil-Alakkad-V138-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V138-Windows-Setup.exe' -Force

          foreach ($name in @('Tahalil-Alakkad-V138-Windows-Portable.exe','Tahalil-Alakkad-V138-Windows-Setup.exe')) {
            if ((Get-Item $name).Length -lt 1000000) { throw "$name unexpectedly small" }
            $hash=(Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Publish directly to Windows V138 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag='v138-windows'

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "$env:GITHUB_REPOSITORY" `
              --title "تحاليل العقاد Windows V138 — Safe Failover" `
