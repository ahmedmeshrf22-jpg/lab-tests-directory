            UyiWzawSgCUD/i1h8lm1+NImLbC7jOPLe2Z29Ya14MyJ5QWU67Kt4ttR3oqNehdHRtAuQEm/tAi1
            wRcbP2bfJQeuZLB8mE2BBEQTQkQWEAVKYJCtEp+FWRhaiBlQ4Z80aXzK5GLJOWamOrQKeVLqKr96
            c2H9lfsa+kh5R2lwpYgbUygvzJfz1H800qLwgAVRj6F+haEa3ngsCEUyFQ4Nb2lMw2ITcGJbwfL5
            9KuCkrHMZaJtsZciAxsDMmRP/0cxlbXpS1lsgVZ+KX5LtPtr17DGWtwHo3cPC2nyEW4baofM/X5l
            TP8Zsuy/guk/OduWg9+lqLGJ20mkvIr9yz3kZTm9vNUuT4HlzDLnHdllxhk15MNn6dv0NVHHWd/C
            l+xA/wWMvkp/xDt98K6wrngviYfU0MHPfI02F7EWfrLBEgg43i9nrTIZ7bXqjX5xbzQBG/BYSRfb
            sU5So3jPr3/d8FRwyfTPG7JX8WTWDyimiHvBLMLyLzJKxLmq0wugp4Uu28AKkRxcJy1GZSIY/qIF
            ekNwnM/VK7t/A2v5IbLnIgAA
        run: |
          set -euo pipefail

          printf '%s' "$V145_PATCH_GZ_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/v145_patch.py.gz"

          gzip -dc \
            "$RUNNER_TEMP/v145_patch.py.gz" \
            > "$RUNNER_TEMP/v145_patch.py"

          python3 -m py_compile \
            "$RUNNER_TEMP/v145_patch.py"

          python3 \
            "$RUNNER_TEMP/v145_patch.py"

      - name: Safety audit
        shell: bash
        run: |
          set -euo pipefail

          cd build_v145

          git diff --check

          EXPECTED=$'app/build.gradle.kts\napp/src/main/java/com/example/ui/LabTestsScreen.kt\napp/src/main/java/com/example/ui/LabTestsViewModel.kt'

          ACTUAL="$(
            git diff --name-only | sort
          )"

          EXPECTED_SORTED="$(
            printf '%s\n' "$EXPECTED" | sort
          )"

          if [ "$ACTUAL" != "$EXPECTED_SORTED" ]; then
            echo "::error::Unexpected changed files"
            echo "$ACTUAL"
            exit 1
          fi

          sha256sum -c \
            "$RUNNER_TEMP/protected.sha256"

          grep -Fq \
            'versionCode = 145' \
            app/build.gradle.kts

          grep -Fq \
            '5.65-search-packages-v145-r2' \
            app/build.gradle.kts

          grep -Fq \
            'V145PackagesSection' \
            app/src/main/java/com/example/ui/LabTestsScreen.kt

          grep -Fq \
            'QuickImageSelectedSection(' \
            app/src/main/java/com/example/ui/LabTestsScreen.kt

          grep -Fq \
            'minLines = 2' \
            app/src/main/java/com/example/ui/LabTestsScreen.kt

          grep -Fq \
            '_searchQuery.value = newQuery' \
            app/src/main/java/com/example/ui/LabTestsViewModel.kt

          echo "Safety audit passed"

      - name: Reuse proven V144 signing selector
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail

          WF=".github/workflows/android-v144-ONLY-SESSION-RELOCK-FIX-FINAL-ONE-RUN-R3-AUDITED.yml"

          test -s "$WF"

          extract_step() {
            local name="$1"
            local out="$2"

            awk -v target="$name" '
              $0 == "      - name: " target {
                found=1
                next
              }

              found && /^        run: \|/ {
                inrun=1
                next
              }

              inrun && /^      - name:/ {
                exit
              }

              inrun {
                sub(/^          /,"")
                print
              }
            ' "$WF" > "$out"

            test -s "$out"
          }

          extract_step \
            "Prepare deterministic APK certificate reader" \
            "$RUNNER_TEMP/cert.sh"

          extract_step \
            "Select exact installed Android signer" \
            "$RUNNER_TEMP/signer.sh"

          bash "$RUNNER_TEMP/cert.sh"
          bash "$RUNNER_TEMP/signer.sh"

      - name: Compile V145
        working-directory: build_v145
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=2 \
            :app:compileReleaseKotlin

      - name: Build signed V145 APK
        working-directory: build_v145
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=2 \
            :app:assembleRelease

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find \
              build_v145/app/build/outputs/apk/release \
              -type f \
              -name '*.apk' \
              -print \
              | sort \
              | head -1
          )"

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::Release APK not found"
            exit 1
          fi

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              -print \
              | sort -V \
              | tail -1
          )"

          AAPT="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name aapt \
              -print \
              | sort -V \
              | tail -1
          )"

          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK"

          cert_digest() {
            "$APKSIGNER" \
              verify \
              --print-certs \
              "$1" \
              | awk -F': ' '
                  /Signer #1 certificate SHA-256 digest:/ {
                    value=$2
                    gsub(/[^0-9A-Fa-f]/, "", value)
                    print tolower(value)
                    exit
                  }
                '
          }

          NEW_CERT="$(
            cert_digest "$APK"
          )"

          if [ "${#NEW_CERT}" -ne 64 ]; then
            echo "::error::Could not read V145 signer certificate"
            exit 1
          fi

          OLD_APK="$RUNNER_TEMP/v144-production.apk"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            'https://github.com/ahmedmeshrf22-jpg/lab-tests-directory/releases/download/v144-android-no-relock-r3/Tahalil-Alakkad-V144-No-Relock-R3-SIGNED.apk' \
            -o "$OLD_APK"

          test -s "$OLD_APK"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$OLD_APK"

          OLD_CERT="$(
            cert_digest "$OLD_APK"
          )"

          if [ "${#OLD_CERT}" -ne 64 ]; then
            echo "::error::Could not read V144 signer certificate"
            exit 1
          fi

          echo "V144 certificate: $OLD_CERT"
          echo "V145 certificate: $NEW_CERT"

          if [ "$NEW_CERT" != "$OLD_CERT" ]; then
            echo "::error::V145 signing certificate does not match V144"
            exit 1
          fi

          BADGING="$(
            "$AAPT" dump badging "$APK" \
              | head -1
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -Fq \
              "package: name='com.aistudio.labtestsdirectory.egypt'"

          echo "$BADGING" \
            | grep -Fq \
              "versionCode='145'"

          echo "$BADGING" \
            | grep -Fq \
              "versionName='5.65-search-packages-v145-r2'"

          cp \
            "$APK" \
            Tahalil-Alakkad-V145-R2-FINAL-SIGNED.apk

          sha256sum \
            Tahalil-Alakkad-V145-R2-FINAL-SIGNED.apk \
            > Tahalil-Alakkad-V145-R2-FINAL-SIGNED.apk.sha256

          echo "APK signature/package/version verified"

      - name: Create source commit and ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd build_v145

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b \
            v145-search-packages-final-r2-base

          git add \
            app/build.gradle.kts \
            app/src/main/java/com/example/ui/LabTestsScreen.kt \
            app/src/main/java/com/example/ui/LabTestsViewModel.kt

          git commit \
            -m \
            "Android V145 R2 final search packages and inquiry image"

          FINAL_SHA="$(
            git rev-parse HEAD
          )"

          echo "FINAL_SHA=$FINAL_SHA" \
            >> "$GITHUB_ENV"

          git archive \
            --format=zip \
            --output="$GITHUB_WORKSPACE/Tahalil-Alakkad-V145-R2-SOURCE.zip" \
            HEAD

          cd "$GITHUB_WORKSPACE"

          test -s \
            Tahalil-Alakkad-V145-R2-SOURCE.zip

          sha256sum \
            Tahalil-Alakkad-V145-R2-SOURCE.zip \
            > Tahalil-Alakkad-V145-R2-SOURCE.zip.sha256

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V145-R2-FINAL-HANDOVER
          path: |
            Tahalil-Alakkad-V145-R2-FINAL-SIGNED.apk
            Tahalil-Alakkad-V145-R2-FINAL-SIGNED.apk.sha256
            Tahalil-Alakkad-V145-R2-SOURCE.zip
            Tahalil-Alakkad-V145-R2-SOURCE.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent source and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git -C build_v145 push \
            origin \
            HEAD:refs/heads/v145-search-packages-final-r2-base

          gh release create \
            v145-search-packages-final-r2 \
            Tahalil-Alakkad-V145-R2-FINAL-SIGNED.apk \
            Tahalil-Alakkad-V145-R2-FINAL-SIGNED.apk.sha256 \
            Tahalil-Alakkad-V145-R2-SOURCE.zip \
            Tahalil-Alakkad-V145-R2-SOURCE.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$FINAL_SHA" \
            --title "Tahalil Alakkad Android V145 R2 FINAL" \
            --notes "Final Android V145: larger persistent multi-test search, liver/kidney/diabetes/thyroid/lipid/anemia/basic packages with current-price totals, branded customer image save/share, V144-compatible signing, unchanged Firestore Rules and 331-test catalogue."

      - name: Final handover summary
        shell: bash
        run: |
          {
            echo "## ✅ V145 R2 FINAL"
            echo ""
            echo "✅ APK built"
            echo ""
            echo "✅ APK signature verified against V144"
            echo ""
            echo "✅ Package/version verified"
            echo ""
            echo "✅ Multi-test persistent search"
            echo ""
            echo "✅ Test packages and totals"
            echo ""
            echo "✅ Branded customer image"
            echo ""
            echo "✅ Firestore Rules unchanged"
            echo ""
            echo "✅ Catalogue unchanged"
            echo ""
            echo "✅ APK artifact uploaded"
            echo ""
            echo "✅ Source ZIP uploaded"
            echo ""
            echo "✅ Permanent release published"
          } >> "$GITHUB_STEP_SUMMARY"
