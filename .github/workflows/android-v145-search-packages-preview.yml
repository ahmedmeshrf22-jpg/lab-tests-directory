name: Android V145 FINAL Search Packages Handover

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-android-v145-final
  cancel-in-progress: false

jobs:
  build-v145:
    name: Build Audit Sign Release V145
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Preflight final destination
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG='v145-search-packages-final'
          BRANCH='v145-search-packages-final-base'

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Final V145 release already exists"
            exit 1
          fi

          if git ls-remote --exit-code --heads origin \
            "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "::error::Final V145 source branch already exists"
            exit 1
          fi

      - name: Load exact V144 R3
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'

          REF='refs/remotes/origin/v144-android-no-relock-r3-base'
          EXPECTED='cb81e5608a02103b5d4633063b44fffd21e082da'

          ACTUAL="$(git rev-parse "$REF^{commit}")"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::V144 R3 base moved"
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

          rm -rf build_v145
          git worktree add --detach build_v145 "$REF"

          grep -Fq 'versionCode = 144' \
            build_v145/app/build.gradle.kts

          grep -Fq 'V144_R3_NO_RELOCK' \
            build_v145/app/src/main/java/com/example/MainActivity.kt

          sha256sum \
            build_v145/firestore.rules \
            build_v145/app/src/main/assets/lab_tests_android.json \
            build_v145/app/src/main/java/com/example/MainActivity.kt \
            > "$RUNNER_TEMP/protected-v144.sha256"

      - name: Create package UI
        shell: bash
        run: |
          set -euo pipefail

          cat > \
          build_v145/app/src/main/java/com/example/ui/V145InquiryPackages.kt \
          <<'KOTLIN'

          package com.example.ui

          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.AddCircle
          import androidx.compose.material.icons.filled.CheckCircle
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.example.data.model.LabTest
          import com.example.settings.appText

          private data class V145Package(
              val ar: String,
              val en: String,
              val queries: List<String>
          )

          private val V145Packages = listOf(

              V145Package(
                  "باقة وظائف الكبد",
                  "Liver Function Package",
                  listOf(
                      "ALT (SGPT)",
                      "AST (SGOT)",
                      "ALP",
                      "GGT",
                      "Bilirubin (Total)",
                      "Bilirubin (Direct)",
                      "Albumin"
                  )
              ),

              V145Package(
                  "باقة وظائف الكلى",
                  "Kidney Function Package",
                  listOf(
                      "Urea",
                      "Creatinine",
                      "Uric Acid",
                      "eGFR"
                  )
              ),

              V145Package(
                  "باقة السكر",
                  "Diabetes Package",
                  listOf(
                      "Fasting Blood Glucose",
                      "HbA1c"
                  )
              ),

              V145Package(
                  "باقة الغدة الدرقية",
                  "Thyroid Package",
                  listOf(
                      "TSH",
                      "Free T4",
                      "Free T3"
                  )
              ),

              V145Package(
                  "باقة الدهون",
                  "Lipid Profile Package",
                  listOf(
                      "Cholesterol",
                      "Triglyceride",
                      "HDL",
                      "LDL"
                  )
              ),

              V145Package(
                  "باقة الأنيميا",
                  "Anemia Package",
                  listOf(
                      "CBC",
                      "Ferritin"
                  )
              ),

              V145Package(
                  "باقة الفحص الأساسي",
                  "Basic Checkup Package",
                  listOf(
                      "CBC",
                      "HbA1c",
                      "TSH",
                      "Creatinine",
                      "ALT (SGPT)",
                      "Cholesterol"
                  )
              )
          )

          private fun normalizeV145(value: String): String =
              value.lowercase()
                  .replace(
                      Regex("[^a-z0-9\\u0600-\\u06ff]+"),
                      " "
                  )
                  .trim()

          private fun resolveV145(
              viewModel: LabTestsViewModel,
              query: String
          ): LabTest? {

              val wanted = normalizeV145(query)

              val candidates =
                  viewModel.searchManagerTests(query)

              return candidates.firstOrNull { test ->

                  listOf(
                      test.englishName,
                      test.arabicName,
                      test.marketName
                  ).any { name ->

                      val current =
                          normalizeV145(name)

                      current == wanted ||
                          current.startsWith("$wanted ") ||
                          wanted.startsWith("$current ")
                  }

              } ?: candidates.firstOrNull()
          }

          private fun priceNumberV145(
              value: String?
          ): Double {

              return Regex(
                  "[0-9]+(\\.[0-9]+)?"
              )
                  .find(value.orEmpty())
                  ?.value
                  ?.toDoubleOrNull()
                  ?: 0.0
          }

          private fun moneyV145(
              value: Double
          ): String {

              return if (
                  value % 1.0 == 0.0
              ) {
                  value.toLong().toString()
              } else {
                  String.format(
                      "%.2f",
                      value
                  )
              }
          }

          fun activeSearchSegmentV145(
              query: String
          ): String {

              return query
                  .split(
                      Regex(
                          "[\\n\\r\\t,،;؛|•]+"
                      )
                  )
                  .lastOrNull()
                  ?.trim()
                  .orEmpty()
          }

          @Composable
          fun InquiryPackagesV145(
              viewModel: LabTestsViewModel,
              customerPriceOverrides:
                  Map<Int, String>,
              selectedIds: Set<Int>,
              onAddPackage:
                  (List<LabTest>) -> Unit
          ) {

              Column(
                  modifier =
                      Modifier.fillMaxWidth(),
                  verticalArrangement =
                      Arrangement.spacedBy(8.dp)
              ) {

                  Text(
                      text = appText(
                          "باقات التحاليل",
                          "Test Packages"
                      ),
                      fontSize = 16.sp,
                      fontWeight =
                          FontWeight.ExtraBold,
                      color =
                          Color(0xFF17324D)
                  )

                  V145Packages.forEach { pkg ->

                      val tests =
                          pkg.queries
                              .mapNotNull {
                                  resolveV145(
                                      viewModel,
                                      it
                                  )
                              }
                              .distinctBy {
                                  it.id
                              }

                      val total =
                          tests.sumOf { test ->

                              priceNumberV145(
                                  customerPriceOverrides[
                                      test.id
                                  ]
                                      ?: test.customerPrice
                              )
                          }

                      val allSelected =
                          tests.isNotEmpty() &&
                              tests.all {
                                  it.id in selectedIds
                              }

                      Card(
                          modifier =
                              Modifier.fillMaxWidth(),
                          shape =
                              RoundedCornerShape(
                                  16.dp
                              ),
                          colors =
                              CardDefaults.cardColors(
                                  containerColor =
                                      if (allSelected)
                                          Color(
                                              0xFFEAF7F2
                                          )
                                      else
                                          Color.White
                              ),
                          border =
                              BorderStroke(
                                  1.dp,
                                  if (allSelected)
                                      Color(
                                          0xFF8FD3B6
                                      )
                                  else
                                      Color(
                                          0xFFDCE6EF
                                      )
                              )
                      ) {

                          Column(
                              modifier =
                                  Modifier
                                      .fillMaxWidth()
                                      .padding(12.dp),
                              verticalArrangement =
                                  Arrangement.spacedBy(
                                      6.dp
                                  )
                          ) {

                              Row(
                                  modifier =
                                      Modifier.fillMaxWidth(),
                                  verticalAlignment =
                                      Alignment.CenterVertically,
                                  horizontalArrangement =
                                      Arrangement.SpaceBetween
                              ) {

                                  Column(
                                      modifier =
                                          Modifier.weight(1f)
                                  ) {

                                      Text(
                                          text =
                                              appText(
                                                  pkg.ar,
                                                  pkg.en
                                              ),
                                          fontSize =
                                              14.sp,
                                          fontWeight =
                                              FontWeight.ExtraBold,
                                          color =
                                              Color(
                                                  0xFF17324D
                                              )
                                      )

                                      Text(
                                          text =
                                              appText(
                                                  "${tests.size} تحليل",
                                                  "${tests.size} tests"
                                              ),
                                          fontSize =
                                              10.sp,
                                          color =
                                              Color(
                                                  0xFF64748B
                                              )
                                      )
                                  }

                                  Text(
                                      text =
                                          "${moneyV145(total)} ${
                                              appText(
                                                  "ج",
                                                  "EGP"
                                              )
                                          }",
                                      fontSize =
                                          17.sp,
                                      fontWeight =
                                          FontWeight.ExtraBold,
                                      color =
                                          Color(
                                              0xFF087F5B
                                          )
                                  )
                              }

                              if (
                                  tests.isNotEmpty()
                              ) {

                                  Text(
                                      text =
                                          tests.joinToString(
                                              " • "
                                          ) {
                                              it.marketName
                                                  .ifBlank {
                                                      it.englishName
                                                  }
                                          },
                                      fontSize =
                                          9.sp,
                                      color =
                                          Color(
                                              0xFF64748B
                                          )
                                  )
                              }

                              Button(
                                  onClick = {
                                      onAddPackage(
                                          tests
                                      )
                                  },
                                  enabled =
                                      tests.isNotEmpty() &&
                                          !allSelected,
                                  modifier =
                                      Modifier.fillMaxWidth()
                              ) {

                                  Icon(
                                      imageVector =
                                          if (
                                              allSelected
                                          )
                                              Icons.Default.CheckCircle
                                          else
                                              Icons.Default.AddCircle,
                                      contentDescription =
                                          null
                                  )

                                  Spacer(
                                      Modifier.width(
                                          6.dp
                                      )
                                  )

                                  Text(
                                      if (
                                          allSelected
                                      )
                                          appText(
                                              "تمت الإضافة",
                                              "Added"
                                          )
                                      else
                                          appText(
                                              "إضافة الباقة بالكامل",
                                              "Add full package"
                                          )
                                  )
                              }
                          }
                      }
                  }
              }
          }

          KOTLIN

      - name: Apply V145 source changes
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'

          from pathlib import Path
          import re

          root = Path("build_v145")

          screen_file = (
              root /
              "app/src/main/java/com/example/ui/LabTestsScreen.kt"
          )

          vm_file = (
              root /
              "app/src/main/java/com/example/ui/LabTestsViewModel.kt"
          )

          grad_file = (
              root /
              "app/build.gradle.kts"
          )

          screen =
              screen_file.read_text(
                  encoding="utf-8"
              )

          vm =
              vm_file.read_text(
                  encoding="utf-8"
              )

          grad =
              grad_file.read_text(
                  encoding="utf-8"
              )

          # -------------------------------
          # Version 145
          # -------------------------------

          if grad.count(
              "versionCode = 144"
          ) != 1:
              raise SystemExit(
                  "Version marker invalid"
              )

          grad =
              grad.replace(
                  "versionCode = 144",
                  "versionCode = 145",
                  1
              )

          grad, n =
              re.subn(
                  r'versionName\s*=\s*"[^"]+"',
                  'versionName = "5.65-search-packages-v145"',
                  grad,
                  count=1
              )

          if n != 1:
              raise SystemExit(
                  "versionName failed"
              )

          # -------------------------------
          # Stop automatic clear
          # -------------------------------

          auto_clear =
              re.compile(
                  r'onSuggestionSelected\s*=\s*'
                  r'\{\s*test\s*->\s*'
                  r'viewModel\.addSelectedTest'
                  r'\(test\)
