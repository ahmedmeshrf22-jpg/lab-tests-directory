name: Android V145 FINAL R2 Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-v145-final-r2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Preflight final R2
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="v145-search-packages-final-r2-base"
          TAG="v145-search-packages-final-r2"

          if git ls-remote --exit-code --heads origin \
            "refs/heads/$BRANCH" >/dev/null 2>&1
          then
            echo "::error::R2 source branch already exists"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin \
            "refs/tags/$TAG" >/dev/null 2>&1
          then
            echo "::error::R2 release tag already exists"
            exit 1
          fi

      - name: Prepare exact V144 base
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin \
            '+refs/heads/*:refs/remotes/origin/*'

          BASE="cb81e5608a02103b5d4633063b44fffd21e082da"
          REF="refs/remotes/origin/v144-android-no-relock-r3-base"

          ACTUAL="$(git rev-parse "$REF^{commit}")"

          if [ "$ACTUAL" != "$BASE" ]; then
            echo "::error::V144 R3 base mismatch"
            echo "Expected: $BASE"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

          rm -rf build_v145
          git worktree add --detach build_v145 "$BASE"

          (
            cd build_v145

            grep -Fq 'versionCode = 144' \
              app/build.gradle.kts

            grep -Fq 'V144_R3_NO_RELOCK' \
              app/src/main/java/com/example/MainActivity.kt

            sha256sum \
              firestore.rules \
              app/google-services.json \
              app/src/main/assets/lab_tests_android.json \
              app/src/main/java/com/example/MainActivity.kt \
              > "$RUNNER_TEMP/protected.sha256"
          )

