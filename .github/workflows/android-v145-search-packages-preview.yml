name: Android V145 FINAL Search Packages Handover

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-android-v145-final
  cancel-in-progress: false

jobs:
  build-v145-final:
    name: Build Audit Sign Release V145
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail

          TAG="v145-search-packages-final"
          BRANCH="v145-search-packages-final-base"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "::error::Branch $BRANCH already exists"
            exit 1
          fi

      - name: Load exact V144 R3 production source
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'

          REF="refs/remotes/origin/v144-android-no-relock-r3-base"
          EXPECTED="cb81e5608a02103b5d4633063b44fffd21e082da"

          ACTUAL="$(git rev-parse "$REF^{commit}")"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::V144 R3 base changed"
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

          rm -rf build_v145
          git worktree add --detach build_v145 "$REF"

          grep -Fq 'versionCode = 144' \
            build_v145/app/build.gradle.kts

          grep -Fq 'versionName = "5.64-no-relock-v144-r3"' \
            build_v145/app/build.gradle.kts

          grep -Fq 'V144_R3_NO_RELOCK' \
            build_v145/app/src/main/java/com/example/MainActivity.kt

          sha256sum \
            build_v145/firestore.rules \
            build_v145/app/google-services.json \
            build_v145/app/src/main/assets/lab_tests_android.json \
            build_v145/app/src/main/java/com/example/MainActivity.kt \
            > "$RUNNER_TEMP/v145-protected-before.sha256"

      - name: Apply complete V145 feature patch
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          root = Path("build_v145")

          screen_file = root / "app/src/main/java/com/example/ui/LabTestsScreen.kt"
          vm_file = root / "app/src/main/java/com/example/ui/LabTestsViewModel.kt"
          gradle_file = root / "app/build.gradle.kts"

          screen = screen_file.read_text(encoding="utf-8")
          vm = vm_file.read_text(encoding="utf-8")
          gradle = gradle_file.read_text(encoding="utf-8")

          def replace_exact(text, old, new, label, expected=1):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{label}: expected {expected} occurrence(s), found {count}"
                  )
              return text.replace(old, new, expected)

          # ==========================================================
          # VERSION
          # ==========================================================

          gradle = replace_exact(
              gradle,
              "versionCode = 144",
              "versionCode = 145",
              "versionCode"
          )

          gradle = replace_exact(
              gradle,
              'versionName = "5.64-no-relock-v144-r3"',
              'versionName = "5.65-search-packages-v145"',
              "versionName"
          )

          # ==========================================================
          # KEEP USER SEARCH TEXT AFTER SELECTING A TEST
          # ==========================================================

          old_auto_clear = (
              "                                            viewModel.addSelectedTest(test)\n"
              "                                            // Keep the field focused and ready for the next test.\n"
              "                                            viewModel.clearSearch()"
          )

          new_auto_clear = (
              "                                            viewModel.addSelectedTest(test)"
          )

          screen = replace_exact(
              screen,
              old_auto_clear,
              new_auto_clear,
              "remove automatic query clearing"
          )

          # ==========================================================
          # KEEP EXACT MULTI-TEST TEXT TYPED BY USER
          # ==========================================================

          old_multi = (
              "        if (explicitTests.size > 1) {\n"
              '            onQueryChanged(explicitTests.joinToString("\\n") { it.englishName })\n'
              "            return\n"
              "        }"
          )

          new_multi = (
              "        if (explicitTests.size > 1) {\n"
              '            onQueryChanged(explicitTests.joinToString("\\n") { it.englishName })\n'
              "            _searchQuery.value = newQuery\n"
              "            return\n"
              "        }"
          )

          vm = replace_exact(
              vm,
              old_multi,
              new_multi,
              "preserve multi-test query"
          )

          # ==========================================================
          # PACKAGE + ACTIVE SEARCH HELPERS
          # Everything is inserted in the existing screen file so it
          # uses the project's existing LabTest/Compose imports.
          # ==========================================================

          searchbox_marker = "@Composable\nprivate fun SearchBox("

          if screen.count(searchbox_marker) != 1:
              raise SystemExit("SearchBox marker invalid")

          package_code = r'''
          private data class V145InquiryPackage(
              val key: String,
              val nameAr: String,
              val nameEn: String,
              val testQueries: List<String>
          )

          private val V145InquiryPackages = listOf(
              V145InquiryPackage(
                  key = "liver",
                  nameAr = "باقة وظائف الكبد",
                  nameEn = "Liver Function Package",
                  testQueries = listOf(
                      "ALT",
                      "AST",
                      "ALP",
                      "GGT",
                      "Bilirubin Total",
                      "Bilirubin Direct",
                      "Albumin"
                  )
              ),
              V145InquiryPackage(
                  key = "kidney",
                  nameAr = "باقة وظائف الكلى",
                  nameEn = "Kidney Function Package",
                  testQueries = listOf(
                      "Urea",
                      "Creatinine",
                      "Uric Acid",
                      "eGFR"
                  )
              ),
              V145InquiryPackage(
                  key = "diabetes",
                  nameAr = "باقة السكر",
                  nameEn = "Diabetes Package",
                  testQueries = listOf(
                      "Fasting Blood Glucose",
                      "HbA1c"
                  )
              ),
              V145InquiryPackage(
                  key = "thyroid",
                  nameAr = "باقة الغدة الدرقية",
                  nameEn = "Thyroid Package",
                  testQueries = listOf(
                      "TSH",
                      "Free T4",
                      "Free T3"
                  )
              ),
              V145InquiryPackage(
                  key = "lipids",
                  nameAr = "باقة الدهون",
                  nameEn = "Lipid Profile Package",
                  testQueries = listOf(
                      "Cholesterol",
                      "Triglyceride",
                      "HDL",
                      "LDL"
                  )
              ),
              V145InquiryPackage(
                  key = "anemia",
                  nameAr = "باقة الأنيميا",
                  nameEn = "Anemia Package",
                  testQueries = listOf(
                      "CBC",
                      "Ferritin"
                  )
              ),
              V145InquiryPackage(
                  key = "basic",
                  nameAr = "باقة الفحص الأساسي",
                  nameEn = "Basic Checkup Package",
                  testQueries = listOf(
                      "CBC",
                      "HbA1c",
                      "TSH",
                      "Creatinine",
                      "ALT",
                      "Cholesterol"
                  )
              )
          )

          private fun activeSearchSegmentV145(
              query: String
          ): String {
              return query
                  .split(Regex("[\\n\\r\\t,،;؛|•]+"))
                  .lastOrNull()
                  ?.trim()
                  .orEmpty()
          }

          private fun resolvePackageTestsV145(
              viewModel: LabTestsViewModel,
              queries: List<String>
          ): List<LabTest> {
              return queries
                  .mapNotNull { query ->
                      viewModel.smartSearchCandidates(query)
                          .firstOrNull()
                  }
                  .distinctBy { it.id }
          }

          @Composable
          private fun InquiryPackagesSectionV145(
              viewModel: LabTestsViewModel,
              customerPriceOverrides: Map<Int, String>,
              selectedIds: Set<Int>,
              onAddPackage: (List<LabTest>) -> Unit
          ) {
              Column(
                  modifier = Modifier.fillMaxWidth(),
                  verticalArrangement = Arrangement.spacedBy(8.dp)
              ) {
                  Text(
                      text = appText(
                          "باقات التحاليل",
                          "Test Packages"
                      ),
                      fontSize = 16.sp,
                      fontWeight = FontWeight.ExtraBold,
                      color = Color(0xFF17324D)
                  )

                  V145InquiryPackages.forEach { pkg ->
                      val tests = resolvePackageTestsV145(
                          viewModel = viewModel,
                          queries = pkg.testQueries
                      )

                      val totalPrice = calculatePriceTotal(tests) { test ->
                          customerPriceOverrides[test.id]
                              ?: test.customerPrice
                      }

                      val allSelected =
                          tests.isNotEmpty() &&
                              tests.all { it.id in selectedIds }

                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(16.dp),
                          colors = CardDefaults.cardColors(
                              containerColor =
                                  if (allSelected) {
                                      Color(0xFFEAF7F2)
                                  } else {
                                      Color.White
                                  }
                          ),
                          border = BorderStroke(
                              1.dp,
                              if (allSelected) {
                                  Color(0xFF8FD3B6)
                              } else {
                                  Color(0xFFDCE6EF)
                              }
                          )
                      ) {
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(12.dp),
                              verticalArrangement =
                                  Arrangement.spacedBy(6.dp)
                          ) {
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement =
                                      Arrangement.SpaceBetween,
                                  verticalAlignment =
                                      Alignment.CenterVertically
                              ) {
                                  Column(
                                      modifier = Modifier.weight(1f)
                                  ) {
                                      Text(
                                          text = appText(
                                              pkg.nameAr,
                                              pkg.nameEn
                                          ),
                                          fontSize = 14.sp,
                                          fontWeight =
                                              FontWeight.ExtraBold,
                                          color = Color(0xFF17324D)
                                      )

                                      Text(
                                          text = appText(
                                              "${tests.size} تحليل",
                                              "${tests.size} tests"
                                          ),
                                          fontSize = 10.sp,
                                          color = Color(0xFF64748B)
                                      )
                                  }

                                  Text(
                                      text =
                                          "${formatTotalDisplay(totalPrice)} ${
                                              appText("ج", "EGP")
                                          }",
                                      fontSize = 17.sp,
                                      fontWeight =
                                          FontWeight.ExtraBold,
                                      color = Color(0xFF087F5B)
                                  )
                              }

                              if (tests.isNotEmpty()) {
                                  Text(
                                      text = tests.joinToString(
                                          separator = " • "
                                      ) { test ->
                                          test.marketName.ifBlank {
                                              test.englishName
                                          }
                                      },
                                      fontSize = 9.sp,
                                      color = Color(0xFF64748B)
                                  )
                              }

                              LabeledIconAction(
                                  label =
                                      if (allSelected) {
                                          appText(
                                              "تمت إضافة الباقة",
                                              "Package added"
                                          )
                                      } else {
                                          appText(
                                              "إضافة الباقة بالكامل",
                                              "Add full package"
                                          )
                                      },
                                  onClick = {
                                      onAddPackage(tests)
                                  },
                                  modifier = Modifier.fillMaxWidth(),
                                  enabled =
                                      tests.isNotEmpty() &&
                                          !allSelected
                              ) {
                                  Icon(
                                      Icons.Default.AddCircle,
                                      contentDescription = null
                                  )
                              }
                          }
                      }
                  }
              }
          }

          '''

          screen = screen.replace(
              searchbox_marker,
              package_code + searchbox_marker,
              1
          )

          # ==========================================================
          # SUGGESTIONS FOLLOW CURRENT TEST SEGMENT
          # ==========================================================

          old_suggestions = (
              "suggestions = "
              "viewModel.smartSearchCandidates(searchQuery),"
          )

          screen = replace_exact(
              screen,
              old_suggestions,
              "suggestions = "
              "viewModel.smartSearchCandidates("
              "activeSearchSegmentV145(searchQuery)),",
              "active search suggestions",
              expected=2
          )

          # ==========================================================
          # BIGGER MULTILINE SEARCH FIELD
          # ==========================================================

          start = screen.find("private fun SearchBox(")

          end = screen.find(
              "\n@Composable\nprivate fun ResultCountChip",
              start
          )

          if start < 0 or end < 0:
              raise SystemExit("SearchBox block not found")

          searchbox = screen[start:end]

          searchbox = replace_exact(
              searchbox,
              ".heightIn(min = 62.dp)",
              ".heightIn(min = 105.dp)",
              "search field height"
          )

          searchbox = replace_exact(
              searchbox,
              "            singleLine = true,\n",
              "            singleLine = false,\n"
              "            minLines = 2,\n"
              "            maxLines = 5,\n",
              "multiline search"
          )

          searchbox = replace_exact(
              searchbox,
              "keyboardOptions = "
              "KeyboardOptions(imeAction = ImeAction.Search),",
              "keyboardOptions = "
              "KeyboardOptions(imeAction = ImeAction.Default),",
              "keyboard action"
          )

          screen = (
              screen[:start] +
              searchbox +
              screen[end:]
          )

          # ==========================================================
          # INSERT PACKAGES DIRECTLY BELOW QUICK INQUIRY SEARCH
          # ==========================================================

          quick_pos = screen.find('"quick_image" -> {')

          if quick_pos < 0:
              raise SystemExit("quick_image workspace not found")

          search_pos = screen.find(
              "SearchBox(",
              quick_pos
          )

          if search_pos < 0:
              raise SystemExit("quick inquiry SearchBox missing")

          search_end_marker = (
              "                                        "
              "importingDocument = importingTestsDocument\n"
              "                                    )"
          )

          search_end = screen.find(
              search_end_marker,
              search_pos
          )

          if search_end < 0:
              raise SystemExit(
                  "quick inquiry SearchBox end not found"
              )

          search_end += len(search_end_marker)

  
