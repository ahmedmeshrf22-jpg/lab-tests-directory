name: Build AK V115 HOME ICONS MULTI INQUIRY LAB SYNC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract V115
        run: |
          set -euo pipefail
          rm -rf build_v115
          mkdir build_v115
          unzip -q Project3_AK_V115_HOME_MULTI_LAB_SYNC_FIXED.zip -d build_v115
          test -f build_v115/app/src/main/java/com/example/ui/LabTestsScreen.kt
          test -f build_v115/app/src/main/java/com/example/ui/OrderHubScreen.kt
          test -f build_v115/app/src/main/java/com/example/ui/LabTestsViewModel.kt
          test -f build_v115/app/src/main/java/com/example/data/repository/LabTestRepository.kt

      - name: Restore signing
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_BUNDLE_B64:-}"
          rm -rf /tmp/tahalil_sign
          mkdir -p /tmp/tahalil_sign/files
          printf '%s' "$SIGNING_BUNDLE_B64" | tr -d '\r\n ' | base64 --decode > /tmp/tahalil_sign/bundle.bin
          if unzip -t /tmp/tahalil_sign/bundle.bin >/dev/null 2>&1; then
            unzip -q /tmp/tahalil_sign/bundle.bin -d /tmp/tahalil_sign/files
          else
            cp /tmp/tahalil_sign/bundle.bin /tmp/tahalil_sign/files/original.keystore
          fi
          KEYSTORE="$(find /tmp/tahalil_sign/files -type f \( -iname '*.jks' -o -iname '*.keystore' \) -print -quit)"
          test -n "$KEYSTORE"
          STORE_PASSWORD=""
          KEY_ALIAS=""
          KEY_PASSWORD=""
          while IFS= read -r META; do
            [ -f "$META" ] || continue
            [ -n "$STORE_PASSWORD" ] || STORE_PASSWORD="$(sed -nE 's/^[[:space:]]*(STORE_PASSWORD|KEYSTORE_PASSWORD|storePassword|store_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(sed -nE 's/^[[:space:]]*(KEY_ALIAS|keyAlias|key_alias)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$(sed -nE 's/^[[:space:]]*(KEY_PASSWORD|keyPassword|key_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
          done < <(find /tmp/tahalil_sign/files -type f \( -iname '*.properties' -o -iname '*.env' -o -iname '*.txt' \) -print)
          if [ -z "$STORE_PASSWORD" ] && keytool -list -keystore "$KEYSTORE" -storepass android >/dev/null 2>&1; then STORE_PASSWORD="android"; fi
          test -n "$STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
          test -n "$KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$STORE_PASSWORD"
          cp "$KEYSTORE" build_v115/original-signing-key.jks
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/build_v115/original-signing-key.jks"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Verify V115 home + multi inquiry + lab sync
        run: |
          set -euo pipefail
          python3 <<'PY2'
          from pathlib import Path
          root = Path("build_v115")
          grad = (root / "app/build.gradle.kts").read_text()
          screen = (root / "app/src/main/java/com/example/ui/LabTestsScreen.kt").read_text()
          vm = (root / "app/src/main/java/com/example/ui/LabTestsViewModel.kt").read_text()
          repo = (root / "app/src/main/java/com/example/data/repository/LabTestRepository.kt").read_text()
          hub = (root / "app/src/main/java/com/example/ui/OrderHubScreen.kt").read_text()
          lab = (root / "app/src/main/java/com/example/ui/LabOperatorScreen.kt").read_text()
          gs = (root / "app/google-services.json").read_text()

          checks = {
              "versionCode 115": 'versionCode = 115' in grad,
              "versionName V115": '5.35-home-icons-multi-inquiry-v115' in grad,
              "same package": 'applicationId = "com.aistudio.labtestsdirectory.egypt"' in grad,
              "same Firebase": 'tahalil-alakkad' in gs,

              # Main home: no hidden arrow/menu; every service is a visible circular icon.
              "circular home icons": 'fun HomeServiceIconShortcut(' in screen and 'shape = CircleShape' in screen,
              "no collapsed services menu": 'الخدمات الأخرى والإدارة ▼' not in screen and 'إخفاء الخدمات الأخرى ▲' not in screen,
              "orders icon visible": 'appText("الطلبات", "Orders")' in screen,
              "prescription icon visible": 'قراءة روشتة / طلب عيادة' in screen,
              "admin icon visible": 'appText("الإدارة", "Admin")' in screen,
              "lab2lab icon visible": 'الأسعار Lab 2 Lab' in screen,
              "settings icon visible": 'appText("الإعدادات", "Settings")' in screen,

              # Test inquiry: one smart box -> multi-select basket -> instant total; customer is optional/not required.
              "single smart search field": 'ابحث عن تحليل أو اكتب ما تريد الاطمئنان عليه' in screen,
              "dropdown on focus": '.onFocusChanged { focused = it.isFocused }' in screen and 'if (focused && suggestions.isNotEmpty())' in screen,
              "two char filtering preserved": 'if (normalized.length < 2) return allTests' in repo,
              "manual dropdown selection": 'onSuggestionSelected(test)' in screen and 'enabled = !selected' in screen,
              "multi inquiry basket": 'fun PriceInquiryBasketSection(' in screen and 'قائمة الاستعلام' in screen,
              "inquiry total": 'formatTotalDisplay(totalPrice)' in screen and 'مسح قائمة الاستعلام' in screen,
              "dropdown adds to basket": 'viewModel.addSelectedTest(test)' in screen and 'viewModel.clearSearch()' in screen,
              "normal result adds to basket": 'إضافة إلى القائمة' in screen and 'onSelectTest = { test ->' in screen,
              "multi selected ids": 'selectedIds = selectedTests.map { it.id }.toSet()' in screen,
              "arabic english market search": all(x in repo for x in ['test.normEnglish','test.normArabic','test.normMarket','test.normSearch']),
              "natural language search preserved": all(x in repo for x in ['اطمن على الكبد','اطمن على الكلى','اطمن على السكر','الغدة الدرقية','انيميا']),

              # Orders Hub V113 behavior preserved.
              "orders hub preserved": 'fun OrderHubScreen(' in hub and all(x in hub for x in ['قيد التنفيذ','مكتمل','تم الإلغاء']),
              "auto completion preserved": 'resultSentAtMillis > 0L' in hub and 'resultUrls.isNotEmpty()' in hub,
              "auto send preserved": 'workflowStatus = "sent_to_lab"' in vm,

              # Lab operator gets the corresponding update, without financial data or hard delete.
              "lab stages preserved": all(x in lab for x in ['طلبات جديدة','جاري التنفيذ','النتائج المرسلة']),
              "lab realtime updates": 'الطلبات والتعديلات والإلغاءات بتتحدث لحظيًا لهذا الحساب' in lab,
              "lab notification deep link": 'pendingOpenOrderId' in lab and 'consumePendingOpenOrder()' in lab,
              "lab update badge": 'الطلب اتحدّث — راجع البيانات قبل التنفيذ' in lab,
              "lab soft cancel": 'إلغاء الطلب' in lab and 'labCancelOrder' in lab and 'fun labCancelOrder(' in vm,
              "no lab hard-delete wording": 'حذف الطلب' not in lab,
              "lab prices hidden": not any(x in lab for x in ['customerPrice','discountAmount','paidAmount','remainingAmount']),
              "lab result sends ready": '"workflow_status" to "ready"' in vm and 'result_sent_at_ms' in vm,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(("OK   " if ok else "FAIL ") + name)
          if failed:
              raise SystemExit("V115 checks failed: " + ", ".join(failed))
          print("ALL V115 HOME/MULTI/LAB-SYNC CHECKS PASSED")
          PY2

      - name: Build signed V115 release
        working-directory: build_v115
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify and upload APK
        run: |
          set -euo pipefail
          APK="$(find build_v115/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" Tahalil-Alakkad-V115-HOME-MULTI-LAB-SYNC-SIGNED.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V115-HOME-MULTI-LAB-SYNC-SIGNED
          path: Tahalil-Alakkad-V115-HOME-MULTI-LAB-SYNC-SIGNED.apk
          if-no-files-found: error
          retention-days: 30
