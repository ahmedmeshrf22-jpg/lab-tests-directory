          $bytes = [Convert]::FromBase64String(($base64 -replace '\s',''))
          $zip = Join-Path $PWD 'V125-small-source.zip'
          [IO.File]::WriteAllBytes($zip, $bytes)
          if (Test-Path build_windows_v125) { Remove-Item build_windows_v125 -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath build_windows_v125 -Force
          if (!(Test-Path 'build_windows_v125/windows-system/package.json')) {
            throw 'Invalid Windows V125 source structure'
          }

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit Windows V125 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows_v125/windows-system'

          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '125.0.0') { throw "Expected 125.0.0, got $($pkg.version)" }
          if ($pkg.build.portable.artifactName -notmatch 'V125') { throw 'Portable V125 name missing' }
          if ($pkg.build.nsis.artifactName -notmatch 'V125') { throw 'Setup V125 name missing' }
          if ($pkg.build.win.icon -ne 'public/logo.png') { throw 'Windows PNG icon config missing' }
          if (!(Test-Path (Join-Path $root 'public/logo.png'))) { throw 'Windows logo missing' }

          $tests = Get-Content (Join-Path $root 'public/lab_tests_android.json') -Raw | ConvertFrom-Json
          if ($tests.Count -ne 331) { throw "Expected 331 tests, got $($tests.Count)" }
          if (($tests | Where-Object { $null -ne $_.customer_price }).Count -ne 0) {
            throw 'Embedded customer prices must remain removed'
          }

          $app = Get-Content (Join-Path $root 'src/app.js') -Raw
          foreach ($x in @(
            'Unified System V125',
            'Windows System V125',
            'نسيت اسم المستخدم',
            'نسيت كلمة المرور',
            'طلب تعديل نتيجة',
            'resetUserLoginCredentials',
            'requestResultRevision',
            'onBackgrounded'
          )) {
            if (!$app.Contains($x)) { throw "Missing app marker: $x" }
          }

          $data = Get-Content (Join-Path $root 'src/data.js') -Raw
          foreach ($x in @(
            "labOrders:'lab_orders'",
            'watchSharedOrders',
            'result_revision_requested',
            'user_credentials_rotate',
            'tahalil_acting_user_v125'
          )) {
            if (!$data.Contains($x)) { throw "Missing data marker: $x" }
          }

          $backup = Get-Content (Join-Path $root 'src/backup.js') -Raw
          foreach ($x in @(
            'SCHEMA=2',
            'app_version_code:125',
            "app_version_name:'System V125 Windows'",
            'result_file_activity'
          )) {
            if (!$backup.Contains($x)) { throw "Missing backup marker: $x" }
          }
          if ($backup.Contains('app_version_code:119')) { throw 'Old V119 backup version remains' }

          $fb = Get-Content (Join-Path $root 'src/firebase.js') -Raw
          if (!$fb.Contains('browserSessionPersistence')) { throw 'Firebase session protection missing' }

          $rs = Get-Content (Join-Path $root 'src/resultStore.js') -Raw
          foreach ($x in @(
            'sha256: digest',
            'sha256_hex: digest',
            'meta.sha256 || meta.sha256_hex',
            'MAX_FILE_BYTES = 6 * 1024 * 1024'
          )) {
            if (!$rs.Contains($x)) { throw "Missing result integrity marker: $x" }
          }

          $main = Get-Content (Join-Path $root 'electron/main.cjs') -Raw
          foreach ($x in @(
            'sandbox: true',
            'contextIsolation: true',
            'nodeIntegration: false',
            'webSecurity: true',
            'new Tray',
            'backgroundThrottling: false',
            'requestSingleInstanceLock',
            'app:backgrounded',
            "notification.on('click', showMainWindow)",
            'خروج نهائي'
          )) {
            if (!$main.Contains($x)) { throw "Missing Windows V125 marker: $x" }
          }

          $runtime = $app + "`n" + $data + "`n" + $backup + "`n" + $fb + "`n" + $rs + "`n" + $main
          if ($runtime.ToLower().Contains('cloudflare') -or $runtime.ToLower().Contains('workers.dev')) {
            throw 'Cloudflare dependency detected'
          }
          if ($runtime.Contains('sendPasswordResetEmail')) {
            throw 'Email password reset must remain disabled'
          }

          Get-ChildItem (Join-Path $root 'src') -Filter '*.js' -File | ForEach-Object {
            Get-Content $_.FullName -Raw | node --input-type=module --check
            if ($LASTEXITCODE -ne 0) { throw "JS syntax failed: $($_.Name)" }
          }
          node --check (Join-Path $root 'electron/main.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'main.cjs syntax failed' }
          node --check (Join-Path $root 'electron/preload.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'preload.cjs syntax failed' }

          Write-Host 'WINDOWS V125 SOURCE AUDIT PASSED'

      - name: Install dependencies
        working-directory: build_windows_v125/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Build Portable EXE
        working-directory: build_windows_v125/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Smoke launch Portable EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows_v125/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*Portable*.exe' -File |
            Sort-Object Length -Descending | Select-Object -First 1
          if (!$exe) { throw 'Portable EXE not found' }
          $env:TAHALIL_SMOKE_TEST = '1'
          $p = Start-Process -FilePath $exe.FullName -PassThru
          if (!$p.WaitForExit(40000)) {
            Stop-Process -Id $p.Id -Force
            throw 'Portable smoke launch timed out'
          }
          if ($p.ExitCode -ne 0) { throw "Portable smoke exit code $($p.ExitCode)" }
          Write-Host 'WINDOWS V125 PORTABLE SMOKE PASSED'

      - name: Build Setup EXE
        working-directory: build_windows_v125/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }

      - name: Prepare release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows_v125/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File |
            Sort-Object Length -Descending | Select-Object -First 1
          $setup = Get-ChildItem $release -Filter '*Setup*.exe' -File |
            Sort-Object Length -Descending | Select-Object -First 1

          if (!$portable -or !$setup) { throw 'Expected Portable and Setup EXEs' }

          Copy-Item $portable.FullName 'Tahalil-Alakkad-V125-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V125-Windows-Setup.exe' -Force

          foreach ($name in @(
            'Tahalil-Alakkad-V125-Windows-Portable.exe',
            'Tahalil-Alakkad-V125-Windows-Setup.exe'
          )) {
            if ((Get-Item $name).Length -lt 1000000) { throw "$name unexpectedly small" }
            $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Publish directly to Windows V125 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v125-windows'

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "$env:GITHUB_REPOSITORY" `
              --title "تحاليل العقاد Windows V125 FINAL" `
              --notes "Windows V125 fixes: System Tray background operation, V125 backup metadata, result revision notifications, Firebase-only operation, no Cloudflare, no reset email."
            if ($LASTEXITCODE -ne 0) { throw 'Could not create Windows V125 release' }
          }

          gh release upload $tag `
            'Tahalil-Alakkad-V125-Windows-Portable.exe' `
            'Tahalil-Alakkad-V125-Windows-Portable.exe.sha256' `
            'Tahalil-Alakkad-V125-Windows-Setup.exe' `
            'Tahalil-Alakkad-V125-Windows-Setup.exe.sha256' `
            --repo "$env:GITHUB_REPOSITORY" --clobber

          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Windows V125 release files' }
          gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --latest
