name: Windows V145 R8.28 Storage Security Hardening

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-windows-v145-r828-storage-security
  cancel-in-progress: false

jobs:
  build:
    name: Windows V145 R8.28 — Storage Security Hardening
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      BASE_TAG: v145-r8.27-windows
      BASE_SOURCE: Tahalil-Alakkad-V145-R8.27-Windows-Source.zip
      BASE_SHA256: 465e24e5315c31a2f93ba684229fd0b89667635e16df3d4aa9135a7a5a2a4408
      BASE_MAIN_SHA256: bb3911fa4cec2828f3b92caa6330f2fced6367fcb63949ec4418f6812bca893b
      BASE_PACKAGE_SHA256: e13d820549ef66a506cb817d7b96d782abc24ee2117af982b16c82200c3b7025
      R828_MAIN_B64: 
      R828_PACKAGE_B64: 
      R828_NOTES_B64: 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore exact R8.27 source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD $env:BASE_SOURCE
          if (Test-Path $zip) { Remove-Item $zip -Force }
          gh release download $env:BASE_TAG --repo "$env:GITHUB_REPOSITORY" --pattern $env:BASE_SOURCE --dir $PWD
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $zip)) { throw 'Could not download exact R8.27 source' }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:BASE_SHA256) { throw "R8.27 source hash mismatch: $hash" }

          $root = Join-Path $PWD 'build_windows/windows-system'
          if (Test-Path (Join-Path $PWD 'build_windows')) { Remove-Item (Join-Path $PWD 'build_windows') -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path $zip -DestinationPath $root -Force

          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '145.8.27') { throw "Expected 145.8.27, got $($pkg.version)" }

          $mainHash = (Get-FileHash (Join-Path $root 'electron/main.cjs') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($mainHash -ne $env:BASE_MAIN_SHA256) { throw "Unexpected R8.27 main.cjs hash: $mainHash" }
          $pkgHash = (Get-FileHash (Join-Path $root 'package.json') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($pkgHash -ne $env:BASE_PACKAGE_SHA256) { throw "Unexpected R8.27 package.json hash: $pkgHash" }

          foreach ($item in @(
            'src/app.js',
            'src/data.js',
            'src/firebase.js',
            'src/resultStore.js',
            'src/styles.css',
            'src/v145r8-parity.js',
            'electron/preload.cjs'
          )) {
            $name = 'R828_' + ($item -replace '[^A-Za-z0-9]','_').ToUpper() + '_SHA256'
            $value = (Get-FileHash (Join-Path $root $item) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$name=$value" | Add-Content $env:GITHUB_ENV
          }

      - name: Apply tested R8.28 hardened files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          [IO.File]::WriteAllBytes((Join-Path $root 'electron/main.cjs'),[Convert]::FromBase64String($env:R828_MAIN_B64))
          [IO.File]::WriteAllBytes((Join-Path $root 'package.json'),[Convert]::FromBase64String($env:R828_PACKAGE_B64))
          $notes = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:R828_NOTES_B64))
          $notes | Set-Content (Join-Path $root 'V145_R828_STORAGE_SECURITY_NOTES.txt') -Encoding utf8

      - name: Install dependencies and refresh lockfile
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          $electronVersion = node -p "require('electron/package.json').version"
          if ($electronVersion -ne '43.7.3') { throw "Expected Electron 43.7.3, got $electronVersion" }

      - name: Runtime dependency security audit
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm audit --omit=dev --audit-level=high
          if ($LASTEXITCODE -ne 0) { throw 'High/Critical runtime dependency vulnerability found' }

      - name: Audit R8.28 protected scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $main = Get-Content (Join-Path $root 'electron/main.cjs') -Raw
          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json

          if ($pkg.version -ne '145.8.28') { throw "Expected 145.8.28, got $($pkg.version)" }
          if ($pkg.devDependencies.electron -ne '43.7.3') { throw 'Electron hardening version mismatch' }

          foreach ($marker in @(
            'AUTO_BACKUP_MAX_FILES = 14',
            'AUTO_BACKUP_MAX_TOTAL_BYTES = 2 * 1024 * 1024 * 1024',
            'AUTO_BACKUP_MIN_FREE_BYTES = 512 * 1024 * 1024',
            'pruneAutoBackups()',
            'cleanupOldTempDir',
            'writeSafeScannedResult',
            "redirect:'error'",
            'isSafeBackupEnvelope(data)'
          )) {
            if (!$main.Contains($marker)) { throw "R8.28 marker missing: $marker" }
          }

          $checks = @{
            'src/app.js'='R828_SRC_APP_JS_SHA256';
            'src/data.js'='R828_SRC_DATA_JS_SHA256';
            'src/firebase.js'='R828_SRC_FIREBASE_JS_SHA256';
            'src/resultStore.js'='R828_SRC_RESULTSTORE_JS_SHA256';
            'src/styles.css'='R828_SRC_STYLES_CSS_SHA256';
            'src/v145r8-parity.js'='R828_SRC_V145R8_PARITY_JS_SHA256';
            'electron/preload.cjs'='R828_ELECTRON_PRELOAD_CJS_SHA256'
          }
          foreach ($pair in $checks.GetEnumerator()) {
            $actual = (Get-FileHash (Join-Path $root $pair.Key) -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = [Environment]::GetEnvironmentVariable($pair.Value)
            if ($actual -ne $expected) { throw "$($pair.Key) changed - protected scope violated" }
          }

          node --check (Join-Path $root 'electron/main.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'main.cjs syntax failed' }
          node --check (Join-Path $root 'src/app.js')
          if ($LASTEXITCODE -ne 0) { throw 'app.js syntax failed' }

          @(
            'R8.28 STORAGE & SECURITY AUDIT: PASS',
            'Auto backups: max 14 and max 2 GB; manual backups untouched',
            'Low disk guard: 512 MB reserve',
            'Temp result/share cleanup enabled',
            'Result open/save/share Defender scan enabled when Defender exists',
            'Backup envelope validation enabled',
            'Backend redirects blocked',
            'Electron 43.7.3',
            'Firebase/data/resultStore/preload/UI business logic unchanged'
          ) | Set-Content 'R828_STORAGE_SECURITY_AUDIT.txt' -Encoding utf8

      - name: Package R8.28 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $stage = Join-Path $env:RUNNER_TEMP 'source_stage_r828'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Get-ChildItem -LiteralPath $root -Force |
            Where-Object { @('node_modules','release','.git') -notcontains $_.Name } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $stage -Recurse -Force }

          $zip = Join-Path $PWD 'Tahalil-Alakkad-V145-R8.28-Windows-Source.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage,$zip,[System.IO.Compression.CompressionLevel]::Optimal,$false)

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Tahalil-Alakkad-V145-R8.28-Windows-Source.zip" | Set-Content 'Tahalil-Alakkad-V145-R8.28-Windows-Source.zip.sha256' -Encoding ascii
          Copy-Item (Join-Path $root 'V145_R828_STORAGE_SECURITY_NOTES.txt') 'V145_R828_STORAGE_SECURITY_NOTES.txt' -Force

      - name: Build Portable
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Portable smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable) { throw 'Portable EXE missing' }
          $proc = Start-Process -FilePath $portable.FullName -PassThru
          Start-Sleep -Seconds 12
          if ($proc.HasExited) { throw "Portable exited unexpectedly: $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Build Setup
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }

      - name: Prepare delivery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup = Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable -or !$setup) { throw 'Portable or Setup missing' }

          Copy-Item $portable.FullName 'Tahalil-Alakkad-V145-R8.28-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V145-R8.28-Windows-Setup.exe' -Force

          foreach ($name in @(
            'Tahalil-Alakkad-V145-R8.28-Windows-Portable.exe',
            'Tahalil-Alakkad-V145-R8.28-Windows-Setup.exe'
          )) {
            $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V145-R8.28-Windows-Storage-Security
          path: |
            Tahalil-Alakkad-V145-R8.28-Windows-Portable.exe
            Tahalil-Alakkad-V145-R8.28-Windows-Portable.exe.sha256
            Tahalil-Alakkad-V145-R8.28-Windows-Setup.exe
            Tahalil-Alakkad-V145-R8.28-Windows-Setup.exe.sha256
            Tahalil-Alakkad-V145-R8.28-Windows-Source.zip
            Tahalil-Alakkad-V145-R8.28-Windows-Source.zip.sha256
            V145_R828_STORAGE_SECURITY_NOTES.txt
            R828_STORAGE_SECURITY_AUDIT.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish R8.28 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v145-r8.28-windows'
          $title = 'تحاليل العقاد Windows V145 R8.28 — Storage & Security Hardening'
          $notes = Get-Content 'V145_R828_STORAGE_SECURITY_NOTES.txt' -Raw

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes
          } else {
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create R8.28 release' }

          gh release upload $tag `
            Tahalil-Alakkad-V145-R8.28-Windows-Portable.exe `
            Tahalil-Alakkad-V145-R8.28-Windows-Portable.exe.sha256 `
            Tahalil-Alakkad-V145-R8.28-Windows-Setup.exe `
            Tahalil-Alakkad-V145-R8.28-Windows-Setup.exe.sha256 `
            Tahalil-Alakkad-V145-R8.28-Windows-Source.zip `
            Tahalil-Alakkad-V145-R8.28-Windows-Source.zip.sha256 `
            V145_R828_STORAGE_SECURITY_NOTES.txt `
            R828_STORAGE_SECURITY_AUDIT.txt `
            --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload R8.28 release assets' }
