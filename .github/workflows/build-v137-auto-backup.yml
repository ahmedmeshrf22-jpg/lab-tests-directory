name: Build Tahalil Alakkad V137 Auto Backup

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-v137-auto-backup
  cancel-in-progress: false

jobs:
  build-v137:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout V136 Restore Feedback base
        uses: actions/checkout@v4
        with:
          ref: v136-restore-feedback-base
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply V137 daily auto backup patch
