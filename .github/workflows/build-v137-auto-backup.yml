      - name: Audit V137 auto backup and restore notifications
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYAUDIT'
          from pathlib import Path
          import subprocess, re
          src=Path('app/src/main/java')
          grad=Path('app/build.gradle.kts').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          main=(src/'com/example/MainActivity.kt').read_text()
          vm=(src/'com/example/ui/LabTestsViewModel.kt').read_text()
          ops=(src/'com/example/ui/OperationsV14Dialog.kt').read_text()
          boot=(src/'com/example/notifications/LabOrderBootReceiver.kt').read_text()
          scheduler=(src/'com/example/notifications/AutoBackupScheduler.kt').read_text()
          notify=(src/'com/example/notifications/BackupNotificationManager.kt').read_text()
          creds=(src/'com/example/util/AutoBackupCredentialStore.kt').read_text()
          storage=(src/'com/example/util/AutoBackupStorage.kt').read_text()
          backup=(src/'com/example/util/CommercialBackupManager.kt').read_text()
          allkt='\n'.join(p.read_text(errors='ignore') for p in src.rglob('*.kt'))
          tracked=subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines()
          changed={x.strip() for x in tracked+untracked if x.strip()}
          allowed={
              'app/build.gradle.kts',
              'app/src/main/AndroidManifest.xml',
              'app/src/main/java/com/example/MainActivity.kt',
              'app/src/main/java/com/example/notifications/LabOrderBootReceiver.kt',
              'app/src/main/java/com/example/notifications/AutoBackupScheduler.kt',
              'app/src/main/java/com/example/notifications/BackupNotificationManager.kt',
              'app/src/main/java/com/example/ui/LabTestsViewModel.kt',
              'app/src/main/java/com/example/ui/OperationsV14Dialog.kt',
              'app/src/main/java/com/example/util/AutoBackupCredentialStore.kt',
              'app/src/main/java/com/example/util/AutoBackupStorage.kt',
              'V137_AUTO_BACKUP_NOTES.txt',
          }
          checks={
              'V137 version':'versionCode = 137' in grad and '5.57-auto-backup-v137' in grad,
              'same package':'applicationId = "com.aistudio.labtestsdirectory.egypt"' in grad,
              'only V137 scope changed':changed == allowed,
              'daily 4am schedule':'FOUR_AM_HOUR = 4' in scheduler and 'set(Calendar.MINUTE, 0)' in scheduler and 'Calendar.DAY_OF_YEAR' in scheduler,
              'exact alarm with safe fallback':'setExactAndAllowWhileIdle' in scheduler and 'setAndAllowWhileIdle' in scheduler and 'canScheduleExactAlarms()' in scheduler,
              'exact alarm access declared and requested':'android.permission.SCHEDULE_EXACT_ALARM' in manifest and 'ACTION_REQUEST_SCHEDULE_EXACT_ALARM' in scheduler,
              'network-aware background job':'AutoBackupJobService' in scheduler and 'JobInfo.NETWORK_TYPE_ANY' in scheduler,
              'manager-only automatic backup':'LabTestsViewModel.isManagerAccount' in scheduler,
              'background App Check':'PlayIntegrityAppCheckProviderFactory' in scheduler,
              'phone-local backup folder':'MediaStore.Downloads.EXTERNAL_CONTENT_URI' in storage and 'Tahalil Alakkad/Backups' in storage and '.tahbak' in storage,
              'auto password protected by Keystore':'AndroidKeyStore' in creds and 'AES/GCM/NoPadding' in creds and 'savePassword' in vm,
              'backup start notification':'notifyBackupStarted' in scheduler and 'جاري إنشاء النسخة الاحتياطية' in notify,
              'backup completion notification':'notifyBackupCompleted' in scheduler and 'تم حفظ النسخة الاحتياطية ✓' in notify,
              'backup failure notification':'notifyBackupFailed' in scheduler,
              'restore start notification':'notifyRestoreStarted' in vm and 'جاري استعادة نسخة احتياطية' in notify,
              'restore success notification':'notifyRestoreCompleted' in vm and 'تم استعادة النسخة الاحتياطية ✓' in notify,
              'restore failure notification':'notifyRestoreFailed' in vm,
              'schedule survives reboot/update':'AutoBackupScheduler.schedule(context)' in boot and 'AutoBackupScheduler.schedule(this)' in main,
              'manual backup enables automatic':'AutoBackupCredentialStore.savePassword' in vm and 'النسخ التلقائي الساعة 4:00 ص مفعّل' in vm,
              'exact access prompt after file save':'requestExactAlarmAccessOnce(context)' in ops,
              'V136 restore popup preserved':'showRestoreDone' in ops and 'تم الاسترجاع ✓' in ops,
              'V135 missing-only restore preserved':'if (!snapshot.exists()) missing += write' in backup and 'write.ref.get(Source.SERVER)' in backup,
              'no Firebase rules edits':not any('firestore.rules' in x.lower() for x in changed),
              'Firebase preserved':'FirebaseFirestore' in allkt and 'FirebaseAuth' in allkt,
              'Supabase preserved':'tahalil-shadow-mirror' in allkt and 'tahalil-recovery-probe' in allkt,
              'offline preserved':'OfflineAccessVault' in allkt,
              'results preserved':'saveResultToDownloads' in allkt and 'requestResultRevision' in allkt,
              'order notifications preserved':'class OrderRealtimeNotificationService' in allkt,
              'credential reset preserved':'resetUserLoginCredentials' in allkt and 'sendPasswordResetEmail' not in allkt,
              'no Cloudflare':'cloudflare' not in allkt.lower() and 'workers.dev' not in allkt.lower(),
              'no Supabase secret':all(x not in allkt for x in ['SUPABASE_SERVICE_ROLE_KEY','SUPABASE_SECRET_KEYS','sb_secret_','BEGIN PRIVATE KEY']),
          }
          for k,v in checks.items(): print(('OK   ' if v else 'FAIL ')+k)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('V137 AUDIT FAILED: '+', '.join(bad))
          print('ALL V137 AUTO BACKUP CHECKS PASSED')
          PYAUDIT

      - name: Publish immutable V137 source branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="v137-auto-backup-base"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add app/build.gradle.kts app/src/main/AndroidManifest.xml app/src/main/java/com/example/MainActivity.kt app/src/main/java/com/example/notifications/LabOrderBootReceiver.kt app/src/main/java/com/example/notifications/AutoBackupScheduler.kt app/src/main/java/com/example/notifications/BackupNotificationManager.kt app/src/main/java/com/example/ui/LabTestsViewModel.kt app/src/main/java/com/example/ui/OperationsV14Dialog.kt app/src/main/java/com/example/util/AutoBackupCredentialStore.kt app/src/main/java/com/example/util/AutoBackupStorage.kt V137_AUTO_BACKUP_NOTES.txt
          git commit -m "V137 daily 4AM local backup and restore notifications"
          COMMIT_SHA="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch -q origin "$BRANCH"
            LOCAL_TREE="$(git rev-parse HEAD^{tree})"
            REMOTE_TREE="$(git rev-parse FETCH_HEAD^{tree})"
            if [ "$LOCAL_TREE" != "$REMOTE_TREE" ]; then
              echo "::error::Existing $BRANCH differs; refusing to overwrite it."
              exit 1
            fi
            COMMIT_SHA="$(git rev-parse FETCH_HEAD)"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "V137_COMMIT_SHA=$COMMIT_SHA" >> "$GITHUB_ENV"

      - name: Restore original Android signing identity
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_BUNDLE_B64:-}"
          SIGN_DIR="$RUNNER_TEMP/tahalil_v137_signing"
          rm -rf "$SIGN_DIR" && mkdir -p "$SIGN_DIR/files"
          printf '%s' "$SIGNING_BUNDLE_B64" | tr -d '\r\n ' | base64 --decode > "$SIGN_DIR/bundle.bin"
          if unzip -t "$SIGN_DIR/bundle.bin" >/dev/null 2>&1; then
            unzip -q "$SIGN_DIR/bundle.bin" -d "$SIGN_DIR/files"
          else
            cp "$SIGN_DIR/bundle.bin" "$SIGN_DIR/files/original.keystore"
          fi
          KEYSTORE="$(find "$SIGN_DIR/files" -type f \( -iname '*.jks' -o -iname '*.keystore' \) -print -quit)"
          test -n "$KEYSTORE"
          STORE_PASSWORD=""; KEY_ALIAS=""; KEY_PASSWORD=""
          while IFS= read -r META; do
            [ -f "$META" ] || continue
            [ -n "$STORE_PASSWORD" ] || STORE_PASSWORD="$(sed -nE 's/^[[:space:]]*(STORE_PASSWORD|KEYSTORE_PASSWORD|storePassword|store_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(sed -nE 's/^[[:space:]]*(KEY_ALIAS|keyAlias|key_alias)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$(sed -nE 's/^[[:space:]]*(KEY_PASSWORD|keyPassword|key_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
          done < <(find "$SIGN_DIR/files" -type f \( -iname '*.properties' -o -iname '*.env' -o -iname '*.txt' \) -print)
          if [ -z "$STORE_PASSWORD" ] && keytool -list -keystore "$KEYSTORE" -storepass android >/dev/null 2>&1; then STORE_PASSWORD=android; fi
          test -n "$STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
          test -n "$KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$STORE_PASSWORD"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "KEYSTORE_PATH=$KEYSTORE"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Android V137
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" Tahalil-Alakkad-V137-Auto-Backup-Android-SIGNED.apk
          sha256sum Tahalil-Alakkad-V137-Auto-Backup-Android-SIGNED.apk > Tahalil-Alakkad-V137-Auto-Backup-Android-SIGNED.apk.sha256

      - name: Publish V137 release directly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v137 >/dev/null 2>&1; then
            echo "::error::Release v137 already exists. Refusing to overwrite it."
            exit 1
          fi
          gh release create v137 \
            Tahalil-Alakkad-V137-Auto-Backup-Android-SIGNED.apk \
            Tahalil-Alakkad-V137-Auto-Backup-Android-SIGNED.apk.sha256 \
            --target "$V137_COMMIT_SHA" \
            --title "تحاليل العقاد V137 — Auto Backup" \
            --notes "V137 adds a daily encrypted local backup scheduled for 04:00, phone storage under Download/Tahalil Alakkad/Backups, backup start/completion/failure notifications, restore start/completion/failure notifications, reboot/update rescheduling, Android Keystore protection for the automatic-backup password, and exact-alarm support with safe fallback. Firebase Rules are unchanged."

      - name: Final status
        shell: bash
        run: |
          echo "V137 Auto Backup built, signed, source-pinned and released."
