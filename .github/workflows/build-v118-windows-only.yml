name: Windows V118 Secure Portable

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows V118 Portable EXE
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Windows V118 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'Tahalil_Alakkad_System_V118_WINDOWS_SECURE.zip'
          if (!(Test-Path $zip)) { throw "Missing $zip" }
          if (Test-Path 'build_windows_v118') { Remove-Item 'build_windows_v118' -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath 'build_windows_v118' -Force
          if (!(Test-Path 'build_windows_v118/windows-system/package.json')) { throw 'Invalid Windows V118 ZIP structure' }

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Windows V118 security source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows_v118/windows-system'
          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '118.0.0') { throw "Expected 118.0.0, got $($pkg.version)" }

          $tests = Get-Content (Join-Path $root 'public/lab_tests_android.json') -Raw | ConvertFrom-Json
          if ($tests.Count -ne 331) { throw "Expected 331 tests, got $($tests.Count)" }

          $rs = Get-Content (Join-Path $root 'src/resultStore.js') -Raw
          if (!$rs.Contains('sha256Hex') -or !$rs.Contains('فشل فحص سلامة ملف النتيجة')) { throw 'SHA-256 result integrity missing' }

          $fb = Get-Content (Join-Path $root 'src/firebase.js') -Raw
          if (!$fb.Contains('browserSessionPersistence')) { throw 'Session-only Firebase Auth persistence missing' }

          $app = Get-Content (Join-Path $root 'src/app.js') -Raw
          foreach ($needle in @('Unified System V118','310000','verifyLocalPin','تبديل المستخدم','رجوع لعبد الرحمن','حفظ وإرسال الطلب للمعمل')) {
            if (!$app.Contains($needle)) { throw "Missing Windows V118 feature: $needle" }
          }

          $main = Get-Content (Join-Path $root 'electron/main.cjs') -Raw
          foreach ($needle in @('contextIsolation: true','nodeIntegration: false','sandbox: true','webSecurity: true','MAX_RESULT_BYTES','safeExternalUrl','will-navigate','validateResultBytes')) {
            if (!$main.Contains($needle)) { throw "Missing Electron hardening: $needle" }
          }

          $html = Get-Content (Join-Path $root 'index.html') -Raw
          if (!$html.Contains('Content-Security-Policy') -or !$html.Contains("object-src 'none'")) { throw 'CSP missing' }

          $srcFiles = Get-ChildItem (Join-Path $root 'src') -Filter '*.js' -File
          foreach ($file in $srcFiles) {
            Get-Content $file.FullName -Raw | node --input-type=module --check
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($file.Name)" }
          }
          node --check (Join-Path $root 'electron/main.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'electron/main.cjs syntax check failed' }
          node --check (Join-Path $root 'electron/preload.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'electron/preload.cjs syntax check failed' }
          Write-Host 'ALL WINDOWS V118 SECURITY CHECKS PASSED'

      - name: Install dependencies
        working-directory: build_windows_v118/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Build portable EXE
        working-directory: build_windows_v118/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { throw 'Windows V118 build failed' }

      - name: Prepare portable EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows_v118/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$exe) { throw 'No Windows EXE produced' }
          $dest = Join-Path $PWD 'Tahalil-Alakkad-V118-Windows-Portable.exe'
          Copy-Item $exe.FullName $dest -Force
          if ((Get-Item $dest).Length -lt 1000000) { throw 'Windows EXE unexpectedly small' }
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Tahalil-Alakkad-V118-Windows-Portable.exe" | Set-Content (Join-Path $PWD 'Tahalil-Alakkad-V118-Windows-Portable.sha256.txt') -Encoding ascii

      - name: Publish Windows V118 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v118-windows'
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title "تحاليل العقاد Windows V118 Secure" --notes "Windows V118 Portable EXE • no installation required • Firebase Spark sync • hardened local/session security."
            if ($LASTEXITCODE -ne 0) { throw 'Could not create Windows V118 release' }
          }
          gh release upload $tag "Tahalil-Alakkad-V118-Windows-Portable.exe" "Tahalil-Alakkad-V118-Windows-Portable.sha256.txt" --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Windows V118 release files' }
          Write-Host 'WINDOWS V118 PORTABLE RELEASE READY'
