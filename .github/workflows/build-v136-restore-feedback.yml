          patch -p1 < /tmp/v136.patch
          echo "V136 restore feedback patch applied over V135"

      - name: Audit V136 scope and restore feedback
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYAUDIT'
          from pathlib import Path
          import subprocess
          src=Path('app/src/main/java')
          grad=Path('app/build.gradle.kts').read_text()
          vm=(src/'com/example/ui/LabTestsViewModel.kt').read_text()
          ui=(src/'com/example/ui/OperationsV14Dialog.kt').read_text()
          backup=(src/'com/example/util/CommercialBackupManager.kt').read_text()
          allkt='\n'.join(p.read_text(errors='ignore') for p in src.rglob('*.kt'))
          changed=set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          changed |= set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          allowed={
              'app/build.gradle.kts',
              'app/src/main/java/com/example/ui/LabTestsViewModel.kt',
              'app/src/main/java/com/example/ui/OperationsV14Dialog.kt',
              'V136_RESTORE_FEEDBACK_NOTES.txt',
          }
          checks={
              'V136 version':'versionCode = 136' in grad and '5.56-restore-feedback-v136' in grad,
              'same package':'applicationId = "com.aistudio.labtestsdirectory.egypt"' in grad,
              'feedback-only scope':changed == allowed,
              'visible completion popup':'showRestoreDone' in ui and 'تم الاسترجاع ✓' in ui and 'restoreDoneMessage = msg' in ui,
              'zero-missing success message':'لا توجد بيانات مفقودة للاسترجاع' in vm,
              'missing-only explanation':'يرجع البيانات المفقودة فقط' in ui,
              'V135 missing-only logic preserved':'if (!snapshot.exists()) missing += write' in backup and 'write.ref.get(Source.SERVER)' in backup,
              'no Firebase rules edits':not any('firestore.rules' in x.lower() for x in changed),
              'Firebase preserved':'FirebaseFirestore' in allkt and 'FirebaseAuth' in allkt,
              'Supabase preserved':'tahalil-shadow-mirror' in allkt and 'tahalil-recovery-probe' in allkt,
              'offline preserved':'OfflineAccessVault' in allkt,
              'results preserved':'saveResultToDownloads' in allkt and 'requestResultRevision' in allkt,
              'notifications preserved':'class OrderRealtimeNotificationService' in allkt,
              'credential reset preserved':'resetUserLoginCredentials' in allkt and 'sendPasswordResetEmail' not in allkt,
              'no Cloudflare':'cloudflare' not in allkt.lower() and 'workers.dev' not in allkt.lower(),
              'no Supabase secret':all(x not in allkt for x in ['SUPABASE_SERVICE_ROLE_KEY','SUPABASE_SECRET_KEYS','sb_secret_','BEGIN PRIVATE KEY']),
          }
          for k,v in checks.items(): print(('OK   ' if v else 'FAIL ')+k)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('V136 AUDIT FAILED: '+', '.join(bad))
          print('ALL V136 RESTORE FEEDBACK CHECKS PASSED')
          PYAUDIT

      - name: Publish immutable V136 source branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="v136-restore-feedback-base"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add app/build.gradle.kts app/src/main/java/com/example/ui/LabTestsViewModel.kt app/src/main/java/com/example/ui/OperationsV14Dialog.kt V136_RESTORE_FEEDBACK_NOTES.txt
          git commit -m "V136 show restore completion feedback"
          COMMIT_SHA="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch -q origin "$BRANCH"
            LOCAL_TREE="$(git rev-parse HEAD^{tree})"
            REMOTE_TREE="$(git rev-parse FETCH_HEAD^{tree})"
            if [ "$LOCAL_TREE" != "$REMOTE_TREE" ]; then
              echo "::error::Existing $BRANCH differs; refusing to overwrite it."
              exit 1
            fi
            COMMIT_SHA="$(git rev-parse FETCH_HEAD)"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "V136_COMMIT_SHA=$COMMIT_SHA" >> "$GITHUB_ENV"

      - name: Restore original Android signing identity
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_BUNDLE_B64:-}"
          SIGN_DIR="$RUNNER_TEMP/tahalil_v136_signing"
          rm -rf "$SIGN_DIR" && mkdir -p "$SIGN_DIR/files"
          printf '%s' "$SIGNING_BUNDLE_B64" | tr -d '\r\n ' | base64 --decode > "$SIGN_DIR/bundle.bin"
          if unzip -t "$SIGN_DIR/bundle.bin" >/dev/null 2>&1; then
            unzip -q "$SIGN_DIR/bundle.bin" -d "$SIGN_DIR/files"
          else
            cp "$SIGN_DIR/bundle.bin" "$SIGN_DIR/files/original.keystore"
          fi
          KEYSTORE="$(find "$SIGN_DIR/files" -type f \( -iname '*.jks' -o -iname '*.keystore' \) -print -quit)"
          test -n "$KEYSTORE"
          STORE_PASSWORD=""; KEY_ALIAS=""; KEY_PASSWORD=""
          while IFS= read -r META; do
            [ -f "$META" ] || continue
            [ -n "$STORE_PASSWORD" ] || STORE_PASSWORD="$(sed -nE 's/^[[:space:]]*(STORE_PASSWORD|KEYSTORE_PASSWORD|storePassword|store_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(sed -nE 's/^[[:space:]]*(KEY_ALIAS|keyAlias|key_alias)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$(sed -nE 's/^[[:space:]]*(KEY_PASSWORD|keyPassword|key_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
          done < <(find "$SIGN_DIR/files" -type f \( -iname '*.properties' -o -iname '*.env' -o -iname '*.txt' \) -print)
          if [ -z "$STORE_PASSWORD" ] && keytool -list -keystore "$KEYSTORE" -storepass android >/dev/null 2>&1; then STORE_PASSWORD=android; fi
          test -n "$STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
          test -n "$KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$STORE_PASSWORD"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "KEYSTORE_PATH=$KEYSTORE"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Android V136
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" Tahalil-Alakkad-V136-Restore-Feedback-Android-SIGNED.apk
          sha256sum Tahalil-Alakkad-V136-Restore-Feedback-Android-SIGNED.apk > Tahalil-Alakkad-V136-Restore-Feedback-Android-SIGNED.apk.sha256

      - name: Publish V136 release directly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v136 >/dev/null 2>&1; then
            echo "::error::Release v136 already exists. Refusing to overwrite it."
            exit 1
          fi
          gh release create v136 \
            Tahalil-Alakkad-V136-Restore-Feedback-Android-SIGNED.apk \
            Tahalil-Alakkad-V136-Restore-Feedback-Android-SIGNED.apk.sha256 \
            --target "$V136_COMMIT_SHA" \
            --title "تحاليل العقاد V136 — Restore Feedback" \
            --notes "V136 shows an immediate restore-success dialog. If no data is missing, it explicitly confirms the backup was checked and nothing needed restoring. V135 missing-only restore logic is unchanged; Firebase Rules are unchanged."

      - name: Final status
        shell: bash
        run: |
          echo "V136 Restore Feedback built, signed, source-pinned and released."
