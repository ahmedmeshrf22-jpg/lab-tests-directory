name: Build Tahalil Alakkad V136 Restore Feedback

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-v136-restore-feedback
  cancel-in-progress: false

jobs:
  build-v136:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout V135 Safe Restore base
        uses: actions/checkout@v4
        with:
          ref: v135-safe-restore-base
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

