          UcoEAHdpbmRvd3Mtc3lzdGVtL3ZpdGUuY29uZmlnLm1qc1BLBQYAAAAAHgAeAOYJAAAIywQAAAA=
          '@
          [IO.File]::WriteAllBytes('v133-source.zip',[Convert]::FromBase64String(($base64 -replace '\s','')))
          if (Test-Path build_v133_windows) { Remove-Item build_v133_windows -Recurse -Force }
          Expand-Archive 'v133-source.zip' 'build_v133_windows' -Force
          if (!(Test-Path 'build_v133_windows/windows-system/package.json')) { throw 'V133 source reconstruction failed' }

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit V131 V132 V133 parity and preserved features
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_v133_windows/windows-system'

          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '133.0.0') { throw "Expected 133.0.0, got $($pkg.version)" }
          if ($pkg.build.portable.artifactName -notmatch 'V133') { throw 'Portable V133 name missing' }
          if ($pkg.build.nsis.artifactName -notmatch 'V133') { throw 'Setup V133 name missing' }

          $tests = Get-Content (Join-Path $root 'public/lab_tests_android.json') -Raw | ConvertFrom-Json
          if ($tests.Count -ne 331) { throw "Expected 331 tests, got $($tests.Count)" }
          if (($tests | Where-Object { $null -ne $_.customer_price }).Count -ne 0) { throw 'Embedded customer prices detected' }

          $app = Get-Content (Join-Path $root 'src/app.js') -Raw

          foreach ($x in @(
            'Unified System V133',
            'customer-choice-row',
            'عميل سابق',
            'عميل جديد',
            '<th>WhatsApp</th>',
            '<th>العنوان</th>',
            'profile-kv',
            'guide-test-card',
            'guide-price',
            'مدة النتيجة',
            'عرض التفاصيل',
            'إخفاء التفاصيل',
            'login-v133',
            'البريد الإلكتروني / اسم الدخول',
            'كلمة المرور',
            'تسجيل الدخول',
            'نسيت اسم المستخدم',
            'نسيت كلمة المرور'
          )) {
            if (!$app.Contains($x)) { throw "Missing V131-V133 UI marker: $x" }
          }

          $loginStart = $app.IndexOf("function loginScreen")
          $loginEnd = $app.IndexOf("async function afterLogin", $loginStart)
          if ($loginStart -lt 0 -or $loginEnd -le $loginStart) { throw 'Login function bounds missing' }
          $login = $app.Substring($loginStart, $loginEnd - $loginStart)
          foreach ($x in @('email','password','forgotUsername','forgotPassword','staff_tests_3d.png','mgr_health_3d.png')) {
            if (!$login.Contains($x)) { throw "Missing V133 login marker: $x" }
          }
          if ($login.Contains('homeaction') -or $login.Contains('customer-choice-row')) {
            throw 'Home/service cards must not appear inside V133 login'
          }

          foreach ($x in @(
            'runRecoveryProbe',
            'ShadowBackupReplicator',
            'requestResultRevision',
            'resetUserLoginCredentials'
          )) {
            if (!$app.Contains($x)) { throw "Preserved feature missing: $x" }
          }

          $recovery = Get-Content (Join-Path $root 'src/recoveryProbe.js') -Raw
          if (!$recovery.Contains('read-only') -and !$recovery.Contains('Read-Only')) { throw 'V130 recovery probe missing' }

          $shadow = Get-Content (Join-Path $root 'src/shadowBackup.js') -Raw
          foreach ($x in @(
            'tahalil-shadow-mirror',
            'getIdToken(false)',
            'getIdToken(true)',
            'Shadow backup is deliberately non-blocking'
          )) {
            if (!$shadow.Contains($x)) { throw "V129 shadow backup marker missing: $x" }
          }

          $res = Get-Content (Join-Path $root 'src/resilience.js') -Raw
          if (!$res.Contains('currentMode(){return BackendFailoverMode.FIREBASE_ONLY}')) {
            throw 'FIREBASE_ONLY policy missing'
          }

          $main = Get-Content (Join-Path $root 'electron/main.cjs') -Raw
          foreach ($x in @(
            'OFFLINE_GRACE_MS = 72 * 60 * 60 * 1000',
            'new Tray',
            'requestSingleInstanceLock',
            'sandbox: true',
            'contextIsolation: true',
            'nodeIntegration: false',
            'webSecurity: true'
          )) {
            if (!$main.Contains($x)) { throw "Windows safety marker missing: $x" }
          }

          $backup = Get-Content (Join-Path $root 'src/backup.js') -Raw
          if (!$backup.Contains('app_version_code:133')) { throw 'V133 backup metadata missing' }
          if (!$backup.Contains("app_version_name:'System V133 Windows'")) { throw 'V133 backup version name missing' }

          $runtime = $app + "`n" + $main + "`n" + (Get-Content (Join-Path $root 'src/data.js') -Raw) + "`n" + (Get-Content (Join-Path $root 'src/firebase.js') -Raw)
          if ($runtime.ToLower().Contains('cloudflare') -or $runtime.ToLower().Contains('workers.dev')) {
            throw 'Cloudflare runtime dependency detected'
          }
          if ($runtime.Contains('sendPasswordResetEmail')) {
            throw 'Email password reset must remain disabled'
          }

          Get-ChildItem (Join-Path $root 'src') -Filter '*.js' -File | ForEach-Object {
            Get-Content $_.FullName -Raw | node --input-type=module --check
            if ($LASTEXITCODE -ne 0) { throw "JS syntax failed: $($_.Name)" }
          }
          node --check (Join-Path $root 'electron/main.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'main.cjs syntax failed' }
          node --check (Join-Path $root 'electron/preload.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'preload.cjs syntax failed' }

          Write-Host 'WINDOWS V133 ANDROID PARITY SOURCE AUDIT PASSED'

      - name: Install dependencies
        working-directory: build_v133_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Build Portable
        working-directory: build_v133_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Portable startup smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v133_windows/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$exe) { throw 'Portable EXE not found' }
          $env:TAHALIL_SMOKE_TEST = '1'
          Remove-Item Env:TAHALIL_TRAY_SMOKE_TEST -ErrorAction SilentlyContinue
          $p = Start-Process $exe.FullName -PassThru
          if (!$p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; throw 'Portable startup timed out' }
          if ($p.ExitCode -ne 0) { throw "Portable startup exit code $($p.ExitCode)" }
          Remove-Item Env:TAHALIL_SMOKE_TEST -ErrorAction SilentlyContinue
          Write-Host 'PORTABLE STARTUP OK'

      - name: Portable System Tray smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v133_windows/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $env:TAHALIL_TRAY_SMOKE_TEST = '1'
          $p = Start-Process $exe.FullName -PassThru
          if (!$p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; throw 'Tray smoke timed out' }
          if ($p.ExitCode -ne 0) { throw "Tray smoke exit code $($p.ExitCode)" }
          Remove-Item Env:TAHALIL_TRAY_SMOKE_TEST -ErrorAction SilentlyContinue
          Write-Host 'SYSTEM TRAY OK'

      - name: Build Setup
        working-directory: build_v133_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }

      - name: Prepare V133 release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v133_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup = Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable -or !$setup) { throw 'Portable or Setup EXE missing' }

          Copy-Item $portable.FullName 'Tahalil-Alakkad-V133-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V133-Windows-Setup.exe' -Force

          foreach ($name in @(
            'Tahalil-Alakkad-V133-Windows-Portable.exe',
            'Tahalil-Alakkad-V133-Windows-Setup.exe'
          )) {
            if ((Get-Item $name).Length -lt 1000000) { throw "$name unexpectedly small" }
            $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Publish directly to Windows V133 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v133-windows'

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "$env:GITHUB_REPOSITORY" `
              --title "تحاليل العقاد Windows V133 — Android UI Parity" `
              --notes "Windows V133 aligns with Android V133. V131 UI polish: clearer customer/order/settings UI and expandable Test Guide with price first, tube and turnaround details. V132: horizontally scrollable customer table, complete customer profile and large Existing/New Customer choices for New Order. V133: focused modern login with email, password, sign-in and recovery actions plus subtle medical 3D accents/light glow, without home/service cards. Firebase remains authoritative; V129 shadow backup, V130 read-only recovery, offline resilience, results, notifications and security remain preserved; no failover, no Cloudflare and no reset-email flow."
            if ($LASTEXITCODE -ne 0) { throw 'Could not create Windows V133 release' }
          }

          gh release upload $tag `
            'Tahalil-Alakkad-V133-Windows-Portable.exe' `
            'Tahalil-Alakkad-V133-Windows-Portable.exe.sha256' `
            'Tahalil-Alakkad-V133-Windows-Setup.exe' `
            'Tahalil-Alakkad-V133-Windows-Setup.exe.sha256' `
            --repo "$env:GITHUB_REPOSITORY" --clobber

          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Windows V133 release files' }
          gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --latest
