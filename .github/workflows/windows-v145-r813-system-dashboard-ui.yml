name: Windows V145 R8.13 System Dashboard UI

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-windows-v145-r813-system-dashboard-ui
  cancel-in-progress: false

jobs:
  windows-v145-r813:
    name: Windows V145 R8.13 — System Dashboard UI
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      R812_TAG: "v145-r8.12-windows"
      R812_SOURCE: "Tahalil-Alakkad-V145-R8.12-Windows-Source.zip"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore exact R8.12 source and lock protected files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $zip = Join-Path $PWD $env:R812_SOURCE
          if (Test-Path $zip) { Remove-Item $zip -Force }

          gh release download $env:R812_TAG --repo "$env:GITHUB_REPOSITORY" --pattern $env:R812_SOURCE --dir $PWD
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $zip)) {
            throw 'Could not download exact R8.12 source release'
          }

          $root = Join-Path $PWD 'build_windows/windows-system'
          if (Test-Path (Join-Path $PWD 'build_windows')) {
            Remove-Item (Join-Path $PWD 'build_windows') -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path $zip -DestinationPath $root -Force

          foreach ($required in @(
            'package.json',
            'src/app.js',
            'src/styles.css',
            'src/data.js',
            'src/firebase.js',
            'src/v145r8-parity.js',
            'electron/main.cjs',
            'electron/preload.cjs'
          )) {
            if (!(Test-Path (Join-Path $root $required))) {
              throw "R8.12 source missing: $required"
            }
          }

          $locked = @{
            R813_DATA_SHA256     = (Get-FileHash (Join-Path $root 'src/data.js') -Algorithm SHA256).Hash.ToLowerInvariant()
            R813_FIREBASE_SHA256 = (Get-FileHash (Join-Path $root 'src/firebase.js') -Algorithm SHA256).Hash.ToLowerInvariant()
            R813_PARITY_SHA256   = (Get-FileHash (Join-Path $root 'src/v145r8-parity.js') -Algorithm SHA256).Hash.ToLowerInvariant()
            R813_MAIN_SHA256     = (Get-FileHash (Join-Path $root 'electron/main.cjs') -Algorithm SHA256).Hash.ToLowerInvariant()
            R813_PRELOAD_SHA256  = (Get-FileHash (Join-Path $root 'electron/preload.cjs') -Algorithm SHA256).Hash.ToLowerInvariant()
          }

          foreach ($pair in $locked.GetEnumerator()) {
            "$($pair.Key)=$($pair.Value)" | Add-Content $env:GITHUB_ENV
          }

          Write-Host 'Exact R8.12 source restored. R8.13 may change app.js + styles.css + package metadata only.'

      - name: Apply R8.13 System Dashboard UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'

          $patcher = @'
          from pathlib import Path
          import json, re, sys

          root = Path(sys.argv[1])
          app_path = root / 'src' / 'app.js'
          css_path = root / 'src' / 'styles.css'
          pkg_path = root / 'package.json'

          app = app_path.read_text(encoding='utf-8-sig')
          css = css_path.read_text(encoding='utf-8-sig')

          for marker in ('TAH_CLEAN_HOME_R812','TAH_3D_SQUARE_HOME_ICONS_R89','TAH_FULL_TIMESTAMP_R810'):
              if marker not in app and marker not in css:
                  raise SystemExit(f'Missing inherited marker: {marker}')

          if 'TAH_SYSTEM_DASHBOARD_R813' in app or 'TAH_SYSTEM_DASHBOARD_R813' in css:
              raise SystemExit('R8.13 patch already installed')

          new_dashboard = """async function dashboard(c){
            setPage('الشاشة الرئيسية',offlineGraceAccess?'وضع الطوارئ الآمن — بيانات مخزنة محليًا حتى عودة الاتصال':'واجهة تشغيل النظام');
            worklist=await D.listWorklist(300);

            const today=new Date();today.setHours(0,0,0,0);
            const tt=worklist.filter(o=>o.created_at_ms>=today.getTime()&&!o.is_voided);
            const processingCount=tt.filter(x=>x.workflow_status==='processing').length;
            const readyCount=tt.filter(x=>x.workflow_status==='ready').length;
            const pendingCount=Math.max(tt.length-processingCount-readyCount,0);
            const recent=[...tt].sort((a,b)=>Number(b.created_at_ms||0)-Number(a.created_at_ms||0)).slice(0,6);

            const statusLabel=s=>({
              processing:'جاري التنفيذ',
              ready:'جاهز',
              received:'تم الاستلام',
              delivered:'تم التسليم',
              draft:'قيد التسجيل'
            }[s]||'قيد التسجيل');

            const statusClass=s=>({
              processing:'processing',
              ready:'ready',
              received:'received',
              delivered:'ready',
              draft:'pending'
            }[s]||'pending');

            let actions=[
              ['quickimage','staff_search_3d.png','استعلام تحاليل'],
              ['new','staff_new_order_3d.png','طلب جديد'],
              ['customers','staff_customers_3d.png','العملاء'],
              ['guide','staff_tests_3d.png','دليل التحاليل'],
              ['worklist','mgr_reports_3d.png','الطلبات'],
              ['vision','staff_qr_3d.png','قراءة روشتة / طلب عيادة']
            ];
            if(!actingProfile&&D.isAdmin(profile)){
              actions.push(['adminops','mgr_health_3d.png','الإدارة']);
              actions.push(['prices','mgr_reports_3d.png','الأسعار Lab 2 Lab']);
              if(isActualManager())actions.push(['switchuser','mgr_switch_3d.png','تبديل المستخدم']);
            }
            actions=orderHomeActions(actions);

            c.innerHTML=`${offlineGraceAccess?'<div class="notice" style="margin-bottom:12px">وضع الطوارئ الآمن V141: الجهاز والحساب تم التحقق منهما سابقًا، ويستمر العمل المؤقت حتى 72 ساعة.</div>':''}
              <div class="system-home">
                <div class="system-topline">
                  <div class="system-page-title">
                    <h2>لوحة تشغيل النظام</h2>
                    <span>واجهة سيستم عملية بدون تكرار أو فراغات</span>
                  </div>
                  <div class="system-topline-meta">
                    <span class="sys-chip">آخر تحديث: ${typeof fullTimestamp==='function'?fullTimestamp():fmtDate(Date.now())}</span>
                    <span class="sys-chip">الحالة: متصل</span>
                  </div>
                </div>

                <div class="sys-kpis">
                  <div class="sys-kpi"><span>طلبات اليوم</span><b>${tt.length}</b></div>
                  <div class="sys-kpi"><span>جاري التنفيذ</span><b>${processingCount}</b></div>
                  <div class="sys-kpi"><span>جاهز</span><b>${readyCount}</b></div>
                  <div class="sys-kpi"><span>قيد التسجيل</span><b>${pendingCount}</b></div>
                </div>

                <div class="sys-block">
                  <div class="sys-block-head">
                    <h3>اختصارات التشغيل</h3>
                    <small>اسحب الأيقونات لتغيير ترتيبها</small>
                  </div>
                  <div class="homeactions homeactions-main sys-quick-grid">
                    ${actions.map(([tab,icon,label])=>`<button class="homeaction" data-home-tab="${tab}" title="اسحب لتغيير الترتيب"><span class="homeiconbox">${navGlyph(tab)}</span><span>${label}</span></button>`).join('')}
                  </div>
                </div>

                <div class="sys-main-grid">
                  <div class="card sys-table-card">
                    <div class="sys-block-head">
                      <h3>آخر الطلبات اليوم</h3>
                      <small>${recent.length} / ${tt.length}</small>
                    </div>
                    <div class="sys-table-wrap">
                      <table class="sys-table">
                        <thead>
                          <tr>
                            <th>رقم الطلب</th>
                            <th>العميل</th>
                            <th>التوقيت</th>
                            <th>الحالة</th>
                          </tr>
                        </thead>
                        <tbody>
                          ${recent.length?recent.map(o=>`
                            <tr>
                              <td>${esc(o.order_number||'—')}</td>
                              <td>${esc(o.customer_name||o.customerName||o.customer?.name||'—')}</td>
                              <td>${esc(fmtDate(o.created_at_ms||Date.now()))}</td>
                              <td><span class="sys-status ${statusClass(o.workflow_status)}">${statusLabel(o.workflow_status)}</span></td>
                            </tr>
                          `).join(''):`
                            <tr>
                              <td colspan="4" class="sys-empty">لا توجد طلبات اليوم حتى الآن</td>
                            </tr>
                          `}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <div class="sys-side-stack">
                    <div class="card sys-side-card">
                      <div class="sys-block-head">
                        <h3>تشغيل سريع</h3>
                        <small>ملخص مباشر</small>
                      </div>
                      <div class="sys-mini-list">
                        <div><span>إرسال الطلبات</span><b>من شاشة الطلبات</b></div>
                        <div><span>الاستعلام</span><b>من شاشة استعلام تحاليل</b></div>
                        <div><span>إدارة العملاء</span><b>من شاشة العملاء</b></div>
                        <div><span>الوقت</span><b>${typeof fullTimestamp==='function'?fullTimestamp():fmtDate(Date.now())}</b></div>
                      </div>
                    </div>

                    <div class="card sys-side-card">
                      <div class="sys-block-head">
                        <h3>مؤشرات التشغيل</h3>
                        <small>سريعة وواضحة</small>
                      </div>
                      <div class="sys-progress-list">
                        <div class="sys-progress-row"><span>جاري التنفيذ</span><div class="sys-progress"><i style="width:${tt.length?Math.max(8,Math.round((processingCount/Math.max(tt.length,1))*100)):8}%"></i></div><b>${processingCount}</b></div>
                        <div class="sys-progress-row"><span>جاهز</span><div class="sys-progress"><i style="width:${tt.length?Math.max(8,Math.round((readyCount/Math.max(tt.length,1))*100)):8}%"></i></div><b>${readyCount}</b></div>
                        <div class="sys-progress-row"><span>قيد التسجيل</span><div class="sys-progress"><i style="width:${tt.length?Math.max(8,Math.round((pendingCount/Math.max(tt.length,1))*100)):8}%"></i></div><b>${pendingCount}</b></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>`;

            enableHomeReorder();
            $$('.homeactions-main [data-home-tab]').forEach(b=>b.onclick=async()=>{
              const tab=b.dataset.homeTab;
              if(tab==='switchuser')return showUserSwitcher();
              return renderTab(tab);
            });
          }"""

          app, n = re.subn(
              r"async function dashboard\(c\)\{.*?\}\nasync function newOrder",
              new_dashboard + "\nasync function newOrder",
              app,
              count=1,
              flags=re.S
          )
          if n != 1:
              raise SystemExit('dashboard replacement failed')

          css_add = """
          /* TAH_SYSTEM_DASHBOARD_R813
             Turn the main screen into a real system dashboard UI.
          */

          body.dashboard-white .system-home{
            display:grid;
            gap:16px;
            min-height:calc(100vh - 145px);
            align-content:start;
          }

          body.dashboard-white .system-topline{
            display:flex;
            align-items:flex-end;
            justify-content:space-between;
            gap:16px;
            padding:2px 2px 0;
          }

          body.dashboard-white .system-page-title h2{
            margin:0 0 4px;
            color:#103f68;
            font-size:23px;
          }

          body.dashboard-white .system-page-title span{
            color:#6f8899;
            font-size:12px;
          }

          body.dashboard-white .system-topline-meta{
            display:flex;
            flex-wrap:wrap;
            gap:8px;
            justify-content:flex-end;
          }

          body.dashboard-white .sys-chip{
            display:inline-flex;
            align-items:center;
            padding:8px 12px;
            border-radius:999px;
            background:#f4f9fd;
            border:1px solid #d8e7f1;
            color:#205f92;
            font-size:12px;
            font-weight:700;
          }

          body.dashboard-white .sys-kpis{
            display:grid;
            grid-template-columns:repeat(4,minmax(0,1fr));
            gap:10px;
          }

          body.dashboard-white .sys-kpi,
          body.dashboard-white .sys-table-card,
          body.dashboard-white .sys-side-card,
          body.dashboard-white .sys-block{
            background:#fff;
            border:1px solid #d9e6ef;
            border-radius:18px;
            box-shadow:0 6px 18px rgba(24,70,104,.05);
          }

          body.dashboard-white .sys-kpi{
            min-height:84px;
            padding:14px 16px;
            display:grid;
            align-content:center;
            gap:6px;
          }

          body.dashboard-white .sys-kpi span{
            color:#6a8396;
            font-size:12px;
            font-weight:700;
          }

          body.dashboard-white .sys-kpi b{
            color:#0d416d;
            font-size:31px;
            line-height:1;
          }

          body.dashboard-white .sys-block{
            padding:14px;
          }

          body.dashboard-white .sys-block-head{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            margin-bottom:12px;
          }

          body.dashboard-white .sys-block-head h3{
            margin:0;
            color:#103f68;
            font-size:18px;
          }

          body.dashboard-white .sys-block-head small{
            color:#7b91a2;
            font-size:12px;
          }

          body.dashboard-white .sys-quick-grid{
            display:grid !important;
            grid-template-columns:repeat(auto-fit,minmax(112px,112px)) !important;
            justify-content:flex-start !important;
            align-items:start !important;
            gap:14px !important;
            margin:0 !important;
          }

          body.dashboard-white .sys-main-grid{
            display:grid;
            grid-template-columns:minmax(0,1.6fr) minmax(320px,.9fr);
            gap:14px;
          }

          body.dashboard-white .sys-table-card,
          body.dashboard-white .sys-side-card{
            padding:14px;
          }

          body.dashboard-white .sys-table-wrap{
            overflow:auto;
          }

          body.dashboard-white .sys-table{
            width:100%;
            border-collapse:collapse;
          }

          body.dashboard-white .sys-table th,
          body.dashboard-white .sys-table td{
            padding:12px 10px;
            text-align:right;
            border-bottom:1px solid #e5eef4;
            vertical-align:middle;
            white-space:nowrap;
          }

          body.dashboard-white .sys-table th{
            color:#6e8798;
            font-size:12px;
            font-weight:800;
            background:#f8fbfe;
          }

          body.dashboard-white .sys-table td{
            color:#153c61;
            font-size:13px;
          }

          body.dashboard-white .sys-empty{
            text-align:center !important;
            color:#8097a8 !important;
            padding:24px 10px !important;
          }

          body.dashboard-white .sys-status{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            min-width:92px;
            padding:6px 10px;
            border-radius:999px;
            font-size:12px;
            font-weight:800;
          }

          body.dashboard-white .sys-status.processing{
            background:#eef6ff;
            color:#1b65a0;
          }

          body.dashboard-white .sys-status.ready{
            background:#edf9f1;
            color:#257349;
          }

          body.dashboard-white .sys-status.received{
            background:#fff7ea;
            color:#9a6618;
          }

          body.dashboard-white .sys-status.pending{
            background:#f3f5f7;
            color:#617b8d;
          }

          body.dashboard-white .sys-side-stack{
            display:grid;
            gap:14px;
          }

          body.dashboard-white .sys-mini-list,
          body.dashboard-white .sys-progress-list{
            display:grid;
            gap:10px;
          }

          body.dashboard-white .sys-mini-list > div{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            min-height:44px;
            padding:10px 12px;
            border-radius:14px;
            background:#f8fbfe;
            border:1px solid #e4edf4;
          }

          body.dashboard-white .sys-mini-list span{
            color:#698192;
            font-size:12px;
            font-weight:700;
          }

          body.dashboard-white .sys-mini-list b{
            color:#113d66;
            font-size:12px;
            font-weight:800;
            text-align:left;
          }

          body.dashboard-white .sys-progress-row{
            display:grid;
            grid-template-columns:92px 1fr 34px;
            align-items:center;
            gap:10px;
          }

          body.dashboard-white .sys-progress-row span{
            color:#698192;
            font-size:12px;
            font-weight:700;
          }

          body.dashboard-white .sys-progress-row b{
            color:#113d66;
            font-size:12px;
            font-weight:800;
            text-align:left;
          }

          body.dashboard-white .sys-progress{
            height:10px;
            border-radius:999px;
            background:#edf3f8;
            overflow:hidden;
          }

          body.dashboard-white .sys-progress i{
            display:block;
            height:100%;
            border-radius:999px;
            background:linear-gradient(90deg,#2f82c7,#0f4774);
          }

          body.dashboard-white .side{
            display:flex !important;
            flex-direction:column !important;
          }

          body.dashboard-white .sidebottom{
            margin-top:auto !important;
            padding-top:12px !important;
            border-top:1px solid #dbe7ef !important;
          }

          @media(max-width:1280px){
            body.dashboard-white .sys-main-grid{
              grid-template-columns:1fr;
            }
          }

          @media(max-width:980px){
            body.dashboard-white .sys-kpis{
              grid-template-columns:repeat(2,minmax(0,1fr));
            }
            body.dashboard-white .system-topline{
              flex-direction:column;
              align-items:flex-start;
            }
            body.dashboard-white .system-topline-meta{
              justify-content:flex-start;
            }
          }
          """

          css = css.rstrip() + "\n\n" + css_add.strip() + "\n"

          pkg = json.loads(pkg_path.read_text(encoding='utf-8-sig'))
          if str(pkg.get('version')) != '145.8.12':
              raise SystemExit(f"Expected 145.8.12, got {pkg.get('version')}")

          pkg['version'] = '145.8.13'
          pkg['description'] = 'Tahalil Alakkad Windows V145 R8.13 - real system dashboard UI with structured workspace and compact 3D shortcuts'

          app_path.write_text(app, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          (root / 'V145_R813_SYSTEM_DASHBOARD_NOTES.txt').write_text(
              'Windows V145 R8.13 - System Dashboard UI\n\n'
              '- Main screen redesigned into a real system dashboard.\n'
              '- Structured top line, KPI strip, compact 3D quick actions, recent orders table, and operation widgets.\n'
              '- No duplicated titles, no marketing blocks, and no oversized decorative empty areas.\n'
              '- Settings and Logout remain separate at sidebar bottom.\n'
              '- Previous save, customer, Firebase, timestamp, and login fixes are preserved.\n',
              encoding='utf-8'
          )

          print('R813_SYSTEM_DASHBOARD_APPLIED')
          '@

          $patcherPath = Join-Path $env:RUNNER_TEMP 'patch_r813.py'
          $patcher | Set-Content $patcherPath -Encoding utf8
          python $patcherPath $root
          if ($LASTEXITCODE -ne 0) {
            throw 'R8.13 patch failed'
          }

      - name: Audit R8.13 and protected files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'

          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '145.8.13') { throw "Expected 145.8.13, got $($pkg.version)" }

          $app = Get-Content (Join-Path $root 'src/app.js') -Raw
          $css = Get-Content (Join-Path $root 'src/styles.css') -Raw

          foreach ($marker in @(
            'TAH_SYSTEM_DASHBOARD_R813',
            'لوحة تشغيل النظام',
            'sys-kpis',
            'sys-table',
            'sys-quick-grid'
          )) {
            if (!($app.Contains($marker) -or $css.Contains($marker))) {
              throw "Missing R8.13 contract: $marker"
            }
          }

          foreach ($forbidden in @(
            'ملاحظات سريعة',
            'SMART HOME',
            'clean-stats'
          )) {
            if ($app.Contains($forbidden)) {
              throw "Old dashboard content remains: $forbidden"
            }
          }

          $actualData = (Get-FileHash (Join-Path $root 'src/data.js') -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualFirebase = (Get-FileHash (Join-Path $root 'src/firebase.js') -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualParity = (Get-FileHash (Join-Path $root 'src/v145r8-parity.js') -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualMain = (Get-FileHash (Join-Path $root 'electron/main.cjs') -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualPreload = (Get-FileHash (Join-Path $root 'electron/preload.cjs') -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($actualData -ne $env:R813_DATA_SHA256) { throw 'R8.13 changed data.js - blocked' }
          if ($actualFirebase -ne $env:R813_FIREBASE_SHA256) { throw 'R8.13 changed firebase.js - blocked' }
          if ($actualParity -ne $env:R813_PARITY_SHA256) { throw 'R8.13 changed core parity - blocked' }
          if ($actualMain -ne $env:R813_MAIN_SHA256) { throw 'R8.13 changed electron/main.cjs - blocked' }
          if ($actualPreload -ne $env:R813_PRELOAD_SHA256) { throw 'R8.13 changed electron/preload.cjs - blocked' }

          node --check (Join-Path $root 'src/app.js')
          if ($LASTEXITCODE -ne 0) { throw 'app.js syntax failed' }

          Write-Host 'R8.13 AUDIT PASSED - SYSTEM DASHBOARD READY, CORE PROTECTED'

      - name: Package R8.13 source before dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $stage = Join-Path $env:RUNNER_TEMP 'source_stage_r813'

          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Get-ChildItem -LiteralPath $root -Force |
            Where-Object { @('node_modules','release','.git') -notcontains $_.Name } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $stage -Recurse -Force }

          $zip = Join-Path $PWD 'Tahalil-Alakkad-V145-R8.13-Windows-Source.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage,$zip,[System.IO.Compression.CompressionLevel]::Optimal,$false)

          if (!(Test-Path $zip) -or (Get-Item $zip).Length -lt 50000) {
            throw 'R8.13 source ZIP invalid'
          }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Tahalil-Alakkad-V145-R8.13-Windows-Source.zip" | Set-Content 'Tahalil-Alakkad-V145-R8.13-Windows-Source.zip.sha256' -Encoding ascii
          Copy-Item (Join-Path $root 'V145_R813_SYSTEM_DASHBOARD_NOTES.txt') 'V145_R813_SYSTEM_DASHBOARD_NOTES.txt' -Force

      - name: Install dependencies
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Build Portable
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Portable startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable) { throw 'Portable EXE missing for smoke test' }

          $proc = Start-Process -FilePath $portable.FullName -PassThru
          Start-Sleep -Seconds 12
          if ($proc.HasExited) {
            if ($proc.ExitCode -ne 0) { throw "Portable exited during smoke test with code $($proc.ExitCode)" }
            throw 'Portable exited unexpectedly during smoke window'
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Build Setup
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }

      - name: Prepare R8.13 delivery files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows/windows-system/release'

          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup = Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1

          if (!$portable -or !$setup) { throw 'Portable or Setup EXE missing' }

          Copy-Item $portable.FullName 'Tahalil-Alakkad-V145-R8.13-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V145-R8.13-Windows-Setup.exe' -Force

          foreach ($name in @(
            'Tahalil-Alakkad-V145-R8.13-Windows-Portable.exe',
            'Tahalil-Alakkad-V145-R8.13-Windows-Setup.exe'
          )) {
            $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Upload R8.13 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V145-R8.13-Windows-System-Dashboard
          path: |
            Tahalil-Alakkad-V145-R8.13-Windows-Portable.exe
            Tahalil-Alakkad-V145-R8.13-Windows-Portable.exe.sha256
            Tahalil-Alakkad-V145-R8.13-Windows-Setup.exe
            Tahalil-Alakkad-V145-R8.13-Windows-Setup.exe.sha256
            Tahalil-Alakkad-V145-R8.13-Windows-Source.zip
            Tahalil-Alakkad-V145-R8.13-Windows-Source.zip.sha256
            V145_R813_SYSTEM_DASHBOARD_NOTES.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish Windows V145 R8.13 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = 'v145-r8.13-windows'
          $title = 'تحاليل العقاد Windows V145 R8.13 — System Dashboard UI'

          $notes = @'
          Windows V145 R8.13 — System Dashboard UI

          - Main screen redesigned as a real system dashboard.
          - Structured top line, KPI strip, recent orders table, and compact 3D quick actions.
          - No duplicated titles, no decorative marketing blocks, and no large empty areas.
          - Settings and Logout remain separate at the sidebar bottom.
          - Previous save, customers, Firebase, timestamps, and login fixes remain preserved.
          '@

          $files = @(
            'Tahalil-Alakkad-V145-R8.13-Windows-Portable.exe',
            'Tahalil-Alakkad-V145-R8.13-Windows-Portable.exe.sha256',
            'Tahalil-Alakkad-V145-R8.13-Windows-Setup.exe',
            'Tahalil-Alakkad-V145-R8.13-Windows-Setup.exe.sha256',
            'Tahalil-Alakkad-V145-R8.13-Windows-Source.zip',
            'Tahalil-Alakkad-V145-R8.13-Windows-Source.zip.sha256',
            'V145_R813_SYSTEM_DASHBOARD_NOTES.txt'
          )

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not update R8.13 release' }
          } else {
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create R8.13 release' }
          }

          gh release upload $tag @files --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload R8.13 release files' }

      - name: Final status
        shell: pwsh
        run: |
          Write-Host 'WINDOWS V145 R8.13 SYSTEM DASHBOARD UI - BUILT, AUDITED, CORE PROTECTED'
