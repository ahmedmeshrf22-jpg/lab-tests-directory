name: Deploy V100 Orders Results Backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract V100 backend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy_v100
          mkdir deploy_v100
          unzip -q Project3_AK_V100_LAB_OPERATOR_RESULTS_FIXED.zip -d deploy_v100
          test -f deploy_v100/firebase/functions/index.js
          test -f deploy_v100/firestore.rules
          test -f deploy_v100/storage.rules

      - name: Write Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "ERROR: Add repository secret FIREBASE_SERVICE_ACCOUNT_JSON once, then rerun."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Install Firebase CLI and function dependencies
        working-directory: deploy_v100
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix firebase/functions
          npm install --global firebase-tools

      - name: Deploy Firestore rules and notification function
        working-directory: deploy_v100
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --project tahalil-alakkad \
            --only firestore:rules,storage,functions:notifyOrderStatusChanged \
            --non-interactive
