      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit V130 read-only recovery safety
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r=Join-Path $PWD 'build_v130_windows/windows-system'
          $pkg=Get-Content (Join-Path $r 'package.json') -Raw | ConvertFrom-Json
          if($pkg.version -ne '130.0.0'){throw 'Wrong version'}
          $tests=Get-Content (Join-Path $r 'public/lab_tests_android.json') -Raw | ConvertFrom-Json
          if($tests.Count -ne 331){throw 'Expected 331 tests'}
          if(($tests|Where-Object{$null -ne $_.customer_price}).Count -ne 0){throw 'Embedded prices found'}
          $app=Get-Content (Join-Path $r 'src/app.js') -Raw
          foreach($x in @('Windows System V130','Unified System V130','اختبار الاسترجاع V130','قراءة ومقارنة فقط','const recoveryCard=(!actingProfile&&isActualManager())','if(actingProfile||!isActualManager())')){if(!$app.Contains($x)){throw "Missing UI marker: $x"}}
          $probe=Get-Content (Join-Path $r 'src/recoveryProbe.js') -Raw
          foreach($x in @('getIdToken(false)','getIdToken(true)','examined','exact','stale','missing','denied')){if(!$probe.Contains($x)){throw "Missing probe marker: $x"}}
          foreach($x in @('firebase/firestore','getDoc(','getDocs(','onSnapshot(','setDoc(','updateDoc(','writeBatch(')){if($probe.Contains($x)){throw "Recovery probe Firestore operation detected: $x"}}
          $main=Get-Content (Join-Path $r 'electron/main.cjs') -Raw
          $a=$main.IndexOf("ipcMain.handle('recovery:probe'");$b=$main.IndexOf("ipcMain.handle('app:notify'",$a);if($a -lt 0 -or $b -le $a){throw 'Recovery handler missing'};$h=$main.Substring($a,$b-$a)
          if(!$main.Contains('tahalil-recovery-probe')){throw 'Recovery endpoint missing'}
          foreach($x in @("method:'GET'",'examined','exact','stale','missing','denied')){if(!$h.Contains($x)){throw "Missing GET recovery marker: $x"}}
          if($h.Contains("method:'POST'") -or $h.Contains('body:')){throw 'Recovery handler must be GET-only with no body'}
          if(!$main.Contains('OFFLINE_GRACE_MS = 72 * 60 * 60 * 1000') -or !$main.Contains('new Tray') -or !$main.Contains('requestSingleInstanceLock')){throw 'V127/V125 Windows protections missing'}
          $pre=Get-Content (Join-Path $r 'electron/preload.cjs') -Raw;if(!$pre.Contains("recoveryProbe: (payload) => ipcRenderer.invoke('recovery:probe', payload)")){throw 'Recovery preload missing'}
          $shadow=Get-Content (Join-Path $r 'src/shadowBackup.js') -Raw;if(!$shadow.Contains('tahalil-shadow-mirror') -or !$shadow.Contains('Shadow backup is deliberately non-blocking') -or $shadow.Contains('tahalil-recovery-probe')){throw 'V129 shadow backup isolation failed'}
          $res=Get-Content (Join-Path $r 'src/resilience.js') -Raw;if(!$res.Contains('currentMode(){return BackendFailoverMode.FIREBASE_ONLY}')){throw 'FIREBASE_ONLY missing'}
          $backup=Get-Content (Join-Path $r 'src/backup.js') -Raw;if(!$backup.Contains('app_version_code:130') -or !$backup.Contains("app_version_name:'System V130 Windows'")){throw 'V130 backup metadata missing'}
          $runtime=$app+"`n"+$probe+"`n"+$main+"`n"+$pre+"`n"+$shadow+"`n"+$res
          foreach($x in @('sb_secret_','sb_publishable_','SUPABASE_SERVICE_ROLE_KEY','SUPABASE_SECRET_KEYS','BEGIN PRIVATE KEY','workers.dev','cloudflare','sendPasswordResetEmail')){if($runtime.ToLower().Contains($x.ToLower())){throw "Forbidden runtime marker: $x"}}
          Get-ChildItem (Join-Path $r 'src') -Filter '*.js' -File|ForEach-Object{Get-Content $_.FullName -Raw|node --input-type=module --check;if($LASTEXITCODE -ne 0){throw "JS syntax: $($_.Name)"}}
          node --check (Join-Path $r 'electron/main.cjs');if($LASTEXITCODE -ne 0){throw 'main syntax'}
          node --check (Join-Path $r 'electron/preload.cjs');if($LASTEXITCODE -ne 0){throw 'preload syntax'}
          Write-Host 'ALL WINDOWS V130 RECOVERY CHECKS PASSED'
      - name: Install dependencies
        working-directory: build_v130_windows/windows-system
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Build Portable
        working-directory: build_v130_windows/windows-system
        shell: pwsh
        run: npm run dist:portable
      - name: Portable startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$rel=Join-Path $PWD 'build_v130_windows/windows-system/release';$exe=Get-ChildItem $rel -Filter '*Portable*.exe' -File|Sort-Object Length -Descending|Select-Object -First 1;if(!$exe){throw 'Portable missing'};$env:TAHALIL_SMOKE_TEST='1';$p=Start-Process $exe.FullName -PassThru;if(!$p.WaitForExit(45000)){Stop-Process -Id $p.Id -Force;throw 'Portable timeout'};if($p.ExitCode -ne 0){throw "Portable exit $($p.ExitCode)"};Remove-Item Env:TAHALIL_SMOKE_TEST -ErrorAction SilentlyContinue
      - name: Portable System Tray smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$rel=Join-Path $PWD 'build_v130_windows/windows-system/release';$exe=Get-ChildItem $rel -Filter '*Portable*.exe' -File|Sort-Object Length -Descending|Select-Object -First 1;$env:TAHALIL_TRAY_SMOKE_TEST='1';$p=Start-Process $exe.FullName -PassThru;if(!$p.WaitForExit(45000)){Stop-Process -Id $p.Id -Force;throw 'Tray timeout'};if($p.ExitCode -ne 0){throw "Tray exit $($p.ExitCode)"};Remove-Item Env:TAHALIL_TRAY_SMOKE_TEST -ErrorAction SilentlyContinue
      - name: Build Setup
        working-directory: build_v130_windows/windows-system
        shell: pwsh
        run: npm run dist:setup
      - name: Prepare V130 release files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$rel=Join-Path $PWD 'build_v130_windows/windows-system/release';$portable=Get-ChildItem $rel -Filter '*Portable*.exe' -File|Sort-Object Length -Descending|Select-Object -First 1;$setup=Get-ChildItem $rel -Filter '*Setup*.exe' -File|Sort-Object Length -Descending|Select-Object -First 1;if(!$portable -or !$setup){throw 'EXE missing'};Copy-Item $portable.FullName 'Tahalil-Alakkad-V130-Windows-Portable.exe' -Force;Copy-Item $setup.FullName 'Tahalil-Alakkad-V130-Windows-Setup.exe' -Force;foreach($n in @('Tahalil-Alakkad-V130-Windows-Portable.exe','Tahalil-Alakkad-V130-Windows-Setup.exe')){if((Get-Item $n).Length -lt 1000000){throw "$n small"};$h=(Get-FileHash $n -Algorithm SHA256).Hash.ToLowerInvariant();"$h  $n"|Set-Content "$n.sha256" -Encoding ascii}
      - name: Publish directly to Windows V130 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';$tag='v130-windows';gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null;if($LASTEXITCODE -ne 0){gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title "تحاليل العقاد Windows V130 — Read-Only Recovery Test" --notes "Windows V130 aligns with Android V130. Firebase remains authoritative; V129 shadow backup is preserved. The manager-only recovery test is GET/read-only, uses the signed-in Firebase ID token, returns sanitized comparison counts only, writes nothing, and enables no failover.";if($LASTEXITCODE -ne 0){throw 'release create failed'}};gh release upload $tag 'Tahalil-Alakkad-V130-Windows-Portable.exe' 'Tahalil-Alakkad-V130-Windows-Portable.exe.sha256' 'Tahalil-Alakkad-V130-Windows-Setup.exe' 'Tahalil-Alakkad-V130-Windows-Setup.exe.sha256' --repo "$env:GITHUB_REPOSITORY" --clobber;if($LASTEXITCODE -ne 0){throw 'release upload failed'};gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --latest
