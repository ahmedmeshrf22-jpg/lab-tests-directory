name: Windows V145 R8.27 Specific Date Filter

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-windows-v145-r827-specific-date-filter
  cancel-in-progress: false

jobs:
  build:
    name: Windows V145 R8.27 — Specific Date Filter
    runs-on: windows-latest
    timeout-minutes: 110

    env:
      BASE_TAG: v145-r8.26-windows
      BASE_SOURCE: Tahalil-Alakkad-V145-R8.26-Windows-Source.zip
      BASE_SHA256: d8cf27ec93a73266b3312f06a2e8ee9978fb57b99534f92dd53a9e4d033c96ac
      R827_PATCH_B64: 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore exact R8.26 source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD $env:BASE_SOURCE
          if (Test-Path $zip) { Remove-Item $zip -Force }
          gh release download $env:BASE_TAG --repo "$env:GITHUB_REPOSITORY" --pattern $env:BASE_SOURCE --dir $PWD
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $zip)) { throw 'Could not download exact R8.26 source' }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:BASE_SHA256) { throw "R8.26 source hash mismatch: $hash" }

          $root = Join-Path $PWD 'build_windows/windows-system'
          if (Test-Path (Join-Path $PWD 'build_windows')) { Remove-Item (Join-Path $PWD 'build_windows') -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path $zip -DestinationPath $root -Force

          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '145.8.26') { throw "Expected 145.8.26, got $($pkg.version)" }

          foreach ($item in @(
            'src/data.js',
            'src/firebase.js',
            'src/resultStore.js',
            'src/styles.css',
            'src/v145r8-parity.js',
            'electron/main.cjs',
            'electron/preload.cjs'
          )) {
            $name = 'R827_' + ($item -replace '[^A-Za-z0-9]','_').ToUpper() + '_SHA256'
            $value = (Get-FileHash (Join-Path $root $item) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$name=$value" | Add-Content $env:GITHUB_ENV
          }

      - name: Apply specific date filter patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patchPath = Join-Path $env:RUNNER_TEMP 'r827_patch.py'
          [IO.File]::WriteAllBytes($patchPath,[Convert]::FromBase64String($env:R827_PATCH_B64))
          python $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'R8.27 patch failed' }

      - name: Audit R8.27 date filter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $app = Get-Content (Join-Path $root 'src/app.js') -Raw
          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json

          if ($pkg.version -ne '145.8.27') { throw "Expected 145.8.27, got $($pkg.version)" }
          foreach ($marker in @(
            'TAH_R827_SPECIFIC_DATE_FILTER',
            '<option value="specific">اختيار يوم معين</option>',
            'id="wdateSpecific" type="date"',
            'tahalil_worklist_date_mode',
            'tahalil_worklist_specific_date',
            'specificBounds',
            'matchesDay'
          )) {
            if (!$app.Contains($marker)) { throw "Missing R8.27 marker: $marker" }
          }

          $checks = @{
            'src/data.js'='R827_SRC_DATA_JS_SHA256';
            'src/firebase.js'='R827_SRC_FIREBASE_JS_SHA256';
            'src/resultStore.js'='R827_SRC_RESULTSTORE_JS_SHA256';
            'src/styles.css'='R827_SRC_STYLES_CSS_SHA256';
            'src/v145r8-parity.js'='R827_SRC_V145R8_PARITY_JS_SHA256';
            'electron/main.cjs'='R827_ELECTRON_MAIN_CJS_SHA256';
            'electron/preload.cjs'='R827_ELECTRON_PRELOAD_CJS_SHA256'
          }
          foreach ($pair in $checks.GetEnumerator()) {
            $actual = (Get-FileHash (Join-Path $root $pair.Key) -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = [Environment]::GetEnvironmentVariable($pair.Value)
            if ($actual -ne $expected) { throw "$($pair.Key) changed - protected scope violated" }
          }

          node --check (Join-Path $root 'src/app.js')
          if ($LASTEXITCODE -ne 0) { throw 'app.js syntax failed' }

          @(
            'R8.27 SPECIFIC DATE FILTER AUDIT: PASS',
            'All Days + Today + Specific Day are available',
            'Specific date uses local calendar day boundaries',
            'Selected mode/date persist across worklist reloads',
            'Firebase/data/results/security files unchanged'
          ) | Set-Content 'R827_SPECIFIC_DATE_FILTER_AUDIT.txt' -Encoding utf8

      - name: Package R8.27 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $stage = Join-Path $env:RUNNER_TEMP 'source_stage_r827'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Get-ChildItem -LiteralPath $root -Force |
            Where-Object { @('node_modules','release','.git') -notcontains $_.Name } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $stage -Recurse -Force }

          $zip = Join-Path $PWD 'Tahalil-Alakkad-V145-R8.27-Windows-Source.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage,$zip,[System.IO.Compression.CompressionLevel]::Optimal,$false)

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Tahalil-Alakkad-V145-R8.27-Windows-Source.zip" | Set-Content 'Tahalil-Alakkad-V145-R8.27-Windows-Source.zip.sha256' -Encoding ascii
          Copy-Item (Join-Path $root 'V145_R827_SPECIFIC_DATE_FILTER_NOTES.txt') 'V145_R827_SPECIFIC_DATE_FILTER_NOTES.txt' -Force

      - name: Install dependencies
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Build Portable
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Portable smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable) { throw 'Portable EXE missing' }
          $proc = Start-Process -FilePath $portable.FullName -PassThru
          Start-Sleep -Seconds 12
          if ($proc.HasExited) { throw "Portable exited unexpectedly: $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Build Setup
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }

      - name: Prepare delivery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup = Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable -or !$setup) { throw 'Portable or Setup missing' }

          Copy-Item $portable.FullName 'Tahalil-Alakkad-V145-R8.27-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V145-R8.27-Windows-Setup.exe' -Force

          foreach ($name in @(
            'Tahalil-Alakkad-V145-R8.27-Windows-Portable.exe',
            'Tahalil-Alakkad-V145-R8.27-Windows-Setup.exe'
          )) {
            $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V145-R8.27-Windows-Specific-Date-Filter
          path: |
            Tahalil-Alakkad-V145-R8.27-Windows-Portable.exe
            Tahalil-Alakkad-V145-R8.27-Windows-Portable.exe.sha256
            Tahalil-Alakkad-V145-R8.27-Windows-Setup.exe
            Tahalil-Alakkad-V145-R8.27-Windows-Setup.exe.sha256
            Tahalil-Alakkad-V145-R8.27-Windows-Source.zip
            Tahalil-Alakkad-V145-R8.27-Windows-Source.zip.sha256
            V145_R827_SPECIFIC_DATE_FILTER_NOTES.txt
            R827_SPECIFIC_DATE_FILTER_AUDIT.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish R8.27 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v145-r8.27-windows'
          $title = 'تحاليل العقاد Windows V145 R8.27 — Specific Date Filter'
          $notes = Get-Content 'V145_R827_SPECIFIC_DATE_FILTER_NOTES.txt' -Raw

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes
          } else {
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create R8.27 release' }

          gh release upload $tag `
            Tahalil-Alakkad-V145-R8.27-Windows-Portable.exe `
            Tahalil-Alakkad-V145-R8.27-Windows-Portable.exe.sha256 `
            Tahalil-Alakkad-V145-R8.27-Windows-Setup.exe `
            Tahalil-Alakkad-V145-R8.27-Windows-Setup.exe.sha256 `
            Tahalil-Alakkad-V145-R8.27-Windows-Source.zip `
            Tahalil-Alakkad-V145-R8.27-Windows-Source.zip.sha256 `
            V145_R827_SPECIFIC_DATE_FILTER_NOTES.txt `
            R827_SPECIFIC_DATE_FILTER_AUDIT.txt `
            --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload R8.27 release assets' }
