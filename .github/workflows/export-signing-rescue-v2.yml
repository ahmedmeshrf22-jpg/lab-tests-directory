name: Export Android Signing Rescue V2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RECOVERY_CERT_B64: 

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt original signing bundle for V2 recovery
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_BUNDLE_B64:-}" || { echo "::error::Missing TAHALIL_SIGNING_BUNDLE_B64"; exit 1; }
          umask 077
          printf '%s' "$SIGNING_BUNDLE_B64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/signing-bundle.bin"
          test -s "$RUNNER_TEMP/signing-bundle.bin"
          printf '%s' "$RECOVERY_CERT_B64" | base64 --decode > "$RUNNER_TEMP/recovery-cert.pem"
          openssl cms -encrypt -binary -aes-256-cbc \
            -in "$RUNNER_TEMP/signing-bundle.bin" \
            -outform DER \
            -out Tahalil-Android-Signing-Rescue-V2.cms \
            "$RUNNER_TEMP/recovery-cert.pem"
          sha256sum Tahalil-Android-Signing-Rescue-V2.cms > Tahalil-Android-Signing-Rescue-V2.cms.sha256
          rm -f "$RUNNER_TEMP/signing-bundle.bin" "$RUNNER_TEMP/recovery-cert.pem"

      - name: Upload encrypted rescue V2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-rescue-v2
          path: |
            Tahalil-Android-Signing-Rescue-V2.cms
            Tahalil-Android-Signing-Rescue-V2.cms.sha256
          if-no-files-found: error
          retention-days: 1
