name: Bootstrap Tahalil Alakkad V133 LTS Safety Base
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  android:
    name: V133 LTS Safety Base Bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Setup Gradle 8.11.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.11.1
    - name: Extract V119 base
      shell: bash
      run: 'set -euo pipefail

        test -f Project3_AK_V119_CURRENT_FIXES.zip

        rm -rf build_v121

        mkdir build_v121

        unzip -q Project3_AK_V119_CURRENT_FIXES.zip -d build_v121

        test -f build_v121/app/build.gradle.kts

        '
    - name: Apply V120 results and notifications patch
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' '''' | base64 --decode > /tmp/v120.patch

        patch -d build_v121 -p1 < /tmp/v120.patch

        '
    - name: Apply V121 result actions revision patch
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' '''' | base64 --decode > /tmp/v121.patch

        patch -d build_v121 -p1 < /tmp/v121.patch

        '
    - name: Apply V122 final icon + visible-label UI pass
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/final_iconify_v122.py <<'PYICON'\nfrom pathlib import Path\nimport re, sys, shutil\n\nROOT=Path(sys.argv[1]) if len(sys.argv)>1 else Path('.')\nSRC=ROOT/'app/src/main/java'\n\nHELPER='''package com.example.ui\n\nimport androidx.compose.foundation.layout.Column\nimport androidx.compose.foundation.layout.size\nimport androidx.compose.material3.IconButton\nimport androidx.compose.material3.LocalContentColor\nimport androidx.compose.material3.Text\nimport androidx.compose.runtime.Composable\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.text.style.TextAlign\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\n\n/**\n * V122 final action control: every tappable action is a transparent icon with\n * its visible name directly underneath. No filled/outlined rectangular action button.\n */\n@Composable\nfun LabeledIconAction(\n    label: String,\n    onClick: () -> Unit,\n    modifier: Modifier = Modifier,\n    enabled: Boolean = true,\n    iconTint: Color = LocalContentColor.current,\n    content: @Composable () -> Unit,\n) {\n    Column(\n        modifier = modifier,\n        horizontalAlignment = Alignment.CenterHorizontally,\n    ) {\n        IconButton(\n            onClick = onClick,\n            enabled = enabled,\n            modifier = Modifier.size(44.dp),\n        ) { content() }\n        Text(\n            text = label,\n            fontSize = 9.sp,\n            lineHeight = 11.sp,\n            fontWeight = FontWeight.SemiBold,\n            textAlign = TextAlign.Center,\n            maxLines = 2,\n            color = if (enabled) iconTint else iconTint.copy(alpha = 0.45f),\n        )\n    }\n}\n'''\n\n# Structural helpers -------------------------------------------------------\ndef skip_string(s,i):\n    if s.startswith('\"\"\"',i):\n        j=s.find('\"\"\"',i+3); return len(s) if j<0 else j+3\n    q=s[i]; j=i+1\n    while j<len(s):\n        if s[j]=='\\\\': j+=2; continue\n        if s[j]==q: return j+1\n        j+=1\n    return len(s)\n\ndef matching(s,i,op,cl):\n    assert s[i]==op\n    depth=0; j=i\n    while j<len(s):\n        if s[j] in ('\"',\"'\"):\n            j=skip_string(s,j); continue\n        if s.startswith('//',j):\n            k=s.find('\\n',j+2); j=len(s) if k<0 else k+1; continue\n        if s.startswith('/*',j):\n            depthc=1; j+=2\n            while j<len(s) and depthc:\n                if s.startswith('/*',j): depthc+=1; j+=2\n                elif s.startswith('*/',j): depthc-=1; j+=2\n                elif s[j] in ('\"',\"'\"): j=skip_string(s,j)\n                else: j+=1\n            continue\n        c=s[j]\n        if c==op: depth+=1\n        elif c==cl:\n            depth-=1\n            if depth==0:return j\n        j+=1\n    raise ValueError(f'unmatched {op} at {i}')\n\ndef split_top(s):\n    out=[]; start=0; stack=[]; i=0; close={')':'(',']':'[','}':'{'}\n    while i<len(s):\n        if s[i] in ('\"',\"'\"):\n            i=skip_string(s,i); continue\n        if s.startswith('//',i):\n            k=s.find('\\n',i+2); i=len(s) if k<0 else k+1; continue\n        if s.startswith('/*',i):\n            k=s.find('*/',i+2); i=len(s) if k<0 else k+2; continue\n        c=s[i]\n        if c in '([{': stack.append(c)\n        elif c in ')]}' and stack and stack[-1]==close[c]: stack.pop()\n        elif c==',' and not stack:\n            out.append(s[start:i].strip()); start=i+1\n        i+=1\n    tail=s[start:].strip()\n    if tail: out.append(tail)\n    return out\n\ndef named_arg(args,name):\n    for a in split_top(args):\n        m=re.match(rf'{re.escape(name)}\\s*=\\s*(.*)\\Z',a,re.S)\n        if m:return m.group(1).strip()\n    return None\n\ndef remove_named(args,names):\n    keep=[]\n    for a in split_top(args):\n        if any(re.match(rf'{re.escape(n)}\\s*=',a,re.S) for n in names): continue\n        keep.append(a)\n    return ',\\n        '.join(keep)\n\ndef first_text_expr(body):\n    m=re.search(r'\\bText\\s*\\(',body)\n    if not m:return None\n    p=body.find('(',m.start())\n    try:q=matching(body,p,'(',')')\n    except:return None\n    args=body[p+1:q]\n    txt=named_arg(args,'text')\n    if txt:return txt\n    parts=split_top(args)\n    return parts[0] if parts else None\n\ndef existing_icon_name(body):\n    m=re.search(r'Icons\\.(?:Default|Filled|Outlined|AutoMirrored\\.(?:Filled|Outlined))\\.([A-Za-z0-9_]+)',body)\n    return m.group(1) if m else None\n\ndef content_desc_expr(body):\n    m=re.search(r'contentDescription\\s*=\\s*',body)\n    if not m:return None\n    i=m.end(); depth=0; start=i\n    # consume expression to comma at top level or closing paren context\n    while i<len(body):\n        if body[i] in ('\"',\"'\"):\n            i=skip_string(body,i); continue\n        c=body[i]\n        if c in '([{':depth+=1\n        elif c in ')]}':\n            if depth==0:break\n            depth-=1\n        elif c==',' and depth==0:break\n        i+=1\n    x=body[start:i].strip()\n    return None if x in ('null','') else x\n\nICON_BY_NAME={\n'Close':'إغلاق','ArrowBack':'رجوع','ArrowForward':'التالي','Logout':'خروج','Login':'دخول','Refresh':'تحديث',\n'Edit':'تعديل','Delete':'حذف','Save':'حفظ','Share':'مشاركة','Download':'تحميل','CloudUpload':'رفع','Send':'إرسال',\n'CheckCircle':'تأكيد','Check':'تأكيد','DoneAll':'قراءة الكل','Visibility':'عرض','VisibilityOff':'إخفاء','Lock':'قفل',\n'LockReset':'تغيير PIN','Fingerprint':'البصمة','Settings':'الإعدادات','AdminPanelSettings':'اعتماد','Add':'إضافة','AddCircle':'إضافة',\n'PersonAdd':'إضافة مستخدم','People':'المستخدمون','Person':'المستخدم','Search':'بحث','CalendarMonth':'التاريخ','Restore':'استرجاع',\n'Backup':'نسخة احتياطية','Storage':'حفظ النسخة','CameraAlt':'الكاميرا','PhotoLibrary':'المعرض','Image':'صورة',\n'DocumentScanner':'مسح مستند','Description':'ملف','QrCodeScanner':'QR','PlayArrow':'تشغيل','Stop':'إيقاف','Block':'إيقاف',\n'Info':'معلومات','NotificationsActive':'الإشعارات','Home':'الرئيسية','Tune':'تصفية','RestartAlt':'إعادة تشغيل','Call':'اتصال',\n'Chat':'واتساب','History':'السجل','Payments':'المدفوعات','Sync':'مزامنة','ChevronRight':'التالي','ChevronLeft':'السابق',\n'TouchApp':'فتح'\n}\nKEY_ICONS=[\n(['حذف','delete','remove','مسح نهائي'],'Delete'),(['إلغاء الطلب','void order'],'Block'),(['إلغاء','الغاء','cancel','إغلاق','اغلاق','close'],'Close'),\n(['رجوع','back'],'ArrowBack'),(['خروج','logout','log out'],'Logout'),(['دخول','login','sign in'],'Login'),(['تحديث','refresh','reload'],'Refresh'),\n(['إضافة مستخدم','حساب استاف','add staff','person'],'PersonAdd'),(['إضافة','اضافة','add','جديد','new'],'AddCircle'),(['تعديل','edit','تصحيح','revision'],'Edit'),\n(['مشاركة','share'],'Share'),(['تحميل','download'],'Download'),(['رفع','upload'],'CloudUpload'),(['إرسال','ارسال','send'],'Send'),(['حفظ','save'],'Save'),\n(['اعتماد','approve','تأكيد','تاكيد','confirm','موافق','ok'],'CheckCircle'),(['استرجاع','restore'],'Restore'),(['نسخة احتياطية','backup'],'Backup'),\n(['qr','باركود'],'QrCodeScanner'),(['مستند','document','pdf','ملف'],'Description'),(['صورة','image','photo'],'Image'),(['كاميرا','camera'],'CameraAlt'),\n(['عرض','view','فتح','open'],'Visibility'),(['بحث','search'],'Search'),(['إشعار','notification'],'NotificationsActive'),(['إعداد','setting'],'Settings'),\n(['لغة','english','العربية','language'],'Language'),(['pin','كلمة المرور','password'],'Lock'),(['بصمة','fingerprint'],'Fingerprint'),(['تاريخ','date'],'CalendarMonth'),\n(['مستخدم','users','accounts'],'People'),(['مدفوع','payment','تحصيل'],'Payments'),(['اتصال','call'],'Call'),(['واتساب','whatsapp','chat'],'Chat'),\n(['سجل','history','audit'],'History'),(['مزامنة','sync'],'Sync'),(['تشغيل','start'],'PlayArrow'),(['إيقاف','تعطيل','block','disable'],'Block')\n]\n\ndef choose_icon(source, fallback=None):\n    low=source.lower()\n    for keys,icon in KEY_ICONS:\n        if any(k.lower() in low for k in keys):return icon\n    return fallback or 'TouchApp'\n\ndef label_for_icon(icon): return f'\"{ICON_BY_NAME.get(icon,\"فتح\")}\"'\n\ndef inject_imports(text):\n    additions=[]\n    if 'LabeledIconAction(' in text and 'package com.example.ui' not in text.splitlines()[0:2]:\n        # non-ui package, import helper\n        if 'import com.example.ui.LabeledIconAction' not in text:additions.append('import com.example.ui.LabeledIconAction')\n    if 'Icons.Default.' in text:\n        if 'import androidx.compose.material.icons.filled.*' not in text:additions.append('import androidx.compose.material.icons.filled.*')\n        if 'import androidx.compose.material.icons.Icons' not in text:additions.append('import androidx.compose.material.icons.Icons')\n    if not additions:return text\n    lines=text.splitlines()\n    idx=next((i for i,l in enumerate(lines) if l.startswith('import ')),1)\n    for a in reversed(additions):lines.insert(idx,a)\n    return '\\n'.join(lines)+('\\n' if text.endswith('\\n') else '')\n\n# convert Button/TextButton/OutlinedButton --------------------------------\ndef convert_buttons(text):\n    pat=re.compile(r'\\b(Button|OutlinedButton|TextButton)\\s*\\('); pos=0; reps=[]\n    while True:\n        m=pat.search(text,pos)\n        if not m:break\n        p=text.find('(',m.start())\n        try:q=matching(text,p,'(',')')\n        except:pos=m.end();continue\n        j=q+1\n        while j<len(text) and text[j].isspace():j+=1\n        if j>=len(text) or text[j]!='{':pos=q+1;continue\n        try:b=matching(text,j,'{','}')\n        except:pos=q+1;continue\n        args=text[p+1:q]; body=text[j+1:b]\n        on=named_arg(args,'onClick')\n        if on is None:\n            ps=split_top(args)\n            if ps and '=' not in ps[0]:on=ps[0]\n        if on is None:pos=b+1;continue\n        enabled=named_arg(args,'enabled')\n        modifier=named_arg(args,'modifier')\n        label=first_text_expr(body) or '\"تنفيذ\"'\n        icon=choose_icon(label, existing_icon_name(body))\n        parts=[f'label = {label}',f'onClick = {on}']\n        if modifier:parts.append(f'modifier = {modifier}')\n        if enabled:parts.append(f'enabled = {enabled}')\n        new='LabeledIconAction(' + ', '.join(parts) + f') {{ Icon(Icons.Default.{icon}, contentDescription = null) }}'\n        reps.append((m.start(),b+1,new));pos=b+1\n    for a,b,r in reversed(reps):text=text[:a]+r+text[b:]\n    # labels inside old onClick lambdas must follow new composable name\n    text=re.sub(r'return@(Button|OutlinedButton|TextButton)\\b','return@LabeledIconAction',text)\n    return text,len(reps)\n\n# convert raw IconButton ----------------------------------------------------\ndef convert_iconbuttons(text):\n    pat=re.compile(r'\\bIconButton\\s*\\(');pos=0;reps=[]\n    while True:\n        m=pat.search(text,pos)\n        if not m:break\n        p=text.find('(',m.start())\n        try:q=matching(text,p,'(',')')\n        except:pos=m.end();continue\n        j=q+1\n        while j<len(text) and text[j].isspace():j+=1\n        if j>=len(text) or text[j]!='{':pos=q+1;continue\n        try:b=matching(text,j,'{','}')\n        except:pos=q+1;continue\n        args=text[p+1:q];body=text[j+1:b]\n        on=named_arg(args,'onClick')\n        if on is None:\n            ps=split_top(args)\n            if ps and '=' not in ps[0]:on=ps[0]\n        if on is None:pos=b+1;continue\n        enabled=named_arg(args,'enabled')\n        modifier=named_arg(args,'modifier')\n        icon=existing_icon_name(body) or 'TouchApp'\n        label=content_desc_expr(body) or label_for_icon(icon)\n        # visibility controls must explicitly name their dual behavior\n        if icon in ('Visibility','VisibilityOff') and ('password' in on.lower() or 'visible' in on.lower() or 'show' in on.lower()):label='\"إظهار/إخفاء\"'\n        parts=[f'label = {label}',f'onClick = {on}']\n        # preserve only useful layout modifiers; hard size clips the label\n        if modifier and any(x in modifier for x in ('.weight(','.fillMaxWidth(','.widthIn(')):parts.append(f'modifier = {modifier}')\n        if enabled:parts.append(f'enabled = {enabled}')\n        # preserve original icon body, which may use dynamic icon expressions\n        new='LabeledIconAction(' + ', '.join(parts) + ') {'+body+'}'\n        reps.append((m.start(),b+1,new));pos=b+1\n    for a,b,r in reversed(reps):text=text[:a]+r+text[b:]\n    text=re.sub(r'return@IconButton\\b','return@LabeledIconAction',text)\n    return text,len(reps)\n\n# Switch -------------------------------------------------------------------\ndef toggle_click(change,checked):\n    change=change.strip()\n    if change.startswith('{') and change.endswith('}'):\n        inner=change[1:-1].strip()\n        inner=re.sub(r'\\bit\\b',f'!({checked})',inner)\n        return '{ '+inner+' }'\n    return '{ '+change+f'(!({checked}))'+' }'\n\ndef convert_switches(text):\n    pat=re.compile(r'\\bSwitch\\s*\\(');pos=0;reps=[]\n    while True:\n        m=pat.search(text,pos); \n        if not m:break\n        p=text.find('(',m.start())\n        try:q=matching(text,p,'(',')')\n        except:pos=m.end();continue\n        args=text[p+1:q]\n        checked=named_arg(args,'checked') or 'false';change=named_arg(args,'onCheckedChange')\n        enabled=named_arg(args,'enabled')\n        if not change:pos=q+1;continue\n        onclick=toggle_click(change,checked)\n        label=f'if ({checked}) \"مفعّل\" else \"غير مفعّل\"'\n        new=f'LabeledIconAction(label = {label}, onClick = {onclick}' + (f', enabled = {enabled}' if enabled else '') + f') {{ Icon(if ({checked}) Icons.Default.CheckCircle else Icons.Default.Block, contentDescription = null) }}'\n        reps.append((m.start(),q+1,new));pos=q+1\n    for a,b,r in reversed(reps):text=text[:a]+r+text[b:]\n    return text,len(reps)\n\n# FilterChip ---------------------------------------------------------------\ndef convert_filterchips(text):\n    pat=re.compile(r'\\bFilterChip\\s*\\(');pos=0;reps=[]\n    while True:\n        m=pat.search(text,pos)\n        if not m:break\n        p=text.find('(',m.start())\n        try:q=matching(text,p,'(',')')\n        except:pos=m.end();continue\n        args=text[p+1:q];on=named_arg(args,'onClick');selected=named_arg(args,'selected') or 'false';modifier=named_arg(args,'modifier')\n        lab=named_arg(args,'label') or '{}'\n        # label is a lambda { Text(expr...) }\n        label=first_text_expr(lab[1:-1] if lab.strip().startswith('{') else lab) or '\"تصفية\"'\n        if on:\n            new=f'LabeledIconAction(label = {label}, onClick = {on}' + (f', modifier = {modifier}' if modifier else '') + f') {{ Icon(if ({selected}) Icons.Default.CheckCircle else Icons.Default.Tune, contentDescription = null) }}'\n            reps.append((m.start(),q+1,new))\n        pos=q+1\n    for a,b,r in reversed(reps):text=text[:a]+r+text[b:]\n    return text,len(reps)\n\n# clickable Card/Surface ---------------------------------------------------\ndef remove_clickable_from_modifier(mod):\n    # Returns cleaned modifier and discovered click expression, if any.\n    i=0\n    while True:\n        m=re.search(r'\\.clickable\\s*',mod[i:])\n        if not m:return mod,None\n        a=i+m.start(); j=i+m.end()\n        if j<len(mod) and mod[j]=='(':\n            q=matching(mod,j,'(',')'); arg=mod[j+1:q]\n            on=named_arg(arg,'onClick')\n            if on is None:\n                ps=split_top(arg); on=ps[0] if ps else None\n            return mod[:a]+mod[q+1:],on\n        if j<len(mod) and mod[j]=='{':\n            q=matching(mod,j,'{','}'); return mod[:a]+mod[q+1:], '{'+mod[j+1:q]+'}'\n        i=j\n\ndef inject_action_into_content(content,action):\n    # Put action into first root Column/Row/Box lambda, preserving visual information card.\n    for layout in ('Column','Row','Box'):\n        m=re.search(rf'\\b{layout}\\s*\\(',content)\n        if m:\n            p=content.find('(',m.start())\n            try:q=matching(content,p,'(',')')\n            except:continue\n            j=q+1\n            while j<len(content) and content[j].isspace():j+=1\n            if j<len(content) and content[j]=='{':\n                try:b=matching(content,j,'{','}')\n                except:continue\n                return content[:b]+'\\n            '+action+'\\n        '+content[b:]\n    return 'Column(horizontalAlignment = Alignment.CenterHorizontally) {\\n'+content+'\\n'+action+'\\n}'\n\ndef convert_clickable_surfaces(text):\n    names=('Card','Surface','ElevatedCard','OutlinedCard')\n    # rescan/rewrite one at a time because offsets change\n    total=0;start=0\n    while True:\n        found=None\n        for name in names:\n            m=re.search(rf'\\b{name}\\s*\\(',text[start:])\n            if m:\n                pos=start+m.start()\n                if found is None or pos<found[0]:found=(pos,name)\n        if found is None:break\n        pos,name=found;p=text.find('(',pos)\n        try:q=matching(text,p,'(',')')\n        except:start=pos+len(name);continue\n        args=text[p+1:q]\n        on=named_arg(args,'onClick'); enabled=named_arg(args,'enabled')\n        modifier=named_arg(args,'modifier')\n        cleaned_mod=modifier;click_mod=None\n        if modifier and '.clickable' in modifier:\n            try:cleaned_mod,click_mod=remove_clickable_from_modifier(modifier)\n            except Exception:click_mod=None\n        click=on or click_mod\n        if not click:\n            start=q+1;continue\n        # trailing content lambda required\n        j=q+1\n        while j<len(text) and text[j].isspace():j+=1\n        if j>=len(text) or text[j]!='{':start=q+1;continue\n        try:b=matching(text,j,'{','}')\n        except:start=q+1;continue\n        # rebuild args as non-clickable card/surface\n        parts=[]\n        for a in split_top(args):\n            if re.match(r'onClick\\s*=',a,re.S) or re.match(r'enabled\\s*=',a,re.S):continue\n            if re.match(r'modifier\\s*=',a,re.S) and cleaned_mod is not None:\n                parts.append('modifier = '+cleaned_mod.strip())\n            else:parts.append(a)\n        newargs=',\\n        '.join(parts)\n        content=text[j+1:b]\n        action='LabeledIconAction(label = \"فتح\", onClick = '+click+((', enabled = '+enabled) if enabled else '')+') { Icon(Icons.Default.Visibility, contentDescription = null) }'\n        newcontent=inject_action_into_content(content,action)\n        replacement=name+'(\\n        '+newargs+'\\n    ) {'+newcontent+'}'\n        text=text[:pos]+replacement+text[b+1:]\n        total+=1;start=pos+len(replacement)\n    return text,total\n\n# Perform ------------------------------------------------------------------\nhelper_path=SRC/'com/example/ui/LabeledIconAction.kt'\nhelper_path.write_text(HELPER)\n\ntotals={'buttons':0,'iconbuttons':0,'switches':0,'filterchips':0,'clickables':0}\nfor f in sorted(SRC.rglob('*.kt')):\n    if f==helper_path:continue\n    old=f.read_text()\n    t,n=convert_buttons(old);totals['buttons']+=n\n    t,n=convert_iconbuttons(t);totals['iconbuttons']+=n\n    t,n=convert_switches(t);totals['switches']+=n\n    t,n=convert_filterchips(t);totals['filterchips']+=n\n    t,n=convert_clickable_surfaces(t);totals['clickables']+=n\n    # normalize label returns if any remained from source transformations\n    t=re.sub(r'return@(Button|OutlinedButton|TextButton|IconButton)\\b','return@LabeledIconAction',t)\n    # clickable imports are now unused by design\n    t=t.replace('import androidx.compose.foundation.clickable\\n','')\n    t=inject_imports(t)\n    if t!=old:f.write_text(t)\n\n# version bump\nbg=ROOT/'app/build.gradle.kts'; b=bg.read_text()\nb=re.sub(r'versionCode\\s*=\\s*\\d+','versionCode = 122',b)\nb=re.sub(r'versionName\\s*=\\s*\"[^\"]+\"','versionName = \"5.42-final-icon-labels-v122\"',b)\nbg.write_text(b)\nprint(totals)\nPYICON\npython3 /tmp/final_iconify_v122.py build_v121\n\ncat > /tmp/refine_v122_action_tiles.py <<'PYREFINE'\nfrom pathlib import Path\nimport sys,re\nroot=Path(sys.argv[1])\n\ndef skipstr(s,i):\n q=s[i]\n if q=='\"' and s.startswith('\"\"\"',i):\n  j=s.find('\"\"\"',i+3);return len(s) if j<0 else j+3\n j=i+1\n while j<len(s):\n  if s[j]=='\\\\':j+=2;continue\n  if s[j]==q:return j+1\n  j+=1\n return len(s)\ndef match(s,i,op,cl):\n d=0;j=i\n while j<len(s):\n  if s[j] in \"\\\"'\":j=skipstr(s,j);continue\n  if s.startswith('//',j):\n   k=s.find('\\n',j);j=len(s) if k<0 else k+1;continue\n  if s.startswith('/*',j):\n   k=s.find('*/',j+2);j=len(s) if k<0 else k+2;continue\n  if s[j]==op:d+=1\n  elif s[j]==cl:\n   d-=1\n   if d==0:return j\n  j+=1\n raise RuntimeError('unmatched')\ndef replace_body(path,name,body):\n s=path.read_text();m=re.search(rf'\\bfun\\s+{re.escape(name)}\\s*\\(',s)\n if not m: raise RuntimeError(f'{name} not found')\n p=s.find('(',m.start());q=match(s,p,'(',')');j=q+1\n while j<len(s) and s[j].isspace():j+=1\n # possible return type before body\n if j<len(s) and s[j]==':':\n  j=s.find('{',j)\n else:\n  j=s.find('{',j)\n b=match(s,j,'{','}')\n s=s[:j]+'{\\n'+body.strip()+'\\n}'+s[b+1:]\n path.write_text(s)\n\nui=root/'app/src/main/java/com/example/ui'\nreplace_body(ui/'DailyServicesNav.kt','Mini3DSwipeServiceCard',r'''\n    LabeledIconAction(\n        label = appText(item.titleAr, item.titleEn),\n        onClick = item.action,\n        modifier = Modifier.width(108.dp)\n    ) {\n        Image(\n            painter = painterResource(item.imageRes),\n            contentDescription = null,\n            modifier = Modifier.size(36.dp),\n            contentScale = ContentScale.Fit\n        )\n    }\n''')\nreplace_body(ui/'OperationsV14Dialog.kt','OperationsSystemCard',r'''\n    LabeledIconAction(\n        label = appText(\"التقارير والحسابات\", \"Reports & Accounts\"),\n        onClick = onClick,\n        modifier = Modifier.fillMaxWidth()\n    ) { Icon(Icons.Default.Assessment, contentDescription = null, tint = OpsPrimary) }\n''')\nreplace_body(ui/'OperationsV14Dialog.kt','OpsMenuCard',r'''\n    LabeledIconAction(label = title, onClick = onClick, modifier = modifier) {\n        Image(\n            painter = painterResource(iconRes),\n            contentDescription = null,\n            modifier = Modifier.size(36.dp),\n            contentScale = ContentScale.Fit\n        )\n    }\n''')\nreplace_body(ui/'OperationsV14Dialog.kt','StaffSummaryCard',r'''\n    LabeledIconAction(\n        label = \"$label • $value\",\n        onClick = onClick,\n        modifier = modifier\n    ) { Icon(if (selected) Icons.Default.CheckCircle else Icons.Default.Tune, contentDescription = null, tint = OpsPrimary) }\n''')\nreplace_body(ui/'CustomerSystemDialog.kt','CustomerSystemCard',r'''\n    LabeledIconAction(\n        label = appText(\"ملفات العملاء\", \"Customer Files\"),\n        onClick = onClick,\n        modifier = Modifier.fillMaxWidth()\n    ) { Icon(Icons.Default.People, contentDescription = null, tint = CustomerPrimary) }\n''')\nreplace_body(ui/'CustomerSystemDialog.kt','CustomerVisualToolCard',r'''\n    LabeledIconAction(label = title, onClick = onClick, modifier = modifier, enabled = enabled && !busy) {\n        if (busy) CircularProgressIndicator(modifier = Modifier.size(24.dp), strokeWidth = 2.dp, color = CustomerPrimary)\n        else Icon(icon, contentDescription = null, tint = CustomerPrimary)\n    }\n''')\nreplace_body(ui/'CustomerSystemDialog.kt','CustomerStatusCard',r'''\n    LabeledIconAction(\n        label = \"$title • $count\",\n        onClick = onClick,\n        modifier = modifier\n    ) { Icon(if (selected) Icons.Default.CheckCircle else icon, contentDescription = null, tint = CustomerPrimary) }\n''')\nreplace_body(ui/'LabOperatorScreen.kt','LabStatusIcon',r'''\n    val active = selected == key\n    LabeledIconAction(\n        label = \"$label • $count\",\n        onClick = { onClick(key) },\n        modifier = modifier\n    ) { Icon(if (active) Icons.Default.CheckCircle else icon, contentDescription = null, tint = accent) }\n''')\nreplace_body(ui/'LabTestsScreen.kt','GlossyServiceCard',r'''\n    LabeledIconAction(label = title, onClick = onClick, modifier = modifier) {\n        Image(\n            painter = painterResource(iconRes),\n            contentDescription = null,\n            modifier = Modifier.size(if (compact) 32.dp else 36.dp),\n            contentScale = ContentScale.Fit\n        )\n    }\n''')\nreplace_body(ui/'LabTestsScreen.kt','OrdersHubIconShortcut',r'''\n    LabeledIconAction(label = title, onClick = onClick, modifier = Modifier.fillMaxWidth()) {\n        Icon(Icons.Default.NotificationsActive, contentDescription = null, tint = Color(0xFF167A8B), modifier = Modifier.size(34.dp))\n    }\n''')\nreplace_body(ui/'LabTestsScreen.kt','StaffSecondaryActionCard',r'''\n    LabeledIconAction(label = title, onClick = onClick, modifier = Modifier.fillMaxWidth()) {\n        Image(painter = painterResource(iconRes), contentDescription = null, modifier = Modifier.size(36.dp), contentScale = ContentScale.Fit)\n    }\n''')\nreplace_body(ui/'LabTestsScreen.kt','HomeServiceIconShortcut',r'''\n    LabeledIconAction(\n        label = if (locked) \"$title \U0001F512\" else title,\n        onClick = onClick,\n        modifier = modifier\n    ) {\n        Image(painter = painterResource(iconRes), contentDescription = null, modifier = Modifier.size(36.dp), contentScale = ContentScale.Fit)\n    }\n''')\nreplace_body(ui/'LabTestsScreen.kt','BottomUtilityCard',r'''\n    LabeledIconAction(\n        label = if (locked) \"$title \U0001F512\" else title,\n        onClick = onClick,\n        modifier = modifier\n    ) {\n        Image(painter = painterResource(imageRes), contentDescription = null, modifier = Modifier.size(36.dp), contentScale = ContentScale.Fit)\n    }\n''')\nreplace_body(ui/'LabTestsScreen.kt','WorkspaceMoreButton',r'''\n    LabeledIconAction(label = title, onClick = onClick, modifier = Modifier.fillMaxWidth()) {\n        Icon(icon, contentDescription = null, tint = Color(0xFF167A8B))\n    }\n''')\nreplace_body(ui/'LabTestsScreen.kt','ManagerHomeActionCard',r'''\n    LabeledIconAction(label = title, onClick = onClick, modifier = modifier) {\n        Icon(icon, contentDescription = null, tint = accent)\n    }\n''')\nreplace_body(ui/'LabTestsScreen.kt','ManagerDashboardCard',r'''\n    LabeledIconAction(\n        label = tr(\"لوحة تحكم المدير\", \"Manager Dashboard\"),\n        onClick = onClick,\n        modifier = Modifier.fillMaxWidth()\n    ) { Icon(Icons.Default.Tune, contentDescription = null, tint = Color(0xFF6D28D9)) }\n''')\nprint('refined action tiles')\nPYREFINE\npython3 /tmp/refine_v122_action_tiles.py build_v121\n"
    - name: Audit every Android action before build
      shell: bash
      run: "set -euo pipefail\npython3 <<'PYAUDIT'\nfrom pathlib import Path\nimport re\nr=Path('build_v121')\nsrc=r/'app/src/main/java'\nfiles=list(src.rglob('*.kt'))\nallkt='\\n'.join(p.read_text(errors='ignore') for p in files)\ngrad=(r/'app/build.gradle.kts').read_text()\n\nchecks={\n  'V122 version':'versionCode = 122' in grad and '5.42-final-icon-labels-v122' in grad,\n  'labeled icon helper':(src/'com/example/ui/LabeledIconAction.kt').exists(),\n  'no Button/OutlinedButton/TextButton':not re.search(r'\\b(Button|OutlinedButton|TextButton)\\s*\\(',allkt),\n  'no Switch':not re.search(r'\\bSwitch\\s*\\(',allkt),\n  'no FilterChip':not re.search(r'\\bFilterChip\\s*\\(',allkt),\n  'no clickable modifier':not re.search(r'\\.clickable\\s*\\(',allkt),\n  'result download preserved':'saveResultToDownloads' in allkt and 'MediaStore.Downloads.EXTERNAL_CONTENT_URI' in allkt,\n  'result share preserved':'fun shareResult' in allkt and 'Intent.ACTION_SEND' in allkt,\n  'result revision preserved':'requestResultRevision' in allkt and 'result_revision_requested' in allkt,\n  'mobile notifications preserved':'class OrderRealtimeNotificationService' in allkt and 'وصلت نتيجة التحاليل' in allkt and 'طلب تعديل نتيجة' in allkt,\n}\nfor p in files:\n    if p.name == 'LabeledIconAction.kt':\n        continue\n    if re.search(r'\\bIconButton\\s*\\(',p.read_text(errors='ignore')):\n        checks['no raw IconButton outside helper']=False\n        break\nelse:\n    checks['no raw IconButton outside helper']=True\n\n# Every action has an explicit label parameter. Calls are counted line-wise because\n# the transformer writes the label in the opening call for all generated controls.\ncount=len(re.findall(r'\\bLabeledIconAction\\s*\\(',allkt))-1\nmissing=[]\nfor p in files:\n    if p.name=='LabeledIconAction.kt': continue\n    s=p.read_text(errors='ignore')\n    for m in re.finditer(r'\\bLabeledIconAction\\s*\\(',s):\n        tail=s[m.start():m.start()+700]\n        if not re.search(r'\\blabel\\s*=',tail):\n            missing.append(f'{p.name}:{s.count(chr(10),0,m.start())+1}')\nchecks['every action has label underneath']=count >= 230 and not missing\n\nfor k,v in checks.items(): print(('OK   ' if v else 'FAIL ')+k)\nprint('Labeled action count:',count)\nif missing: print('Missing labels:',missing)\nbad=[k for k,v in checks.items() if not v]\nif bad: raise SystemExit('V122 FINAL UI AUDIT FAILED: '+', '.join(bad))\nprint('ALL V122 FINAL ICON + LABEL + RESULT + NOTIFICATION CHECKS PASSED')\nPYAUDIT\n"
    - name: Apply V123 bottom bar + simple account recovery
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/apply_v123_final.py <<'PYV123'\nfrom pathlib import Path\nimport re\nroot=Path('build_v121')\n\n# --- version ---\np=root/'app/build.gradle.kts'; s=p.read_text()\ns=re.sub(r'versionCode\\s*=\\s*\\d+','versionCode = 123',s,1)\ns=re.sub(r'versionName\\s*=\\s*\"[^\"]+\"','versionName = \"5.43-simple-recovery-bottombar-v123\"',s,1)\np.write_text(s)\n\n# --- Login: simple recovery guidance only ---\np=root/'app/src/main/java/com/example/ui/LoginScreen.kt'; s=p.read_text()\nif 'import androidx.compose.foundation.layout.Row\\n' not in s:\n    s=s.replace('import androidx.compose.foundation.layout.Column\\n','import androidx.compose.foundation.layout.Column\\nimport androidx.compose.foundation.layout.Row\\n',1)\ns=s.replace('    var passwordVisible by remember { mutableStateOf(false) }\\n','    var passwordVisible by remember { mutableStateOf(false) }\\n    var recoveryMessage by remember { mutableStateOf<String?>(null) }\\n',1)\nneedle='''                        LabeledIconAction(label = \"تسجيل الدخول\", onClick = {\n                                keyboardController?.hide()\n                                onLoginClick(email.trim(), password)\n                            }, modifier = Modifier\n                                .fillMaxWidth()\n                                .height(52.dp)\n                                .testTag(\"login_button\"), enabled = email.isNotBlank() && password.isNotBlank() && !isLoading) { Icon(Icons.Default.Login, contentDescription = null) }\n'''\nassert needle in s, 'login submit marker missing'\nrepl=needle+'''\n\n                        Spacer(modifier = Modifier.height(14.dp))\n                        Row(\n                            modifier = Modifier.fillMaxWidth(),\n                            horizontalArrangement = Arrangement.SpaceEvenly,\n                            verticalAlignment = Alignment.Top\n                        ) {\n                            LabeledIconAction(\n                                label = tr(\"نسيت اسم المستخدم\", \"Forgot username\"),\n                                onClick = { recoveryMessage = tr(\"راجع الإدارة لمعرفة اسم الدخول / البريد المسجل لحسابك.\", \"Contact administration to recover the login email / username registered for your account.\") }\n                            ) {\n                                Icon(Icons.Default.Email, contentDescription = null, tint = Color(0xFF0061A4), modifier = Modifier.size(30.dp))\n                            }\n                            LabeledIconAction(\n                                label = tr(\"نسيت كلمة المرور\", \"Forgot password\"),\n                                onClick = { recoveryMessage = tr(\"راجع الإدارة لإعادة تعيين بيانات الدخول لحسابك.\", \"Contact administration to reset your account login credentials.\") }\n                            ) {\n                                Icon(Icons.Default.LockReset, contentDescription = null, tint = Color(0xFF0061A4), modifier = Modifier.size(30.dp))\n                            }\n                        }\n'''\ns=s.replace(needle,repl,1)\n# insert dialog before final function brace\nend='''        }\n    }\n}\n'''\nidx=s.rfind(end); assert idx>=0\nalert='''        }\n    }\n\n    recoveryMessage?.let { msg ->\n        androidx.compose.material3.AlertDialog(\n            onDismissRequest = { recoveryMessage = null },\n            title = { Text(tr(\"استرجاع الحساب\", \"Account recovery\"), fontWeight = FontWeight.Bold) },\n            text = { Text(msg, textAlign = TextAlign.Center) },\n            confirmButton = {\n                LabeledIconAction(label = tr(\"حسناً\", \"OK\"), onClick = { recoveryMessage = null }) {\n                    Icon(Icons.Default.CheckCircle, contentDescription = null, tint = Color(0xFF0061A4))\n                }\n            }\n        )\n    }\n}\n'''\ns=s[:idx]+alert+s[idx+len(end):]\np.write_text(s)\n\n# --- ViewModel: manager-only credential rotation without email reset/backend ---\np=root/'app/src/main/java/com/example/ui/LabTestsViewModel.kt'; s=p.read_text()\n# hide obsolete profiles after a credential rotation\nold='''                val parsed = snapshot.documents.map { parseUserProfile(it) }.toMutableList()\n'''\nnew='''                val parsed = snapshot.documents\n                    .filter { it.getString(\"credential_replaced_by_uid\").isNullOrBlank() }\n                    .map { parseUserProfile(it) }\n                    .toMutableList()\n'''\nassert old in s, 'loadUsers parser marker missing'\ns=s.replace(old,new,1)\nmarker='''    fun requestUserPinReset(profile: AppUserProfile, onResult: (Boolean, String) -> Unit) {\n'''\nidx=s.find(marker); assert idx>=0\n# insert credential function before requestUserPinReset\nfunc=r'''    /**\n     * V123 backend-free password recovery.\n     * Firebase client SDK cannot change another user's Auth password directly.\n     * To keep the reset inside the already PIN-locked administration area and avoid\n     * email reset links / paid backend services, rotate the user's login credentials:\n     * create a fresh Firebase Auth identity, clone the application profile + approved\n     * devices to it, then disable the old application profile. The old Auth identity\n     * may still authenticate at Firebase, but Firestore activeUser() denies it because\n     * its profile is disabled.\n     */\n    fun resetUserLoginCredentials(\n        profile: AppUserProfile,\n        newPassword: String,\n        onResult: (Boolean, String) -> Unit\n    ) {\n        if (!hasAdminAccess()) {\n            onResult(false, tr(\"الإجراء متاح للمدير فقط\", \"Manager only action\"))\n            return\n        }\n        if (profile.uid == MANAGER_UID || profile.role == \"super_admin\") {\n            onResult(false, tr(\"الحساب الرئيسي لا يتم تغيير بيانات دخوله من هنا\", \"The primary account cannot be rotated here\"))\n            return\n        }\n        if (newPassword.length < 6) {\n            onResult(false, tr(\"كلمة المرور الجديدة لازم تكون 6 خانات على الأقل\", \"New password must be at least 6 characters\"))\n            return\n        }\n\n        val originalEmail = profile.email.trim().lowercase()\n        val at = originalEmail.lastIndexOf('@')\n        if (at <= 0 || at >= originalEmail.length - 1) {\n            onResult(false, tr(\"اسم الدخول الحالي غير صالح\", \"Current login email is invalid\"))\n            return\n        }\n        val localBase = originalEmail.substring(0, at).substringBefore(\"+ak\")\n        val domain = originalEmail.substring(at + 1)\n        val suffix = UUID.randomUUID().toString().replace(\"-\", \"\").take(8)\n        val newLoginEmail = \"$localBase+ak$suffix@$domain\"\n\n        val userRef = privilegedFirestore().collection(USERS_COLLECTION).document(profile.uid)\n        userRef.get(Source.SERVER)\n            .addOnSuccessListener { oldProfileDoc ->\n                if (!oldProfileDoc.exists()) {\n                    onResult(false, tr(\"ملف المستخدم غير موجود\", \"User profile was not found\"))\n                    return@addOnSuccessListener\n                }\n\n                val secondaryApp = try {\n                    FirebaseApp.getInstance(SECONDARY_AUTH_APP)\n                } catch (_: IllegalStateException) {\n                    FirebaseApp.initializeApp(\n                        getApplication<Application>(),\n                        FirebaseApp.getInstance().options,\n                        SECONDARY_AUTH_APP\n                    ) ?: run {\n                        onResult(false, tr(\"تعذر تجهيز إعادة تعيين بيانات الدخول\", \"Unable to initialize credential reset\"))\n                        return@addOnSuccessListener\n                    }\n                }\n                val secondaryAuth = FirebaseAuth.getInstance(secondaryApp)\n                secondaryAuth.createUserWithEmailAndPassword(newLoginEmail, newPassword)\n                    .addOnSuccessListener { authResult ->\n                        val newUid = authResult.user?.uid\n                        if (newUid.isNullOrBlank()) {\n                            secondaryAuth.signOut()\n                            onResult(false, tr(\"تعذر إنشاء بيانات الدخول الجديدة\", \"Unable to create the new login\"))\n                            return@addOnSuccessListener\n                        }\n\n                        userRef.collection(DEVICES_SUBCOLLECTION).get(Source.SERVER)\n                            .addOnSuccessListener { deviceSnapshot ->\n                                val now = System.currentTimeMillis()\n                                val newUserRef = privilegedFirestore().collection(USERS_COLLECTION).document(newUid)\n                                val cloned = oldProfileDoc.data.orEmpty().toMutableMap()\n                                cloned[\"email\"] = newLoginEmail\n                                cloned[\"enabled\"] = profile.enabled\n                                cloned[\"updated_at_ms\"] = now\n                                cloned[\"updated_at\"] = FieldValue.serverTimestamp()\n                                cloned[\"updated_by_uid\"] = currentUid()\n                                cloned[\"credential_rotated_from_uid\"] = profile.uid\n                                cloned[\"credential_rotated_at_ms\"] = now\n                                cloned.remove(\"credential_replaced_by_uid\")\n                                cloned.remove(\"credential_replaced_at_ms\")\n                                cloned.remove(\"pin_reset_requested_at_ms\")\n\n                                privilegedFirestore().runBatch { batch ->\n                                    batch.set(newUserRef, cloned)\n                                    batch.set(\n                                        userRef,\n                                        mapOf(\n                                            \"enabled\" to false,\n                                            \"credential_replaced_by_uid\" to newUid,\n                                            \"credential_replaced_at_ms\" to now,\n                                            \"updated_at_ms\" to now,\n                                            \"updated_at\" to FieldValue.serverTimestamp(),\n                                            \"updated_by_uid\" to currentUid()\n                                        ),\n                                        SetOptions.merge()\n                                    )\n                                    deviceSnapshot.documents.forEach { deviceDoc ->\n                                        val copied = deviceDoc.data.orEmpty().toMutableMap()\n                                        copied[\"uid\"] = newUid\n                                        copied[\"email\"] = newLoginEmail\n                                        copied[\"updated_at_ms\"] = now\n                                        copied[\"updated_at\"] = FieldValue.serverTimestamp()\n                                        batch.set(newUserRef.collection(DEVICES_SUBCOLLECTION).document(deviceDoc.id), copied)\n                                    }\n                                }.addOnSuccessListener {\n                                    secondaryAuth.signOut()\n                                    logAudit(\n                                        action = \"user_credentials_rotate\",\n                                        entityType = \"user\",\n                                        entityId = newUid,\n                                        title = tr(\"إعادة تعيين كلمة المرور\", \"Reset password\"),\n                                        details = \"${profile.displayName} • $originalEmail -> $newLoginEmail\"\n                                    )\n                                    loadUsers()\n                                    onResult(\n                                        true,\n                                        tr(\n                                            \"تمت إعادة تعيين بيانات الدخول. اسم الدخول الجديد: $newLoginEmail\",\n                                            \"Login credentials reset. New login email: $newLoginEmail\"\n                                        )\n                                    )\n                                }.addOnFailureListener {\n                                    authResult.user?.delete()?.addOnCompleteListener {\n                                        secondaryAuth.signOut()\n                                        onResult(false, tr(\"تعذر حفظ بيانات الدخول الجديدة وتم التراجع عن العملية\", \"Unable to save the new login; the operation was rolled back\"))\n                                    } ?: run {\n                                        secondaryAuth.signOut()\n                                        onResult(false, tr(\"تعذر حفظ بيانات الدخول الجديدة\", \"Unable to save the new login\"))\n                                    }\n                                }\n                            }\n                            .addOnFailureListener {\n                                authResult.user?.delete()?.addOnCompleteListener {\n                                    secondaryAuth.signOut()\n                                    onResult(false, tr(\"تعذر قراءة أجهزة المستخدم وتم التراجع عن العملية\", \"Unable to read user devices; the operation was rolled back\"))\n                                } ?: run {\n                                    secondaryAuth.signOut()\n                                    onResult(false, tr(\"تعذر قراءة أجهزة المستخدم\", \"Unable to read user devices\"))\n                                }\n                            }\n                    }\n                    .addOnFailureListener { error ->\n                        secondaryAuth.signOut()\n                        onResult(false, error.localizedMessage ?: tr(\"تعذر إنشاء بيانات الدخول الجديدة\", \"Unable to create new login credentials\"))\n                    }\n            }\n            .addOnFailureListener {