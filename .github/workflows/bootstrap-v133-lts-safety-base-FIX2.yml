      run: "set -euo pipefail\nBASE_BRANCH=\"v133-lts-base\"\ncd build_v121\n\n# Never commit signing material or local/build artifacts into the source base.\nrm -f original-signing-key.jks local.properties\nrm -rf .gradle build app/build\nfind . -type f \\( -iname '*.jks' -o -iname '*.keystore' -o -iname '*.p12' -o -iname '*.pfx' \\) -delete\n\n# Basic source safety checks before publishing the immutable base.\ntest -f app/build.gradle.kts\ngrep -q 'versionCode = 133' app/build.gradle.kts\ngrep -q 'applicationId = \"com.aistudio.labtestsdirectory.egypt\"' app/build.gradle.kts\n! grep -RIl --exclude='google-services.json' --exclude='*.md' --exclude='*.txt' -E 'SUPABASE_SERVICE_ROLE_KEY|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' . | grep -q .\n\ngit init -q\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit checkout -q -b \"$BASE_BRANCH\"\ngit add -A\ngit commit -q -m \"V133 LTS immutable safety base\"\nBASE_COMMIT=\"$(git rev-parse HEAD)\"\necho \"$BASE_COMMIT\" > ../V133-LTS-BASE-COMMIT.txt\n\ngit remote add origin \"https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git\"\nif git ls-remote --exit-code --heads origin \"$BASE_BRANCH\" >/dev/null 2>&1; then\n  echo \"::error::Branch $BASE_BRANCH already exists. Refusing to overwrite the immutable safety base.\"\n  exit 1\nfi\ngit push origin \"HEAD:refs/heads/$BASE_BRANCH\"\necho \"Published immutable base: $BASE_BRANCH @ $BASE_COMMIT\"\n"
