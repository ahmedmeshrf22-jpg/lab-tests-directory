name: Windows V145 R8.17 Customer Select + Right Click Menu

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-windows-v145-r817-customer-context
  cancel-in-progress: false

jobs:
  windows-v145-r817:
    name: Windows V145 R8.17 — Customer Select + Right Click
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      BASE_TAG: "v145-r8.16-windows"
      BASE_SOURCE: "Tahalil-Alakkad-V145-R8.16-Windows-Source.zip"
      BASE_SHA256: "cd62b5640159950905a0abca460a5e513e4442c80352e1406826ee9c6c50f0b0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore exact R8.16 source and lock protected files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $zip = Join-Path $PWD $env:BASE_SOURCE
          if (Test-Path $zip) { Remove-Item $zip -Force }

          gh release download $env:BASE_TAG --repo "$env:GITHUB_REPOSITORY" --pattern $env:BASE_SOURCE --dir $PWD
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $zip)) {
            throw 'Could not download exact R8.16 source release'
          }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:BASE_SHA256) {
            throw "R8.16 source hash mismatch: $hash"
          }

          $root = Join-Path $PWD 'build_windows/windows-system'
          if (Test-Path (Join-Path $PWD 'build_windows')) {
            Remove-Item (Join-Path $PWD 'build_windows') -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path $zip -DestinationPath $root -Force

          foreach ($required in @(
            'package.json',
            'src/app.js',
            'src/styles.css',
            'src/data.js',
            'src/firebase.js',
            'src/v145r8-parity.js',
            'electron/main.cjs',
            'electron/preload.cjs'
          )) {
            if (!(Test-Path (Join-Path $root $required))) { throw "R8.16 source missing: $required" }
          }

          $locked = @{
            R817_DATA_SHA256     = (Get-FileHash (Join-Path $root 'src/data.js') -Algorithm SHA256).Hash.ToLowerInvariant()
            R817_FIREBASE_SHA256 = (Get-FileHash (Join-Path $root 'src/firebase.js') -Algorithm SHA256).Hash.ToLowerInvariant()
            R817_PARITY_SHA256   = (Get-FileHash (Join-Path $root 'src/v145r8-parity.js') -Algorithm SHA256).Hash.ToLowerInvariant()
            R817_MAIN_SHA256     = (Get-FileHash (Join-Path $root 'electron/main.cjs') -Algorithm SHA256).Hash.ToLowerInvariant()
            R817_PRELOAD_SHA256  = (Get-FileHash (Join-Path $root 'electron/preload.cjs') -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          foreach ($pair in $locked.GetEnumerator()) { "$($pair.Key)=$($pair.Value)" | Add-Content $env:GITHUB_ENV }

      - name: Apply R8.17 customer interaction patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'

          $patcher = @'
          from pathlib import Path
          import base64, json, re, sys

          root = Path(sys.argv[1])
          app_path = root / 'src' / 'app.js'
          css_path = root / 'src' / 'styles.css'
          pkg_path = root / 'package.json'

          app = app_path.read_text(encoding='utf-8-sig')
          css = css_path.read_text(encoding='utf-8-sig')

          if 'TAH_CUSTOMER_ROW_CONTEXT_R817' in app or 'TAH_CUSTOMER_ROW_CONTEXT_R817' in css:
              raise SystemExit('R8.17 already installed')

          new_func = base64.b64decode('').decode('utf-8')
          css_patch = base64.b64decode('').decode('utf-8')

          pattern = r"async function customersPage\(c\)\{.*?\n\}\n\nasync function visionPage"
          found = re.search(pattern, app, re.S)
          if not found:
              raise SystemExit('customersPage anchor not found')
          app = re.sub(pattern, new_func + '\n\nasync function visionPage', app, count=1, flags=re.S)
          css += css_patch

          pkg = json.loads(pkg_path.read_text(encoding='utf-8-sig'))
          if str(pkg.get('version')) != '145.8.16':
              raise SystemExit(f"Expected exact R8.16 package version, got {pkg.get('version')}")
          pkg['version'] = '145.8.17'
          pkg['description'] = 'Tahalil Alakkad Windows V145 R8.17 - customer row selection and right click menu'

          app_path.write_text(app, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          (root / 'V145_R817_CUSTOMER_CONTEXT_NOTES.txt').write_text(
              'Windows V145 R8.17\n\n'
              '- Left click a customer row to select it; click the same row again to deselect.\n'
              '- Right click opens Edit / Delete / New Tests.\n'
              '- Choosing an action closes the menu and clears the row selection.\n'
              '- Delete is safe archive: the customer disappears from normal list while orders/history remain protected.\n'
              '- Existing R8.16 UI, back arrow, Firebase, timestamp and core behavior preserved.\n',
              encoding='utf-8'
          )
          print('R817_CUSTOMER_CONTEXT_APPLIED')
          '@

          $patcherPath = Join-Path $env:RUNNER_TEMP 'patch_r817.py'
          $patcher | Set-Content $patcherPath -Encoding utf8
          python $patcherPath $root
          if ($LASTEXITCODE -ne 0) { throw 'R8.17 patch failed' }

      - name: Audit R8.17 and protected files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '145.8.17') { throw "Expected 145.8.17, got $($pkg.version)" }

          $app = Get-Content (Join-Path $root 'src/app.js') -Raw
          $css = Get-Content (Join-Path $root 'src/styles.css') -Raw
          foreach ($marker in @(
            'customer-select-row',
            'customerContextMenu',
            'data-action="edit"',
            'data-action="newtests"',
            'data-action="delete"',
            'oncontextmenu',
            'selectedCustomerId=selectedCustomerId===id',
            'TAH_CUSTOMER_ROW_CONTEXT_R817'
          )) {
            if (!($app.Contains($marker) -or $css.Contains($marker))) { throw "Missing R8.17 contract: $marker" }
          }

          $actualData = (Get-FileHash (Join-Path $root 'src/data.js') -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualFirebase = (Get-FileHash (Join-Path $root 'src/firebase.js') -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualParity = (Get-FileHash (Join-Path $root 'src/v145r8-parity.js') -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualMain = (Get-FileHash (Join-Path $root 'electron/main.cjs') -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualPreload = (Get-FileHash (Join-Path $root 'electron/preload.cjs') -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($actualData -ne $env:R817_DATA_SHA256) { throw 'data.js changed - blocked' }
          if ($actualFirebase -ne $env:R817_FIREBASE_SHA256) { throw 'firebase.js changed - blocked' }
          if ($actualParity -ne $env:R817_PARITY_SHA256) { throw 'core parity changed - blocked' }
          if ($actualMain -ne $env:R817_MAIN_SHA256) { throw 'electron/main.cjs changed - blocked' }
          if ($actualPreload -ne $env:R817_PRELOAD_SHA256) { throw 'electron/preload.cjs changed - blocked' }

          node --check (Join-Path $root 'src/app.js')
          if ($LASTEXITCODE -ne 0) { throw 'app.js syntax failed' }

      - name: Package R8.17 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $stage = Join-Path $env:RUNNER_TEMP 'source_stage_r817'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem -LiteralPath $root -Force |
            Where-Object { @('node_modules','release','.git') -notcontains $_.Name } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $stage -Recurse -Force }

          $zip = Join-Path $PWD 'Tahalil-Alakkad-V145-R8.17-Windows-Source.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage,$zip,[System.IO.Compression.CompressionLevel]::Optimal,$false)
          if (!(Test-Path $zip) -or (Get-Item $zip).Length -lt 50000) { throw 'R8.17 source ZIP invalid' }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Tahalil-Alakkad-V145-R8.17-Windows-Source.zip" | Set-Content 'Tahalil-Alakkad-V145-R8.17-Windows-Source.zip.sha256' -Encoding ascii
          Copy-Item (Join-Path $root 'V145_R817_CUSTOMER_CONTEXT_NOTES.txt') 'V145_R817_CUSTOMER_CONTEXT_NOTES.txt' -Force

      - name: Install dependencies
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Build Portable
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Portable startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable) { throw 'Portable EXE missing' }
          $proc = Start-Process -FilePath $portable.FullName -PassThru
          Start-Sleep -Seconds 12
          if ($proc.HasExited) {
            if ($proc.ExitCode -ne 0) { throw "Portable exited with code $($proc.ExitCode)" }
            throw 'Portable exited unexpectedly during smoke test'
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Build Setup
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }

      - name: Prepare R8.17 delivery files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup = Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable -or !$setup) { throw 'Portable or Setup EXE missing' }
          Copy-Item $portable.FullName 'Tahalil-Alakkad-V145-R8.17-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V145-R8.17-Windows-Setup.exe' -Force
          foreach ($name in @(
            'Tahalil-Alakkad-V145-R8.17-Windows-Portable.exe',
            'Tahalil-Alakkad-V145-R8.17-Windows-Setup.exe'
          )) {
            $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Upload R8.17 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V145-R8.17-Windows-Customer-Context
          path: |
            Tahalil-Alakkad-V145-R8.17-Windows-Portable.exe
            Tahalil-Alakkad-V145-R8.17-Windows-Portable.exe.sha256
            Tahalil-Alakkad-V145-R8.17-Windows-Setup.exe
            Tahalil-Alakkad-V145-R8.17-Windows-Setup.exe.sha256
            Tahalil-Alakkad-V145-R8.17-Windows-Source.zip
            Tahalil-Alakkad-V145-R8.17-Windows-Source.zip.sha256
            V145_R817_CUSTOMER_CONTEXT_NOTES.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish Windows V145 R8.17 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v145-r8.17-windows'
          $title = 'تحاليل العقاد Windows V145 R8.17 — Customer Select + Right Click'
          $notes = @'
          Windows V145 R8.17

          - Click a customer row once to select it; click it again to deselect.
          - Right Click opens: Edit customer / Delete customer / New tests.
          - Choosing any action closes the menu and clears selection.
          - Delete is safe archive so orders/history are not lost.
          - All R8.16 fixes remain preserved.
          '@
          $files = @(
            'Tahalil-Alakkad-V145-R8.17-Windows-Portable.exe',
            'Tahalil-Alakkad-V145-R8.17-Windows-Portable.exe.sha256',
            'Tahalil-Alakkad-V145-R8.17-Windows-Setup.exe',
            'Tahalil-Alakkad-V145-R8.17-Windows-Setup.exe.sha256',
            'Tahalil-Alakkad-V145-R8.17-Windows-Source.zip',
            'Tahalil-Alakkad-V145-R8.17-Windows-Source.zip.sha256',
            'V145_R817_CUSTOMER_CONTEXT_NOTES.txt'
          )
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes }
          else { gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create/update R8.17 release' }
          gh release upload $tag @files --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload R8.17 files' }
