name: Build Tahalil Alakkad V121 Icon Only FIX2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android V121 Signed FIX2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract V119 base
        shell: bash
        run: |
          set -euo pipefail
          test -f Project3_AK_V119_CURRENT_FIXES.zip
          rm -rf build_v121
          mkdir build_v121
          unzip -q Project3_AK_V119_CURRENT_FIXES.zip -d build_v121
          test -f build_v121/app/build.gradle.kts

      - name: Apply V120 results and notifications patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/v120.patch
          patch -d build_v121 -p1 < /tmp/v120.patch

      - name: Apply V121 result actions revision patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/v121.patch
          patch -d build_v121 -p1 < /tmp/v121.patch

      - name: Convert entire Android UI to icon-only actions
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/iconify_buttons.py <<'PYICON'
          from pathlib import Path
          import re, sys
          
          ROOT = Path(sys.argv[1]) if len(sys.argv)>1 else Path('.')
          ui = ROOT/'app/src/main/java/com/example/ui'
          
          # Keywords are inspected only from the old visual body, never business logic.
          KEYMAP = [
              (['حذف','مسح نهائي','delete','remove'], 'Delete'),
              (['إلغاء','الغاء','cancel','رفض','reject','إغلاق','اغلاق','close'], 'Close'),
              (['رجوع','back'], 'ArrowBack'),
              (['تسجيل الخروج','خروج','logout','log out'], 'Logout'),
              (['دخول','login','sign in'], 'Login'),
              (['تحديث','refresh','إعادة تحميل','reload'], 'Refresh'),
              (['إضافة','اضافة','add','جديد','new'], 'Add'),
              (['تعديل','edit','تصحيح','revision'], 'Edit'),
              (['مشاركة','share'], 'Share'),
              (['تحميل','download','حفظ الملف'], 'Download'),
              (['رفع','upload'], 'CloudUpload'),
              (['إرسال','ارسال','send'], 'Send'),
              (['حفظ','save'], 'Save'),
              (['اعتماد','approve','تأكيد','تاكيد','confirm','موافق','ok'], 'CheckCircle'),
              (['استرجاع','restore'], 'Restore'),
              (['نسخة احتياطية','backup'], 'Backup'),
              (['فتح','open','عرض','view'], 'Visibility'),
              (['بحث','search'], 'Search'),
              (['التالي','next'], 'ArrowForward'),
              (['السابق','previous'], 'ArrowBack'),
              (['قفل','lock','كلمة المرور','password'], 'Lock'),
              (['طباعة','print'], 'Print'),
              (['كاميرا','camera'], 'CameraAlt'),
              (['صورة','image','photo'], 'Image'),
              (['pdf','ملف'], 'Description'),
              (['تشغيل','start','بدء'], 'PlayArrow'),
              (['إيقاف','ايقاف','stop'], 'Stop'),
          ]
          
          def skip_string(s, i, quote):
              # supports normal and triple quoted Kotlin strings
              if s.startswith(quote*3, i):
                  j=i+3
                  k=s.find(quote*3,j)
                  return len(s) if k<0 else k+3
              j=i+1
              while j < len(s):
                  if s[j]=='\\': j += 2; continue
                  if s[j]==quote: return j+1
                  j += 1
              return len(s)
          
          def matching(s, i, op, cl):
              assert s[i]==op
              depth=0; j=i
              while j < len(s):
                  c=s[j]
                  if c in ('"', "'"):
                      j=skip_string(s,j,c); continue
                  if s.startswith('//',j):
                      k=s.find('\n',j+2); j=len(s) if k<0 else k+1; continue
                  if s.startswith('/*',j):
                      k=s.find('*/',j+2); j=len(s) if k<0 else k+2; continue
                  if c==op: depth += 1
                  elif c==cl:
                      depth -= 1
                      if depth==0: return j
                  j += 1
              raise ValueError(f'unmatched {op} at {i}')
          
          def split_top(s):
              out=[]; start=0; stack=[]; i=0
              pairs={')':'(',']':'[','}':'{'}
              while i<len(s):
                  c=s[i]
                  if c in ('"',"'"):
                      i=skip_string(s,i,c); continue
                  if s.startswith('//',i):
                      k=s.find('\n',i+2); i=len(s) if k<0 else k+1; continue
                  if s.startswith('/*',i):
                      k=s.find('*/',i+2); i=len(s) if k<0 else k+2; continue
                  if c in '([{': stack.append(c)
                  elif c in ')]}' and stack and stack[-1]==pairs[c]: stack.pop()
                  elif c==',' and not stack:
                      out.append(s[start:i].strip()); start=i+1
                  i+=1
              tail=s[start:].strip()
              if tail: out.append(tail)
              return out
          
          def find_named(args,name):
              for a in split_top(args):
                  m=re.match(rf'{re.escape(name)}\s*=\s*(.*)\Z',a,re.S)
                  if m: return m.group(1).strip()
              return None
          
          def choose_icon(body):
              # preserve an explicit existing icon when possible
              m=re.search(r'Icons\.(?:Default|Filled)\.([A-Za-z0-9_]+)', body)
              if m: return m.group(1)
              low=body.lower()
              for keys,icon in KEYMAP:
                  if any(k.lower() in low for k in keys): return icon
              return 'TouchApp'
          
          def convert(text):
              pat=re.compile(r'\b(Button|OutlinedButton|TextButton)\s*\(')
              pos=0; reps=[]
              while True:
                  m=pat.search(text,pos)
                  if not m: break
                  name=m.group(1); p=text.find('(',m.start())
                  try: q=matching(text,p,'(',')')
                  except Exception:
                      pos=m.end(); continue
                  j=q+1
                  while j<len(text) and text[j].isspace(): j+=1
                  # only ordinary trailing-content Material buttons; named content handled separately below
                  if j>=len(text) or text[j]!='{':
                      pos=q+1; continue
                  try: b=matching(text,j,'{','}')
                  except Exception:
                      pos=q+1; continue
                  args=text[p+1:q]
                  on=find_named(args,'onClick')
                  if on is None:
                      # positional onClick first arg
                      parts=split_top(args)
                      if parts and '=' not in parts[0]: on=parts[0]
                  if on is None:
                      pos=b+1; continue
                  enabled=find_named(args,'enabled')
                  body=text[j+1:b]
                  icon=choose_icon(body)
                  newargs=f'onClick = {on}' + (f', enabled = {enabled}' if enabled else '')
                  replacement=f'IconButton({newargs}) {{ Icon(Icons.Default.{icon}, contentDescription = null) }}'
                  reps.append((m.start(),b+1,replacement))
                  pos=b+1
              for a,b,r in reversed(reps): text=text[:a]+r+text[b:]
              return text,len(reps)
          
          total=0; touched=[]
          for f in sorted(ui.glob('*.kt')):
              old=f.read_text()
              new,n=convert(old)
              if n:
                  # Converted buttons may contain labeled returns such as return@Button.
                  # Keep the label aligned with the new composable or Kotlin compilation fails.
                  new=re.sub(r'return@(Button|OutlinedButton|TextButton)\b','return@IconButton',new)
                  # Ensure IconButton and all filled icon extension properties resolve.
                  if 'import androidx.compose.material3.IconButton' not in new:
                      # insert after package + imports start
                      lines=new.splitlines()
                      insert=next((i for i,l in enumerate(lines) if l.startswith('import ')),1)
                      lines.insert(insert,'import androidx.compose.material3.IconButton')
                      new='\n'.join(lines)+('\n' if old.endswith('\n') else '')
                  if 'import androidx.compose.material.icons.filled.*' not in new:
                      lines=new.splitlines()
                      insert=next((i for i,l in enumerate(lines) if l.startswith('import ')),1)
                      lines.insert(insert,'import androidx.compose.material.icons.filled.*')
                      new='\n'.join(lines)+('\n' if old.endswith('\n') else '')
                  f.write_text(new)
                  total+=n; touched.append((f.name,n))
          print('converted',total,'buttons in',len(touched),'files')
          for x in touched: print(x[0],x[1])
          left=[]
          for f in sorted(ui.glob('*.kt')):
              s=f.read_text()
              for m in re.finditer(r'\b(Button|OutlinedButton|TextButton)\s*\(',s): left.append((f.name,m.group(1),s[:m.start()].count('\n')+1))
          print('remaining',len(left))
          for x in left[:50]: print('LEFT',x)
          bad_labels=[]
          for f in sorted(ui.glob('*.kt')):
              txt=f.read_text()
              for m in re.finditer(r'return@(Button|OutlinedButton|TextButton)\b',txt):
                  bad_labels.append((f.name,m.group(0),txt[:m.start()].count('\n')+1))
          if bad_labels:
              print('stale button labels found:',bad_labels[:50])
              raise SystemExit(1)
          PYICON
          python3 /tmp/iconify_buttons.py build_v121
          sed -i 's/5.41-result-actions-notify-v121/5.41-result-actions-icon-only-v121/' build_v121/app/build.gradle.kts

      - name: Restore original Android signing
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_BUNDLE_B64:-}"
          rm -rf /tmp/tahalil_sign
          mkdir -p /tmp/tahalil_sign/files
          printf '%s' "$SIGNING_BUNDLE_B64" | tr -d '\r\n ' | base64 --decode > /tmp/tahalil_sign/bundle.bin
          if unzip -t /tmp/tahalil_sign/bundle.bin >/dev/null 2>&1; then
            unzip -q /tmp/tahalil_sign/bundle.bin -d /tmp/tahalil_sign/files
          else
            cp /tmp/tahalil_sign/bundle.bin /tmp/tahalil_sign/files/original.keystore
          fi
          KEYSTORE="$(find /tmp/tahalil_sign/files -type f \( -iname '*.jks' -o -iname '*.keystore' \) -print -quit)"
          test -n "$KEYSTORE"
          STORE_PASSWORD=""; KEY_ALIAS=""; KEY_PASSWORD=""
          while IFS= read -r META; do
            [ -f "$META" ] || continue
            [ -n "$STORE_PASSWORD" ] || STORE_PASSWORD="$(sed -nE 's/^[[:space:]]*(STORE_PASSWORD|KEYSTORE_PASSWORD|storePassword|store_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(sed -nE 's/^[[:space:]]*(KEY_ALIAS|keyAlias|key_alias)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$(sed -nE 's/^[[:space:]]*(KEY_PASSWORD|keyPassword|key_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
          done < <(find /tmp/tahalil_sign/files -type f \( -iname '*.properties' -o -iname '*.env' -o -iname '*.txt' \) -print)
          if [ -z "$STORE_PASSWORD" ] && keytool -list -keystore "$KEYSTORE" -storepass android >/dev/null 2>&1; then STORE_PASSWORD=android; fi
          test -n "$STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
          test -n "$KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$STORE_PASSWORD"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          cp "$KEYSTORE" build_v121/original-signing-key.jks
          echo "::add-mask::$STORE_PASSWORD"; echo "::add-mask::$KEY_ALIAS"; echo "::add-mask::$KEY_PASSWORD"
          {
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/build_v121/original-signing-key.jks"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Verify V121 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          r=Path('build_v121')
          grad=(r/'app/build.gradle.kts').read_text()
          vm=(r/'app/src/main/java/com/example/ui/LabTestsViewModel.kt').read_text()
          ui=(r/'app/src/main/java/com/example/ui/CustomerSystemDialog.kt').read_text()
          labui=(r/'app/src/main/java/com/example/ui/LabOperatorScreen.kt').read_text()
          store=(r/'app/src/main/java/com/example/backend/FirestoreResultFileStore.kt').read_text()
          service=(r/'app/src/main/java/com/example/notifications/OrderRealtimeNotificationService.kt').read_text()
          checks={
            'version 121':'versionCode = 121' in grad and '5.41-result-actions-icon-only-v121' in grad,
            'download result':'saveResultToDownloads' in store and 'MediaStore.Downloads.EXTERNAL_CONTENT_URI' in store,
            'share result':'fun shareResult' in store and 'Intent.ACTION_SEND' in store,
            'clinic result actions':'downloadResultFile' in ui and 'shareResultFile' in ui and 'requestResultRevision' in vm,
            'revision workflow':'requestResultRevision' in vm and 'result_revision_requested' in vm,
            'lab revision banner':'العيادة طلبت تعديل النتيجة' in labui,
            'external mobile notification':'class OrderRealtimeNotificationService' in service and 'وصلت نتيجة التحاليل' in service and 'طلب تعديل نتيجة' in service,
            'no rules change required':'workflow_status" to "processing"' in vm and '"notes" to mergedNotes' in vm,
            'all actions icon-only': not __import__('re').search(r'\b(Button|OutlinedButton|TextButton)\s*\(', ''.join(p.read_text() for p in (r/'app/src/main/java/com/example/ui').glob('*.kt'))),
          }
          for k,v in checks.items(): print(('OK   ' if v else 'FAIL ')+k)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('V121 checks failed: '+', '.join(bad))
          print('ALL V121 RESULT ACTIONS / REVISION / NOTIFICATION CHECKS PASSED')
          PY

      - name: Build signed Android V121
        working-directory: build_v121
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify signature and prepare release
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build_v121/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"; test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" Tahalil-Alakkad-V121-Android-SIGNED.apk
          sha256sum Tahalil-Alakkad-V121-Android-SIGNED.apk > Tahalil-Alakkad-V121-Android-SIGNED.apk.sha256

      - name: Publish Android V121
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v121
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "تحاليل العقاد V121 Icon-Only + Results + Notifications" --notes "V121: all Android action controls are icon-only with no textual Material buttons. Received results can be opened, downloaded, and shared. Clinic can return a result to the lab for correction with a note and repeat the cycle. Background Android notifications alert clinic when results arrive and lab when a correction is requested. Keeps V119 privacy migration and original Android signing lineage."
          fi
          gh release upload "$TAG" Tahalil-Alakkad-V121-Android-SIGNED.apk Tahalil-Alakkad-V121-Android-SIGNED.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
