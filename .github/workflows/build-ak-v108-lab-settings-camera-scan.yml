name: Build AK V108 LAB SETTINGS CAMERA SCAN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract V108
        run: |
          set -euo pipefail
          rm -rf build_v108
          mkdir build_v108
          unzip -q Project3_AK_V108_LAB_SETTINGS_CAMERA_SCAN_EDIT_FIXED.zip -d build_v108
          test -f build_v108/app/src/main/java/com/example/ui/LabOperatorScreen.kt

      - name: Restore signing
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_BUNDLE_B64:-}"
          rm -rf /tmp/tahalil_sign
          mkdir -p /tmp/tahalil_sign/files
          printf '%s' "$SIGNING_BUNDLE_B64" | tr -d '\r\n ' | base64 --decode > /tmp/tahalil_sign/bundle.bin
          if unzip -t /tmp/tahalil_sign/bundle.bin >/dev/null 2>&1; then
            unzip -q /tmp/tahalil_sign/bundle.bin -d /tmp/tahalil_sign/files
          else
            cp /tmp/tahalil_sign/bundle.bin /tmp/tahalil_sign/files/original.keystore
          fi
          KEYSTORE="$(find /tmp/tahalil_sign/files -type f \( -iname '*.jks' -o -iname '*.keystore' \) -print -quit)"
          test -n "$KEYSTORE"
          STORE_PASSWORD=""
          KEY_ALIAS=""
          KEY_PASSWORD=""
          while IFS= read -r META; do
            [ -f "$META" ] || continue
            [ -n "$STORE_PASSWORD" ] || STORE_PASSWORD="$(sed -nE 's/^[[:space:]]*(STORE_PASSWORD|KEYSTORE_PASSWORD|storePassword|store_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(sed -nE 's/^[[:space:]]*(KEY_ALIAS|keyAlias|key_alias)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$(sed -nE 's/^[[:space:]]*(KEY_PASSWORD|keyPassword|key_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
          done < <(find /tmp/tahalil_sign/files -type f \( -iname '*.properties' -o -iname '*.env' -o -iname '*.txt' \) -print)
          if [ -z "$STORE_PASSWORD" ] && keytool -list -keystore "$KEYSTORE" -storepass android >/dev/null 2>&1; then STORE_PASSWORD="android"; fi
          test -n "$STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
          test -n "$KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$STORE_PASSWORD"
          cp "$KEYSTORE" build_v108/original-signing-key.jks
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/build_v108/original-signing-key.jks"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Verify V108 features
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          root=Path("build_v108")
          lab=(root/"app/src/main/java/com/example/ui/LabOperatorScreen.kt").read_text()
          cust=(root/"app/src/main/java/com/example/ui/CustomerSystemDialog.kt").read_text()
          grad=(root/"app/build.gradle.kts").read_text()
          checks={
            "v108": 'versionCode = 108' in grad,
            "lab settings": 'UserSettingsDialog(' in lab and 'Icons.Default.Settings' in lab,
            "camera": 'ActivityResultContracts.TakePicture()' in lab,
            "image/pdf": 'OpenMultipleDocuments()' in lab and 'application/pdf' in lab,
            "document scan": 'GmsDocumentScanning.getClient' in lab and 'RESULT_FORMAT_PDF' in lab,
            "edit order": 'تعديل الطلب نفسه' in cust,
            "no lab prices": not any(x in lab for x in ['customerPrice','discountAmount','paidAmount','remainingAmount']),
          }
          failed=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(("OK   " if v else "FAIL ")+k)
          if failed: raise SystemExit(", ".join(failed))
          PY

      - name: Build signed V108 release
        working-directory: build_v108
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify and upload APK
        run: |
          set -euo pipefail
          APK="$(find build_v108/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" Tahalil-Alakkad-V108-LAB-SETTINGS-CAMERA-SCAN-SIGNED.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V108-LAB-SETTINGS-CAMERA-SCAN-SIGNED
          path: Tahalil-Alakkad-V108-LAB-SETTINGS-CAMERA-SCAN-SIGNED.apk
          if-no-files-found: error
          retention-days: 30
