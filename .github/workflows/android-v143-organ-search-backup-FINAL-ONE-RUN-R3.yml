name: Android V143 Organ Search + Backup Fix FINAL ONE RUN R3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-android-v143-organ-search-backup-final-one-run-r3
  cancel-in-progress: false

jobs:
  build-v143:
    name: Fix organ search + backup permissions + exact sign + release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout old signing repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight V143 delivery destination
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v143-organ-search-backup-final-r3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::Release v143-organ-search-backup-final-r3 already exists; refusing to overwrite an existing delivery.'
            exit 1
          fi
          if git ls-remote --exit-code --heads origin refs/heads/v143-android-organ-search-backup-final-r3-base >/dev/null 2>&1; then
            echo '::error::Source branch v143-android-organ-search-backup-final-r3-base already exists; refusing to overwrite immutable source.'
            exit 1
          fi
          echo 'V143 release tag and immutable source branch are free.'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Resolve exact V142 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          REF='refs/remotes/origin/v142-android-backup-smart-search-ui-base'
          git rev-parse --verify "$REF^{commit}" >/dev/null
          git show "$REF:app/build.gradle.kts" | grep -Fq 'versionCode = 142'
          git show "$REF:app/src/main/java/com/example/data/repository/LabTestRepository.kt" | grep -Fq 'V142 semantic organ/system search'
          rm -rf build_v143
          git worktree add --detach build_v143 "$REF"

          V142_BASE_SHA="$(git -C build_v143 rev-parse HEAD)"
          V142_RULES_SHA="$(sha256sum build_v143/firestore.rules | awk '{print $1}')"
          V142_GOOGLE_SHA="$(sha256sum build_v143/app/google-services.json | awk '{print $1}')"
          test -n "$V142_BASE_SHA" && test -n "$V142_RULES_SHA" && test -n "$V142_GOOGLE_SHA"
          {
            echo "V142_BASE_SHA=$V142_BASE_SHA"
            echo "V142_RULES_SHA=$V142_RULES_SHA"
            echo "V142_GOOGLE_SHA=$V142_GOOGLE_SHA"
          } >> "$GITHUB_ENV"
          echo "Resolved exact V142 source commit: $V142_BASE_SHA"

      - name: Apply V143 organ-search-everywhere fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json, re

          root = Path('build_v143')
          grad = root/'app/build.gradle.kts'
          vmf = root/'app/src/main/java/com/example/ui/LabTestsViewModel.kt'
          asset = root/'app/src/main/assets/lab_tests_android.json'

          # Version bump: install directly over V142.
          g = grad.read_text(encoding='utf-8')
          g, n = re.subn(r'versionCode\s*=\s*142\b', 'versionCode = 143', g, count=1)
          if n != 1:
              raise SystemExit('Expected V142 versionCode marker not found')
          g, n2 = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "5.63-organ-search-everywhere-v143"', g, count=1)
          if n2 != 1:
              raise SystemExit('versionName marker not found')
          grad.write_text(g, encoding='utf-8')

          # Fix grouped/manual/OCR path: never discard semantic matches just because
          # one literal/direct match exists. Smart results are first, then direct,
          # de-duplicated by test id.
          vm = vmf.read_text(encoding='utf-8')
          old = '''                val directMatches = repository.searchTests(q)\n                // V142: a natural/clinical phrase is accepted for each item too.\n                val allMatches = if (directMatches.isNotEmpty()) directMatches else repository.smartSearchTests(q)'''
          new = '''                val directMatches = repository.searchTests(q)\n                val smartMatches = repository.smartSearchTests(q)\n                // V143: semantic organ matches must NEVER be hidden by one literal match.\n                val allMatches = (smartMatches + directMatches).distinctBy { it.id }'''
          if old in vm:
              vm = vm.replace(old, new, 1)
          elif 'val allMatches = (smartMatches + directMatches).distinctBy { it.id }' not in vm:
              raise SystemExit('V142 grouped-search fallback marker not found')
          vmf.write_text(vm, encoding='utf-8')

          tests = json.loads(asset.read_text(encoding='utf-8-sig'))
          if len(tests) != 331:
              raise SystemExit(f'Expected 331 tests, found {len(tests)}')

          # These aliases are written into each related test's search_text so EVERY
          # search surface (including literal/direct search) understands organs.
          organ_rules = [
              (["القلب","قلب","عضلة القلب","عضله القلب","انزيمات القلب","إنزيمات القلب","تحاليل القلب","فحص القلب","اطمن على القلب","اطمئن على القلب","عايز اطمن على القلب","عاوز اطمن على القلب","heart","cardiac","cardiology"],
               ["CK-MB","Troponin I (Qualitative)","Troponin I (Quantitative)","Homocysteine","CRP","LDH (Lactate Dehydrogenase)","Cholesterol","HDL","LDL Cholesterol","Triglyceride"]),
              (["الكبد","كبد","وظائف الكبد","انزيمات الكبد","إنزيمات الكبد","تحاليل الكبد","اطمن على الكبد","اطمئن على الكبد","liver","hepatic"],
               ["ALT (SGPT)","AST (SGOT)","GGT","Alkaline Phosphatase","Bilirubin (Total)","Bilirubin (Direct)","Bilirubin (Indirect)","Albumin","Total Protein","Prothrombin Time & Conc","HBs Ag","HCV Ab","AFP"]),
              (["الكلى","الكليتين","كلى","كلية","وظائف الكلى","تحاليل الكلى","اطمن على الكلى","اطمئن على الكلى","kidney","kidneys","renal"],
               ["Creatinine","Blood Urea","BUN","eGFR","Creatinine Clearance","Albumin/Creatinine Ratio","Micro Albumin Random","Micro Albumin in 24 hrs","Protein in Urine Random","Sodium (Na)","Potassium (K)","Phosphorous","Uric Acid"]),
              (["الغدة الدرقية","الغده الدرقيه","الدرقية","درقية","وظائف الغدة الدرقية","اطمن على الغدة الدرقية","thyroid"],
               ["TSH","T3","T4","Free T3","Free T4","Anti Thyroid Ab","Thyroid Ab (Anti-Microsomal / Peroxidase Ab)"]),
              (["البنكرياس","بنكرياس","وظائف البنكرياس","تحاليل البنكرياس","اطمن على البنكرياس","pancreas","pancreatic"],
               ["Amylase","Amylase in urine","Lipase","Blood Glucose Fasting","Glucose Random","Blood Glucose 2 hrs P.P","Glycated Haemoglobin (HbA1c)","Insulin Level (Fasting)","Insulin (Random)","C-Peptide (Fasting)","C-Peptide (Random)","Homa-IR","Anti Islet Cells Antibody"]),
              (["البروستاتا","بروستاتا","تحاليل البروستاتا","اطمن على البروستاتا","prostate"],
               ["PSA (Total)","PSA (Free)"]),
              (["المبيض","المبايض","مبيض","مبايض","مخزون المبيض","تحاليل المبايض","اطمن على المبايض","ovary","ovaries","ovarian"],
               ["AMH","CA 125","FSH","LH","Estradiol (E2)","Progesterone"]),
              (["الرحم","رحم","عنق الرحم","تحاليل الرحم","اطمن على الرحم","uterus","uterine","cervix","cervical"],
               ["Beta HCG Quantitative","Progesterone","Estradiol (E2)","FSH","LH","CA 125","Cervical Swab C/S"]),
              (["الغدة النخامية","الغده النخاميه","النخامية","النخاميه","نخامية","pituitary"],
               ["ACTH AM","ACTH PM","FSH","LH","PRL","Growth Hormone (Basal)","Insulin Like Growth Factor-1 (IGF-1)","TSH"]),
              (["الغدة الكظرية","الغده الكظريه","الكظرية","الكظريه","كظرية","adrenal"],
               ["Cortisol AM","Cortisol PM","Cortisol Random","ACTH AM","ACTH PM","Aldosterone","Aldosterone / Renin Ratio","DHEA","DHEA-S"]),
              (["العظام","عظام","صحة العظام","تحاليل العظام","اطمن على العظام","bone","bones"],
               ["Vit D3 (25 Hydroxycholecalciferol)","Calcium (Total)","Calcium (Ionized)","Phosphorous","PTH","Alkaline Phosphatase"]),
              (["العضلات","عضلات","عضلة","عضله","تحاليل العضلات","muscle","muscles"],
               ["CK Total","LDH (Lactate Dehydrogenase)","AST (SGOT)"]),
              (["المعدة","المعده","معدة","معده","تحاليل المعدة","جرثومة المعدة","اطمن على المعدة","stomach","gastric"],
               ["H. Pylori IgG","H. Pylori IgM","H. Pylori Ag (in stool)","Gastrin Level"]),
              (["القولون","قولون","الأمعاء","الامعاء","أمعاء","امعاء","تحاليل القولون","اطمن على القولون","colon","bowel","intestine","intestinal"],
               ["Calprotectin in Stool","Occult Blood in Stool","CEA","Stool Analysis","Stool C/S"]),
              (["الرئة","الرئه","الرئتين","رئة","رئه","التنفس","الجهاز التنفسي","تحاليل الرئة","اطمن على الرئة","lung","lungs","pulmonary","respiratory"],
               ["D-Dimer","Alpha 1 Antitrypsin (Serum)","Sputum C/S","Acid Fast Bacilli (Sputum)","T.B Gold (QuantiFERON)","T.B DNA by PCR","IgE Specific (Inhalant Allergens) RAST"]),
              (["الثدي","ثدي","تحاليل الثدي","اطمن على الثدي","breast"],
               ["CA 15.3","PRL"]),
              (["الخصية","الخصيه","الخصيتين","خصية","خصيه","تحاليل الخصية","اطمن على الخصية","testis","testicle","testicular","male fertility"],
               ["Testosterone Total","Testosterone Free","FSH","LH","Semen Analysis","Semen Analysis with CASA","Semen C/S","Fructose In Semen","Anti Sperm Ab (Semen)"]),
          ]

          by_name = {str(t.get('english_name','')).strip().casefold(): t for t in tests}
          touched = set()
          missing = []
          for aliases, targets in organ_rules:
              for target in targets:
                  t = by_name.get(target.casefold())
                  if not t:
                      missing.append(target)
                      continue
                  st = str(t.get('search_text','')).strip()
                  parts = [part.strip() for part in st.split('|') if part.strip()]
                  seen = {part.casefold() for part in parts}
                  for alias in aliases:
                      if alias.casefold() not in seen:
                          parts.append(alias)
                          seen.add(alias.casefold())
                  t['search_text'] = ' | '.join(parts)
                  touched.add(t.get('id'))

          # Heart is the acceptance-critical requirement: all 10 must exist and be searchable by القلب.
          heart_targets = organ_rules[0][1]
          for name in heart_targets:
              t = by_name.get(name.casefold())
              if not t:
                  raise SystemExit(f'Heart target missing from catalogue: {name}')
              if 'القلب' not in str(t.get('search_text','')):
                  raise SystemExit(f'Heart direct-search alias missing after patch: {name}')

          asset.write_text(json.dumps(tests, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Organ aliases written into search_text for {len(touched)} catalogue entries')
          if missing:
              raise SystemExit('Required organ-search targets missing from 331-test catalogue: ' + ', '.join(sorted(set(missing))))
          PY

