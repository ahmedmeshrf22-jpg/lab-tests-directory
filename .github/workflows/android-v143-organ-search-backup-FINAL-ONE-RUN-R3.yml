      - name: Deep audit V143 + full V142 preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess

          root=Path('build_v143')
          src=root/'app/src/main/java'
          grad=(root/'app/build.gradle.kts').read_text(encoding='utf-8')
          vm=(src/'com/example/ui/LabTestsViewModel.kt').read_text(encoding='utf-8')
          repo=(src/'com/example/data/repository/LabTestRepository.kt').read_text(encoding='utf-8')
          login=(src/'com/example/ui/LoginScreen.kt').read_text(encoding='utf-8')
          ops=(src/'com/example/ui/OperationsV14Dialog.kt').read_text(encoding='utf-8')
          storage=(src/'com/example/util/AutoBackupStorage.kt').read_text(encoding='utf-8')
          sched=(src/'com/example/notifications/AutoBackupScheduler.kt').read_text(encoding='utf-8')
          main=(src/'com/example/MainActivity.kt').read_text(encoding='utf-8')
          backup=(src/'com/example/util/CommercialBackupManager.kt').read_text(encoding='utf-8')
          result_store=(src/'com/example/backend/FirestoreResultFileStore.kt').read_text(encoding='utf-8')
          rules=(root/'firestore.rules').read_text(encoding='utf-8')
          google=(root/'app/google-services.json').read_text(encoding='utf-8')
          tests=json.loads((root/'app/src/main/assets/lab_tests_android.json').read_text(encoding='utf-8'))
          baseline_tests=json.loads(subprocess.check_output(
              ['git','-C',str(root),'show','HEAD:app/src/main/assets/lab_tests_android.json'], text=True
          ))
          allkt='\n'.join(p.read_text(errors='ignore') for p in src.rglob('*.kt'))
          by={t['english_name']:t for t in tests}
          baseline_by_id={int(t['id']):t for t in baseline_tests}

          def without_search_text(t):
              return {k:v for k,v in t.items() if k != 'search_text'}

          catalogue_fields_unchanged = len(baseline_tests)==len(tests) and all(
              int(t['id']) in baseline_by_id and without_search_text(t)==without_search_text(baseline_by_id[int(t['id'])])
              for t in tests
          )
          old_search_preserved = all(
              str(baseline_by_id[int(t['id'])].get('search_text','')).strip() in str(t.get('search_text',''))
              for t in tests if int(t['id']) in baseline_by_id
          )

          heart=["CK-MB","Troponin I (Qualitative)","Troponin I (Quantitative)","Homocysteine","CRP","LDH (Lactate Dehydrogenase)","Cholesterol","HDL","LDL Cholesterol","Triglyceride"]
          organ_min_counts={
            'القلب': 10, 'الكبد': 13, 'الكلى': 13, 'الغدة الدرقية': 7,
            'البنكرياس': 13, 'البروستاتا': 2, 'المبايض': 6, 'الرحم': 7,
            'الغدة النخامية': 8, 'الغدة الكظرية': 9, 'العظام': 6,
            'العضلات': 3, 'المعدة': 4, 'القولون': 5, 'الرئة': 7,
            'الثدي': 2, 'الخصية': 9,
          }
          alias_counts={alias: sum(alias in str(t.get('search_text','')) for t in tests) for alias in organ_min_counts}

          checks={
            # exact V143 delta
            'V143 version': 'versionCode = 143' in grad and '5.63-organ-search-everywhere-v143' in grad,
            'same package': 'applicationId = "com.aistudio.labtestsdirectory.egypt"' in grad,
            '331 tests': len(tests)==331 and len(baseline_tests)==331,
            'catalogue ids names prices unchanged': catalogue_fields_unchanged,
            'pre-existing search aliases preserved': old_search_preserved,
            'heart all 10 direct searchable': all(n in by and 'القلب' in by[n].get('search_text','') for n in heart) and alias_counts['القلب']==10,
            'both Troponin I tests': by.get('Troponin I (Qualitative)',{}).get('id')==309 and by.get('Troponin I (Quantitative)',{}).get('id')==310,
            'all organ aliases written': all(alias_counts[k] >= v for k,v in organ_min_counts.items()),
            'direct search reads search_text': all(x in repo for x in ['test.normEnglish','test.normArabic','test.normMarket','test.normSearch']),
            'smart + direct merged': 'val smartMatches = repository.smartSearchTests(q)' in vm and '(smartMatches + directMatches).distinctBy { it.id }' in vm,
            'V142 semantic rules preserved': 'V142 semantic organ/system search' in repo,
            'universal separators preserved': 'universal medical-list tokenizer' in vm and "'+'" in vm and "'•'" in vm and "'|'" in vm,
            'OCR uses same parser': 'val segments = parseQueries(rawText)' in vm,

            # V142 backup/UI/login preservation
            'backup now visible': 'V142_QUICK_BACKUP' in ops and 'نسخة احتياطية الآن' in ops,
            'backup status visible': 'النسخ التلقائي: 4:00 ص' in ops and 'آخر نسخة:' in ops,
            'V134 encrypted exporter active': 'createEncryptedBackupV134' in vm,
            'manual backup enables automatic': 'AutoBackupCredentialStore.savePassword' in vm,
            '4am preserved': 'FOUR_AM_HOUR = 4' in sched,
            'missed backup catchup': 'catchUpIfMissed' in sched and 'AutoBackupScheduler.catchUpIfMissed(this)' in main,
            'latest backup detection': 'latestBackupEpochMillis' in storage and 'latestBackupName' in storage,
            'safe restore preserved': 'if (!snapshot.exists()) missing += write' in backup,
            'backup core server reads': 'db.collection(name).get(Source.SERVER)' in backup,
            'backup core collections remain mandatory': all(x in backup for x in [
                'val labOrders = simple("lab_orders")',
                'val customerPrices = simple("customer_price_overrides")',
                'val labPrices = simple("lab2lab_prices")',
                'val phoneRegistry = simple("phone_registry")',
                'val catalogOverrides = simple("lab_catalog_overrides")',
            ]),
            'backup security collections permission safe': 'fun optionalSecurity(name: String)' in backup and 'optionalSecurity("users")' in backup and 'optionalSecurity("audit_logs")' in backup,
            'backup device archive permission safe': 'securityArchiveWarnings += "devices/$uid:' in backup and 'collection("devices").get(Source.SERVER)' in backup,
            'backup security archive status recorded': 'security_archive_complete' in backup and 'security_archive_warnings' in backup,
            'admin icons enlarged': 'actionSize = 72.dp' in ops and ('actionSize = 60.dp' in ops or 'actionSize = 68.dp' in ops),
            'login care tagline': 'V142_CARE_TAGLINE' in login and all(x in login for x in ['"رعاية"','"تليق"','"بك"']),
            'tagline sequential animation': 'careWordsVisible' in login and 'delay(320)' in login and 'AnimatedVisibility' in login,

            # production behavior / security preservation
            'Firebase project preserved': 'tahalil-alakkad' in google,
            'Firestore rules byte-identical': hashlib.sha256((root/'firestore.rules').read_bytes()).hexdigest() == os.environ.get('V142_RULES_SHA',''),
            'google-services byte-identical': hashlib.sha256((root/'app/google-services.json').read_bytes()).hexdigest() == os.environ.get('V142_GOOGLE_SHA',''),
            'shared catalogue overrides preserved': 'lab_catalog_overrides' in vm and 'applyRemoteCatalogOverride' in repo,
            'Firestore result chunking': 'RAW_CHUNK_BYTES = 420 * 1024' in result_store and 'result_file_chunk' in result_store and 'fsr:' in result_store,
            'result failover preserved': 'tahalil-result-failover' in allkt,
            'reconciliation preserved': 'tahalil-shadow-reconcile' in allkt,
            'offline preserved': 'OfflineAccessVault' in allkt,
            'notifications preserved': 'class OrderRealtimeNotificationService' in allkt,
            'screenshots enabled': 'FLAG_SECURE' not in allkt,
            'overlay defense preserved': 'setHideOverlayWindows(true)' in main,
            'no Firebase Storage client': 'FirebaseStorage' not in allkt and 'firebase-storage' not in grad.lower(),
            'no Cloudflare': 'cloudflare' not in allkt.lower() and 'workers.dev' not in allkt.lower(),
            'no client secrets': all(x not in allkt for x in ['SUPABASE_SERVICE_ROLE_KEY','SUPABASE_SECRET_KEYS','sb_secret_','BEGIN PRIVATE KEY']),
          }
          for k,v in checks.items(): print(('OK   ' if v else 'FAIL ')+k)
          print('Organ alias counts:', alias_counts)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('V143 AUDIT FAILED: '+', '.join(bad))
          print('ALL V143 REQUESTED + V142 PRESERVATION CHECKS PASSED')
          PY

      - name: Prove only the 4 intended source files changed
        shell: bash
        run: |
          set -euo pipefail
          cd build_v143
          git diff --check
          ACTUAL="$(git diff --name-only | sort)"
          EXPECTED="$(printf '%s\n' \
            'app/build.gradle.kts' \
            'app/src/main/assets/lab_tests_android.json' \
            'app/src/main/java/com/example/ui/LabTestsViewModel.kt' \
            'app/src/main/java/com/example/util/CommercialBackupManager.kt' | sort)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo '::error::Unexpected files changed from V142 baseline'
            echo 'Expected:'; printf '%s\n' "$EXPECTED"
            echo 'Actual:'; printf '%s\n' "$ACTUAL"
            exit 1
          fi
          echo 'Only the 4 intended V143 files differ from exact V142 source.'

