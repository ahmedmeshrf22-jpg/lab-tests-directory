name: Build Tahalil Alakkad V139 Final Resilience FIX

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-v139-final-resilience
  cancel-in-progress: false

jobs:
  build-v139:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout verified V138 base
        uses: actions/checkout@v4
        with:
          ref: v138-safe-failover-base
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply V139 final resilience patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/apply_v139.py
          python3 /tmp/apply_v139.py

      - name: Audit V139 final invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          src=Path('app/src/main/java')
          grad=Path('app/build.gradle.kts').read_text()
          main=(src/'com/example/MainActivity.kt').read_text()
          vm=(src/'com/example/ui/LabTestsViewModel.kt').read_text()
          fail=(src/'com/example/resilience/EmergencyFailoverClient.kt').read_text()
          result=(src/'com/example/resilience/ResultFailoverClient.kt').read_text()
          reconcile=(src/'com/example/resilience/ShadowReconciliationClient.kt').read_text()
          store=(src/'com/example/backend/FirestoreResultFileStore.kt').read_text()
          scheduler=(src/'com/example/notifications/AutoBackupScheduler.kt').read_text()
          backup=(src/'com/example/util/CommercialBackupManager.kt').read_text()
          allkt='\n'.join(p.read_text(errors='ignore') for p in src.rglob('*.kt'))

          tracked=subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines()
          changed={x.strip() for x in tracked+untracked if x.strip()}
          allowed={
              'app/build.gradle.kts',
              'app/src/main/java/com/example/MainActivity.kt',
              'app/src/main/java/com/example/backend/FirestoreResultFileStore.kt',
              'app/src/main/java/com/example/resilience/ResultFailoverClient.kt',
              'app/src/main/java/com/example/resilience/ShadowReconciliationClient.kt',
              'V139_FINAL_RESILIENCE_NOTES.txt',
          }

          checks={
              'V139 version':'versionCode = 139' in grad and '5.59-final-resilience-v139' in grad,
              'same package':'applicationId = "com.aistudio.labtestsdirectory.egypt"' in grad,
              'only V139 scope changed':changed == allowed,
              'Firebase remains authoritative':'FirebaseFirestore' in allkt and 'FirebaseAuth' in allkt,
              'V138 database failover preserved':'tahalil-failover-read' in fail and 'entityType = "customer"' in vm and 'entityType = "order"' in vm,
              'result failover endpoint':'tahalil-result-failover' in result,
              'result auth + approved device':'getIdToken(false)' in result and 'getIdToken(true)' in result and 'X-Tahalil-Device' in result,
              'result integrity + size':'X-Tahalil-SHA256' in result and 'MAX_FILE_BYTES = 6 * 1024 * 1024' in result,
              'Firebase result reader still first':'PrimaryV139' in store and 'ResultFailoverClient.open' in store and '!storedRef.startsWith("fsr:")' in store,
              'existing result hardening preserved':'sha256_hex' in store and 'MessageDigest.isEqual' in store and 'Base64.decode' in store and 'MAX_FILE_BYTES' in store,
              'full reconciliation client':'tahalil-shadow-reconcile' in reconcile and 'SUCCESS_INTERVAL_MS = 24L' in reconcile,
              'reconciliation hooked inside approved startup':'ShadowBackupReplicator.start' in main and 'ShadowReconciliationClient.runIfDue' in main,
              'shadow mirror preserved':'tahalil-shadow-mirror' in allkt,
              'V137 4am backup preserved':'FOUR_AM_HOUR = 4' in scheduler and 'Tahalil Alakkad/Backups' in allkt,
              'V137 notifications preserved':'notifyBackupStarted' in allkt and 'notifyBackupCompleted' in allkt,
              'V136 restore feedback preserved':'تم الاسترجاع ✓' in allkt,
              'V135 safe restore preserved':'if (!snapshot.exists()) missing += write' in backup,
              'offline vault preserved':'OfflineAccessVault' in allkt,
              'pending writes preserved':'waitForPendingWrites()' in vm and 'PendingSyncStore' in vm,
              'results + notifications preserved':'saveResultToDownloads' in allkt and 'requestResultRevision' in allkt and 'class OrderRealtimeNotificationService' in allkt,
              'no Supabase secret':all(x not in allkt for x in ['SUPABASE_SERVICE_ROLE_KEY','SUPABASE_SECRET_KEYS','sb_secret_','BEGIN PRIVATE KEY']),
              'no Firebase rules edits':not any('firestore.rules' in x.lower() for x in changed),
              'no Cloudflare':'cloudflare' not in allkt.lower() and 'workers.dev' not in allkt.lower(),
          }
          for k,v in checks.items():
              print(('OK   ' if v else 'FAIL ')+k)
          bad=[k for k,v in checks.items() if not v]
          if bad:
              raise SystemExit('V139 AUDIT FAILED: '+', '.join(bad))
          print('ALL V139 FINAL RESILIENCE CHECKS PASSED')
          PY

      - name: Compile-check V139
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:compileReleaseKotlin

      - name: Publish immutable V139 source branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="v139-final-resilience-base"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/example/MainActivity.kt \
            app/src/main/java/com/example/backend/FirestoreResultFileStore.kt \
            app/src/main/java/com/example/resilience/ResultFailoverClient.kt \
            app/src/main/java/com/example/resilience/ShadowReconciliationClient.kt \
            V139_FINAL_RESILIENCE_NOTES.txt
          git commit -m "V139 final resilience hardening"

          COMMIT_SHA="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch -q origin "$BRANCH"
            LOCAL_TREE="$(git rev-parse HEAD^{tree})"
            REMOTE_TREE="$(git rev-parse FETCH_HEAD^{tree})"
            if [ "$LOCAL_TREE" != "$REMOTE_TREE" ]; then
              echo "::error::Existing $BRANCH differs; refusing to overwrite it."
              exit 1
            fi
            COMMIT_SHA="$(git rev-parse FETCH_HEAD)"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "V139_COMMIT_SHA=$COMMIT_SHA" >> "$GITHUB_ENV"

      - name: Restore original Android signing identity
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_BUNDLE_B64:-}"
          SIGN_DIR="$RUNNER_TEMP/tahalil_v139_signing"
          rm -rf "$SIGN_DIR" && mkdir -p "$SIGN_DIR/files"
          printf '%s' "$SIGNING_BUNDLE_B64" | tr -d '\r\n ' | base64 --decode > "$SIGN_DIR/bundle.bin"

          if unzip -t "$SIGN_DIR/bundle.bin" >/dev/null 2>&1; then
            unzip -q "$SIGN_DIR/bundle.bin" -d "$SIGN_DIR/files"
          else
            cp "$SIGN_DIR/bundle.bin" "$SIGN_DIR/files/original.keystore"
          fi

          KEYSTORE="$(find "$SIGN_DIR/files" -type f \( -iname '*.jks' -o -iname '*.keystore' \) -print -quit)"
          test -n "$KEYSTORE"

          STORE_PASSWORD=""
          KEY_ALIAS=""
          KEY_PASSWORD=""

          while IFS= read -r META; do
            [ -f "$META" ] || continue
            [ -n "$STORE_PASSWORD" ] || STORE_PASSWORD="$(sed -nE 's/^[[:space:]]*(STORE_PASSWORD|KEYSTORE_PASSWORD|storePassword|store_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(sed -nE 's/^[[:space:]]*(KEY_ALIAS|keyAlias|key_alias)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$(sed -nE 's/^[[:space:]]*(KEY_PASSWORD|keyPassword|key_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
          done < <(find "$SIGN_DIR/files" -type f \( -iname '*.properties' -o -iname '*.env' -o -iname '*.txt' \) -print)

          if [ -z "$STORE_PASSWORD" ] && keytool -list -keystore "$KEYSTORE" -storepass android >/dev/null 2>&1; then
            STORE_PASSWORD=android
          fi

          test -n "$STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
          test -n "$KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$STORE_PASSWORD"

          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"

          {
            echo "KEYSTORE_PATH=$KEYSTORE"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Android V139
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" Tahalil-Alakkad-V139-Final-Resilience-Android-SIGNED.apk
          sha256sum Tahalil-Alakkad-V139-Final-Resilience-Android-SIGNED.apk > Tahalil-Alakkad-V139-Final-Resilience-Android-SIGNED.apk.sha256

      - name: Publish V139 private release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v139 >/dev/null 2>&1; then
            echo "::error::Release v139 already exists. Refusing to overwrite it."
            exit 1
          fi
          gh release create v139 \
            Tahalil-Alakkad-V139-Final-Resilience-Android-SIGNED.apk \
            Tahalil-Alakkad-V139-Final-Resilience-Android-SIGNED.apk.sha256 \
            --target "$V139_COMMIT_SHA" \
            --title "تحاليل العقاد V139 — Final Resilience" \
            --notes "V139 closes the final resilience audit: secure role-aware approved-device failover, full Firebase-to-shadow reconciliation, complete result-file shadowing and authenticated result-file fallback. Firebase remains authoritative; V137 encrypted 04:00 backup, V136/V135 restore safety, offline queue/vault, notifications, UI and Firebase Rules remain unchanged."

      - name: Final status
        shell: bash
        run: |
          echo "V139 Final Resilience built, compiled, signed, source-pinned and released."
