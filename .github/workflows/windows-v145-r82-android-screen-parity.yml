          if ($LASTEXITCODE -ne 0) { throw 'Could not create Windows V145 R8.1 release' }
          gh release upload $tag `
            'Tahalil-Alakkad-V145-R8.2-Windows-Portable.exe' `
            'Tahalil-Alakkad-V145-R8.2-Windows-Portable.exe.sha256' `
            'Tahalil-Alakkad-V145-R8.2-Windows-Setup.exe' `
            'Tahalil-Alakkad-V145-R8.2-Windows-Setup.exe.sha256' `
            --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Windows V145 R8.1 files' }

      - name: Final status
