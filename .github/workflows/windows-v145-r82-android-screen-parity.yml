          path: |
            Tahalil-Alakkad-V145-R8.2-Windows-Portable.exe
            Tahalil-Alakkad-V145-R8.2-Windows-Portable.exe.sha256
            Tahalil-Alakkad-V145-R8.2-Windows-Setup.exe
            Tahalil-Alakkad-V145-R8.2-Windows-Setup.exe.sha256
          retention-days: 30

      - name: Publish Windows V145 R8.1 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag='v145-r8.2-windows'
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --repo "$env:GITHUB_REPOSITORY" --yes
            git push origin ":refs/tags/$tag" 2>$null
          }
          gh release create $tag `
