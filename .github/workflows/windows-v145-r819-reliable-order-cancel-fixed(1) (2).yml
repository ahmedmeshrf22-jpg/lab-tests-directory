name: Windows V145 R8.19 Reliable Order Cancel

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-windows-v145-r819-reliable-order-cancel
  cancel-in-progress: false

jobs:
  windows-v145-r819:
    name: Windows V145 R8.19 — Reliable Order Cancel
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      BASE_TAG: "v145-r8.18-windows"
      BASE_SOURCE: "Tahalil-Alakkad-V145-R8.18-Windows-Source.zip"
      BASE_SHA256: "0ef9df4dd395e481bca57ba4435e9d19ccc4302d62841d10453ee452d7a5708a"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore exact R8.18 source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD $env:BASE_SOURCE
          if (Test-Path $zip) { Remove-Item $zip -Force }

          gh release download $env:BASE_TAG --repo "$env:GITHUB_REPOSITORY" --pattern $env:BASE_SOURCE --dir $PWD
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $zip)) { throw 'Could not download exact R8.18 source release' }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:BASE_SHA256) { throw "R8.18 source hash mismatch: $hash" }

          $root = Join-Path $PWD 'build_windows/windows-system'
          if (Test-Path (Join-Path $PWD 'build_windows')) { Remove-Item (Join-Path $PWD 'build_windows') -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path $zip -DestinationPath $root -Force

          foreach ($required in @('package.json','src/app.js','src/styles.css','src/data.js','src/firebase.js','src/v145r8-parity.js','electron/main.cjs','electron/preload.cjs')) {
            if (!(Test-Path (Join-Path $root $required))) { throw "R8.18 source missing: $required" }
          }

          $locked = @{
            R819_FIREBASE_SHA256 = (Get-FileHash (Join-Path $root 'src/firebase.js') -Algorithm SHA256).Hash.ToLowerInvariant()
            R819_PARITY_SHA256   = (Get-FileHash (Join-Path $root 'src/v145r8-parity.js') -Algorithm SHA256).Hash.ToLowerInvariant()
            R819_MAIN_SHA256     = (Get-FileHash (Join-Path $root 'electron/main.cjs') -Algorithm SHA256).Hash.ToLowerInvariant()
            R819_PRELOAD_SHA256  = (Get-FileHash (Join-Path $root 'electron/preload.cjs') -Algorithm SHA256).Hash.ToLowerInvariant()
            R819_STYLES_SHA256   = (Get-FileHash (Join-Path $root 'src/styles.css') -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          foreach ($pair in $locked.GetEnumerator()) { "$($pair.Key)=$($pair.Value)" | Add-Content $env:GITHUB_ENV }

      - name: Apply R8.19 cancel fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $patchPath = Join-Path $env:RUNNER_TEMP 'r819.patch'

          $b64 = @'
          
          '@
          [IO.File]::WriteAllBytes($patchPath,[Convert]::FromBase64String(($b64 -replace '\s','')))

          Push-Location $root
          try {
            git apply --check --ignore-space-change --ignore-whitespace $patchPath
            if ($LASTEXITCODE -ne 0) { throw 'R8.19 patch check failed' }
            git apply --ignore-space-change --ignore-whitespace $patchPath
            if ($LASTEXITCODE -ne 0) { throw 'R8.19 patch apply failed' }
          } finally {
            Pop-Location
          }

          @'
          Windows V145 R8.19
          
          - Order cancellation no longer asks for a reason.
          - One confirmation only, then the order is cancelled immediately.
          - Cancelled order disappears from the visible worklist immediately.
          - Audit/activity/backup follow-up can no longer make a successful cancellation look failed.
          - Lab-side cancellation is hardened when the mirror document is missing.
          - All R8.18 dashboard click-through and R8.17 customer right-click behavior are preserved.
          '@ | Set-Content (Join-Path $root 'V145_R819_RELIABLE_CANCEL_NOTES.txt') -Encoding utf8

      - name: Audit R8.19
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'

          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '145.8.19') { throw "Expected 145.8.19, got $($pkg.version)" }

          $app = Get-Content (Join-Path $root 'src/app.js') -Raw
          $data = Get-Content (Join-Path $root 'src/data.js') -Raw

          foreach ($marker in @(
            'TAH_CANCEL_ORDER_R819',
            "await D.voidOrder(o.customerId,o.id,'')",
            "String(reason||'').trim()||'إلغاء بدون سبب'",
            'Promise.allSettled',
            'b.set(labMirrorRef(order.id)'
          )) {
            if (!($app.Contains($marker) -or $data.Contains($marker))) { throw "Missing R8.19 contract: $marker" }
          }

          if ($app.Contains('سبب إلغاء الطلب') -or $data.Contains("throw new Error('اكتب سبب الإلغاء')")) {
            throw 'Old mandatory cancel-reason flow is still present'
          }

          if ((Get-FileHash (Join-Path $root 'src/firebase.js') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:R819_FIREBASE_SHA256) { throw 'firebase.js changed - blocked' }
          if ((Get-FileHash (Join-Path $root 'src/v145r8-parity.js') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:R819_PARITY_SHA256) { throw 'core parity changed - blocked' }
          if ((Get-FileHash (Join-Path $root 'electron/main.cjs') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:R819_MAIN_SHA256) { throw 'electron/main.cjs changed - blocked' }
          if ((Get-FileHash (Join-Path $root 'electron/preload.cjs') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:R819_PRELOAD_SHA256) { throw 'electron/preload.cjs changed - blocked' }
          if ((Get-FileHash (Join-Path $root 'src/styles.css') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:R819_STYLES_SHA256) { throw 'styles.css changed - blocked' }

          node --check (Join-Path $root 'src/app.js')
          if ($LASTEXITCODE -ne 0) { throw 'app.js syntax failed' }
          node --check (Join-Path $root 'src/data.js')
          if ($LASTEXITCODE -ne 0) { throw 'data.js syntax failed' }

      - name: Package R8.19 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows/windows-system'
          $stage = Join-Path $env:RUNNER_TEMP 'source_stage_r819'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Get-ChildItem -LiteralPath $root -Force |
            Where-Object { @('node_modules','release','.git') -notcontains $_.Name } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $stage -Recurse -Force }

          $zip = Join-Path $PWD 'Tahalil-Alakkad-V145-R8.19-Windows-Source.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage,$zip,[System.IO.Compression.CompressionLevel]::Optimal,$false)

          if (!(Test-Path $zip) -or (Get-Item $zip).Length -lt 50000) { throw 'R8.19 source ZIP invalid' }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Tahalil-Alakkad-V145-R8.19-Windows-Source.zip" | Set-Content 'Tahalil-Alakkad-V145-R8.19-Windows-Source.zip.sha256' -Encoding ascii
          Copy-Item (Join-Path $root 'V145_R819_RELIABLE_CANCEL_NOTES.txt') 'V145_R819_RELIABLE_CANCEL_NOTES.txt' -Force

      - name: Install dependencies
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Build Portable
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Portable startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable) { throw 'Portable EXE missing' }
          $proc = Start-Process -FilePath $portable.FullName -PassThru
          Start-Sleep -Seconds 12
          if ($proc.HasExited) {
            if ($proc.ExitCode -ne 0) { throw "Portable exited with code $($proc.ExitCode)" }
            throw 'Portable exited unexpectedly during smoke test'
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Build Setup
        working-directory: build_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }

      - name: Prepare R8.19 delivery files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup = Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable -or !$setup) { throw 'Portable or Setup EXE missing' }

          Copy-Item $portable.FullName 'Tahalil-Alakkad-V145-R8.19-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V145-R8.19-Windows-Setup.exe' -Force

          foreach ($name in @('Tahalil-Alakkad-V145-R8.19-Windows-Portable.exe','Tahalil-Alakkad-V145-R8.19-Windows-Setup.exe')) {
            $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Upload R8.19 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V145-R8.19-Windows-Reliable-Order-Cancel
          path: |
            Tahalil-Alakkad-V145-R8.19-Windows-Portable.exe
            Tahalil-Alakkad-V145-R8.19-Windows-Portable.exe.sha256
            Tahalil-Alakkad-V145-R8.19-Windows-Setup.exe
            Tahalil-Alakkad-V145-R8.19-Windows-Setup.exe.sha256
            Tahalil-Alakkad-V145-R8.19-Windows-Source.zip
            Tahalil-Alakkad-V145-R8.19-Windows-Source.zip.sha256
            V145_R819_RELIABLE_CANCEL_NOTES.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish Windows V145 R8.19 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v145-r8.19-windows'
          $title = 'تحاليل العقاد Windows V145 R8.19 — Reliable Order Cancel'
          $notes = @'
          Windows V145 R8.19
          
          - Cancel order no longer requires entering a reason.
          - One confirmation only.
          - Cancelled orders disappear immediately from the active worklist.
          - Cancellation commit is no longer reported as failed if Audit/activity/backup follow-up has a problem.
          - Lab cancellation is hardened when the lab mirror document is absent.
          - All previous R8.18 / R8.17 behavior remains preserved.
          '@
          $files = @(
            'Tahalil-Alakkad-V145-R8.19-Windows-Portable.exe',
            'Tahalil-Alakkad-V145-R8.19-Windows-Portable.exe.sha256',
            'Tahalil-Alakkad-V145-R8.19-Windows-Setup.exe',
            'Tahalil-Alakkad-V145-R8.19-Windows-Setup.exe.sha256',
            'Tahalil-Alakkad-V145-R8.19-Windows-Source.zip',
            'Tahalil-Alakkad-V145-R8.19-Windows-Source.zip.sha256',
            'V145_R819_RELIABLE_CANCEL_NOTES.txt'
          )

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes
          } else {
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create/update R8.19 release' }

          gh release upload $tag @files --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload R8.19 files' }
