          if (Test-Path build_v134_windows) { Remove-Item build_v134_windows -Recurse -Force }
          Expand-Archive 'v134-source.zip' 'build_v134_windows' -Force
          if (!(Test-Path 'build_v134_windows/windows-system/package.json')) { throw 'V134 source reconstruction failed' }

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit V134 Android parity and preserved features
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_v134_windows/windows-system'

          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '134.0.0') { throw "Expected V134 package" }

          $tests = Get-Content (Join-Path $root 'public/lab_tests_android.json') -Raw | ConvertFrom-Json
          if ($tests.Count -ne 331) { throw "Expected 331 tests, got $($tests.Count)" }
          if (($tests | Where-Object { $null -ne $_.customer_price }).Count -ne 0) { throw 'Embedded customer prices detected' }

          $app = Get-Content (Join-Path $root 'src/app.js') -Raw
          foreach ($x in @(
            'Unified System V134',
            'Windows System V134',
            'order-history-table',
            'order-mini-icon',
            'guide-hero',
            'guide-detail-grid',
            'مدة النتيجة',
            'settings-card',
            'section-icon-head',
            'login-v134',
            'login-brand-row',
            'login-trust-strip',
            'نسيت اسم المستخدم',
            'نسيت كلمة المرور',
            'runRecoveryProbe',
            'ShadowBackupReplicator',
            'requestResultRevision',
            'resetUserLoginCredentials',
            'customer-choice-row',
            'عميل سابق',
            'عميل جديد'
          )) {
            if (!$app.Contains($x)) { throw "Missing V134 marker: $x" }
          }

          $backup = Get-Content (Join-Path $root 'src/backup.js') -Raw
          if (!$backup.Contains('app_version_code:134')) { throw 'V134 backup code missing' }
          if (!$backup.Contains("app_version_name:'System V134 Windows'")) { throw 'V134 backup name missing' }

          $res = Get-Content (Join-Path $root 'src/resilience.js') -Raw
          if (!$res.Contains('currentMode(){return BackendFailoverMode.FIREBASE_ONLY}')) { throw 'FIREBASE_ONLY missing' }

          $main = Get-Content (Join-Path $root 'electron/main.cjs') -Raw
          foreach ($x in @(
            'OFFLINE_GRACE_MS = 72 * 60 * 60 * 1000',
            'new Tray',
            'requestSingleInstanceLock',
            'sandbox: true',
            'contextIsolation: true',
            'nodeIntegration: false',
            'webSecurity: true'
          )) {
            if (!$main.Contains($x)) { throw "Missing Windows safety marker: $x" }
          }

          $runtime = $app + "`n" + $main + "`n" + (Get-Content (Join-Path $root 'src/data.js') -Raw)
          if ($runtime.ToLower().Contains('cloudflare') -or $runtime.ToLower().Contains('workers.dev')) { throw 'Cloudflare dependency detected' }
          if ($runtime.Contains('sendPasswordResetEmail')) { throw 'Reset email flow must remain disabled' }

          Get-ChildItem (Join-Path $root 'src') -Filter '*.js' -File | ForEach-Object {
            Get-Content $_.FullName -Raw | node --input-type=module --check
            if ($LASTEXITCODE -ne 0) { throw "JS syntax failed: $($_.Name)" }
          }
          node --check (Join-Path $root 'electron/main.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'main.cjs syntax failed' }
          node --check (Join-Path $root 'electron/preload.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'preload.cjs syntax failed' }

          Write-Host 'WINDOWS V134 FINAL UI PASS AUDIT PASSED'

      - name: Install dependencies
        working-directory: build_v134_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Build Portable
        working-directory: build_v134_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Portable startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v134_windows/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$exe) { throw 'Portable EXE not found' }
          $env:TAHALIL_SMOKE_TEST='1'
          $p=Start-Process $exe.FullName -PassThru
          if (!$p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; throw 'Portable smoke timed out' }
          if ($p.ExitCode -ne 0) { throw "Portable smoke exit code $($p.ExitCode)" }
          Remove-Item Env:TAHALIL_SMOKE_TEST -ErrorAction SilentlyContinue

      - name: Portable System Tray smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v134_windows/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $env:TAHALIL_TRAY_SMOKE_TEST='1'
          $p=Start-Process $exe.FullName -PassThru
          if (!$p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; throw 'Tray smoke timed out' }
          if ($p.ExitCode -ne 0) { throw "Tray smoke exit code $($p.ExitCode)" }
          Remove-Item Env:TAHALIL_TRAY_SMOKE_TEST -ErrorAction SilentlyContinue

      - name: Build Setup
        working-directory: build_v134_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }

      - name: Prepare V134 release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_v134_windows/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup = Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable -or !$setup) { throw 'Portable or Setup EXE missing' }

          Copy-Item $portable.FullName 'Tahalil-Alakkad-V134-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V134-Windows-Setup.exe' -Force

          foreach ($name in @('Tahalil-Alakkad-V134-Windows-Portable.exe','Tahalil-Alakkad-V134-Windows-Setup.exe')) {
            if ((Get-Item $name).Length -lt 1000000) { throw "$name unexpectedly small" }
            $hash=(Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Publish directly to Windows V134 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag='v134-windows'
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title "تحاليل العقاد Windows V134 — Final 12 UI Changes" --notes "Windows V134 aligns with Android V134 Final UI Pass. It preserves the V132 customer table/profile and Existing/New Customer flow, preserves V133 expandable analysis details with large price, tube colour and result duration, and improves Order History icon/data layout, Test Guide organization, Settings icon organization and external Login presentation. Firebase remains authoritative; shadow backup, read-only recovery, offline resilience, notifications, results, security, no Cloudflare and no automatic failover are preserved."
            if ($LASTEXITCODE -ne 0) { throw 'Could not create V134 Windows release' }
          }
          gh release upload $tag 'Tahalil-Alakkad-V134-Windows-Portable.exe' 'Tahalil-Alakkad-V134-Windows-Portable.exe.sha256' 'Tahalil-Alakkad-V134-Windows-Setup.exe' 'Tahalil-Alakkad-V134-Windows-Setup.exe.sha256' --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Windows V134 files' }
          gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --latest
