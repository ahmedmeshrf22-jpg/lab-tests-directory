      - name: Deep audit V141 blockers and preserved invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json
          root=Path('.')
          src=root/'app/src/main/java'
          grad=(root/'app/build.gradle.kts').read_text()
          main=(src/'com/example/MainActivity.kt').read_text()
          manifest=(root/'app/src/main/AndroidManifest.xml').read_text()
          paths=(root/'app/src/main/res/xml/file_paths.xml').read_text()
          result=(src/'com/example/resilience/ResultFailoverClient.kt').read_text()
          guard=(src/'com/example/notifications/DeviceApprovalGuard.kt').read_text()
          realtime=(src/'com/example/notifications/OrderRealtimeNotificationService.kt').read_text()
          job=(src/'com/example/notifications/LabOrderBackgroundService.kt').read_text()
          fcm=(src/'com/example/notifications/OrderFirebaseMessagingService.kt').read_text()
          notif=(src/'com/example/notifications/OrderNotificationManager.kt').read_text()
          vm=(src/'com/example/ui/LabTestsViewModel.kt').read_text()
          repo=(src/'com/example/data/repository/LabTestRepository.kt').read_text()
          backup=(src/'com/example/util/CommercialBackupManager.kt').read_text()
          fail=(src/'com/example/resilience/EmergencyFailoverClient.kt').read_text()
          reconcile=(src/'com/example/resilience/ShadowReconciliationClient.kt').read_text()
          store=(src/'com/example/backend/FirestoreResultFileStore.kt').read_text()
          scheduler=(src/'com/example/notifications/AutoBackupScheduler.kt').read_text()
          rules=(root/'firestore.rules').read_text()
          allkt='\n'.join(p.read_text(errors='ignore') for p in src.rglob('*.kt'))
          tests=json.loads((root/'app/src/main/assets/lab_tests_android.json').read_text())
          checks={
            'V141 version': 'versionCode = 141' in grad and '5.61-final-delivery-fix-v141' in grad,
            'same package': 'applicationId = "com.aistudio.labtestsdirectory.egypt"' in grad,
            '331 tests': len(tests)==331,
            'screenshots stay enabled': 'FLAG_SECURE' not in main,
            'overlay defense stays enabled': 'setHideOverlayWindows(true)' in main,
            'result provider authority fixed': 'context.packageName + ".provider"' in result and '.fileprovider' not in result,
            'result failover cache exposed': 'result_failover_cache' in paths and 'path="result_failover/"' in paths,
            'manifest provider matches': 'android:authorities="${applicationId}.provider"' in manifest,
            'result integrity preserved': 'X-Tahalil-SHA256' in result and 'MAX_FILE_BYTES = 6 * 1024 * 1024' in result,
            'background main gate approved only': 'approvedForBackground = currentUser != null && accountEnabled == true && deviceAccessStatus == "approved"' in main,
            'device server guard exists': 'get(Source.SERVER)' in guard and 'status") == "approved"' in guard,
            'realtime server device gate': 'DeviceApprovalGuard.checkServerApproved(this, user)' in realtime,
            'job server device gate': 'DeviceApprovalGuard.checkServerApproved(this, user)' in job,
            'FCM server device gate': 'DeviceApprovalGuard.checkServerApproved(this, user)' in fcm,
            'token server device gate': 'saveTokenIfApproved' in notif and 'DeviceApprovalGuard.checkServerApproved(context, user)' in notif,
            'Android 15/16 dataSync timeout class removed': 'foregroundServiceType="dataSync"' not in manifest and 'FOREGROUND_SERVICE_DATA_SYNC' not in manifest,
            'specialUse FGS declared': 'FOREGROUND_SERVICE_SPECIAL_USE' in manifest and 'foregroundServiceType="specialUse"' in manifest and 'PROPERTY_SPECIAL_USE_FGS_SUBTYPE' in manifest,
            'catalog shared collection': 'CATALOG_OVERRIDES_COLLECTION = "lab_catalog_overrides"' in vm,
            'catalog realtime sync': 'startCatalogOverridesSync()' in vm and 'applyRemoteCatalogOverride' in repo,
            'catalog backup': 'lab_catalog_overrides' in backup,
            'catalog rules': 'match /lab_catalog_overrides/' in rules,
            'bulk prices server backed': 'Unable to save bulk update to server' in vm and 'batch.set(ref' in vm,
            'financial invariant helper': 'function validOrderFinancialState()' in rules,
            'order total invariant': 'total_customer_price == request.resource.data.subtotal_customer_price - request.resource.data.discount_amount' in rules,
            'remaining invariant': 'remaining_amount == request.resource.data.total_customer_price - request.resource.data.paid_amount' in rules,
            'payment identity invariant': 'request.resource.data.customer_id == customerId' in rules and 'request.resource.data.order_id == orderId' in rules,
            'Firebase authoritative': 'FirebaseFirestore' in allkt and 'FirebaseAuth' in allkt,
            'DB failover preserved': 'tahalil-failover-read' in fail and 'entityType = "customer"' in vm and 'entityType = "order"' in vm,
            'result fallback preserved': 'tahalil-result-failover' in result,
            'reconciliation preserved': 'tahalil-shadow-reconcile' in reconcile and 'ShadowReconciliationClient.runIfDue' in main,
            'Firebase result first': 'PrimaryV139' in store and 'ResultFailoverClient.open' in store,
            '4am backup preserved': 'FOUR_AM_HOUR = 4' in scheduler and 'Tahalil Alakkad/Backups' in allkt,
            'safe restore preserved': 'if (!snapshot.exists()) missing += write' in backup,
            'offline vault preserved': 'OfflineAccessVault' in allkt,
            'pending sync preserved': 'waitForPendingWrites()' in vm and 'PendingSyncStore' in vm,
            'notifications preserved': 'class OrderRealtimeNotificationService' in allkt,
            'no Supabase secret in APK': all(x not in allkt for x in ['SUPABASE_SERVICE_ROLE_KEY','SUPABASE_SECRET_KEYS','sb_secret_','BEGIN PRIVATE KEY']),
            'no Cloudflare': 'cloudflare' not in allkt.lower() and 'workers.dev' not in allkt.lower(),
          }
          for k,v in checks.items(): print(('OK   ' if v else 'FAIL ')+k)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('V141 DELIVERY AUDIT FAILED: '+', '.join(bad))
          print('ALL V141 FINAL DELIVERY CHECKS PASSED')
          PY

      - name: Compile-check Android V141
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:compileReleaseKotlin

      - name: Validate V141 Firestore rules source
        shell: bash
        run: |
          set -euo pipefail
          test -s firestore.rules
          grep -q 'validOrderFinancialState' firestore.rules
          grep -q 'validPaymentState' firestore.rules

      - name: Publish immutable V141 Android source branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH='v141-android-final-delivery-base'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add app firestore.rules V141_FINAL_DELIVERY_FIX_NOTES.txt
          git commit -m 'Android V141 final delivery fixes'
          COMMIT_SHA="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch -q origin "$BRANCH"
            test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse FETCH_HEAD^{tree})" || { echo '::error::Existing V141 branch differs'; exit 1; }
            COMMIT_SHA="$(git rev-parse FETCH_HEAD)"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "V141_COMMIT_SHA=$COMMIT_SHA" >> "$GITHUB_ENV"

      - name: Restore original Android signing identity
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TAHALIL_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_BUNDLE_B64:-}"
          SIGN_DIR="$RUNNER_TEMP/tahalil_v141_signing"
          rm -rf "$SIGN_DIR" && mkdir -p "$SIGN_DIR/files"
          printf '%s' "$SIGNING_BUNDLE_B64" | tr -d '\r\n ' | base64 --decode > "$SIGN_DIR/bundle.bin"
          if unzip -t "$SIGN_DIR/bundle.bin" >/dev/null 2>&1; then
            unzip -q "$SIGN_DIR/bundle.bin" -d "$SIGN_DIR/files"
          else
            cp "$SIGN_DIR/bundle.bin" "$SIGN_DIR/files/original.keystore"
          fi
          KEYSTORE="$(find "$SIGN_DIR/files" -type f \( -iname '*.jks' -o -iname '*.keystore' \) -print -quit)"
          test -n "$KEYSTORE"
          STORE_PASSWORD=''; KEY_ALIAS=''; KEY_PASSWORD=''
          while IFS= read -r META; do
            [ -f "$META" ] || continue
            [ -n "$STORE_PASSWORD" ] || STORE_PASSWORD="$(sed -nE 's/^[[:space:]]*(STORE_PASSWORD|KEYSTORE_PASSWORD|storePassword|store_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(sed -nE 's/^[[:space:]]*(KEY_ALIAS|keyAlias|key_alias)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
            [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$(sed -nE 's/^[[:space:]]*(KEY_PASSWORD|keyPassword|key_password)[[:space:]]*[:=][[:space:]]*"?([^"#]+)"?[[:space:]]*$/\2/p' "$META" | head -1 | xargs || true)"
          done < <(find "$SIGN_DIR/files" -type f \( -iname '*.properties' -o -iname '*.env' -o -iname '*.txt' \) -print)
          if [ -z "$STORE_PASSWORD" ] && keytool -list -keystore "$KEYSTORE" -storepass android >/dev/null 2>&1; then STORE_PASSWORD=android; fi
          test -n "$STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
          test -n "$KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$STORE_PASSWORD"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "::add-mask::$STORE_PASSWORD"; echo "::add-mask::$KEY_ALIAS"; echo "::add-mask::$KEY_PASSWORD"
          {
            echo "KEYSTORE_PATH=$KEYSTORE"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Android V141
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --no-parallel --max-workers=2 :app:assembleRelease

      - name: Verify APK signature and same signer as V140
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p "$RUNNER_TEMP/v140apk"
          gh release download v140 --pattern 'Tahalil-Alakkad-V140-Screenshot-Enabled-Android-SIGNED.apk' --dir "$RUNNER_TEMP/v140apk"
          OLD_APK="$RUNNER_TEMP/v140apk/Tahalil-Alakkad-V140-Screenshot-Enabled-Android-SIGNED.apk"
          test -s "$OLD_APK"
          NEW_CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          OLD_CERT="$("$APKSIGNER" verify --print-certs "$OLD_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test -n "$NEW_CERT" && test "$NEW_CERT" = "$OLD_CERT"
          cp "$APK" Tahalil-Alakkad-V141-Final-Delivery-Android-SIGNED.apk
          sha256sum Tahalil-Alakkad-V141-Final-Delivery-Android-SIGNED.apk > Tahalil-Alakkad-V141-Final-Delivery-Android-SIGNED.apk.sha256

      - name: Deploy V141 hardened Firestore rules via Rules API
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" || { echo '::error::FIREBASE_SERVICE_ACCOUNT_JSON secret missing'; exit 1; }
          test -s firestore.rules
          grep -q 'validOrderFinancialState' firestore.rules
          grep -q 'validPaymentState' firestore.rules

          CREDS="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDS"
          chmod 600 "$CREDS"
          export GOOGLE_APPLICATION_CREDENTIALS="$CREDS"

          RULES_DIR="$RUNNER_TEMP/v141-rules-api"
          rm -rf "$RULES_DIR"
          mkdir -p "$RULES_DIR"
          cd "$RULES_DIR"
          npm init -y >/dev/null 2>&1
          npm install firebase-admin@13 --no-audit --no-fund >/dev/null

          FIRESTORE_RULES_PATH="$GITHUB_WORKSPACE/firestore.rules" node <<'NODE'
          const fs = require('node:fs');
          const admin = require('firebase-admin');

          (async () => {
            const rulesPath = process.env.FIRESTORE_RULES_PATH;
            const source = fs.readFileSync(rulesPath, 'utf8');

            if (!source.includes('validOrderFinancialState') || !source.includes('validPaymentState')) {
              throw new Error('V141 hardened rule markers missing');
            }

            admin.initializeApp({
              credential: admin.credential.applicationDefault(),
              projectId: 'tahalil-alakkad'
            });

            const securityRules = admin.securityRules();

            // Direct Firebase Rules API through Admin SDK.
            // This deliberately avoids firebase-tools Service Usage pre-check,
            // which requires serviceusage.services.get and caused the previous 403.
            const released = await securityRules.releaseFirestoreRulesetFromSource(source);
            if (!released || !released.name) {
              throw new Error('Rules API returned no released ruleset name');
            }
            console.log('Released Firestore ruleset:', released.name);

            const active = await securityRules.getFirestoreRuleset();
            if (!active || !active.name) {
              throw new Error('Could not read active Firestore ruleset after deploy');
            }

            let activeSource = '';
            if (Array.isArray(active.source)) {
              activeSource = active.source.map(x => x && x.content ? x.content : '').join('\n');
            } else if (active.source && Array.isArray(active.source.files)) {
              activeSource = active.source.files.map(x => x && x.content ? x.content : '').join('\n');
            } else if (typeof active.source === 'string') {
              activeSource = active.source;
            }

            if (activeSource) {
              if (!activeSource.includes('validOrderFinancialState') ||
                  !activeSource.includes('validPaymentState')) {
                throw new Error('Active Firestore rules do not contain V141 hardened markers');
              }
            }

            console.log('Active Firestore ruleset verified:', active.name);
          })().catch(err => {
            console.error(err && err.stack ? err.stack : err);
            process.exit(1);
          });
          NODE

      - name: Publish Android V141 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v141-android'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Refusing overwrite."
            exit 1
          fi
          gh release create "$TAG" \
            Tahalil-Alakkad-V141-Final-Delivery-Android-SIGNED.apk \
            Tahalil-Alakkad-V141-Final-Delivery-Android-SIGNED.apk.sha256 \
            --target "$V141_COMMIT_SHA" \
            --title 'تحاليل العقاد Android V141 — Final Delivery Fix' \
            --notes 'V141 fixes result failover opening, approved-device background gating, Android 15/16 foreground-service classification, shared Android catalogue overrides, server-backed bulk price updates, encrypted catalogue backup/restore, and Firestore financial invariants. V140 screenshots, Firebase primary data, Supabase failover/reconciliation, notifications, offline vault and original signing identity remain preserved.'

      - name: Final V141 status
        shell: bash
        run: |
          echo 'Android V141 final-delivery fix built, compiled, signed, signer-verified, rules-deployed-via-Rules-API, source-pinned and released.'
