name: Android V141 Final Delivery Fix - Rules API FIX

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-v141-android-final-delivery
  cancel-in-progress: false

jobs:
  build-v141:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout Android V140 verified base
        uses: actions/checkout@v4
        with:
          ref: v140-screenshot-enabled-base
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply locally audited V141 delivery overlay
