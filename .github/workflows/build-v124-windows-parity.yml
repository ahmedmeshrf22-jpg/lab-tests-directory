          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String(($base64 -replace '\s','')))
          if (Test-Path 'build_windows_v124') { Remove-Item 'build_windows_v124' -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath 'build_windows_v124' -Force
          if (!(Test-Path 'build_windows_v124/windows-system/package.json')) { throw 'Invalid Windows V124 ZIP structure' }

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit Windows V124 parity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'build_windows_v124/windows-system'
          $pkg = Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '124.0.0') { throw "Expected 124.0.0, got $($pkg.version)" }

          $tests = Get-Content (Join-Path $root 'public/lab_tests_android.json') -Raw | ConvertFrom-Json
          if ($tests.Count -ne 331) { throw "Expected 331 tests, got $($tests.Count)" }
          if (($tests | Where-Object { $null -ne $_.customer_price }).Count -ne 0) { throw 'Embedded customer prices still present' }

          $app = Get-Content (Join-Path $root 'src/app.js') -Raw
          foreach ($x in @('Unified System V124','نسيت اسم المستخدم','نسيت كلمة المرور','راجع الإدارة لمعرفة اسم الدخول / البريد المسجل لحسابك.','راجع الإدارة لإعادة تعيين بيانات الدخول لحسابك.','<th>الاسم / Email</th>','Reset Password','settingsBottom','sidebottom','homeiconbox','downloadResultUrl','shareResultUrl','إعادة للمعمل للتعديل','watchSharedOrders')) {
            if (!$app.Contains($x)) { throw "Missing V124 app marker: $x" }
          }

          $data = Get-Content (Join-Path $root 'src/data.js') -Raw
          foreach ($x in @('resetUserLoginCredentials','credential_replaced_by_uid','credential_rotated_from_uid','createSecondaryFirebase','requestResultRevision','result_revision_requested','watchSharedOrders')) {
            if (!$data.Contains($x)) { throw "Missing V124 data marker: $x" }
          }
          if ($data.Contains('sendPasswordResetEmail')) { throw 'Email reset flow must remain disabled' }

          $css = Get-Content (Join-Path $root 'src/styles.css') -Raw
          foreach ($x in @('.homeiconbox{width:64px;height:64px','.homeiconbox img{width:54px;height:54px','.sideicon{width:58px;height:58px','font-size:40px')) {
            if (!$css.Contains($x)) { throw "Missing V124 icon sizing: $x" }
          }

          $fb = Get-Content (Join-Path $root 'src/firebase.js') -Raw
          if (!$fb.Contains('browserSessionPersistence')) { throw 'Session-only Firebase Auth persistence missing' }

          $rs = Get-Content (Join-Path $root 'src/resultStore.js') -Raw
          foreach ($x in @('sha256: digest','sha256_hex: digest','meta.sha256 || meta.sha256_hex')) {
            if (!$rs.Contains($x)) { throw "Missing result integrity marker: $x" }
          }

          $preload = Get-Content (Join-Path $root 'electron/preload.cjs') -Raw
          foreach ($x in @('openResultBytes','saveResultBytes','shareResultBytes')) { if (!$preload.Contains($x)) { throw "Missing preload result action: $x" } }

          $main = Get-Content (Join-Path $root 'electron/main.cjs') -Raw
          foreach ($x in @('sandbox: true','contextIsolation: true','nodeIntegration: false','webSecurity: true','allowRunningInsecureContent: false','webviewTag: false','devTools: false','setContentProtection(true)','cleanupResultTemp','will-navigate','TAHALIL_SMOKE_TEST','result:openBytes','result:saveBytes','result:shareBytes')) {
            if (!$main.Contains($x)) { throw "Missing Electron hardening/result marker: $x" }
          }

          $html = Get-Content (Join-Path $root 'index.html') -Raw
          if (!$html.Contains('Content-Security-Policy') -or !$html.Contains("object-src 'none'")) { throw 'CSP missing' }

          $execFiles = @(
            (Join-Path $root 'index.html'),
            (Join-Path $root 'package.json'),
            (Join-Path $root 'electron/main.cjs'),
            (Join-Path $root 'electron/preload.cjs')
          ) + (Get-ChildItem (Join-Path $root 'src') -Filter '*.js' -File | ForEach-Object { $_.FullName })
          $execText = ($execFiles | ForEach-Object { Get-Content $_ -Raw }) -join "`n"
          if ($execText -match '(?i)cloudflare|workers\.dev') { throw 'Cloudflare reference found in executable source' }

          if (!$pkg.scripts.'dist:portable' -or !$pkg.scripts.'dist:setup') { throw 'Portable/Setup scripts missing' }
          Get-ChildItem (Join-Path $root 'src') -Filter '*.js' -File | ForEach-Object {
            Get-Content $_.FullName -Raw | node --input-type=module --check
            if ($LASTEXITCODE -ne 0) { throw "JS syntax failed: $($_.Name)" }
          }
          node --check (Join-Path $root 'electron/main.cjs'); if ($LASTEXITCODE -ne 0) { throw 'main.cjs syntax failed' }
          node --check (Join-Path $root 'electron/preload.cjs'); if ($LASTEXITCODE -ne 0) { throw 'preload.cjs syntax failed' }
          Write-Host 'ALL WINDOWS V124 PARITY SOURCE CHECKS PASSED'

      - name: Install dependencies
        working-directory: build_windows_v124/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Build Portable EXE
        working-directory: build_windows_v124/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Smoke launch Portable EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows_v124/windows-system/release'
          $exe = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$exe) { throw 'Portable EXE not found' }
          $env:TAHALIL_SMOKE_TEST = '1'
          $p = Start-Process -FilePath $exe.FullName -PassThru
          if (!$p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force; throw 'Portable smoke launch timed out' }
          if ($p.ExitCode -ne 0) { throw "Portable smoke launch exit code $($p.ExitCode)" }
          Write-Host 'PACKAGED WINDOWS V124 EXE SMOKE LAUNCH PASSED'

      - name: Build Setup EXE
        working-directory: build_windows_v124/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }

      - name: Prepare Windows V124 release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build_windows_v124/windows-system/release'
          $portable = Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup = Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable -or !$setup) { throw 'Expected Portable and Setup EXEs' }
          Copy-Item $portable.FullName (Join-Path $PWD 'Tahalil-Alakkad-V124-Windows-Portable.exe') -Force
          Copy-Item $setup.FullName (Join-Path $PWD 'Tahalil-Alakkad-V124-Windows-Setup.exe') -Force
          foreach ($name in @('Tahalil-Alakkad-V124-Windows-Portable.exe','Tahalil-Alakkad-V124-Windows-Setup.exe')) {
            if ((Get-Item $name).Length -lt 1000000) { throw "$name unexpectedly small" }
            $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Upload Windows V124 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-V124-Windows
          path: |
            Tahalil-Alakkad-V124-Windows-Portable.exe
            Tahalil-Alakkad-V124-Windows-Portable.exe.sha256
            Tahalil-Alakkad-V124-Windows-Setup.exe
            Tahalil-Alakkad-V124-Windows-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows V124 to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v124'
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title "تحاليل العقاد V124" --notes "V124 Android/Windows parity release. Windows includes Portable + Setup, Firebase sync, results open/download/share/revision, admin credential reset without reset email, enlarged home icons only, and no Cloudflare dependency."
            if ($LASTEXITCODE -ne 0) { throw 'Could not create V124 release' }
          }
          gh release upload $tag 'Tahalil-Alakkad-V124-Windows-Portable.exe' 'Tahalil-Alakkad-V124-Windows-Portable.exe.sha256' 'Tahalil-Alakkad-V124-Windows-Setup.exe' 'Tahalil-Alakkad-V124-Windows-Setup.exe.sha256' --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Windows V124 files' }
          gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --latest
