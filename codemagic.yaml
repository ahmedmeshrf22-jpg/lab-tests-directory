workflows:
  android-release:
    name: Build Tahalil Alakkad V65 FULLSCREEN TASK WORKSPACE FIXED
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
      android_signing:
      - tahalil_alakkad_release
    scripts:
    - name: Extract V65 project
      script: "set -euo pipefail\n\nZIP_FILE=\"$CM_BUILD_DIR/Project3_AK_SECURE_FULLSCREEN_TASK_WORKSPACE_V65.zip\"\nWORK_DIR=\"\
        $CM_BUILD_DIR/android_project\"\n\nif [ ! -f \"$ZIP_FILE\" ]; then\n  echo \"ERROR: V65 project ZIP not found: $ZIP_FILE\"\
        \n  find \"$CM_BUILD_DIR\" -maxdepth 2 -type f -iname '*.zip' -print || true\n  exit 1\nfi\n\nrm -rf \"$WORK_DIR\"\
        \nmkdir -p \"$WORK_DIR\"\nunzip -q -o \"$ZIP_FILE\" -d \"$WORK_DIR\"\n\nSETTINGS_FILE=$(find \"$WORK_DIR\" -type f\
        \ -name settings.gradle.kts -print -quit)\nif [ -z \"$SETTINGS_FILE\" ]; then\n  echo \"ERROR: settings.gradle.kts\
        \ not found\"\n  exit 1\nfi\n\nPROJECT_DIR=$(dirname \"$SETTINGS_FILE\")\necho \"PROJECT_DIR=$PROJECT_DIR\" >> \"\
        $CM_ENV\"\necho \"PROJECT_DIR=$PROJECT_DIR\"\n"
    - name: Verify V65 fullscreen task workspace
      script: "set -euo pipefail\n\npython3 - \"$PROJECT_DIR\" <<'PY'\nfrom pathlib import Path\nimport json, re, sys\n\n\
        root = Path(sys.argv[1])\n\nrequired = [\n    \"app/build.gradle.kts\",\n    \"gradle/libs.versions.toml\",\n    \"\
        app/src/main/AndroidManifest.xml\",\n    \"app/google-services.json\",\n    \"app/src/main/java/com/example/MainActivity.kt\"\
        ,\n    \"app/src/main/java/com/example/ui/SplashScreen.kt\",\n    \"app/src/main/java/com/example/ui/LabTestsViewModel.kt\"\
        ,\n    \"app/src/main/java/com/example/ui/LabTestsScreen.kt\",\n    \"app/src/main/java/com/example/ui/CustomerSystemDialog.kt\"\
        ,\n    \"app/src/main/java/com/example/ui/OperationsV14Dialog.kt\",\n    \"app/src/main/java/com/example/util/TestDocumentImport.kt\"\
        ,\n    \"app/src/main/java/com/example/util/CustomerQrImport.kt\",\n    \"app/src/main/java/com/example/util/SecureFileGuard.kt\"\
        ,\n    \"app/src/main/java/com/example/util/PdfGenerator.kt\",\n    \"app/src/main/assets/lab_tests_android.json\"\
        ,\n    \"firestore.rules\",\n    \"FINAL_AUDIT_V61_NOTES.txt\",\n    \"SMART_MEDICAL_VISION_V62_NOTES.txt\",\n   \
        \ \"IMPORT_SELECTION_FIX_V63_NOTES.txt\",\n    \"CUSTOMER_ORDER_WORKFLOW_V64_NOTES.txt\",\n    \"FULLSCREEN_TASK_WORKSPACE_V65_NOTES.txt\"\
        ,\n    \"app/src/main/java/com/example/util/SmartMedicalVision.kt\",\n]\nmissing = [p for p in required if not (root\
        \ / p).is_file()]\nif missing:\n    raise SystemExit(\"Missing required files:\\n\" + \"\\n\".join(missing))\n\ndef\
        \ read(rel):\n    return (root / rel).read_text(encoding=\"utf-8\")\n\nbuild = read(\"app/build.gradle.kts\")\nfor\
        \ needle in [\n    \"compileSdk = 36\",\n    'buildToolsVersion = \"35.0.0\"',\n    \"versionCode = 65\",\n    'versionName\
        \ = \"4.32-fullscreen-task-workspace-v65\"',\n    \"isMinifyEnabled = true\",\n    \"isShrinkResources = true\",\n\
        \    \"isDebuggable = false\",\n]:\n    if needle not in build:\n        raise SystemExit(f\"Build verification missing:\
        \ {needle}\")\n\n# Existing V60 login/admin behavior must remain unchanged.\nmain = read(\"app/src/main/java/com/example/MainActivity.kt\"\
        )\nforbidden_main = [\n    'deviceAccessStatus by viewModel.deviceAccessStatus.collectAsState()',\n    'currentUser\
        \ != null && deviceAccessStatus == \"checking\"',\n    'currentUser != null && deviceAccessStatus != \"approved\"\
        ',\n    'DeviceAuthorizationScreen(',\n]\nfound = [x for x in forbidden_main if x in main]\nif found:\n    raise SystemExit(\"\
        Login is still gated by device approval: \" + \", \".join(found))\n\nvm = read(\"app/src/main/java/com/example/ui/LabTestsViewModel.kt\"\
        )\nfor needle in [\n    \"private fun hasAdminAccess(): Boolean = _actualManager.value || _adminUnlocked.value\",\n\
        \    \"if (_actualManager.value) firestore\",\n    \"else adminFirestore ?: error(\\\"Admin access is not unlocked\\\
        \")\",\n    \"fun unlockAdmin(pin: String\",\n    \"ADMIN_PIN_VERIFIER\",\n]:\n    if needle not in vm:\n        raise\
        \ SystemExit(f\"Admin PIN behavior missing: {needle}\")\n\n# 1) Splash copyright.\nsplash = read(\"app/src/main/java/com/example/ui/SplashScreen.kt\"\
        )\nfor needle in [\"2026 A.M \U0001F343\", \"All Rights Reserved\", \"Alignment.BottomCenter\"]:\n    if needle not\
        \ in splash:\n        raise SystemExit(f\"Splash copyright verification missing: {needle}\")\n\n# 2) Staff workflow\
        \ status Firestore rule, restricted to known values.\nrules = read(\"firestore.rules\")\nfor needle in [\n    \"'workflow_status'\"\
        ,\n    \"hasAny(['workflow_status'])\",\n    \"request.resource.data.workflow_status in [\",\n    \"'sent_to_lab'\"\
        ,\n    \"'processing'\",\n    \"'ready'\",\n    \"'delivered'\",\n]:\n    if needle not in rules:\n        raise SystemExit(f\"\
        Workflow rules verification missing: {needle}\")\n\n# 3) Range prices: all legacy ranges must be parseable without\
        \ becoming zero.\nif 'matchEntire(normalized)' not in vm or 'groupValues[1].toDoubleOrNull()' not in vm:\n    raise\
        \ SystemExit(\"Range-safe order price parser missing\")\ntests = json.loads(read(\"app/src/main/assets/lab_tests_android.json\"\
        ))\nranges = [str(x.get(\"customer_price\")) for x in tests if isinstance(x.get(\"customer_price\"), str) and \"/\"\
        \ in x.get(\"customer_price\")]\nif not ranges:\n    raise SystemExit(\"Expected legacy range prices were not found\"\
        )\nrange_re = re.compile(r\"^(\\d+(?:\\.\\d+)?)(?:\\s*/\\s*\\d+(?:\\.\\d+)?)?$\")\nbad_ranges = [x for x in ranges\
        \ if not range_re.fullmatch(x.replace(\",\", \"\").strip())]\nif bad_ranges:\n    raise SystemExit(\"Unsupported range\
        \ prices: \" + \", \".join(bad_ranges))\n\n# 4) Customer QR from cloud/provider PDF uses a private seekable cache\
        \ file.\nqr = read(\"app/src/main/java/com/example/util/CustomerQrImport.kt\")\nfor needle in [\n    'File.createTempFile(\"\
        customer_qr_import_\", \".pdf\", context.cacheDir)',\n    'ParcelFileDescriptor.open(tempPdf, ParcelFileDescriptor.MODE_READ_ONLY)',\n\
        \    'runCatching { tempPdf.delete() }',\n    'error(\"ملف PDF محمي بكلمة مرور أو لا يسمح بقراءته\")',\n]:\n    if\
        \ needle not in qr:\n        raise SystemExit(f\"QR PDF verification missing: {needle}\")\n\n# 5) Rendered PDF pages\
        \ use the same handwriting preprocessing as images.\npdf_import = read(\"app/src/main/java/com/example/util/TestDocumentImport.kt\"\
        )\nfor needle in [\n    'val pageText = recognizeImageRobust(recognizer, bitmap).trim()',\n    'createHighContrastBitmap',\n\
        \    'targetWidth = max(bitmap.width, 1800)',\n    'File.createTempFile(\"lab_tests_import_\", \".pdf\", context.cacheDir)',\n\
        ]:\n    if needle not in pdf_import:\n        raise SystemExit(f\"PDF handwriting OCR verification missing: {needle}\"\
        )\n\n# 6) Direct Android Share supports modern phone image MIME types.\nmanifest = read(\"app/src/main/AndroidManifest.xml\"\
        )\nfor needle in [\n    'android:mimeType=\"image/heic\"',\n    'android:mimeType=\"image/heif\"',\n    'android:mimeType=\"\
        image/avif\"',\n    'android:mimeType=\"application/pdf\"',\n]:\n    if needle not in manifest:\n        raise SystemExit(f\"\
        Share MIME verification missing: {needle}\")\n\n# Security hardening must remain present.\nfor needle in [\n    'android:allowBackup=\"\
        false\"',\n    'android:usesCleartextTraffic=\"false\"',\n    'android.permission.HIDE_OVERLAY_WINDOWS',\n]:\n   \
        \ if needle not in manifest:\n        raise SystemExit(f\"Security verification missing: {needle}\")\n\n# V62 true\
        \ multimodal medical-document vision, with local OCR fallback.\nsmart = read(\"app/src/main/java/com/example/util/SmartMedicalVision.kt\"\
        )\nfor needle in [\n    'FirebaseAI.instance.generativeModel(modelName)',\n    '\"gemini-3.6-flash\"',\n    'bitmaps.forEach\
        \ { bitmap -> image(bitmap) }',\n    'Extract ONLY laboratory tests that are explicitly requested',\n    'Do NOT diagnose,\
        \ recommend, infer, or add tests',\n]:\n    if needle not in smart:\n        raise SystemExit(f\"Smart vision verification\
        \ missing: {needle}\")\n\nimporter = read(\"app/src/main/java/com/example/util/TestDocumentImport.kt\")\nfor needle\
        \ in [\n    'suspend fun readTests(',\n    'SmartMedicalVision.isOnline(context)',\n    'extractRequestedLabTests(visionBitmaps,\
        \ localText)',\n    'ReadMode.SMART_VISION',\n    'SmartFallbackReason.OFFLINE',\n    'MAX_VISION_PDF_PAGES = 4',\n\
        ]:\n    if needle not in importer:\n        raise SystemExit(f\"Vision import verification missing: {needle}\")\n\n\
        screen = read(\"app/src/main/java/com/example/ui/LabTestsScreen.kt\")\nfor needle in [\n    'TestDocumentImport.readTests(context,\
        \ uri)',\n    'تم التعرف الذكي على',\n    'شغّل الإنترنت لاستخدام القراءة الذكية للخط اليدوي',\n]:\n    if needle\
        \ not in screen:\n        raise SystemExit(f\"Vision UI verification missing: {needle}\")\n\n# V63: selecting one\
        \ imported result must keep the remaining results, and\n# the full detected batch can be added in one action.\nfor\
        \ needle in [\n    'private val _recognizedTests = MutableStateFlow<List<LabTest>>(emptyList())',\n    'val recognizedTests:\
        \ StateFlow<List<LabTest>> = _recognizedTests.asStateFlow()',\n    'fun onManualQueryChanged(newQuery: String)',\n\
        \    'fun addAllRecognizedTests(): Int',\n    'selectedExactMatch -> Unit',\n    'onQueryChanged(current)',\n]:\n\
        \    if needle not in vm:\n        raise SystemExit(f\"V63 selection-flow verification missing: {needle}\")\n\nadd_fn\
        \ = vm.split('fun addSelectedTest(test: LabTest)', 1)[1].split('fun addAllRecognizedTests()', 1)[0]\nif 'clearSearch()'\
        \ in add_fn:\n    raise SystemExit('V63 regression: addSelectedTest still clears the entire search')\n\nfor needle\
        \ in [\n    'val recognizedTests by viewModel.recognizedTests.collectAsState()',\n    'onQueryChange = { viewModel.onManualQueryChanged(it)\
        \ }',\n    'RecognizedTestsActionsCard(',\n    'إضافة كل التحاليل المقروءة',\n    'add_all_recognized_tests',\n  \
        \  'viewModel.addAllRecognizedTests()',\n]:\n    if needle not in screen:\n        raise SystemExit(f\"V63 selection\
        \ UI verification missing: {needle}\")\n\n# V64 behavior must remain: totals, full customer dialogs and reopening\
        \ the saved customer file.\nfor needle in [\n    'text = tr(\"إجمالي الطلب الحالي\", \"Current Order Total\")',\n\
        \    '.fillMaxHeight(0.94f)',\n    'customerSystemInitialCustomer = activeOrderCustomer',\n    'initialCustomer =\
        \ customerSystemInitialCustomer',\n]:\n    if needle not in screen:\n        raise SystemExit(f\"V64 order workflow\
        \ regression: {needle}\")\n\n# V65: active tasks own the whole screen and all task content shares one scroll surface.\n\
        for needle in [\n    'if (managerMainMode == \"home\")',\n    'TemporaryWorkspaceTopBar(',\n    'testTag(\"temporary_workspace_back\"\
        )',\n    'testTag(\"temporary_workspace_settings\")',\n    'topContent: (@Composable () -> Unit)? = null',\n    'item(key\
        \ = \"workspace_top_content\")',\n    'results use the full screen',\n    'bottomContent = null',\n]:\n    if needle\
        \ not in screen:\n        raise SystemExit(f\"V65 fullscreen workspace verification missing: {needle}\")\n\nif screen.count('WorkspaceMoreSection(')\
        \ != 1:\n    raise SystemExit('V65 regression: unrelated More navigation is still rendered inside an active task')\n\
        \nif 'Modifier.weight(1f).fillMaxWidth()' in screen:\n    raise SystemExit('V65 regression: task results are still\
        \ constrained to the old small weighted lower viewport')\n\ncustomer_ui = read(\"app/src/main/java/com/example/ui/CustomerSystemDialog.kt\"\
        )\nfor needle in [\n    'initialCustomer: Customer? = null',\n    'var selectedCustomer by remember(initialCustomer?.id)',\n\
        \    'كل طلب محفوظ يظهر هنا',\n    'فتح / طباعة / PDF / صورة',\n    'ordersLoading: Boolean',\n    'جاري تحميل الطلبات\
        \ المحفوظة',\n    'طباعة / PDF / صورة للطلب',\n]:\n    if needle not in customer_ui:\n        raise SystemExit(f\"\
        V64 customer file verification missing: {needle}\")\n\nfor needle in [\n    'val customerOrdersLoading: StateFlow<Boolean>\
        \ = _customerOrdersLoading.asStateFlow()',\n    'fun loadCustomerOrders(customerId: String, preserveCurrent: Boolean\
        \ = false)',\n    '_customerOrdersLoading.value = true',\n    'loadCustomerOrders(customer.id, preserveCurrent = true)',\n\
        \    '_customerOrders.value = listOf(order) + _customerOrders.value.filterNot { it.id == order.id }',\n]:\n    if\
        \ needle not in vm:\n        raise SystemExit(f\"V64 saved-order persistence verification missing: {needle}\")\n\n\
        pdf = read(\"app/src/main/java/com/example/util/PdfGenerator.kt\")\nfor needle in [\n    'fun printGeneratedPdf(',\n\
        \    'PrintManager',\n    'PrintAttributes.MediaSize.ISO_A5',\n    'PageRange.ALL_PAGES',\n]:\n    if needle not in\
        \ pdf:\n        raise SystemExit(f\"V64 direct print verification missing: {needle}\")\n\noutput = read(\"app/src/main/java/com/example/ui/OrderPdfShareDialog.kt\"\
        )\nfor needle in [\n    'طباعة إيصال العميل',\n    'طباعة طلب المعمل',\n    'verticalScroll(rememberScrollState())',\n\
        ]:\n    if needle not in output:\n        raise SystemExit(f\"V64 output dialog verification missing: {needle}\")\n\
        \nif 'implementation(libs.firebase.ai)' not in build:\n    raise SystemExit(\"Firebase AI Logic dependency missing\"\
        )\n\nprint(f\"V65 FULLSCREEN TASK WORKSPACE verification passed; legacy range prices checked: {len(ranges)}\")\nPY\n"
    - name: Configure Android SDK 36
      script: "set -euo pipefail\n\nANDROID_HOME=\"/usr/local/share/android-sdk\"\nSDKMANAGER=\"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\"\
        \n\nif [ ! -x \"$SDKMANAGER\" ]; then\n  echo \"ERROR: sdkmanager not found at $SDKMANAGER\"\n  exit 1\nfi\n\necho\
        \ \"ANDROID_HOME=$ANDROID_HOME\" >> \"$CM_ENV\"\necho \"ANDROID_SDK_ROOT=$ANDROID_HOME\" >> \"$CM_ENV\"\necho \"sdk.dir=$ANDROID_HOME\"\
        \ > \"$PROJECT_DIR/local.properties\"\n\nyes | \"$SDKMANAGER\" --licenses >/dev/null 2>&1 || true\n\"$SDKMANAGER\"\
        \ \"platform-tools\" \"platforms;android-36\" \"build-tools;35.0.0\"\n"
    - name: Use compatible preinstalled Gradle
      script: "set -euo pipefail\n\nGRADLE_BIN=$(command -v gradle || true)\n\nif [ -z \"$GRADLE_BIN\" ] || [ ! -x \"$GRADLE_BIN\"\
        \ ]; then\n  for candidate in \\\n    \"$HOME/programs/gradle-8.14.1/bin/gradle\" \\\n    \"/Users/builder/programs/gradle-8.14.1/bin/gradle\"\
        \n  do\n    if [ -x \"$candidate\" ]; then\n      GRADLE_BIN=\"$candidate\"\n      break\n    fi\n  done\nfi\n\nif\
        \ [ -z \"$GRADLE_BIN\" ] || [ ! -x \"$GRADLE_BIN\" ]; then\n  echo \"ERROR: No compatible preinstalled Gradle found\"\
        \n  exit 1\nfi\n\nGRADLE_VERSION=$($GRADLE_BIN --version | awk '/^Gradle / {print $2; exit}')\necho \"Detected Gradle\
        \ $GRADLE_VERSION at $GRADLE_BIN\"\n\npython3 - \"$GRADLE_VERSION\" <<'PY'\nimport sys\nparts = sys.argv[1].split('.')\n\
        major = int(parts[0])\nminor = int(parts[1]) if len(parts) > 1 else 0\nif major != 8 or minor < 11:\n    raise SystemExit(f\"\
        Gradle {sys.argv[1]} is incompatible; need Gradle 8.11+ and <9\")\nPY\n\necho \"GRADLE_BIN=$GRADLE_BIN\" >> \"$CM_ENV\"\
        \n\"$GRADLE_BIN\" --version\n"
    - name: Validate release signing
      script: "set -euo pipefail\n\nif [ -z \"${CM_KEYSTORE_PATH:-}\" ] || [ ! -f \"$CM_KEYSTORE_PATH\" ]; then\n  echo \"\
        ERROR: Release keystore missing\"\n  exit 1\nfi\n\nif [ -z \"${CM_KEYSTORE_PASSWORD:-}\" ] || [ -z \"${CM_KEY_ALIAS:-}\"\
        \ ] || [ -z \"${CM_KEY_PASSWORD:-}\" ]; then\n  echo \"ERROR: Signing credentials incomplete\"\n  exit 1\nfi\n\nkeytool\
        \ -list \\\n  -keystore \"$CM_KEYSTORE_PATH\" \\\n  -storepass \"$CM_KEYSTORE_PASSWORD\" \\\n  -alias \"$CM_KEY_ALIAS\"\
        \ \\\n  >/dev/null\n"
    - name: Build V65 fullscreen task workspace APK and AAB - FIXED
      script: "set -euo pipefail\n\nexport KEYSTORE_PATH=\"$CM_KEYSTORE_PATH\"\nexport STORE_PASSWORD=\"$CM_KEYSTORE_PASSWORD\"\
        \nexport KEY_PASSWORD=\"$CM_KEY_PASSWORD\"\nexport KEY_ALIAS=\"$CM_KEY_ALIAS\"\nexport GRADLE_USER_HOME=\"$CM_BUILD_DIR/.gradle-v65-fullscreen-task-workspace\"\
        \n\ncd \"$PROJECT_DIR\"\n\nBUILD_LOG=\"$CM_BUILD_DIR/v65-fullscreen-task-workspace-build.log\"\nRELEASE_DIR=\"$CM_BUILD_DIR/release\"\
        \nrm -f \"$BUILD_LOG\"\nrm -rf \"$RELEASE_DIR\"\nmkdir -p \"$RELEASE_DIR\"\n\nif \"$GRADLE_BIN\" \\\n  --no-daemon\
        \ \\\n  --no-configuration-cache \\\n  --no-parallel \\\n  --max-workers=2 \\\n  --console=plain \\\n  clean \\\n\
        \  :app:assembleRelease \\\n  :app:bundleRelease >\"$BUILD_LOG\" 2>&1; then\n  cat \"$BUILD_LOG\"\nelse\n  BUILD_STATUS=$?\n\
        \  cat \"$BUILD_LOG\"\n  echo \"Gradle build failed with status $BUILD_STATUS\"\n  exit \"$BUILD_STATUS\"\nfi\n\n\
        APK_FILE=\"$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)\"\nAAB_FILE=\"$(find app/build/outputs/bundle/release\
        \ -type f -name '*.aab' -print -quit)\"\n\ntest -n \"$APK_FILE\"\ntest -f \"$APK_FILE\"\ntest -n \"$AAB_FILE\"\ntest\
        \ -f \"$AAB_FILE\"\n\ncp \"$APK_FILE\" \"$RELEASE_DIR/Tahalil-Alakkad-V65-FULLSCREEN-TASK-WORKSPACE.apk\"\ncp \"$AAB_FILE\"\
        \ \"$RELEASE_DIR/Tahalil-Alakkad-V65-FULLSCREEN-TASK-WORKSPACE.aab\"\ncp \"$BUILD_LOG\" \"$RELEASE_DIR/v65-fullscreen-task-workspace-build.log\"\
        \n\necho \"V65 artifacts created successfully\"\nls -lah \"$RELEASE_DIR\"\n"
    artifacts:
    - release/*.apk
    - release/*.aab
    - release/*.log
    - android_project/**/app/build/outputs/mapping/release/mapping.txt
    
