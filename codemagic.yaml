workflows:
  android-release:
    name: Smart Clinic Secretary V2 RELEASE
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17
      android_signing:
        - smartclinic_release

    scripts:
      - name: Extract V2 project
        script: |
          set -euo pipefail

          ZIP_FILE="$CM_BUILD_DIR/SmartClinicSecretary_V2_BUILD_READY.zip"
          WORK_DIR="$CM_BUILD_DIR/_smartclinic_v2"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: SmartClinicSecretary_V2_BUILD_READY.zip not found"
            find "$CM_BUILD_DIR" -maxdepth 1 -type f -print
            exit 1
          fi

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          unzip -q -o "$ZIP_FILE" -d "$WORK_DIR"

          SETTINGS_FILE=$(find "$WORK_DIR" -type f -name 'settings.gradle.kts' -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found inside V2 ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

          echo "Using V2 project: $PROJECT_DIR"

      - name: Install Android SDK 36
        script: |
          set -euo pipefail

          SDKMANAGER=$(command -v sdkmanager || true)

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER"             "platform-tools"             "platforms;android-36"             "build-tools;35.0.0"

      - name: Install Gradle 8.13
        script: |
          set -euo pipefail

          GRADLE_DIR="$HOME/gradle-8.13"

          if [ ! -x "$GRADLE_DIR/bin/gradle" ]; then
            curl -L --fail --retry 3               -o /tmp/gradle-8.13-bin.zip               https://services.gradle.org/distributions/gradle-8.13-bin.zip
            unzip -q -o /tmp/gradle-8.13-bin.zip -d "$HOME"
          fi

          echo "GRADLE_BIN=$GRADLE_DIR/bin/gradle" >> "$CM_ENV"
          "$GRADLE_DIR/bin/gradle" --version

      - name: Validate release signing
        script: |
          set -euo pipefail

          test -n "${CM_KEYSTORE_PATH:-}"
          test -f "$CM_KEYSTORE_PATH"
          test -n "${CM_KEY_ALIAS:-}"
          test -n "${CM_KEYSTORE_PASSWORD:-}"
          test -n "${CM_KEY_PASSWORD:-}"

          keytool -list             -keystore "$CM_KEYSTORE_PATH"             -storepass "$CM_KEYSTORE_PASSWORD"             -alias "$CM_KEY_ALIAS" >/dev/null

          echo "Release signing OK"

      - name: Build V2 signed APK
        script: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          "$GRADLE_BIN" :app:assembleRelease --stacktrace

      - name: Prepare V2 APK
        script: |
          set -euo pipefail

          APK_FILE="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: Release APK not found"
            find "$PROJECT_DIR/app/build/outputs" -type f -print || true
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/apk"

          cp "$APK_FILE"             "$CM_BUILD_DIR/apk/SmartClinicSecretary-V2.apk"

          echo "SmartClinicSecretary-V2.apk READY"

    artifacts:
      - apk/SmartClinicSecretary-V2.apk
      
