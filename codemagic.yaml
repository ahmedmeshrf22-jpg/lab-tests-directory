workflows:
  android-release:
    name: Build Tahalil Alakkad RELEASE
    max_build_duration: 60

    environment:
      java: 17
      android_signing:
        - tahalil_alakkad_release

    scripts:
      - name: Extract Android project
        script: |
          set -e

          rm -rf "$CM_BUILD_DIR/extracted"
          mkdir -p "$CM_BUILD_DIR/extracted"

          unzip -q "$CM_BUILD_DIR/project.zip" \
            -d "$CM_BUILD_DIR/extracted"

          SETTINGS_FILE=$(find "$CM_BUILD_DIR/extracted" \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android project not found inside project.zip"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Set app name and icon
        script: |
          set -e

          python3 <<'PY'
          import os
          import re
          import shutil

          project = os.environ["PROJECT_DIR"]
          build_dir = os.environ["CM_BUILD_DIR"]

          manifest = os.path.join(
              project,
              "app",
              "src",
              "main",
              "AndroidManifest.xml"
          )

          icon_source = os.path.join(
              build_dir,
              "app_icon.png"
          )

          if not os.path.exists(icon_source):
              raise RuntimeError(
                  "app_icon.png not found in repository"
              )

          drawable_dir = os.path.join(
              project,
              "app",
              "src",
              "main",
              "res",
              "drawable"
          )

          os.makedirs(drawable_dir, exist_ok=True)

          icon_target = os.path.join(
              drawable_dir,
              "app_icon.png"
          )

          shutil.copyfile(
              icon_source,
              icon_target
          )

          with open(
              manifest,
              "r",
              encoding="utf-8"
          ) as f:
              text = f.read()

          start = text.find("<application")

          if start == -1:
              raise RuntimeError(
                  "application tag not found"
              )

          end = text.find(">", start)

          if end == -1:
              raise RuntimeError(
                  "invalid application tag"
              )

          tag = text[start:end + 1]

          def set_attr(tag, name, value):
              pattern = (
                  rf'\sandroid:{name}="[^"]*"'
              )

              replacement = (
                  f' android:{name}="{value}"'
              )

              if re.search(pattern, tag):
                  return re.sub(
                      pattern,
                      replacement,
                      tag,
                      count=1
                  )

              return (
                  tag[:-1]
                  + f'\n        android:{name}="{value}">'
              )

          tag = set_attr(
              tag,
              "label",
              "تحاليل العقاد"
          )

          tag = set_attr(
              tag,
              "icon",
              "@drawable/app_icon"
          )

          tag = set_attr(
              tag,
              "roundIcon",
              "@drawable/app_icon"
          )

          text = (
              text[:start]
              + tag
              + text[end + 1:]
          )

          with open(
              manifest,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(text)

          strings_file = os.path.join(
              project,
              "app",
              "src",
              "main",
              "res",
              "values",
              "strings.xml"
          )

          if os.path.exists(strings_file):
              with open(
                  strings_file,
                  "r",
                  encoding="utf-8"
              ) as f:
                  strings = f.read()

              if 'name="app_name"' in strings:
                  strings = re.sub(
                      r'<string\s+name="app_name">.*?</string>',
                      '<string name="app_name">تحاليل العقاد</string>',
                      strings,
                      count=1,
                      flags=re.DOTALL
                  )

                  with open(
                      strings_file,
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(strings)

          print("App name: تحاليل العقاد")
          print("App icon installed")
          PY

      - name: Install Android SDK 36.1
        script: |
          set -e

          SDKMANAGER=$(command -v sdkmanager || true)

          if [ -z "$SDKMANAGER" ]; then
            for CANDIDATE in \
              "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "/usr/local/share/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
              "$HOME/Library/Android/sdk/cmdline-tools/latest/bin/sdkmanager"
            do
              if [ -x "$CANDIDATE" ]; then
                SDKMANAGER="$CANDIDATE"
                break
              fi
            done
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" \
            --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platforms;android-36.1" \
            "platform-tools"

          echo "sdk.dir=$ANDROID_SDK_ROOT" \
            > "$PROJECT_DIR/local.properties"

      - name: Install Gradle 9.3.1
        script: |
          set -e

          rm -rf /tmp/gradle-9.3.1
          rm -f /tmp/gradle-9.3.1-bin.zip

          curl -L \
            --fail \
            --retry 3 \
            "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" \
            -o /tmp/gradle-9.3.1-bin.zip

          unzip -q \
            /tmp/gradle-9.3.1-bin.zip \
            -d /tmp

          GRADLE_BIN="/tmp/gradle-9.3.1/bin/gradle"

          echo "GRADLE_BIN=$GRADLE_BIN" \
            >> "$CM_ENV"

          "$GRADLE_BIN" --version

      - name: Verify release keystore
        script: |
          set -e

          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "CM_KEYSTORE_PATH is missing"
            exit 1
          fi

          if [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "Keystore file not found"
            exit 1
          fi

          echo "Release keystore loaded successfully"
          echo "Alias: $CM_KEY_ALIAS"

      - name: Build signed Release APK
        script: |
          set -e

          cd "$PROJECT_DIR"

          export KEYSTORE_PATH="$CM_KEYSTORE_PATH"
          export STORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export KEY_PASSWORD="$CM_KEY_PASSWORD"

          "$GRADLE_BIN" \
            --no-daemon \
            :app:assembleRelease

      - name: Collect Release APK
        script: |
          set -e

          mkdir -p "$CM_BUILD_DIR/output"

          APK_FILE=$(find \
            "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "Release APK not found"
            exit 1
          fi

          cp "$APK_FILE" \
            "$CM_BUILD_DIR/output/tahalil-alakkad-release.apk"

          echo "SIGNED RELEASE APK READY:"
          ls -lh "$CM_BUILD_DIR/output"

    artifacts:
      - output/*.apk
