workflows:
  android-release:
    name: Build Tahalil Alakkad DUAL PDF QR V36
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17
      android_signing:
        - tahalil_alakkad_release

    scripts:

      - name: Extract DUAL PDF QR V36 project
        script: |
          set -euo pipefail

          ZIP_FILE="$CM_BUILD_DIR/Project3_AK_SECURE_DUAL_PDF_QR_V36.zip"
          WORK_DIR="$CM_BUILD_DIR/android_project"

          echo "Looking for project ZIP..."
          ls -lah "$CM_BUILD_DIR"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found:"
            echo "$ZIP_FILE"
            exit 1
          fi

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"

          echo "Extracting project..."
          unzip -q -o "$ZIP_FILE" -d "$WORK_DIR"

          SETTINGS_FILE=$(find "$WORK_DIR" -type f -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"

          echo "Project extracted successfully"


      - name: Verify DUAL PDF QR V36
        script: |
          set -euo pipefail

          echo "Verifying core project files..."

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/res/values/strings.xml"

          test -f "$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsViewModel.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/ui/CustomerSystemDialog.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/ui/OperationsV14Dialog.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/ui/OrderPdfShareDialog.kt"

          test -f "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"

          echo "Checking application version..."

          grep -q 'versionCode = 41' \
            "$PROJECT_DIR/app/build.gradle.kts"

          grep -q 'versionName = "4.12-dual-pdf-qr-v36"' \
            "$PROJECT_DIR/app/build.gradle.kts"

          grep -q '<string name="app_name">تحاليل العقاد</string>' \
            "$PROJECT_DIR/app/src/main/res/values/strings.xml"

          echo "Checking V36 PDF functions..."

          grep -q 'generateDualOrderPdfs' \
            "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"

          grep -q 'createCustomerQrBitmap' \
            "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"

          grep -q 'OrderPdfBundle' \
            "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"

          grep -q 'بيانات الحالة' \
            "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"

          grep -q 'التحاليل المطلوبة' \
            "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"

          grep -q '01102233167' \
            "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"

          grep -q '01107072134' \
            "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"

          grep -q '59 شارع فيصل الرئيسي' \
            "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"

          echo "Checking QR dependency..."

          grep -q 'com.google.zxing:core:3.5.3' \
            "$PROJECT_DIR/app/build.gradle.kts"

          echo "Checking PDF share screen..."

          grep -q 'إرسال طلب المعمل' \
            "$PROJECT_DIR/app/src/main/java/com/example/ui/OrderPdfShareDialog.kt"

          grep -q 'إرسال PDF العميل' \
            "$PROJECT_DIR/app/src/main/java/com/example/ui/OrderPdfShareDialog.kt"

          echo "Checking security..."

          grep -q 'FLAG_SECURE' \
            "$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt"

          grep -q 'android:allowBackup="false"' \
            "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          grep -q 'android:usesCleartextTraffic="false"' \
            "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "DUAL PDF QR V36 verification passed"


      - name: Configure Android SDK
        script: |
          set -euo pipefail

          ANDROID_HOME="/usr/local/share/android-sdk"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$CM_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$CM_ENV"

          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-36.1"
          "$SDKMANAGER" "build-tools;36.0.0"

          echo "Android SDK configured"


      - name: Install Gradle 9.3.1
        script: |
          set -euo pipefail

          GRADLE_VERSION="9.3.1"
          GRADLE_DIR="$HOME/gradle-$GRADLE_VERSION"
          GRADLE_BIN="$GRADLE_DIR/bin/gradle"

          if [ ! -x "$GRADLE_BIN" ]; then

            echo "Downloading Gradle $GRADLE_VERSION..."

            rm -f /tmp/gradle.zip

            curl \
              --fail \
              --location \
              --retry 3 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o /tmp/gradle.zip

            unzip -q -o /tmp/gradle.zip -d "$HOME"
          fi

          if [ ! -x "$GRADLE_BIN" ]; then
            echo "ERROR: Gradle installation failed"
            exit 1
          fi

          echo "GRADLE_BIN=$GRADLE_BIN" >> "$CM_ENV"

          "$GRADLE_BIN" --version


      - name: Validate release signing
        script: |
          set -euo pipefail

          echo "Checking release signing..."

          if [ -z "${CM_KEYSTORE_PATH:-}" ]; then
            echo "ERROR: CM_KEYSTORE_PATH is empty"
            exit 1
          fi

          if [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: Keystore file not found"
            exit 1
          fi

          if [ -z "${CM_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: CM_KEYSTORE_PASSWORD missing"
            exit 1
          fi

          if [ -z "${CM_KEY_ALIAS:-}" ]; then
            echo "ERROR: CM_KEY_ALIAS missing"
            exit 1
          fi

          if [ -z "${CM_KEY_PASSWORD:-}" ]; then
            echo "ERROR: CM_KEY_PASSWORD missing"
            exit 1
          fi

          keytool \
            -list \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -alias "$CM_KEY_ALIAS" \
            >/dev/null

          echo "Release signing OK"


      - name: Build DUAL PDF QR V36 APK and AAB
        script: |
          set -euo pipefail

          export KEYSTORE_PATH="$CM_KEYSTORE_PATH"
          export STORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export KEY_PASSWORD="$CM_KEY_PASSWORD"
          export KEY_ALIAS="$CM_KEY_ALIAS"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "Starting Android Release build..."

          "$GRADLE_BIN" \
            --no-daemon \
            --stacktrace \
            clean \
            :app:assembleRelease \
            :app:bundleRelease

          echo "Gradle build completed successfully"

          APK_FILE=$(find app/build/outputs/apk/release -type f -name "*.apk" -print -quit)
          AAB_FILE=$(find app/build/outputs/bundle/release -type f -name "*.aab" -print -quit)

          echo "APK:"
          echo "$APK_FILE"

          echo "AAB:"
          echo "$AAB_FILE"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK path not found"
            exit 1
          fi

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK file does not exist"
            exit 1
          fi

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: AAB path not found"
            exit 1
          fi

          if [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: AAB file does not exist"
            exit 1
          fi

          RELEASE_DIR="$CM_BUILD_DIR/release"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          cp \
            "$APK_FILE" \
            "$RELEASE_DIR/Tahalil-Alakkad-DUAL-PDF-QR-V36.apk"

          cp \
            "$AAB_FILE" \
            "$RELEASE_DIR/Tahalil-Alakkad-DUAL-PDF-QR-V36.aab"

          if [ ! -f "$RELEASE_DIR/Tahalil-Alakkad-DUAL-PDF-QR-V36.apk" ]; then
            echo "ERROR: Final APK copy failed"
            exit 1
          fi

          if [ ! -f "$RELEASE_DIR/Tahalil-Alakkad-DUAL-PDF-QR-V36.aab" ]; then
            echo "ERROR: Final AAB copy failed"
            exit 1
          fi

          echo "=========================================="
          echo "V36 BUILD COMPLETED SUCCESSFULLY"
          echo "=========================================="

          ls -lah "$RELEASE_DIR"


    artifacts:
      - release/*.apk
      - release/*.aab
      - android_project/**/app/build/outputs/mapping/release/mapping.txt
      - android_project/**/app/build/outputs/logs/*
