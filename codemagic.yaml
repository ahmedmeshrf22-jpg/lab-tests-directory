workflows:
  android-release:
    name: Build Tahalil Alakkad V59 UNIFIED ADMIN GATE
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17
      android_signing:
        - tahalil_alakkad_release

    scripts:
      - name: Extract V59 project
        script: |
          set -euo pipefail

          ZIP_FILE="$CM_BUILD_DIR/Project3_AK_SECURE_UNIFIED_ADMIN_GATE_V59.zip"
          WORK_DIR="$CM_BUILD_DIR/android_project"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: V59 ZIP not found: $ZIP_FILE"
            find "$CM_BUILD_DIR" -maxdepth 2 -type f -iname '*.zip' -print || true
            exit 1
          fi

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          unzip -q -o "$ZIP_FILE" -d "$WORK_DIR"

          SETTINGS_FILE=$(find "$WORK_DIR" -type f -name 'settings.gradle.kts' -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Verify V59 project
        script: |
          set -euo pipefail

          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])

          required_files = [
              "app/build.gradle.kts",
              "gradle/libs.versions.toml",
              "gradle.properties",
              "app/src/main/AndroidManifest.xml",
              "app/google-services.json",
              "UNIFIED_ADMIN_GATE_V59_NOTES.txt",
              "app/src/main/java/com/example/MainActivity.kt",
              "app/src/main/java/com/example/ui/LabTestsViewModel.kt",
              "app/src/main/java/com/example/ui/LabTestsScreen.kt",
              "app/src/main/java/com/example/ui/CustomerSystemDialog.kt",
              "app/src/main/java/com/example/ui/OperationsV14Dialog.kt",
              "app/src/main/res/drawable-nodpi/mgr_reports_3d.png",
              "app/src/main/res/drawable-nodpi/mgr_staff_3d.png",
              "app/src/main/res/drawable-nodpi/mgr_devices_3d.png",
              "app/src/main/res/drawable-nodpi/mgr_alerts_3d.png",
              "app/src/main/res/drawable-nodpi/mgr_integrity_3d.png",
              "app/src/main/res/drawable-nodpi/mgr_health_3d.png",
              "app/src/main/res/drawable-nodpi/mgr_audit_3d.png",
              "app/src/main/res/drawable-nodpi/settings_3d.png",
              "app/src/main/res/drawable-nodpi/staff_search_3d.png",
              "app/src/main/res/drawable-nodpi/staff_new_order_3d.png",
              "app/src/main/res/drawable-nodpi/staff_pdf_3d.png",
              "app/src/main/res/drawable-nodpi/staff_qr_3d.png",
              "app/src/main/res/drawable-nodpi/staff_customers_3d.png",
              "app/src/main/res/drawable-nodpi/staff_tests_3d.png",
          ]

          missing = [p for p in required_files if not (root / p).is_file()]
          if missing:
              raise SystemExit("Missing required files:\n" + "\n".join(missing))

          def text(rel):
              return (root / rel).read_text(encoding="utf-8")

          def require(rel, needles):
              body = text(rel)
              missing_needles = [n for n in needles if n not in body]
              if missing_needles:
                  raise SystemExit(
                      f"Verification failed in {rel}:\n" + "\n".join(missing_needles)
                  )

          require("gradle/libs.versions.toml", [
              'agp = "8.10.0"',
              'kotlin = "2.2.10"',
              'googleDevtoolsKsp = "2.3.6"',
              'kotlin-android = { id = "org.jetbrains.kotlin.android"',
          ])

          require("app/build.gradle.kts", [
              'applicationId = "com.aistudio.labtestsdirectory.egypt"',
              "compileSdk = 36",
              'buildToolsVersion = "35.0.0"',
              "minSdk = 24",
              "targetSdk = 36",
              "versionCode = 59",
              'versionName = "4.26-unified-admin-gate-v59"',
              "jvmTarget.set(JvmTarget.JVM_11)",
              "targetCompatibility = JavaVersion.VERSION_11",
              "isMinifyEnabled = true",
              "isShrinkResources = true",
              "isDebuggable = false",
          ])

          require("gradle.properties", [
              "android.useAndroidX=true",
              "org.gradle.parallel=false",
              "org.gradle.configuration-cache=false",
              "org.gradle.workers.max=2",
          ])

          vm = text("app/src/main/java/com/example/ui/LabTestsViewModel.kt")

          require("app/src/main/java/com/example/ui/LabTestsViewModel.kt", [
              "private fun hasAdminAccess(): Boolean = _adminUnlocked.value",
              'private const val ADMIN_UNLOCK_APP = "TahalilAdminUnlock"',
              "fun unlockAdmin(password: String",
              "FirebaseAuth.getInstance(app)",
              "FirebaseAppCheck.getInstance(app)",
              "FirebaseFirestore.getInstance(app)",
              "private fun privilegedFirestore(): FirebaseFirestore",
              "fun lockAdmin()",
              "_lab2LabPrices.value = emptyMap()",
              "fun approveCurrentDeviceWithAdminPassword",
          ])

          forbidden_vm = [
              "private fun hasAdminAccess(): Boolean = _actualManager.value || _adminUnlocked.value",
              "private fun hasAdminAccess(): Boolean = _isManager.value || _adminUnlocked.value",
              "حسابك غير مصرح له بإضافة خصومات",
              "حسابك غير مصرح له بتحصيل دفعات",
          ]

          found = [x for x in forbidden_vm if x in vm]

          if found:
              raise SystemExit(
                  "Legacy manager/permission bypass found:\n" +
                  "\n".join(found)
              )

          require("app/src/main/java/com/example/MainActivity.kt", [
              "Lifecycle.Event.ON_STOP",
              "viewModel.lockAdmin()",
          ])

          screen = text("app/src/main/java/com/example/ui/LabTestsScreen.kt")

          require("app/src/main/java/com/example/ui/LabTestsScreen.kt", [
              "val adminUnlocked by viewModel.adminUnlocked.collectAsState()",
              "val isManager = adminUnlocked",
              "ManagerHomeDashboard(",
              "locked = !adminUnlocked",
              "showAdminPasswordDialog",
              'appText("دخول الإدارة", "Administration access")',
              "private fun AvailableTestPriceCard",
              'appText("تعديل الأسعار", "Edit prices")',
              "R.drawable.staff_search_3d",
              "R.drawable.mgr_reports_3d",
          ])

          if "StaffHomeDashboard(" in screen[:screen.find("private fun StaffHomeDashboard")]:
              raise SystemExit(
                  "Legacy separate staff home route is still active"
              )

          require("app/src/main/java/com/example/ui/CustomerSystemDialog.kt", [
              "viewModel.adminUnlocked.collectAsState()",
          ])

          print("V59 verification passed")
          PY

      - name: Configure Android SDK 36
        script: |
          set -euo pipefail

          ANDROID_HOME="/usr/local/share/android-sdk"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found at $SDKMANAGER"
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$CM_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$CM_ENV"
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Use compatible preinstalled Gradle
        script: |
          set -euo pipefail

          GRADLE_BIN=$(command -v gradle || true)

          if [ -z "$GRADLE_BIN" ] || [ ! -x "$GRADLE_BIN" ]; then
            for candidate in \
              "$HOME/programs/gradle-8.14.1/bin/gradle" \
              "/Users/builder/programs/gradle-8.14.1/bin/gradle"
            do
              if [ -x "$candidate" ]; then
                GRADLE_BIN="$candidate"
                break
              fi
            done
          fi

          if [ -z "$GRADLE_BIN" ] || [ ! -x "$GRADLE_BIN" ]; then
            echo "ERROR: No compatible preinstalled Gradle found"
            exit 1
          fi

          GRADLE_VERSION=$(
            "$GRADLE_BIN" --version |
            awk '/^Gradle / {print $2; exit}'
          )

          echo "Detected Gradle $GRADLE_VERSION at $GRADLE_BIN"

          python3 - "$GRADLE_VERSION" <<'PY'
          import sys

          parts = sys.argv[1].split('.')
          major = int(parts[0])
          minor = int(parts[1]) if len(parts) > 1 else 0

          if major != 8 or minor < 11:
              raise SystemExit(
                  f"Gradle {sys.argv[1]} is incompatible; need Gradle 8.11+ and <9"
              )
          PY

          echo "GRADLE_BIN=$GRADLE_BIN" >> "$CM_ENV"

          "$GRADLE_BIN" --version

      - name: Validate release signing
        script: |
          set -euo pipefail

          if [ -z "${CM_KEYSTORE_PATH:-}" ] || [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: Release keystore missing"
            exit 1
          fi

          if [ -z "${CM_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${CM_KEY_ALIAS:-}" ] || \
             [ -z "${CM_KEY_PASSWORD:-}" ]; then
            echo "ERROR: Signing credentials incomplete"
            exit 1
          fi

          keytool -list \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -alias "$CM_KEY_ALIAS" \
            >/dev/null

      - name: Build V59 release APK and AAB
        script: |
          set -euo pipefail

          export KEYSTORE_PATH="$CM_KEYSTORE_PATH"
          export STORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export KEY_PASSWORD="$CM_KEY_PASSWORD"
          export KEY_ALIAS="$CM_KEY_ALIAS"
          export GRADLE_USER_HOME="$CM_BUILD_DIR/.gradle-v59"

          cd "$PROJECT_DIR"

          BUILD_LOG="$CM_BUILD_DIR/v59-build.log"
          rm -f "$BUILD_LOG"

          set +e

          "$GRADLE_BIN" \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=2 \
            --console=plain \
            clean \
            :app:assembleRelease \
            :app:bundleRelease \
            2>&1 | tee "$BUILD_LOG"

          BUILD_STATUS=${PIPESTATUS[0]}

          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo ""
            echo "================ BUILD ERROR SUMMARY ================"

            grep -nE \
              '(^e: |error:|FAILURE:|What went wrong:|Execution failed for task|Caused by:|Could not resolve|Could not find|Inconsistent JVM|Compilation error)' \
              "$BUILD_LOG" |
              head -140 || true

            echo "====================================================="

            exit "$BUILD_STATUS"
          fi

          APK_FILE=$(
            find app/build/outputs/apk/release \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )

          AAB_FILE=$(
            find app/build/outputs/bundle/release \
              -type f \
              -name '*.aab' \
              -print \
              -quit
          )

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: AAB was not generated"
            exit 1
          fi

          RELEASE_DIR="$CM_BUILD_DIR/release"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          cp \
            "$APK_FILE" \
            "$RELEASE_DIR/Tahalil-Alakkad-V59-UNIFIED-ADMIN-GATE.apk"

          cp \
            "$AAB_FILE" \
            "$RELEASE_DIR/Tahalil-Alakkad-V59-UNIFIED-ADMIN-GATE.aab"

          cp \
            "$BUILD_LOG" \
            "$RELEASE_DIR/v59-build.log"

          echo "BUILD SUCCESSFUL - V59 APK and AAB created"

          ls -lah "$RELEASE_DIR"

      - name: Verify V59 release artifacts
        script: |
          set -euo pipefail

          APK_FILE="$CM_BUILD_DIR/release/Tahalil-Alakkad-V59-UNIFIED-ADMIN-GATE.apk"
          AAB_FILE="$CM_BUILD_DIR/release/Tahalil-Alakkad-V59-UNIFIED-ADMIN-GATE.aab"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          test -f "$APK_FILE"
          test -f "$AAB_FILE"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK_FILE"

          BADGING=$(
            "$AAPT" dump badging "$APK_FILE" |
            head -1
          )

          echo "$BADGING"

          echo "$BADGING" |
            grep -q "name='com.aistudio.labtestsdirectory.egypt'"

          echo "$BADGING" |
            grep -q "versionCode='59'"

          echo "$BADGING" |
            grep -q "versionName='4.26-unified-admin-gate-v59'"

          jarsigner -verify "$AAB_FILE" >/dev/null

          echo "V59 release artifacts verified successfully"

    artifacts:
      - release/*.apk
      - release/*.aab
      - release/*.log
      - android_project/**/app/build/outputs/mapping/release/mapping.txt
