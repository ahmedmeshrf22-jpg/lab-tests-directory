workflows:
  android-release:
    name: Build Tahalil Alakkad TEST DOCUMENT IMPORT V40
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17
      android_signing:
        - tahalil_alakkad_release

    scripts:
      - name: Extract TEST DOCUMENT IMPORT V40 project
        script: |
          set -euo pipefail

          ZIP_FILE="$CM_BUILD_DIR/Project3_AK_SECURE_TEST_DOCUMENT_IMPORT_V40.zip"
          WORK_DIR="$CM_BUILD_DIR/android_project"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project3_AK_SECURE_TEST_DOCUMENT_IMPORT_V40.zip not found"
            ls -lah "$CM_BUILD_DIR"
            exit 1
          fi

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          unzip -q -o "$ZIP_FILE" -d "$WORK_DIR"

          SETTINGS_FILE=$(find "$WORK_DIR" -type f -name "settings.gradle.kts" -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Verify TEST DOCUMENT IMPORT V40
        script: |
          set -euo pipefail

          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/ui/CustomerSystemDialog.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsViewModel.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/util/CustomerQrImport.kt"
          test -f "$PROJECT_DIR/QR_IMPORT_SHARE_V39_NOTES.txt"
          test -f "$PROJECT_DIR/OPTIONAL_OUTPUT_QR_V38_NOTES.txt"
          test -f "$PROJECT_DIR/TEST_DOCUMENT_IMPORT_V40_NOTES.txt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/util/TestDocumentImport.kt"

          grep -q 'versionCode = 45' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionName = "4.16-test-document-import-v40"' "$PROJECT_DIR/app/build.gradle.kts"

          # Keep V38 optional order outputs.
          grep -q 'fun generateCustomerOrderPdf' "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          grep -q 'fun generateLabRequestPdf' "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          grep -q 'fun generateCustomerOrderImage' "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          grep -q 'fun generateLabRequestImage' "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          grep -q 'إغلاق - حفظ فقط' "$PROJECT_DIR/app/src/main/java/com/example/ui/OrderPdfShareDialog.kt"

          # V39 local image/PDF QR import.
          grep -q 'object CustomerQrImport' "$PROJECT_DIR/app/src/main/java/com/example/util/CustomerQrImport.kt"
          grep -q 'PdfRenderer' "$PROJECT_DIR/app/src/main/java/com/example/util/CustomerQrImport.kt"
          grep -q 'MultiFormatReader' "$PROJECT_DIR/app/src/main/java/com/example/util/CustomerQrImport.kt"
          grep -q 'ActivityResultContracts.OpenDocument' "$PROJECT_DIR/app/src/main/java/com/example/ui/CustomerSystemDialog.kt"
          grep -q 'قراءة QR من صورة أو PDF' "$PROJECT_DIR/app/src/main/java/com/example/ui/CustomerSystemDialog.kt"
          grep -q 'مسح QR بالكاميرا' "$PROJECT_DIR/app/src/main/java/com/example/ui/CustomerSystemDialog.kt"
          grep -q 'CustomerQrImport.readQrPayload' "$PROJECT_DIR/app/src/main/java/com/example/ui/CustomerSystemDialog.kt"

          # V39 Android Share target and pending shared URI flow.
          grep -q 'android.intent.action.SEND' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'android:mimeType="image/\*"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'android:mimeType="application/pdf"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'handleIncomingQrShare' "$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt"
          grep -q 'Intent.EXTRA_STREAM' "$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt"
          grep -q 'queueSharedQrUri' "$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt"
          grep -q 'pendingSharedQrUri' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsViewModel.kt"
          grep -q 'consumeSharedQrUri' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsViewModel.kt"
          grep -q 'initialQrUri = pendingSharedQrUri' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"

          # Stable unique customer QR and server/local lookup remain intact.
          grep -q 'TAHALIL_ALAKKAD_CUSTOMER|V=2|ID=' "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          grep -q 'findCustomerByQrPayload' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsViewModel.kt"
          grep -q 'GmsBarcodeScanning.getClient' "$PROJECT_DIR/app/src/main/java/com/example/ui/CustomerSystemDialog.kt"
          grep -q 'com.google.zxing:core:3.5.3' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'com.google.android.gms:play-services-code-scanner:16.1.0' "$PROJECT_DIR/app/build.gradle.kts"

          # V40 OCR test-name import from local image/PDF.
          grep -q 'com.google.mlkit:text-recognition:16.0.1' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'object TestDocumentImport' "$PROJECT_DIR/app/src/main/java/com/example/util/TestDocumentImport.kt"
          grep -q 'TextRecognition.getClient' "$PROJECT_DIR/app/src/main/java/com/example/util/TestDocumentImport.kt"
          grep -q 'PdfRenderer' "$PROJECT_DIR/app/src/main/java/com/example/util/TestDocumentImport.kt"
          grep -q 'ActivityResultContracts.OpenDocument' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          grep -q 'قراءة التحاليل من صورة أو PDF' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          grep -q 'detectTestsFromRecognizedText' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsViewModel.kt"
          grep -q 'applyRecognizedTestsToSearch' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsViewModel.kt"

          # Security stays enabled.
          grep -q 'FLAG_SECURE' "$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt"
          grep -q 'android:allowBackup="false"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'android:usesCleartextTraffic="false"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'isMinifyEnabled = true' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'isShrinkResources = true' "$PROJECT_DIR/app/build.gradle.kts"

          echo "TEST DOCUMENT IMPORT V40 verification passed"

      - name: Configure Android SDK
        script: |
          set -euo pipefail

          ANDROID_HOME="/usr/local/share/android-sdk"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$CM_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$CM_ENV"
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-36.1"
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Install Gradle 9.3.1
        script: |
          set -euo pipefail

          GRADLE_VERSION="9.3.1"
          GRADLE_DIR="$HOME/gradle-$GRADLE_VERSION"
          GRADLE_BIN="$GRADLE_DIR/bin/gradle"

          if [ ! -x "$GRADLE_BIN" ]; then
            rm -f /tmp/gradle.zip
            curl --fail --location --retry 3 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o /tmp/gradle.zip
            unzip -q -o /tmp/gradle.zip -d "$HOME"
          fi

          if [ ! -x "$GRADLE_BIN" ]; then
            echo "ERROR: Gradle installation failed"
            exit 1
          fi

          echo "GRADLE_BIN=$GRADLE_BIN" >> "$CM_ENV"
          "$GRADLE_BIN" --version

      - name: Validate release signing
        script: |
          set -euo pipefail

          if [ -z "${CM_KEYSTORE_PATH:-}" ] || [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: Release keystore missing"
            exit 1
          fi

          if [ -z "${CM_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${CM_KEY_ALIAS:-}" ] || \
             [ -z "${CM_KEY_PASSWORD:-}" ]; then
            echo "ERROR: Signing credentials incomplete"
            exit 1
          fi

          keytool -list \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -alias "$CM_KEY_ALIAS" \
            >/dev/null

      - name: Build TEST DOCUMENT IMPORT V40 APK and AAB
        script: |
          set -euo pipefail

          export KEYSTORE_PATH="$CM_KEYSTORE_PATH"
          export STORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export KEY_PASSWORD="$CM_KEY_PASSWORD"
          export KEY_ALIAS="$CM_KEY_ALIAS"

          cd "$PROJECT_DIR"

          "$GRADLE_BIN" \
            --no-daemon \
            --stacktrace \
            clean \
            :app:assembleRelease \
            :app:bundleRelease

          echo "Gradle build completed successfully"

          APK_FILE=$(find app/build/outputs/apk/release -type f -name "*.apk" -print -quit)
          AAB_FILE=$(find app/build/outputs/bundle/release -type f -name "*.aab" -print -quit)

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: AAB was not generated"
            exit 1
          fi

          RELEASE_DIR="$CM_BUILD_DIR/release"
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          cp "$APK_FILE" "$RELEASE_DIR/Tahalil-Alakkad-TEST-DOCUMENT-IMPORT-V40.apk"
          cp "$AAB_FILE" "$RELEASE_DIR/Tahalil-Alakkad-TEST-DOCUMENT-IMPORT-V40.aab"

          test -f "$RELEASE_DIR/Tahalil-Alakkad-TEST-DOCUMENT-IMPORT-V40.apk"
          test -f "$RELEASE_DIR/Tahalil-Alakkad-TEST-DOCUMENT-IMPORT-V40.aab"

          echo "V40 APK and AAB created successfully"
          ls -lah "$RELEASE_DIR"

    artifacts:
      - release/*.apk
      - release/*.aab
      - android_project/**/app/build/outputs/mapping/release/mapping.txt
      - android_project/**/app/build/outputs/logs/*
