workflows:
  android-release:
    name: Build Tahalil Alakkad COPYRIGHT SETTINGS V46
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17
      android_signing:
        - tahalil_alakkad_release

    scripts:
      - name: Extract COPYRIGHT SETTINGS V46 project
        script: |
          set -euo pipefail

          ZIP_FILE="$CM_BUILD_DIR/Project3_AK_SECURE_COPYRIGHT_SETTINGS_V46.zip"
          WORK_DIR="$CM_BUILD_DIR/android_project"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project3_AK_SECURE_COPYRIGHT_SETTINGS_V46.zip not found"
            ls -lah "$CM_BUILD_DIR"
            exit 1
          fi

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          unzip -q -o "$ZIP_FILE" -d "$WORK_DIR"

          SETTINGS_FILE=$(find "$WORK_DIR" -type f -name "settings.gradle.kts" -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Verify COPYRIGHT SETTINGS V46
        script: |
          set -euo pipefail

          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/ui/SplashScreen.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/util/SecureFileGuard.kt"
          test -f "$PROJECT_DIR/COPYRIGHT_SETTINGS_V46_NOTES.txt"
          test -f "$PROJECT_DIR/SECURITY_HARDENING_V45_NOTES.txt"

          grep -q 'versionCode = 51' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionName = "4.22-copyright-settings-v46"' "$PROJECT_DIR/app/build.gradle.kts"

          # V46: exact splash ownership text.
          grep -q 'text = "2026 A.M 🍃"' "$PROJECT_DIR/app/src/main/java/com/example/ui/SplashScreen.kt"
          grep -q 'text = "All Rights Reserved"' "$PROJECT_DIR/app/src/main/java/com/example/ui/SplashScreen.kt"
          grep -q 'Alignment.BottomCenter' "$PROJECT_DIR/app/src/main/java/com/example/ui/SplashScreen.kt"

          # V46: staff settings gear remains at the top on all staff screens.
          grep -q 'showSettings = !isManager || (isManager && showManagerHome)' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          grep -q 'imageVector = Icons.Default.Settings' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          grep -q 'testTag("manager_settings_button")' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"

          # Staff home remains visual and manager behavior stays separate.
          grep -q 'private fun StaffHomeDashboard' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          grep -q 'private fun StaffVisualActionCard' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          grep -q 'if (showManagerActions)' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"

          # Preserve V45 security hardening.
          grep -q 'android.permission.HIDE_OVERLAY_WINDOWS' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'window.setHideOverlayWindows(true)' "$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt"
          grep -q 'FLAG_SECURE' "$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt"
          grep -q 'android:allowBackup="false"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'android:usesCleartextTraffic="false"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'isMinifyEnabled = true' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'isShrinkResources = true' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'isDebuggable = false' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'object SecureFileGuard' "$PROJECT_DIR/app/src/main/java/com/example/util/SecureFileGuard.kt"

          echo "COPYRIGHT SETTINGS V46 verification passed"

      - name: Configure Android SDK
        script: |
          set -euo pipefail

          ANDROID_HOME="/usr/local/share/android-sdk"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$CM_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$CM_ENV"
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-36.1"
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Install Gradle 9.3.1
        script: |
          set -euo pipefail

          GRADLE_VERSION="9.3.1"
          GRADLE_DIR="$HOME/gradle-$GRADLE_VERSION"
          GRADLE_BIN="$GRADLE_DIR/bin/gradle"

          if [ ! -x "$GRADLE_BIN" ]; then
            rm -f /tmp/gradle.zip
            curl --fail --location --retry 3 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o /tmp/gradle.zip
            unzip -q -o /tmp/gradle.zip -d "$HOME"
          fi

          if [ ! -x "$GRADLE_BIN" ]; then
            echo "ERROR: Gradle installation failed"
            exit 1
          fi

          echo "GRADLE_BIN=$GRADLE_BIN" >> "$CM_ENV"
          "$GRADLE_BIN" --version

      - name: Validate release signing
        script: |
          set -euo pipefail

          if [ -z "${CM_KEYSTORE_PATH:-}" ] || [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: Release keystore missing"
            exit 1
          fi

          if [ -z "${CM_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${CM_KEY_ALIAS:-}" ] || \
             [ -z "${CM_KEY_PASSWORD:-}" ]; then
            echo "ERROR: Signing credentials incomplete"
            exit 1
          fi

          keytool -list \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -alias "$CM_KEY_ALIAS" \
            >/dev/null

      - name: Build COPYRIGHT SETTINGS V46 APK and AAB
        script: |
          set -euo pipefail

          export KEYSTORE_PATH="$CM_KEYSTORE_PATH"
          export STORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export KEY_PASSWORD="$CM_KEY_PASSWORD"
          export KEY_ALIAS="$CM_KEY_ALIAS"

          cd "$PROJECT_DIR"

          "$GRADLE_BIN" \
            --no-daemon \
            --stacktrace \
            clean \
            :app:assembleRelease \
            :app:bundleRelease

          echo "Gradle build completed successfully"

          APK_FILE=$(find app/build/outputs/apk/release -type f -name "*.apk" -print -quit)
          AAB_FILE=$(find app/build/outputs/bundle/release -type f -name "*.aab" -print -quit)

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: AAB was not generated"
            exit 1
          fi

          RELEASE_DIR="$CM_BUILD_DIR/release"
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          cp "$APK_FILE" "$RELEASE_DIR/Tahalil-Alakkad-COPYRIGHT-SETTINGS-V46.apk"
          cp "$AAB_FILE" "$RELEASE_DIR/Tahalil-Alakkad-COPYRIGHT-SETTINGS-V46.aab"

          test -f "$RELEASE_DIR/Tahalil-Alakkad-COPYRIGHT-SETTINGS-V46.apk"
          test -f "$RELEASE_DIR/Tahalil-Alakkad-COPYRIGHT-SETTINGS-V46.aab"

          echo "V46 APK and AAB created successfully"
          ls -lah "$RELEASE_DIR"

    artifacts:
      - release/*.apk
      - release/*.aab
      - android_project/**/app/build/outputs/mapping/release/mapping.txt
      - android_project/**/app/build/outputs/logs/*
