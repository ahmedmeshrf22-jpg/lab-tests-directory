workflows:
  android-release:
    name: Build Tahalil Alakkad V65 FULLSCREEN TASK WORKSPACE
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17
      android_signing:
        - tahalil_alakkad_release

    scripts:
      - name: Extract V65 project
        script: |
          set -euo pipefail

          ZIP_FILE="$CM_BUILD_DIR/Project3_AK_SECURE_FULLSCREEN_TASK_WORKSPACE_V65.zip"
          WORK_DIR="$CM_BUILD_DIR/android_project"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: V65 project ZIP not found: $ZIP_FILE"
            find "$CM_BUILD_DIR" -maxdepth 2 -type f -iname '*.zip' -print || true
            exit 1
          fi

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          unzip -q -o "$ZIP_FILE" -d "$WORK_DIR"

          SETTINGS_FILE=$(find "$WORK_DIR" -type f -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Verify V65 fullscreen task workspace
        script: |
          set -euo pipefail

          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import json, re, sys

          root = Path(sys.argv[1])

          required = [
              "app/build.gradle.kts",
              "gradle/libs.versions.toml",
              "app/src/main/AndroidManifest.xml",
              "app/google-services.json",
              "app/src/main/java/com/example/MainActivity.kt",
              "app/src/main/java/com/example/ui/SplashScreen.kt",
              "app/src/main/java/com/example/ui/LabTestsViewModel.kt",
              "app/src/main/java/com/example/ui/LabTestsScreen.kt",
              "app/src/main/java/com/example/ui/CustomerSystemDialog.kt",
              "app/src/main/java/com/example/ui/OperationsV14Dialog.kt",
              "app/src/main/java/com/example/util/TestDocumentImport.kt",
              "app/src/main/java/com/example/util/CustomerQrImport.kt",
              "app/src/main/java/com/example/util/SecureFileGuard.kt",
              "app/src/main/java/com/example/util/PdfGenerator.kt",
              "app/src/main/assets/lab_tests_android.json",
              "firestore.rules",
              "FINAL_AUDIT_V61_NOTES.txt",
              "SMART_MEDICAL_VISION_V62_NOTES.txt",
              "IMPORT_SELECTION_FIX_V63_NOTES.txt",
              "CUSTOMER_ORDER_WORKFLOW_V64_NOTES.txt",
              "FULLSCREEN_TASK_WORKSPACE_V65_NOTES.txt",
              "app/src/main/java/com/example/util/SmartMedicalVision.kt",
          ]
          missing = [p for p in required if not (root / p).is_file()]
          if missing:
              raise SystemExit("Missing required files:\n" + "\n".join(missing))

          def read(rel):
              return (root / rel).read_text(encoding="utf-8")

          build = read("app/build.gradle.kts")
          for needle in [
              "compileSdk = 36",
              'buildToolsVersion = "35.0.0"',
              "versionCode = 65",
              'versionName = "4.32-fullscreen-task-workspace-v65"',
              "isMinifyEnabled = true",
              "isShrinkResources = true",
              "isDebuggable = false",
          ]:
              if needle not in build:
                  raise SystemExit(f"Build verification missing: {needle}")

          # Existing V60 login/admin behavior must remain unchanged.
          main = read("app/src/main/java/com/example/MainActivity.kt")
          forbidden_main = [
              'deviceAccessStatus by viewModel.deviceAccessStatus.collectAsState()',
              'currentUser != null && deviceAccessStatus == "checking"',
              'currentUser != null && deviceAccessStatus != "approved"',
              'DeviceAuthorizationScreen(',
          ]
          found = [x for x in forbidden_main if x in main]
          if found:
              raise SystemExit("Login is still gated by device approval: " + ", ".join(found))

          vm = read("app/src/main/java/com/example/ui/LabTestsViewModel.kt")
          for needle in [
              "private fun hasAdminAccess(): Boolean = _actualManager.value || _adminUnlocked.value",
              "if (_actualManager.value) firestore",
              "else adminFirestore ?: error(\"Admin access is not unlocked\")",
              "fun unlockAdmin(pin: String",
              "ADMIN_PIN_VERIFIER",
          ]:
              if needle not in vm:
                  raise SystemExit(f"Admin PIN behavior missing: {needle}")

          # 1) Splash copyright.
          splash = read("app/src/main/java/com/example/ui/SplashScreen.kt")
          for needle in ["2026 A.M 🍃", "All Rights Reserved", "Alignment.BottomCenter"]:
              if needle not in splash:
                  raise SystemExit(f"Splash copyright verification missing: {needle}")

          # 2) Staff workflow status Firestore rule, restricted to known values.
          rules = read("firestore.rules")
          for needle in [
              "'workflow_status'",
              "hasAny(['workflow_status'])",
              "request.resource.data.workflow_status in [",
              "'sent_to_lab'",
              "'processing'",
              "'ready'",
              "'delivered'",
          ]:
              if needle not in rules:
                  raise SystemExit(f"Workflow rules verification missing: {needle}")

          # 3) Range prices: all legacy ranges must be parseable without becoming zero.
          if 'matchEntire(normalized)' not in vm or 'groupValues[1].toDoubleOrNull()' not in vm:
              raise SystemExit("Range-safe order price parser missing")
          tests = json.loads(read("app/src/main/assets/lab_tests_android.json"))
          ranges = [str(x.get("customer_price")) for x in tests if isinstance(x.get("customer_price"), str) and "/" in x.get("customer_price")]
          if not ranges:
              raise SystemExit("Expected legacy range prices were not found")
          range_re = re.compile(r"^(\d+(?:\.\d+)?)(?:\s*/\s*\d+(?:\.\d+)?)?$")
          bad_ranges = [x for x in ranges if not range_re.fullmatch(x.replace(",", "").strip())]
          if bad_ranges:
              raise SystemExit("Unsupported range prices: " + ", ".join(bad_ranges))

          # 4) Customer QR from cloud/provider PDF uses a private seekable cache file.
          qr = read("app/src/main/java/com/example/util/CustomerQrImport.kt")
          for needle in [
              'File.createTempFile("customer_qr_import_", ".pdf", context.cacheDir)',
              'ParcelFileDescriptor.open(tempPdf, ParcelFileDescriptor.MODE_READ_ONLY)',
              'runCatching { tempPdf.delete() }',
              'error("ملف PDF محمي بكلمة مرور أو لا يسمح بقراءته")',
          ]:
              if needle not in qr:
                  raise SystemExit(f"QR PDF verification missing: {needle}")

          # 5) Rendered PDF pages use the same handwriting preprocessing as images.
          pdf_import = read("app/src/main/java/com/example/util/TestDocumentImport.kt")
          for needle in [
              'val pageText = recognizeImageRobust(recognizer, bitmap).trim()',
              'createHighContrastBitmap',
              'targetWidth = max(bitmap.width, 1800)',
              'File.createTempFile("lab_tests_import_", ".pdf", context.cacheDir)',
          ]:
              if needle not in pdf_import:
                  raise SystemExit(f"PDF handwriting OCR verification missing: {needle}")

          # 6) Direct Android Share supports modern phone image MIME types.
          manifest = read("app/src/main/AndroidManifest.xml")
          for needle in [
              'android:mimeType="image/heic"',
              'android:mimeType="image/heif"',
              'android:mimeType="image/avif"',
              'android:mimeType="application/pdf"',
          ]:
              if needle not in manifest:
                  raise SystemExit(f"Share MIME verification missing: {needle}")

          # Security hardening must remain present.
          for needle in [
              'android:allowBackup="false"',
              'android:usesCleartextTraffic="false"',
              'android.permission.HIDE_OVERLAY_WINDOWS',
          ]:
              if needle not in manifest:
                  raise SystemExit(f"Security verification missing: {needle}")

          # V62 true multimodal medical-document vision, with local OCR fallback.
          smart = read("app/src/main/java/com/example/util/SmartMedicalVision.kt")
          for needle in [
              'FirebaseAI.instance.generativeModel(modelName)',
              '"gemini-3.6-flash"',
              'bitmaps.forEach { bitmap -> image(bitmap) }',
              'Extract ONLY laboratory tests that are explicitly requested',
              'Do NOT diagnose, recommend, infer, or add tests',
          ]:
              if needle not in smart:
                  raise SystemExit(f"Smart vision verification missing: {needle}")

          importer = read("app/src/main/java/com/example/util/TestDocumentImport.kt")
          for needle in [
              'suspend fun readTests(',
              'SmartMedicalVision.isOnline(context)',
              'extractRequestedLabTests(visionBitmaps, localText)',
              'ReadMode.SMART_VISION',
              'SmartFallbackReason.OFFLINE',
              'MAX_VISION_PDF_PAGES = 4',
          ]:
              if needle not in importer:
                  raise SystemExit(f"Vision import verification missing: {needle}")

          screen = read("app/src/main/java/com/example/ui/LabTestsScreen.kt")
          for needle in [
              'TestDocumentImport.readTests(context, uri)',
              'تم التعرف الذكي على',
              'شغّل الإنترنت لاستخدام القراءة الذكية للخط اليدوي',
          ]:
              if needle not in screen:
                  raise SystemExit(f"Vision UI verification missing: {needle}")

          # V63: selecting one imported result must keep the remaining results, and
          # the full detected batch can be added in one action.
          for needle in [
              'private val _recognizedTests = MutableStateFlow<List<LabTest>>(emptyList())',
              'val recognizedTests: StateFlow<List<LabTest>> = _recognizedTests.asStateFlow()',
              'fun onManualQueryChanged(newQuery: String)',
              'fun addAllRecognizedTests(): Int',
              'selectedExactMatch -> Unit',
              'onQueryChanged(current)',
          ]:
              if needle not in vm:
                  raise SystemExit(f"V63 selection-flow verification missing: {needle}")

          add_fn = vm.split('fun addSelectedTest(test: LabTest)', 1)[1].split('fun addAllRecognizedTests()', 1)[0]
          if 'clearSearch()' in add_fn:
              raise SystemExit('V63 regression: addSelectedTest still clears the entire search')

          for needle in [
              'val recognizedTests by viewModel.recognizedTests.collectAsState()',
              'onQueryChange = { viewModel.onManualQueryChanged(it) }',
              'RecognizedTestsActionsCard(',
              'إضافة كل التحاليل المقروءة',
              'add_all_recognized_tests',
              'viewModel.addAllRecognizedTests()',
          ]:
              if needle not in screen:
                  raise SystemExit(f"V63 selection UI verification missing: {needle}")

          # V64 behavior must remain: totals, full customer dialogs and reopening the saved customer file.
          for needle in [
              'text = tr("إجمالي الطلب الحالي", "Current Order Total")',
              '.fillMaxHeight(0.94f)',
              'customerSystemInitialCustomer = activeOrderCustomer',
              'initialCustomer = customerSystemInitialCustomer',
          ]:
              if needle not in screen:
                  raise SystemExit(f"V64 order workflow regression: {needle}")

          # V65: active tasks own the whole screen and all task content shares one scroll surface.
          for needle in [
              'if (managerMainMode == "home")',
              'TemporaryWorkspaceTopBar(',
              'testTag("temporary_workspace_back")',
              'testTag("temporary_workspace_settings")',
              'topContent: (@Composable () -> Unit)? = null',
              'item(key = "workspace_top_content")',
              'results use the full screen',
              'bottomContent = null',
          ]:
              if needle not in screen:
                  raise SystemExit(f"V65 fullscreen workspace verification missing: {needle}")

          if screen.count('WorkspaceMoreSection(') != 1:
              raise SystemExit('V65 regression: unrelated More navigation is still rendered inside an active task')

          if 'Modifier.weight(1f).fillMaxWidth()' in screen:
              raise SystemExit('V65 regression: task results are still constrained to the old small weighted lower viewport')

          customer_ui = read("app/src/main/java/com/example/ui/CustomerSystemDialog.kt")
          for needle in [
              'initialCustomer: Customer? = null',
              'var selectedCustomer by remember(initialCustomer?.id)',
              'كل طلب محفوظ يظهر هنا',
              'فتح / طباعة / PDF / صورة',
              'ordersLoading: Boolean',
              'جاري تحميل الطلبات المحفوظة',
              'طباعة / PDF / صورة للطلب',
          ]:
              if needle not in customer_ui:
                  raise SystemExit(f"V64 customer file verification missing: {needle}")

          for needle in [
              'val customerOrdersLoading: StateFlow<Boolean> = _customerOrdersLoading.asStateFlow()',
              'fun loadCustomerOrders(customerId: String, preserveCurrent: Boolean = false)',
              '_customerOrdersLoading.value = true',
              'loadCustomerOrders(customer.id, preserveCurrent = true)',
              '_customerOrders.value = listOf(order) + _customerOrders.value.filterNot { it.id == order.id }',
          ]:
              if needle not in vm:
                  raise SystemExit(f"V64 saved-order persistence verification missing: {needle}")

          pdf = read("app/src/main/java/com/example/util/PdfGenerator.kt")
          for needle in [
              'fun printGeneratedPdf(',
              'PrintManager',
              'PrintAttributes.MediaSize.ISO_A5',
              'PageRange.ALL_PAGES',
          ]:
              if needle not in pdf:
                  raise SystemExit(f"V64 direct print verification missing: {needle}")

          output = read("app/src/main/java/com/example/ui/OrderPdfShareDialog.kt")
          for needle in [
              'طباعة إيصال العميل',
              'طباعة طلب المعمل',
              'verticalScroll(rememberScrollState())',
          ]:
              if needle not in output:
                  raise SystemExit(f"V64 output dialog verification missing: {needle}")

          if 'implementation(libs.firebase.ai)' not in build:
              raise SystemExit("Firebase AI Logic dependency missing")

          print(f"V65 FULLSCREEN TASK WORKSPACE verification passed; legacy range prices checked: {len(ranges)}")
          PY

      - name: Configure Android SDK 36
        script: |
          set -euo pipefail

          ANDROID_HOME="/usr/local/share/android-sdk"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found at $SDKMANAGER"
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$CM_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$CM_ENV"
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Use compatible preinstalled Gradle
        script: |
          set -euo pipefail

          GRADLE_BIN=$(command -v gradle || true)

          if [ -z "$GRADLE_BIN" ] || [ ! -x "$GRADLE_BIN" ]; then
            for candidate in \
              "$HOME/programs/gradle-8.14.1/bin/gradle" \
              "/Users/builder/programs/gradle-8.14.1/bin/gradle"
            do
              if [ -x "$candidate" ]; then
                GRADLE_BIN="$candidate"
                break
              fi
            done
          fi

          if [ -z "$GRADLE_BIN" ] || [ ! -x "$GRADLE_BIN" ]; then
            echo "ERROR: No compatible preinstalled Gradle found"
            exit 1
          fi

          GRADLE_VERSION=$($GRADLE_BIN --version | awk '/^Gradle / {print $2; exit}')
          echo "Detected Gradle $GRADLE_VERSION at $GRADLE_BIN"

          python3 - "$GRADLE_VERSION" <<'PY'
          import sys
          parts = sys.argv[1].split('.')
          major = int(parts[0])
          minor = int(parts[1]) if len(parts) > 1 else 0
          if major != 8 or minor < 11:
              raise SystemExit(f"Gradle {sys.argv[1]} is incompatible; need Gradle 8.11+ and <9")
          PY

          echo "GRADLE_BIN=$GRADLE_BIN" >> "$CM_ENV"
          "$GRADLE_BIN" --version

      - name: Validate release signing
        script: |
          set -euo pipefail

          if [ -z "${CM_KEYSTORE_PATH:-}" ] || [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: Release keystore missing"
            exit 1
          fi

          if [ -z "${CM_KEYSTORE_PASSWORD:-}" ] || [ -z "${CM_KEY_ALIAS:-}" ] || [ -z "${CM_KEY_PASSWORD:-}" ]; then
            echo "ERROR: Signing credentials incomplete"
            exit 1
          fi

          keytool -list \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -alias "$CM_KEY_ALIAS" \
            >/dev/null

      - name: Build V65 fullscreen task workspace APK and AAB
        script: |
          set -euo pipefail

          export KEYSTORE_PATH="$CM_KEYSTORE_PATH"
          export STORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export KEY_PASSWORD="$CM_KEY_PASSWORD"
          export KEY_ALIAS="$CM_KEY_ALIAS"
          export GRADLE_USER_HOME="$CM_BUILD_DIR/.gradle-v65-fullscreen-task-workspace"

          cd "$PROJECT_DIR"

          BUILD_LOG="$CM_BUILD_DIR/v65-fullscreen-task-workspace-build.log"
          rm -f "$BUILD_LOG"

          set +e
          "$GRADLE_BIN" \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=2 \
            --console=plain \
            clean \
            :app:assembleRelease \
            :app:bundleRelease \
            2>&1 | tee "$BUILD_LOG"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo ""
            echo "================ BUILD ERROR SUMMARY ================"
            grep -nE '(^e: |error:|FAILURE:|What went wrong:|Execution failed for task|Caused by:|Could not resolve|Could not find|Inconsistent JVM|Compilation error)' "$BUILD_LOG" | head -120 || true
            echo "====================================================="
            exit "$BUILD_STATUS"
          fi

          APK_FILE=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          AAB_FILE=$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: AAB was not generated"
            exit 1
          fi

          RELEASE_DIR="$CM_BUILD_DIR/release"
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          cp "$APK_FILE" "$RELEASE_DIR/Tahalil-Alakkad-V65-FULLSCREEN-TASK-WORKSPACE.apk"
          cp "$AAB_FILE" "$RELEA
