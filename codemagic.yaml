workflows:
  android-release:
    name: Build Tahalil Alakkad RELEASE
    instance_type: linux_x2
    max_build_duration: 60

    environment:
      java: 17
      android_signing:
        - tahalil_alakkad_release

    scripts:
      - name: Find and extract Android project
        script: |
          set -euo pipefail

          WORK_DIR="$CM_BUILD_DIR/android_project"
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"

          # لو المشروع موجود مباشرة بدون ZIP
          SETTINGS_FILE=$(find "$CM_BUILD_DIR" \
            -path "$WORK_DIR" -prune -o \
            -name "settings.gradle.kts" -type f -print | head -n 1 || true)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            echo "Android project found directly."
          else
            # اختيار ملف المشروع تلقائياً بدون الحاجة لتغيير اسمه
            ZIP_FILE=""

            if [ -f "$CM_BUILD_DIR/Project3_fixed.zip" ]; then
              ZIP_FILE="$CM_BUILD_DIR/Project3_fixed.zip"
            elif [ -f "$CM_BUILD_DIR/Project3.zip" ]; then
              ZIP_FILE="$CM_BUILD_DIR/Project3.zip"
            else
              ZIP_FILE=$(find "$CM_BUILD_DIR" -maxdepth 1 -type f -iname "*.zip" \
                -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2- || true)
            fi

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android project or ZIP file found."
              exit 1
            fi

            echo "Using ZIP:"
            echo "$ZIP_FILE"

            unzip -q -o "$ZIP_FILE" -d "$WORK_DIR"

            SETTINGS_FILE=$(find "$WORK_DIR" -name "settings.gradle.kts" -type f | head -n 1 || true)

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle.kts not found."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"

          echo "============================"
          echo "PROJECT ROOT:"
          echo "$PROJECT_DIR"
          echo "============================"

          ls -lah "$PROJECT_DIR"


      - name: Configure Android SDK
        script: |
          set -euo pipefail

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"


      - name: Install Gradle 9.3.1
        script: |
          set -euo pipefail

          GRADLE_VERSION="9.3.1"
          GRADLE_HOME="$HOME/gradle-$GRADLE_VERSION"

          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            rm -f /tmp/gradle.zip

            curl --fail --location --retry 3 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o /tmp/gradle.zip

            unzip -q -o /tmp/gradle.zip -d "$HOME"
          fi

          echo "GRADLE_BIN=$GRADLE_HOME/bin/gradle" >> "$CM_ENV"

          "$GRADLE_HOME/bin/gradle" --version


      - name: Configure release signing
        script: |
          set -euo pipefail

          if [ -z "${CM_KEYSTORE_PATH:-}" ]; then
            echo "ERROR: Codemagic keystore not found."
            exit 1
          fi

          if [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: Keystore file does not exist."
            exit 1
          fi

          export APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          python3 <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["APP_GRADLE"])
          text = p.read_text(encoding="utf-8")

          text = text.replace(
              'keyAlias = "upload"',
              'keyAlias = System.getenv("KEY_ALIAS") ?: "upload"'
          )

          p.write_text(text, encoding="utf-8")
          PY

          echo "Signing configured."


      - name: Build Release APK and AAB
        script: |
          set -euo pipefail

          export KEYSTORE_PATH="$CM_KEYSTORE_PATH"
          export STORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export KEY_PASSWORD="$CM_KEY_PASSWORD"
          export KEY_ALIAS="$CM_KEY_ALIAS"

          cd "$PROJECT_DIR"

          "$GRADLE_BIN" \
            --no-daemon \
            --stacktrace \
            clean \
            :app:assembleRelease \
            :app:bundleRelease

          mkdir -p "$CM_BUILD_DIR/release"

          APK=$(find app/build/outputs/apk/release \
            -type f -name "*.apk" | head -n 1)

          AAB=$(find app/build/outputs/bundle/release \
            -type f -name "*.aab" | head -n 1)

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: Release APK not generated."
            exit 1
          fi

          if [ -z "$AAB" ] || [ ! -f "$AAB" ]; then
            echo "ERROR: Release AAB not generated."
            exit 1
          fi

          cp "$APK" "$CM_BUILD_DIR/release/Tahalil-Alakkad.apk"
          cp "$AAB" "$CM_BUILD_DIR/release/Tahalil-Alakkad.aab"

          echo "============================"
          echo "BUILD SUCCESSFUL"
          echo "============================"

          ls -lh "$CM_BUILD_DIR/release"


    artifacts:
      - release/*.apk
      - release/*.aab
      - android_project/**/app/build/outputs/logs/*
