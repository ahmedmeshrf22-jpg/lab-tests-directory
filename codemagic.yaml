workflows:
  android-release:
    name: Build Tahalil Alakkad V58 UNIFIED ADMIN PASSWORD
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17
      android_signing:
        - tahalil_alakkad_release

    scripts:
      - name: Extract verified V45 project
        script: |
          set -euo pipefail

          ZIP_FILE="$CM_BUILD_DIR/Project3_AK_SECURE_UNIFIED_ADMIN_PASSWORD_V58.zip"
          WORK_DIR="$CM_BUILD_DIR/android_project"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found"
            echo "ZIP files present in repository:"
            find "$CM_BUILD_DIR" -maxdepth 2 -type f -iname '*.zip' -print || true
            exit 1
          fi

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          unzip -q -o "$ZIP_FILE" -d "$WORK_DIR"

          SETTINGS_FILE=$(find "$WORK_DIR" -type f -name 'settings.gradle.kts' -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found after extraction"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Verify fixed Android toolchain
        script: |
          set -euo pipefail

          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/gradle/libs.versions.toml"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/google-services.json"
          test -f "$PROJECT_DIR/BUILD_ONLY_FIX_V45_NOTES.txt"
          test -f "$PROJECT_DIR/ALL_ICON_SERVICES_V55_NOTES.txt"
          test -f "$PROJECT_DIR/THREED_ICON_UI_V56_NOTES.txt"

          # V56 approved 3D icon UI
          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/mgr_reports_3d.png"
          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/mgr_staff_3d.png"
          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/mgr_devices_3d.png"
          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/mgr_alerts_3d.png"
          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/mgr_integrity_3d.png"
          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/mgr_health_3d.png"
          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/mgr_audit_3d.png"
          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/mgr_switch_3d.png"
          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/settings_3d.png"
          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/staff_search_3d.png"
          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/staff_new_order_3d.png"
          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/staff_pdf_3d.png"
          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/staff_qr_3d.png"
          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/staff_customers_3d.png"
          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/staff_tests_3d.png"
          grep -q 'private fun GlossyServiceCard' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          grep -q 'R.drawable.mgr_reports_3d' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          grep -q 'R.drawable.staff_search_3d' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          grep -q 'R.drawable.settings_3d' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"

          grep -q 'agp = "8.10.0"' "$PROJECT_DIR/gradle/libs.versions.toml"
          grep -q 'kotlin = "2.2.10"' "$PROJECT_DIR/gradle/libs.versions.toml"
          grep -q 'googleDevtoolsKsp = "2.3.6"' "$PROJECT_DIR/gradle/libs.versions.toml"
          grep -q 'kotlin-android = { id = "org.jetbrains.kotlin.android"' "$PROJECT_DIR/gradle/libs.versions.toml"
          grep -q 'alias(libs.plugins.kotlin.android)' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'compileSdk = 36' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'buildToolsVersion = "35.0.0"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'jvmTarget.set(JvmTarget.JVM_11)' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'targetCompatibility = JavaVersion.VERSION_11' "$PROJECT_DIR/app
