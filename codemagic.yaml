workflows:
  android-release:
    name: Build Tahalil Alakkad SECURITY HARDENING V45
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17
      android_signing:
        - tahalil_alakkad_release

    scripts:
      - name: Extract SECURITY HARDENING V45 project
        script: |
          set -euo pipefail

          ZIP_FILE="$CM_BUILD_DIR/Project3_AK_SECURE_SECURITY_HARDENING_V45.zip"
          WORK_DIR="$CM_BUILD_DIR/android_project"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project3_AK_SECURE_SECURITY_HARDENING_V45.zip not found"
            ls -lah "$CM_BUILD_DIR"
            exit 1
          fi

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          unzip -q -o "$ZIP_FILE" -d "$WORK_DIR"

          SETTINGS_FILE=$(find "$WORK_DIR" -type f -name "settings.gradle.kts" -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Verify SECURITY HARDENING V45
        script: |
          set -euo pipefail

          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/ui/CustomerSystemDialog.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsViewModel.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/util/CustomerQrImport.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/util/TestDocumentImport.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/util/SecureFileGuard.kt"
          test -f "$PROJECT_DIR/SECURITY_HARDENING_V45_NOTES.txt"
          test -f "$PROJECT_DIR/STAFF_VISUAL_HOME_V44_NOTES.txt"

          grep -q 'versionCode = 50' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionName = "4.21-security-hardening-v45"' "$PROJECT_DIR/app/build.gradle.kts"

          grep -q 'android.permission.HIDE_OVERLAY_WINDOWS' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'window.setHideOverlayWindows(true)' "$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt"
          grep -q 'FLAG_SECURE' "$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt"

          grep -q 'android:mimeType="image/jpeg"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'android:mimeType="image/png"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'android:mimeType="image/webp"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'android:mimeType="application/pdf"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'uri.scheme == ContentResolver.SCHEME_CONTENT' "$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt"

          grep -q 'object SecureFileGuard' "$PROJECT_DIR/app/src/main/java/com/example/util/SecureFileGuard.kt"
          grep -q 'MAX_IMAGE_BYTES = 20L' "$PROJECT_DIR/app/src/main/java/com/example/util/SecureFileGuard.kt"
          grep -q 'MAX_PDF_BYTES = 30L' "$PROJECT_DIR/app/src/main/java/com/example/util/SecureFileGuard.kt"
          grep -q 'detectImageMime' "$PROJECT_DIR/app/src/main/java/com/example/util/SecureFileGuard.kt"
          grep -q 'decodeImageSafely' "$PROJECT_DIR/app/src/main/java/com/example/util/SecureFileGuard.kt"
          grep -q 'SecureFileGuard.validate' "$PROJECT_DIR/app/src/main/java/com/example/util/TestDocumentImport.kt"
          grep -q 'SecureFileGuard.validate' "$PROJECT_DIR/app/src/main/java/com/example/util/CustomerQrImport.kt"
          grep -q 'raw.length > 512' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsViewModel.kt"

          grep -q 'android:allowBackup="false"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'android:usesCleartextTraffic="false"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q '<certificates src="system"' "$PROJECT_DIR/app/src/main/res/xml/network_security_config.xml"
          grep -q 'isMinifyEnabled = true' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'isShrinkResources = true' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'isDebuggable = false' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'PlayIntegrityAppCheckProviderFactory' "$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt"

          grep -q 'private fun StaffHomeDashboard' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          grep -q 'private fun StaffVisualActionCard' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          grep -q 'private fun StaffFeatureIllustration' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          grep -q 'private fun CustomerVisualToolCard' "$PROJECT_DIR/app/src/main/java/com/example/ui/CustomerSystemDialog.kt"

          echo "SECURITY HARDENING V45 verification passed"

      - name: Configure Android SDK
        script: |
          set -euo pipefail

          ANDROID_HOME="/usr/local/share/android-sdk"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$CM_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$CM_ENV"
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-36.1"
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        script: |
          set -euo pipefail

          GRADLE_VERSION="9.3.1"
          GRADLE_DIR="$HOME/gradle-$GRADLE_VERSION"
          GRADLE_BIN="$GRADLE_DIR/bin/gradle"
          GRADLE_ZIP="$CM_BUILD_DIR/gradle-${GRADLE_VERSION}-bin.zip"

          if [ ! -x "$GRADLE_BIN" ]; then
            echo "Gradle $GRADLE_VERSION is not preinstalled. Installing it..."

            rm -rf "$GRADLE_DIR"
            rm -f "$GRADLE_ZIP"

            echo "Trying direct Gradle download..."

            if ! curl --http1.1 --fail --location \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 3 \
              --connect-timeout 30 \
              --max-time 900 \
              "https://downloads.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o "$GRADLE_ZIP"; then

              echo "Direct download failed. Trying Gradle services fallback..."

              rm -f "$GRADLE_ZIP"

              if ! wget \
                --tries=5 \
                --timeout=30 \
                --read-timeout=120 \
                --output-document="$GRADLE_ZIP" \
                "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"; then

                echo "ERROR: Could not download Gradle $GRADLE_VERSION from either source"
                exit 1
              fi
            fi

            if [ ! -s "$GRADLE_ZIP" ]; then
              echo "ERROR: Gradle archive is empty"
              exit 1
            fi

            echo "Downloaded Gradle archive:"
            ls -lh "$GRADLE_ZIP"

            if ! unzip -tq "$GRADLE_ZIP" >/dev/null; then
              echo "ERROR: Downloaded Gradle ZIP is corrupt"
              exit 1
            fi

            unzip -q -o "$GRADLE_ZIP" -d "$HOME"
          fi

          if [ ! -x "$GRADLE_BIN" ]; then
            echo "ERROR: Gradle $GRADLE_VERSION installation failed"
            exit 1
          fi

          echo "GRADLE_BIN=$GRADLE_BIN" >> "$CM_ENV"

          echo "Using Gradle:"
          "$GRADLE_BIN" --version

      - name: Validate release signing
        script: |
          set -euo pipefail

          if [ -z "${CM_KEYSTORE_PATH:-}" ] || [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: Release keystore missing"
            exit 1
          fi

          if [ -z "${CM_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${CM_KEY_ALIAS:-}" ] || \
             [ -z "${CM_KEY_PASSWORD:-}" ]; then

            echo "ERROR: Signing credentials incomplete"
            exit 1
          fi

          keytool -list \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -alias "$CM_KEY_ALIAS" \
            >/dev/null

      - name: Build SECURITY HARDENING V45 APK and AAB
        script: |
          set -euo pipefail

          export KEYSTORE_PATH="$CM_KEYSTORE_PATH"
          export STORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export KEY_PASSWORD="$CM_KEY_PASSWORD"
          export KEY_ALIAS="$CM_KEY_ALIAS"

          cd "$PROJECT_DIR"

          "$GRADLE_BIN" \
            --no-daemon \
            --stacktrace \
            clean \
            :app:assembleRelease \
            :app:bundleRelease

          echo "Gradle build completed successfully"

          APK_FILE=$(find app/build/outputs/apk/release -type f -name "*.apk" -print -quit)
          AAB_FILE=$(find app/build/outputs/bundle/release -type f -name "*.aab" -print -quit)

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: AAB was not generated"
            exit 1
          fi

          RELEASE_DIR="$CM_BUILD_DIR/release"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          cp "$APK_FILE" "$RELEASE_DIR/Tahalil-Alakkad-SECURITY-HARDENING-V45.apk"
          cp "$AAB_FILE" "$RELEASE_DIR/Tahalil-Alakkad-SECURITY-HARDENING-V45.aab"

          test -f "$RELEASE_DIR/Tahalil-Alakkad-SECURITY-HARDENING-V45.apk"
          test -f "$RELEASE_DIR/Tahalil-Alakkad-SECURITY-HARDENING-V45.aab"

          echo "V45 APK and AAB created successfully"

          ls -lah "$RELEASE_DIR"

    artifacts:
      - release/*.apk
      - release/*.aab
      - android_project/**/app/build/outputs/mapping/release/mapping.txt
      - android_project/**/app/build/outputs/logs/*
