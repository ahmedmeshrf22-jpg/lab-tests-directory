workflows:
  android-release:
    name: Build Tahalil Alakkad RELEASE
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17

      android_signing:
        - tahalil_alakkad_release

    scripts:
      - name: Find Android project
        script: |
          set -euo pipefail

          WORK_DIR="$CM_BUILD_DIR/android_project"

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"

          SETTINGS_FILE="$(find "$CM_BUILD_DIR" \
            -path "$WORK_DIR" -prune -o \
            -name "settings.gradle.kts" \
            -type f -print | head -n 1 || true)"

          if [ -n "$SETTINGS_FILE" ]; then

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

            echo "Project found directly:"
            echo "$PROJECT_DIR"

          else

            ZIP_FILE=""

            if [ -f "$CM_BUILD_DIR/Project3_fixed.zip" ]; then
              ZIP_FILE="$CM_BUILD_DIR/Project3_fixed.zip"

            elif [ -f "$CM_BUILD_DIR/Project3.zip" ]; then
              ZIP_FILE="$CM_BUILD_DIR/Project3.zip"

            elif [ -f "$CM_BUILD_DIR/untitled (2).zip" ]; then
              ZIP_FILE="$CM_BUILD_DIR/untitled (2).zip"

            else
              ZIP_FILE="$(find "$CM_BUILD_DIR" \
                -maxdepth 1 \
                -type f \
                -iname "*.zip" \
                | head -n 1 || true)"
            fi

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android project ZIP found."
              echo "Files:"
              ls -lah "$CM_BUILD_DIR"
              exit 1
            fi

            echo "Using ZIP:"
            echo "$ZIP_FILE"

            if ! unzip -q -o "$ZIP_FILE" -d "$WORK_DIR"; then

              echo "Normal unzip failed."
              echo "Trying fallback extractor..."

              rm -rf "$WORK_DIR"
              mkdir -p "$WORK_DIR"

              cat > "$CM_BUILD_DIR/LenientZipExtract.java" <<'JAVA'
          import java.io.*;
          import java.nio.file.*;
          import java.util.zip.*;

          public class LenientZipExtract {
              public static void main(String[] args) throws Exception {
                  Path zipFile = Paths.get(args[0]);
                  Path outputDir = Paths.get(args[1]);

                  Files.createDirectories(outputDir);

                  try (
                      InputStream fis = Files.newInputStream(zipFile);
                      BufferedInputStream bis = new BufferedInputStream(fis);
                      ZipInputStream zis = new ZipInputStream(bis)
                  ) {
                      ZipEntry entry;

                      while ((entry = zis.getNextEntry()) != null) {

                          Path target = outputDir.resolve(entry.getName()).normalize();

                          if (!target.startsWith(outputDir)) {
                              throw new IOException("Unsafe ZIP entry: " + entry.getName());
                          }

                          if (entry.isDirectory()) {
                              Files.createDirectories(target);
                          } else {
                              Path parent = target.getParent();

                              if (parent != null) {
                                  Files.createDirectories(parent);
                              }

                              try (OutputStream out = Files.newOutputStream(target)) {
                                  byte[] buffer = new byte[8192];
                                  int len;

                                  while ((len = zis.read(buffer)) > 0) {
                                      out.write(buffer, 0, len);
                                  }
                              }
                          }

                          zis.closeEntry();
                      }
                  }
              }
          }
          JAVA

              cd "$CM_BUILD_DIR"

              javac LenientZipExtract.java

              java LenientZipExtract \
                "$ZIP_FILE" \
                "$WORK_DIR"
            fi

            SETTINGS_FILE="$(find "$WORK_DIR" \
              -name "settings.gradle.kts" \
              -type f | head -n 1 || true)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle.kts not found."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"

          echo "================================"
          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"
          echo "================================"

          ls -lah "$PROJECT_DIR"


      - name: Validate project
        script: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Project structure OK."


      - name: Configure Android SDK
        script: |
          set -euo pipefail

          echo "sdk.dir=$ANDROID_SDK_ROOT" \
            > "$PROJECT_DIR/local.properties"

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

          echo "Android SDK ready."


      - name: Install Gradle 9.3.1
        script: |
          set -euo pipefail

          GRADLE_VERSION="9.3.1"
          GRADLE_DIR="$HOME/gradle-$GRADLE_VERSION"

          if [ ! -x "$GRADLE_DIR/bin/gradle" ]; then

            echo "Downloading Gradle $GRADLE_VERSION..."

            rm -f /tmp/gradle.zip

            curl \
              --fail \
              --location \
              --retry 3 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o /tmp/gradle.zip

            unzip -q -o \
              /tmp/gradle.zip \
              -d "$HOME"
          fi

          echo "GRADLE_BIN=$GRADLE_DIR/bin/gradle" \
            >> "$CM_ENV"

          "$GRADLE_DIR/bin/gradle" --version


      - name: Configure release signing
        script: |
          set -euo pipefail

          if [ -z "${CM_KEYSTORE_PATH:-}" ]; then
            echo "ERROR: Keystore not available."
            exit 1
          fi

          if [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: Keystore file not found."
            exit 1
          fi

          if [ -z "${CM_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: Keystore password missing."
            exit 1
          fi

          if [ -z "${CM_KEY_ALIAS:-}" ]; then
            echo "ERROR: Key alias missing."
            exit 1
          fi

          if [ -z "${CM_KEY_PASSWORD:-}" ]; then
            echo "ERROR: Key password missing."
            exit 1
          fi

          export APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          python3 <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["APP_GRADLE"])

          text = path.read_text(encoding="utf-8")

          text = text.replace(
              'keyAlias = "upload"',
              'keyAlias = System.getenv("KEY_ALIAS") ?: "upload"'
          )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

          keytool \
            -list \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -alias "$CM_KEY_ALIAS" \
            >/dev/null

          echo "Release signing ready."


      - name: Build signed APK and AAB
        script: |
          set -euo pipefail

          export KEYSTORE_PATH="$CM_KEYSTORE_PATH"
          export STORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export KEY_PASSWORD="$CM_KEY_PASSWORD"
          export KEY_ALIAS="$CM_KEY_ALIAS"

          cd "$PROJECT_DIR"

          "$GRADLE_BIN" \
            --no-daemon \
            --stacktrace \
            clean \
            :app:assembleRelease \
            :app:bundleRelease

          APK_FILE="$(find \
            "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)"

          AAB_FILE="$(find \
            "$PROJECT_DIR/app/build/outputs/bundle/release" \
            -type f \
            -name "*.aab" \
            | head -n 1 || true)"

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: AAB was not generated."
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/release"

          cp "$APK_FILE" \
            "$CM_BUILD_DIR/release/Tahalil-Alakkad-release.apk"

          cp "$AAB_FILE" \
            "$CM_BUILD_DIR/release/Tahalil-Alakkad-release.aab"

          echo ""
          echo "================================"
          echo "BUILD SUCCESSFUL"
          echo "================================"

          ls -lh "$CM_BUILD_DIR/release"


    artifacts:
      - release/*.apk
      - release/*.aab
      - android_project/**/app/build/outputs/logs/*
