workflows:
  android-release:
    name: Build Tahalil Alakkad Manager V4
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17
      android_signing:
        - tahalil_alakkad_release

    scripts:
      - name: Extract Android project
        script: |
          set -euo pipefail

          ZIP_FILE="$CM_BUILD_DIR/Project3_AK_Manager_Lab2Lab_V4.zip"
          WORK_DIR="$CM_BUILD_DIR/android_project"

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project3_AK_Manager_Lab2Lab_V4.zip not found"
            ls -lah "$CM_BUILD_DIR"
            exit 1
          fi

          unzip -q -o "$ZIP_FILE" -d "$WORK_DIR"

          SETTINGS_FILE="$(find "$WORK_DIR" \
            -name "settings.gradle.kts" \
            -type f | head -n 1 || true)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"


      - name: Configure Android SDK
        script: |
          set -euo pipefail

          ANDROID_HOME="/usr/local/share/android-sdk"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$CM_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$CM_ENV"

          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"


      - name: Install Gradle 9.3.1
        script: |
          set -euo pipefail

          GRADLE_VERSION="9.3.1"
          GRADLE_DIR="$HOME/gradle-$GRADLE_VERSION"

          if [ ! -x "$GRADLE_DIR/bin/gradle" ]; then
            curl --fail --location --retry 3 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o /tmp/gradle.zip

            unzip -q -o /tmp/gradle.zip -d "$HOME"
          fi

          echo "GRADLE_BIN=$GRADLE_DIR/bin/gradle" >> "$CM_ENV"


      - name: Configure signing
        script: |
          set -euo pipefail

          export APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          python3 <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["APP_GRADLE"])
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              'keyAlias = "upload"',
              'keyAlias = System.getenv("KEY_ALIAS") ?: "upload"'
          )

          path.write_text(text, encoding="utf-8")
          PY


      - name: Build V4 APK and AAB
        script: |
          set -euo pipefail

          export KEYSTORE_PATH="$CM_KEYSTORE_PATH"
          export STORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export KEY_PASSWORD="$CM_KEY_PASSWORD"
          export KEY_ALIAS="$CM_KEY_ALIAS"

          cd "$PROJECT_DIR"

          "$GRADLE_BIN" \
            --no-daemon \
            --stacktrace \
            clean \
            :app:assembleRelease \
            :app:bundleRelease

          mkdir -p "$CM_BUILD_DIR/release"

          APK_FILE="$(find app/build/outputs/apk/release \
            -type f -name "*.apk" | head -n 1)"

          AAB_FILE="$(find app/build/outputs/bundle/release \
            -type f -name "*.aab" | head -n 1)"

          cp "$APK_FILE" \
            "$CM_BUILD_DIR/release/Tahalil-Alakkad-Manager-V4.apk"

          cp "$AAB_FILE" \
            "$CM_BUILD_DIR/release/Tahalil-Alakkad-Manager-V4.aab"

          echo "BUILD SUCCESSFUL"

    artifacts:
      - release/*.apk
      - release/*.aab
