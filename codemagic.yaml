workflows:
  android-release:
    name: Build Tahalil Alakkad V66 RECOVERY MINIMAL
    instance_type: mac_mini_m2
    max_build_duration: 20

    environment:
      java: 17
      android_signing:
        - tahalil_alakkad_release

    scripts:
      - name: Extract V66 project
        script: |
          set -euo pipefail

          ZIP_FILE="$CM_BUILD_DIR/Project3_AK_SECURE_AUDIT_FIX_V66.zip"
          WORK_DIR="$CM_BUILD_DIR/android_project"

          test -f "$ZIP_FILE"
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          unzip -q -o "$ZIP_FILE" -d "$WORK_DIR"

          SETTINGS_FILE="$(find "$WORK_DIR" -type f -name settings.gradle.kts -print -quit)"
          test -n "$SETTINGS_FILE"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Configure Android build tools
        script: |
          set -euo pipefail

          ANDROID_HOME="/usr/local/share/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$CM_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$CM_ENV"
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

          GRADLE_BIN="$(command -v gradle || true)"
          if [ -z "$GRADLE_BIN" ]; then
            GRADLE_BIN="$HOME/programs/gradle-8.14.1/bin/gradle"
          fi
          test -x "$GRADLE_BIN"
          echo "GRADLE_BIN=$GRADLE_BIN" >> "$CM_ENV"
          "$GRADLE_BIN" --version

      - name: Validate signing
        script: |
          set -euo pipefail

          test -n "${CM_KEYSTORE_PATH:-}"
          test -f "$CM_KEYSTORE_PATH"
          test -n "${CM_KEYSTORE_PASSWORD:-}"
          test -n "${CM_KEY_ALIAS:-}"
          test -n "${CM_KEY_PASSWORD:-}"

          keytool -list \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -alias "$CM_KEY_ALIAS" \
            >/dev/null

      - name: Build V66 APK and AAB
        script: |
          set -euo pipefail

          export KEYSTORE_PATH="$CM_KEYSTORE_PATH"
          export STORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export KEY_ALIAS="$CM_KEY_ALIAS"
          export KEY_PASSWORD="$CM_KEY_PASSWORD"
          export GRADLE_USER_HOME="$CM_BUILD_DIR/.gradle-v66-recovery"

          cd "$PROJECT_DIR"
          "$GRADLE_BIN" \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=2 \
            --console=plain \
            clean \
            :app:assembleRelease \
            :app:bundleRelease

          APK_FILE="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          AAB_FILE="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          test -f "$APK_FILE"
          test -f "$AAB_FILE"

          RELEASE_DIR="$CM_BUILD_DIR/release"
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          cp "$APK_FILE" "$RELEASE_DIR/Tahalil-Alakkad-V66-AUDIT-FIX.apk"
          cp "$AAB_FILE" "$RELEASE_DIR/Tahalil-Alakkad-V66-AUDIT-FIX.aab"
          ls -lah "$RELEASE_DIR"

    artifacts:
      - release/*.apk
      - release/*.aab
      - android_project/**/app/build/outputs/mapping/release/mapping.txt
      
