workflows:
  android-debug:
    name: Build Tahalil Alakkad APK
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Extract Android project
        script: |
          set -e

          mkdir -p "$CM_BUILD_DIR/extracted"
          unzip -q "$CM_BUILD_DIR/project.zip" -d "$CM_BUILD_DIR/extracted"

          SETTINGS_FILE=$(find "$CM_BUILD_DIR/extracted" \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android project not found inside project.zip"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "Project found at: $PROJECT_DIR"

      - name: Set app name and icon
        script: |
          set -e

          python3 <<'PY'
          import os
          import re
          import shutil

          project = os.environ["PROJECT_DIR"]
          build_dir = os.environ["CM_BUILD_DIR"]

          manifest = os.path.join(
              project,
              "app",
              "src",
              "main",
              "AndroidManifest.xml"
          )

          icon_source = os.path.join(build_dir, "app_icon.png")

          drawable_dir = os.path.join(
              project,
              "app",
              "src",
              "main",
              "res",
              "drawable"
          )

          os.makedirs(drawable_dir, exist_ok=True)

          icon_target = os.path.join(
              drawable_dir,
              "app_icon.png"
          )

          shutil.copyfile(icon_source, icon_target)

          with open(manifest, "r", encoding="utf-8") as f:
              text = f.read()

          start = text.find("<application")

          if start == -1:
              raise RuntimeError("application tag not found")

          end = text.find(">", start)

          if end == -1:
              raise RuntimeError("application tag is invalid")

          tag = text[start:end + 1]

          def set_android_attr(tag, name, value):
              pattern = rf'\sandroid:{name}="[^"]*"'

              if re.search(pattern, tag):
                  return re.sub(
                      pattern,
                      f' android:{name}="{value}"',
                      tag,
                      count=1
                  )

              return tag[:-1] + \
                  f'\n        android:{name}="{value}">'

          tag = set_android_attr(
              tag,
              "label",
              "تحاليل العقاد"
          )

          tag = set_android_attr(
              tag,
              "icon",
              "@drawable/app_icon"
          )

          tag = set_android_attr(
              tag,
              "roundIcon",
              "@drawable/app_icon"
          )

          text = text[:start] + tag + text[end + 1:]

          with open(manifest, "w", encoding="utf-8") as f:
              f.write(text)

          strings_file = os.path.join(
              project,
              "app",
              "src",
              "main",
              "res",
              "values",
              "strings.xml"
          )

          if os.path.exists(strings_file):
              with open(
                  strings_file,
                  "r",
                  encoding="utf-8"
              ) as f:
                  strings = f.read()

              if 'name="app_name"' in strings:
                  strings = re.sub(
                      r'<string\s+name="app_name">.*?</string>',
                      '<string name="app_name">تحاليل العقاد</string>',
                      strings,
                      count=1,
                      flags=re.DOTALL
                  )

                  with open(
                      strings_file,
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(strings)

          print("App name set to: تحاليل العقاد")
          print("App icon installed successfully")
          PY

      - name: Install Android SDK 36.1
        script: |
          set -e

          SDKMANAGER="/usr/local/share/android-sdk/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"
            exit 1
          fi

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platforms;android-36.1" \
            "platform-tools"

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

      - name: Install Gradle 9.3.1
        script: |
          set -e

          rm -rf /tmp/gradle-9.3.1
          rm -f /tmp/gradle-9.3.1-bin.zip

          curl -L --fail --retry 3 \
            "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" \
            -o /tmp/gradle-9.3.1-bin.zip

          unzip -q /tmp/gradle-9.3.1-bin.zip -d /tmp

          echo "GRADLE_BIN=/tmp/gradle-9.3.1/bin/gradle" >> "$CM_ENV"

          /tmp/gradle-9.3.1/bin/gradle --version

      - name: Create debug keystore
        script: |
          set -e

          if [ ! -f "$PROJECT_DIR/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$PROJECT_DIR/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
          fi

      - name: Build APK
        script: |
          set -e

          cd "$PROJECT_DIR"

          "$GRADLE_BIN" \
            --no-daemon \
            :app:assembleDebug

      - name: Collect APK
        script: |
          set -e

          mkdir -p "$CM_BUILD_DIR/output"

          APK_FILE=$(find \
            "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "APK not found"
            exit 1
          fi

          cp "$APK_FILE" \
            "$CM_BUILD_DIR/output/tahalil-alakkad.apk"

          echo "APK ready:"
          ls -lh "$CM_BUILD_DIR/output"

    artifacts:
      - output/*.apk
