workflows:
  android-release:
    name: Build Tahalil Alakkad V58 UNIFIED ADMIN PASSWORD FIXED
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17
      android_signing:
        - tahalil_alakkad_release

    scripts:
      - name: Extract V58 project
        script: |
          set -euo pipefail

          ZIP_FILE="$CM_BUILD_DIR/Project3_AK_SECURE_UNIFIED_ADMIN_PASSWORD_V58.zip"
          WORK_DIR="$CM_BUILD_DIR/android_project"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: V58 ZIP not found: $ZIP_FILE"
            find "$CM_BUILD_DIR" -maxdepth 2 -type f -iname '*.zip' -print || true
            exit 1
          fi

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          unzip -q -o "$ZIP_FILE" -d "$WORK_DIR"

          SETTINGS_FILE=$(find "$WORK_DIR" -type f -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Verify V58 project
        script: |
          set -euo pipefail

          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])

          required_files = [
              "app/build.gradle.kts",
              "gradle/libs.versions.toml",
              "app/src/main/AndroidManifest.xml",
              "app/google-services.json",
              "gradle.properties",
              "BUILD_ONLY_FIX_V45_NOTES.txt",
              "ALL_ICON_SERVICES_V55_NOTES.txt",
              "THREED_ICON_UI_V56_NOTES.txt",
              "AVAILABLE_TESTS_PRICING_V57_NOTES.txt",
              "UNIFIED_ADMIN_PASSWORD_V58_NOTES.txt",
              "app/src/main/res/drawable-nodpi/mgr_reports_3d.png",
              "app/src/main/res/drawable-nodpi/mgr_staff_3d.png",
              "app/src/main/res/drawable-nodpi/mgr_devices_3d.png",
              "app/src/main/res/drawable-nodpi/mgr_alerts_3d.png",
              "app/src/main/res/drawable-nodpi/mgr_integrity_3d.png",
              "app/src/main/res/drawable-nodpi/mgr_health_3d.png",
              "app/src/main/res/drawable-nodpi/mgr_audit_3d.png",
              "app/src/main/res/drawable-nodpi/settings_3d.png",
              "app/src/main/res/drawable-nodpi/staff_search_3d.png",
              "app/src/main/res/drawable-nodpi/staff_new_order_3d.png",
              "app/src/main/res/drawable-nodpi/staff_pdf_3d.png",
              "app/src/main/res/drawable-nodpi/staff_qr_3d.png",
              "app/src/main/res/drawable-nodpi/staff_customers_3d.png",
              "app/src/main/res/drawable-nodpi/staff_tests_3d.png",
          ]

          missing = [p for p in required_files if not (root / p).is_file()]
          if missing:
              raise SystemExit("Missing required files:\n" + "\n".join(missing))

          def require_text(rel, needles):
              text = (root / rel).read_text(encoding="utf-8")
              missing_needles = [n for n in needles if n not in text]
              if missing_needles:
                  raise SystemExit(
                      f"Verification failed in {rel}:\n" + "\n".join(missing_needles)
                  )

          require_text("gradle/libs.versions.toml", [
              'agp = "8.10.0"',
              'kotlin = "2.2.10"',
              'googleDevtoolsKsp = "2.3.6"',
              'kotlin-android = { id = "org.jetbrains.kotlin.android"',
          ])

          require_text("app/build.gradle.kts", [
              "alias(libs.plugins.kotlin.android)",
              "compileSdk = 36",
              'buildToolsVersion = "35.0.0"',
              "jvmTarget.set(JvmTarget.JVM_11)",
              "targetCompatibility = JavaVersion.VERSION_11",
              "versionCode = 58",
              'versionName = "4.25-unified-admin-password-v58"',
          ])

          require_text("gradle.properties", [
              "org.gradle.parallel=false",
              "org.gradle.configuration-cache=false",
              "org.gradle.workers.max=2",
              "android.useAndroidX=true",
          ])

          require_text("app/src/main/java/com/example/ui/LabTestsScreen.kt", [
              "private fun GlossyServiceCard",
              "R.drawable.mgr_reports_3d",
              "R.drawable.staff_search_3d",
              "R.drawable.settings_3d",
              "private fun AvailableTestPriceCard",
              "customerPriceOverrides = customerPriceOverrides",
              "lab2LabPrices = lab2LabPrices",
              "catalog_edit_prices_",
              'appText("تعديل الأسعار", "Edit prices")',
              "val isManager = adminUnlocked",
              "showAdminPasswordDialog",
              'appText("دخول الإدارة", "Administration access")',
              "locked = !adminUnlocked",
          ])

          require_text("app/src/main/java/com/example/ui/LabTestsViewModel.kt", [
              'private const val ADMIN_UNLOCK_APP = "TahalilAdminUnlock"',
              "val adminUnlocked: StateFlow<Boolean>",
              "fun unlockAdmin(password: String",
              "FirebaseAppCheck.getInstance(app)",
              "FirebaseFirestore.getInstance(app)",
              "private fun privilegedFirestore()",
          ])

          require_text("app/src/main/java/com/example/ui/CustomerSystemDialog.kt", [
              "viewModel.adminUnlocked.collectAsState()",
          ])

          vm = (root / "app/src/main/java/com/example/ui/LabTestsViewModel.kt").read_text(encoding="utf-8")
          forbidden = [
              "حسابك غير مصرح له بإضافة خصومات",
              "حسابك غير مصرح له بتحصيل دفعات",
          ]
          found = [x for x in forbidden if x in vm]
          if found:
              raise SystemExit("Legacy role gates still exist: " + ", ".join(found))

          print("V58 verification passed")
          PY

      - name: Configure Android SDK 36
        script: |
          set -euo pipefail

          ANDROID_HOME="/usr/local/share/android-sdk"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found at $SDKMANAGER"
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$CM_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$CM_ENV"
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Use compatible preinstalled Gradle
        script: |
          set -euo pipefail

          GRADLE_BIN=$(command -v gradle || true)

          if [ -z "$GRADLE_BIN" ] || [ ! -x "$GRADLE_BIN" ]; then
            for candidate in \
              "$HOME/programs/gradle-8.14.1/bin/gradle" \
              "/Users/builder/programs/gradle-8.14.1/bin/gradle"
            do
              if [ -x "$candidate" ]; then
                GRADLE_BIN="$candidate"
                break
              fi
            done
          fi

          if [ -z "$GRADLE_BIN" ] || [ ! -x "$GRADLE_BIN" ]; then
            echo "ERROR: No compatible preinstalled Gradle found"
            exit 1
          fi

          GRADLE_VERSION=$($GRADLE_BIN --version | awk '/^Gradle / {print $2; exit}')
          echo "Detected Gradle $GRADLE_VERSION at $GRADLE_BIN"

          python3 - "$GRADLE_VERSION" <<'PY'
          import sys
          parts = sys.argv[1].split('.')
          major = int(parts[0])
          minor = int(parts[1]) if len(parts) > 1 else 0
          if major != 8 or minor < 11:
              raise SystemExit(f"Gradle {sys.argv[1]} is incompatible; need Gradle 8.11+ and <9")
          PY

          echo "GRADLE_BIN=$GRADLE_BIN" >> "$CM_ENV"
          "$GRADLE_BIN" --version

      - name: Validate release signing
        script: |
          set -euo pipefail

          if [ -z "${CM_KEYSTORE_PATH:-}" ] || [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: Release keystore missing"
            exit 1
          fi

          if [ -z "${CM_KEYSTORE_PASSWORD:-}" ] || [ -z "${CM_KEY_ALIAS:-}" ] || [ -z "${CM_KEY_PASSWORD:-}" ]; then
            echo "ERROR: Signing credentials incomplete"
            exit 1
          fi

          keytool -list \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -alias "$CM_KEY_ALIAS" \
            >/dev/null

      - name: Build V58 release APK and AAB
        script: |
          set -euo pipefail

          export KEYSTORE_PATH="$CM_KEYSTORE_PATH"
          export STORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export KEY_PASSWORD="$CM_KEY_PASSWORD"
          export KEY_ALIAS="$CM_KEY_ALIAS"
          export GRADLE_USER_HOME="$CM_BUILD_DIR/.gradle-v58"

          cd "$PROJECT_DIR"

          BUILD_LOG="$CM_BUILD_DIR/v58-build.log"
          rm -f "$BUILD_LOG"

          set +e
          "$GRADLE_BIN" \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=2 \
            --console=plain \
            clean \
            :app:assembleRelease \
            :app:bundleRelease \
            2>&1 | tee "$BUILD_LOG"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo ""
            echo "================ BUILD ERROR SUMMARY ================"
            grep -nE '(^e: |error:|FAILURE:|What went wrong:|Execution failed for task|Caused by:|Could not resolve|Could not find|Inconsistent JVM|Compilation error)' "$BUILD_LOG" | head -120 || true
            echo "====================================================="
            exit "$BUILD_STATUS"
          fi

          APK_FILE=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          AAB_FILE=$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: AAB was not generated"
            exit 1
          fi

          RELEASE_DIR="$CM_BUILD_DIR/release"
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          cp "$APK_FILE" "$RELEASE_DIR/Tahalil-Alakkad-V58-UNIFIED-ADMIN-PASSWORD.apk"
          cp "$AAB_FILE" "$RELEASE_DIR/Tahalil-Alakkad-V58-UNIFIED-ADMIN-PASSWORD.aab"
          cp "$BUILD_LOG" "$RELEASE_DIR/v58-build.log"

          echo "BUILD SUCCESSFUL - V58 APK and AAB created"
          ls -lah "$RELEASE_DIR"

    artifacts:
      - release/*.apk
      - release/*.aab
      - release/*.log
      - android_project/**/app/build/outputs/mapping/release/mapping.txt
      
