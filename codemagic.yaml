workflows:
  android-release:
    name: Build Tahalil Alakkad OPTIONAL OUTPUT QR V38
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17
      android_signing:
        - tahalil_alakkad_release

    scripts:
      - name: Extract OPTIONAL OUTPUT QR V38 project
        script: |
          set -euo pipefail

          ZIP_FILE="$CM_BUILD_DIR/Project3_AK_SECURE_OPTIONAL_OUTPUT_QR_V38.zip"
          WORK_DIR="$CM_BUILD_DIR/android_project"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project3_AK_SECURE_OPTIONAL_OUTPUT_QR_V38.zip not found"
            ls -lah "$CM_BUILD_DIR"
            exit 1
          fi

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          unzip -q -o "$ZIP_FILE" -d "$WORK_DIR"

          SETTINGS_FILE=$(find "$WORK_DIR" -type f -name "settings.gradle.kts" -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Verify OPTIONAL OUTPUT QR V38
        script: |
          set -euo pipefail

          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/ui/CustomerSystemDialog.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/ui/OrderPdfShareDialog.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsViewModel.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          test -f "$PROJECT_DIR/OPTIONAL_OUTPUT_QR_V38_NOTES.txt"

          grep -q 'versionCode = 43' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionName = "4.14-optional-output-qr-v38"' "$PROJECT_DIR/app/build.gradle.kts"

          # Save is independent from output generation
          grep -q 'حفظ الطلب"' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsScreen.kt"
          grep -q 'إغلاق - حفظ فقط' "$PROJECT_DIR/app/src/main/java/com/example/ui/OrderPdfShareDialog.kt"
          grep -q 'إرسال أو إنشاء المستندات اختياري' "$PROJECT_DIR/app/src/main/java/com/example/ui/OrderPdfShareDialog.kt"

          # No automatic dual PDF generation remains in UI save flows
          if grep -R -q 'generateDualOrderPdfs(' "$PROJECT_DIR/app/src/main/java/com/example/ui"; then
            echo "ERROR: automatic dual PDF generation still exists in UI flow"
            exit 1
          fi

          # Optional PDF + PNG outputs
          grep -q 'fun generateCustomerOrderPdf' "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          grep -q 'fun generateLabRequestPdf' "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          grep -q 'fun generateCustomerOrderImage' "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          grep -q 'fun generateLabRequestImage' "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          grep -q 'fun shareGeneratedImage' "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          grep -q 'type = "image/png"' "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          grep -q 'PdfRenderer' "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"

          # Stable unique QR + QR search
          grep -q 'TAHALIL_ALAKKAD_CUSTOMER|V=2|ID=' "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          grep -q 'findCustomerByQrPayload' "$PROJECT_DIR/app/src/main/java/com/example/ui/LabTestsViewModel.kt"
          grep -q 'بحث بـ QR العميل' "$PROJECT_DIR/app/src/main/java/com/example/ui/CustomerSystemDialog.kt"
          grep -q 'امسح QR الموجود على إيصال العميل لفتح ملفه مباشرة' "$PROJECT_DIR/app/src/main/java/com/example/ui/CustomerSystemDialog.kt"
          grep -q 'GmsBarcodeScanning.getClient' "$PROJECT_DIR/app/src/main/java/com/example/ui/CustomerSystemDialog.kt"
          grep -q 'com.google.android.gms:play-services-code-scanner:16.1.0' "$PROJECT_DIR/app/build.gradle.kts"

          # Clinic identity and patient/lab data
          grep -q '01102233167' "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          grep -q '01107072134' "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          grep -q '59 شارع فيصل الرئيسي' "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          grep -q 'بيانات الحالة' "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"
          grep -q 'التحاليل المطلوبة' "$PROJECT_DIR/app/src/main/java/com/example/util/PdfGenerator.kt"

          # Security
          grep -q 'FLAG_SECURE' "$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt"
          grep -q 'android:allowBackup="false"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'android:usesCleartextTraffic="false"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'isMinifyEnabled = true' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'isShrinkResources = true' "$PROJECT_DIR/app/build.gradle.kts"

          echo "OPTIONAL OUTPUT QR V38 verification passed"

      - name: Configure Android SDK
        script: |
          set -euo pipefail

          ANDROID_HOME="/usr/local/share/android-sdk"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$CM_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$CM_ENV"
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-36.1"
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Install Gradle 9.3.1
        script: |
          set -euo pipefail

          GRADLE_VERSION="9.3.1"
          GRADLE_DIR="$HOME/gradle-$GRADLE_VERSION"
          GRADLE_BIN="$GRADLE_DIR/bin/gradle"

          if [ ! -x "$GRADLE_BIN" ]; then
            rm -f /tmp/gradle.zip
            curl --fail --location --retry 3 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o /tmp/gradle.zip
            unzip -q -o /tmp/gradle.zip -d "$HOME"
          fi

          if [ ! -x "$GRADLE_BIN" ]; then
            echo "ERROR: Gradle installation failed"
            exit 1
          fi

          echo "GRADLE_BIN=$GRADLE_BIN" >> "$CM_ENV"
          "$GRADLE_BIN" --version

      - name: Validate release signing
        script: |
          set -euo pipefail

          if [ -z "${CM_KEYSTORE_PATH:-}" ] || [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: Release keystore missing"
            exit 1
          fi

          if [ -z "${CM_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${CM_KEY_ALIAS:-}" ] || \
             [ -z "${CM_KEY_PASSWORD:-}" ]; then
            echo "ERROR: Signing credentials incomplete"
            exit 1
          fi

          keytool -list \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -alias "$CM_KEY_ALIAS" \
            >/dev/null

      - name: Build OPTIONAL OUTPUT QR V38 APK and AAB
        script: |
          set -euo pipefail

          export KEYSTORE_PATH="$CM_KEYSTORE_PATH"
          export STORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export KEY_PASSWORD="$CM_KEY_PASSWORD"
          export KEY_ALIAS="$CM_KEY_ALIAS"

          cd "$PROJECT_DIR"

          "$GRADLE_BIN" \
            --no-daemon \
            --stacktrace \
            clean \
            :app:assembleRelease \
            :app:bundleRelease

          echo "Gradle build completed successfully"

          APK_FILE=$(find app/build/outputs/apk/release -type f -name "*.apk" -print -quit)
          AAB_FILE=$(find app/build/outputs/bundle/release -type f -name "*.aab" -print -quit)

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: AAB was not generated"
            exit 1
          fi

          RELEASE_DIR="$CM_BUILD_DIR/release"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          cp "$APK_FILE" "$RELEASE_DIR/Tahalil-Alakkad-OPTIONAL-OUTPUT-QR-V38.apk"
          cp "$AAB_FILE" "$RELEASE_DIR/Tahalil-Alakkad-OPTIONAL-OUTPUT-QR-V38.aab"

          test -f "$RELEASE_DIR/Tahalil-Alakkad-OPTIONAL-OUTPUT-QR-V38.apk"
          test -f "$RELEASE_DIR/Tahalil-Alakkad-OPTIONAL-OUTPUT-QR-V38.aab"

          echo "V38 APK and AAB created successfully"
          ls -lah "$RELEASE_DIR"

    artifacts:
      - release/*.apk
      - release/*.aab
      - android_project/**/app/build/outputs/mapping/release/mapping.txt
      - android_project/**/app/build/outputs/logs/*
